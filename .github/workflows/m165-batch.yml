name: NaSeed M165 30 NEW signed Alpine image codecs and transformations three ISA

on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  original-image-programs:
    name: M165 30 new native Alpine executable identities / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
      - name: Audit original executable identity, exact case map and ABI boundaries
        run: |
          set -eu
          for script in scripts/stage-m165-prebuilt.sh scripts/probe-m165-batch.sh \
                        scripts/host-configure-m165-batch.sh \
                        scripts/host-configure-m163-batch.sh tests/m165-batch-run.sh; do
            sh -n "$script"
          done
          python3 scripts/check-prebuilt-profile-catalog.py
          python3 scripts/check-m165-inventory.py
          python3 scripts/check-three-isa-core.py
          python3 scripts/check-architecture-boundaries.py
      - name: Install original signed Alpine APK staging and native QEMU firmware
        timeout-minutes: 14
        run: |
          set -eu
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'clang:clang' 'ld.lld:lld' 'readelf:binutils' \
                      'cpio:cpio' 'mke2fs:e2fsprogs' 'xorriso:xorriso' \
                      'mformat:mtools' 'sgdisk:gdisk' 'openssl:openssl' \
                      'qemu-riscv64:qemu-user'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          case '${{ matrix.port }}' in
            amd64)
              command -v qemu-system-x86_64 >/dev/null || missing="$missing qemu-system-x86"
              test -f /usr/share/OVMF/OVMF_CODE_4M.fd || \
              test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf" ;;
            riscv64)
              command -v qemu-system-riscv64 >/dev/null || missing="$missing qemu-system-misc"
              test -f /usr/share/qemu-efi-riscv64/RISCV_VIRT_CODE.fd || missing="$missing qemu-efi-riscv64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
            arm64)
              command -v qemu-system-aarch64 >/dev/null || missing="$missing qemu-system-arm"
              test -f /usr/share/AAVMF/AAVMF_CODE.fd || \
              test -f /usr/share/qemu-efi-aarch64/QEMU_EFI.fd || missing="$missing qemu-efi-aarch64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
          esac
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
      - name: Execute thirty distinct real Alpine Netpbm ELF functions in native QEMU
        timeout-minutes: 58
        run: sh scripts/probe-m165-batch.sh ${{ matrix.port }}
      - name: Preserve exact ELF digests and true codec workload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m165-30-new-image-elfs-${{ matrix.port }}
          path: |
            build/external/m165-batch/${{ matrix.port }}/apk-install.log
            build/external/m165-batch/${{ matrix.port }}/requested-packages.txt
            build/external/m165-batch/${{ matrix.port }}/*.sha256
            build/busybox-source-parity-x86/m165-batch.clean.log
            build/busybox-source-parity-x86/m165-batch.serial.log
            build/port-riscv64/full/matrix-source/m165-batch.clean.log
            build/port-riscv64/full/matrix-source/m165-batch.serial.log
            build/port-aarch64/full/matrix-source/m165-batch.clean.log
            build/port-aarch64/full/matrix-source/m165-batch.serial.log
          if-no-files-found: ignore
