name: NaSeed M50 bounded 4-suite original Alpine QEMU matrix — 12 x 3 ISA
on:
  pull_request:
    paths:
      - 'kernel/**'
      - 'rootfs/alpine/**'
      - 'scripts/**'
      - 'tests/**'
      - 'Makefile'
      - '.github/workflows/**'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  native-alpine:
    name: ${{ matrix.port }} / ${{ matrix.suite }} / original Linux ELF QEMU
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
        suite: [foundation, pthread, lifecycle, parallel]
    steps:
      - uses: actions/checkout@v4
      - name: Static shared-kernel parity, exact 12 original milestones and 3 ISA coverage
        run: |
          python3 scripts/check-three-isa-core.py
          python3 scripts/check-native-alpine-matrix.py
          sh -n scripts/probe-alpine-batch.sh
      - name: Install headless QEMU and boot toolchain
        timeout-minutes: 12
        run: |
          set -eu
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'clang:clang' 'ld.lld:lld' 'readelf:binutils' 'cpio:cpio' \
                      'xorriso:xorriso' 'mformat:mtools' 'sgdisk:gdisk' \
                      'qemu-riscv64:qemu-user'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          case "${{ matrix.port }}" in
            amd64)
              command -v qemu-system-x86_64 >/dev/null || missing="$missing qemu-system-x86"
              test -f /usr/share/OVMF/OVMF_CODE_4M.fd || \
                test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf" ;;
            riscv64)
              command -v qemu-system-riscv64 >/dev/null || missing="$missing qemu-system-misc"
              test -f /usr/share/qemu-efi-riscv64/RISCV_VIRT_CODE.fd || missing="$missing qemu-efi-riscv64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
            arm64)
              command -v qemu-system-aarch64 >/dev/null || missing="$missing qemu-system-arm"
              test -f /usr/share/AAVMF/AAVMF_CODE.fd || missing="$missing qemu-efi-aarch64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
          esac
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
      - name: Reject hardcoded CPIO file limit regressions before costly native QEMU
        run: sh scripts/check-bootfs-scale.sh
      - name: Run every original workload in this ISA and suite (zero suppressed failures)
        timeout-minutes: 50
        run: sh scripts/probe-alpine-batch.sh ${{ matrix.suite }} ${{ matrix.port }}
      - name: Retain original Alpine package/ELF/serial evidence after any failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m50-native-${{ matrix.port }}-${{ matrix.suite }}
          path: |
            build/external/**/apk-install.log
            build/external/**/requested-packages.txt
            build/busybox-source-parity-x86/*.clean.log
            build/port-riscv64/full/matrix-source/*.clean.log
            build/port-aarch64/full/matrix-source/*.clean.log
          if-no-files-found: ignore
