name: NaSeed M240 original Alpine Dropbear genuine host SSH PTY two-native-boot

# First new-feature pilot runs amd64 only on push; dispatch can select other
# ISAs or all three once the host/guest PTY owner is proven on real QEMU.
on:
  push:
    branches: [naseed-app-batch2]
    paths:
      - '.github/workflows/m240-alpine-ssh-pty.yml'
      - '.github/actions/naseed-limine-seed/**'
      - 'tests/m240-alpine-ssh-pty-workload.sh'
      - 'scripts/m240-*.py'
      - 'scripts/test-m240-*.py'
      - 'scripts/probe-m197-alpine-software-cohort.sh'
      - 'scripts/acceptance/profile.sh'
      - 'kernel/drivers/pty.c'
      - 'kernel/task/signal.c'
  workflow_dispatch:
    inputs:
      port:
        description: 'Real original Alpine native ISA (or all three)'
        type: choice
        required: true
        default: amd64
        options: [amd64, riscv64, arm64, all]

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-alpine-dropbear-pty:
    name: Real 9x2 host SSH PTYs / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    strategy:
      fail-fast: false
      matrix:
        port: ${{ fromJSON(github.event_name == 'push' && '["amd64"]' || (inputs.port == 'all' && '["amd64","riscv64","arm64"]' || format('["{0}"]', inputs.port))) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: true
      - name: Reject fake PTY receipts, insecure keys, stale selectors and native ISA regression
        run: |
          set -eu
          python3 scripts/test-acceptance-profiles.py
          python3 scripts/test-m230-cohort-contract.py
          python3 scripts/test-m230-dropbear-guest-contract.py
          python3 scripts/test-m230-host-ssh.py
          python3 scripts/test-m230-dropbear-disk-check.py
          python3 scripts/test-m240-ssh-pty-contract.py
          python3 scripts/check-three-isa-core.py
          python3 scripts/check-architecture-boundaries.py
          python3 scripts/test-m227-openrc-contract.py
          python3 scripts/test-m228-hostfwd-contract.py
          python3 -m py_compile scripts/m240-alpine-uart.py \
            scripts/m240-host-ssh-pty-check.py scripts/m240-ssh-pty-disk-check.py
          sh -n tests/m240-alpine-ssh-pty-workload.sh
          sh -n scripts/probe-m197-alpine-software-cohort.sh
      - name: Install official Alpine and native QEMU toolchains
        timeout-minutes: 20
        run: |
          set -eu
          PATH=/usr/sbin:/sbin:$PATH
          export PATH
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'cmake:cmake' 'g++:g++' 'clang:clang' 'ld.lld:lld' \
                      'readelf:binutils' 'cpio:cpio' 'mke2fs:e2fsprogs' \
                      'debugfs:e2fsprogs' 'e2fsck:e2fsprogs' \
                      'xorriso:xorriso' 'mformat:mtools' 'sgdisk:gdisk' \
                      'curl:curl' 'python3:python3' 'openssl:openssl' \
                      'ssh:openssh-client' 'ssh-keygen:openssh-client'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          case '${{ matrix.port }}' in
            amd64)
              command -v qemu-system-x86_64 >/dev/null || missing="$missing qemu-system-x86"
              test -f /usr/share/OVMF/OVMF_CODE_4M.fd || \
                test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf" ;;
            riscv64)
              command -v riscv64-linux-gnu-gcc >/dev/null || missing="$missing gcc-riscv64-linux-gnu"
              command -v riscv64-linux-gnu-g++ >/dev/null || missing="$missing g++-riscv64-linux-gnu"
              test -f /usr/riscv64-linux-gnu/include/bits/wordsize.h && \
                test -f /usr/riscv64-linux-gnu/lib/libc.a || missing="$missing libc6-dev-riscv64-cross"
              command -v qemu-system-riscv64 >/dev/null || missing="$missing qemu-system-misc"
              test -f /usr/share/qemu-efi-riscv64/RISCV_VIRT_CODE.fd || missing="$missing qemu-efi-riscv64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
            arm64)
              command -v aarch64-linux-gnu-gcc >/dev/null || missing="$missing gcc-aarch64-linux-gnu"
              command -v aarch64-linux-gnu-g++ >/dev/null || missing="$missing g++-aarch64-linux-gnu"
              test -f /usr/aarch64-linux-gnu/include/bits/wordsize.h && \
                test -f /usr/aarch64-linux-gnu/lib/libc.a || missing="$missing libc6-dev-arm64-cross"
              command -v qemu-system-aarch64 >/dev/null || missing="$missing qemu-system-arm"
              test -f /usr/share/AAVMF/AAVMF_CODE.fd || \
                test -f /usr/share/qemu-efi-aarch64/QEMU_EFI.fd || missing="$missing qemu-efi-aarch64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
          esac
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
      - name: Restore immutable native three-ISA proven Limine
        uses: ./.github/actions/naseed-limine-seed
        with:
          github-token: ${{ github.token }}
      - name: Two genuine original Alpine PID1 QEMUs and real SSH PTY sessions
        timeout-minutes: 100
        env:
          NAS_M240_SSH_PTY: '1'
          NAS_M240_PUBLIC_QEMU_TIMEOUT: '2850'
          NAS_M240_FIRST_SECONDS: '2700'
          NAS_M240_REOPEN_QEMU_TIMEOUT: '1300'
          NAS_M240_REOPEN_SECONDS: '1150'
          NAS_M240_HOST_PORT: '12222'
          NAS_M240_HOST_SSH_SECONDS: '260'
        run: sh scripts/probe-m197-alpine-software-cohort.sh '${{ matrix.port }}'
      - name: Preserve real host PTY receipts, both NIC PCAPs, UART and physical ext4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m240-original-alpine-host-ssh-pty-${{ matrix.port }}
          path: |
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m240-first.serial.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m240-reopen.serial.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m240-first-runner.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m240-reopen-runner.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m240-first-host-ssh-pty.json
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m240-reopen-host-ssh-pty.json
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m240-first-host-ssh-pty.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m240-reopen-host-ssh-pty.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m197-public-wire.pcap
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m240-reopen-wire.pcap
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m240-dropbear-final-oracle.json
            build/acceptance/**/m197-batch*.log
          if-no-files-found: warn
          retention-days: 1
