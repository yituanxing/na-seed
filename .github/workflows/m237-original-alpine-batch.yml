name: NaSeed M237 fifteen original signed Alpine ELF physical two-boot QEMU

on:
  push:
    branches: [naseed-app-batch2]
    paths:
      - '.github/workflows/m237-original-alpine-batch.yml'
      - 'rootfs/alpine/packages-m237-candidates.txt'
      - 'scripts/m237-*'
      - 'scripts/test-m237-*'
      - 'scripts/probe-m237-alpine-batch.sh'
      - 'scripts/run-m237-local.sh'
      - 'scripts/inventory-m141-signed-apks.sh'
      - 'scripts/check-m141-candidates.py'
      - 'scripts/probe-m197-alpine-software-cohort.sh'
      - 'tests/m205-software-workload.sh'
      - 'tests/m237-software-workload.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  amd64-first:
    name: M237 AMD64 strict fifteen unique original ELF pilot, two genuine QEMUs
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: true
      - name: Signed original Alpine cohort, first and second AMD64 native QEMU
        timeout-minutes: 105
        env:
          NAS_M237_PUBLIC_SECONDS: '4400'
          NAS_M237_PUBLIC_QEMU_TIMEOUT: '4500'
          NAS_M237_REOPEN_SECONDS: '1200'
        run: sh scripts/run-m237-local.sh --native amd64
      - name: Inspect actual signed musl instruction bytes after AMD64 guest failure
        if: failure()
        run: |
          libc=$(find build/external/m237-candidate-inventory/amd64 \
            -type f \( -name 'ld-musl-x86_64.so.1' -o -name 'libc.musl-x86_64.so.1' \) \
            -print -quit 2>/dev/null || true)
          if [ -n "$libc" ]; then
            echo "[M237 MUSL HLT] original signed Alpine libc: $libc"
            readelf -lW "$libc" | head -35
            objdump -d -Mintel --start-address=0x41d90 --stop-address=0x41f00 \
              "$libc" | tail -90
          else
            echo '[M237 MUSL HLT] no extracted original libc to inspect'
          fi
      - name: Preserve signed APK census, both QEMUs, native semantics and physical ext4 SHA proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m237-original-real-alpine-amd64
          path: |
            build/external/m237-candidate-inventory/amd64/candidates.tsv
            build/external/m237-candidate-inventory/amd64/apk-install.log
            build/external/m237-candidate-inventory/amd64/apk-offline-proof.log
            build/external/m237-candidate-inventory/amd64/signed-cache.sha256
            build/external/m191-alpine-rootfs/amd64/m237-compat-report.json
            build/external/m191-alpine-rootfs/amd64/m237-physical-ext4-evidence.json
            build/external/m191-alpine-rootfs/amd64/m237-*runner.log
            build/external/m191-alpine-rootfs/amd64/m197-live.serial.log
            build/external/m191-alpine-rootfs/amd64/m197-reopen-runner.log
            build/external/m191-alpine-rootfs/amd64/m197-public-wire.json
            build/external/m191-alpine-rootfs/amd64/m197-public-wire.pcap
            build/acceptance/**/m197-batch*.log
            build/busybox-source-parity-x86/m197-batch*.log
          if-no-files-found: warn
          retention-days: 7

  rv64-arm64-after-amd64:
    name: M237 ${{ matrix.port }} exact fifteen original ELF two-boot native QEMU
    needs: amd64-first
    if: ${{ needs.amd64-first.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    strategy:
      fail-fast: false
      matrix:
        port: [riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: true
      - name: Signed original Alpine cohort, first and second target-native QEMU
        timeout-minutes: 105
        env:
          NAS_M237_PUBLIC_SECONDS: '4400'
          NAS_M237_PUBLIC_QEMU_TIMEOUT: '4500'
          NAS_M237_REOPEN_SECONDS: '1200'
        run: sh scripts/run-m237-local.sh --native '${{ matrix.port }}'
      - name: Preserve signed APK census, both QEMUs, native semantics and physical ext4 SHA proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m237-original-real-alpine-${{ matrix.port }}
          path: |
            build/external/m237-candidate-inventory/${{ matrix.port }}/candidates.tsv
            build/external/m237-candidate-inventory/${{ matrix.port }}/apk-install.log
            build/external/m237-candidate-inventory/${{ matrix.port }}/apk-offline-proof.log
            build/external/m237-candidate-inventory/${{ matrix.port }}/signed-cache.sha256
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m237-compat-report.json
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m237-physical-ext4-evidence.json
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m237-*runner.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m197-live.serial.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m197-reopen-runner.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m197-public-wire.json
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m197-public-wire.pcap
            build/acceptance/**/m197-batch*.log
            build/port-riscv64/full/matrix-source/m197-batch*.log
            build/port-aarch64/full/matrix-source/m197-batch*.log
          if-no-files-found: warn
          retention-days: 7
