name: NaSeed M132 15 signed ICU WebP compression regex ELFs, native QEMU three ISAs
on:
  # Exact-head M132 45/45 remains at run 41189211776. M133 is the one
  # active PR QEMU matrix; older milestones stay manually reproducible.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  signed-original-software:
    name: M132 15 signed original Unicode image regex compression tools / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify signed catalog, FIEMAP sparse owner and 3-ISA contracts
        timeout-minutes: 4
        run: |
          set -eu
          sh -n scripts/stage-alpine-prebuilt-overlay.sh \
                scripts/stage-m132-prebuilt.sh \
                scripts/probe-m132-batch.sh \
                tests/m132-batch-run.sh
          python3 scripts/check-prebuilt-profile-catalog.py
          python3 scripts/check-native-qemu-target.py
          python3 scripts/check-three-isa-core.py
          sh scripts/check-vfs-provider.sh
          sh scripts/check-m108-tmp-index.sh
      - name: Install signed APK staging tools and native system QEMU
        timeout-minutes: 12
        run: sh scripts/ci-install-signed-alpine-qemu-deps.sh ${{ matrix.port }}
      - name: Run all 15 original signed ELFs in one native NaSeed guest
        timeout-minutes: 45
        run: sh scripts/probe-m132-batch.sh ${{ matrix.port }}
      - name: Preserve native ELF provenance and QEMU serial on success
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: m132-signed-multifamily-pass-${{ matrix.port }}
          path: |
            build/external/m132-batch/${{ matrix.port }}/apk-install.log
            build/external/m132-batch/${{ matrix.port }}/requested-packages.txt
            build/external/m132-batch/${{ matrix.port }}/*.sha256
            build/busybox-source-parity-x86/m132-batch.clean.log
            build/port-riscv64/full/matrix-source/m132-batch.clean.log
            build/port-aarch64/full/matrix-source/m132-batch.clean.log
          if-no-files-found: error
      - name: Preserve full failed serial and guest rootfs for batch triage
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m132-signed-multifamily-fail-${{ matrix.port }}
          path: |
            build/external/m132-batch/${{ matrix.port }}/apk-install.log
            build/external/m132-batch/${{ matrix.port }}/requested-packages.txt
            build/external/m132-batch/${{ matrix.port }}/rootfs.cpio
            build/external/m132-batch/${{ matrix.port }}/*.sha256
            build/busybox-source-parity-x86/m132-batch.clean.log
            build/port-riscv64/full/matrix-source/m132-batch.clean.log
            build/port-aarch64/full/matrix-source/m132-batch.clean.log
          if-no-files-found: ignore
