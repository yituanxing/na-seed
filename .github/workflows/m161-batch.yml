name: NaSeed M161 real framebuffer ImageMagick fbgrab QMP pixels

on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  visible-real-screen:
    name: M161 original signed image apps and real screen pixels / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
      - name: Host framebuffer ABI and bounds test with sanitizers
        run: |
          set -eu
          for script in scripts/stage-m161-prebuilt.sh scripts/probe-m161-batch.sh \
                        scripts/host-configure-m161-batch.sh tests/m161-batch-run.sh \
                        scripts/run.sh scripts/probe-riscv64-busybox-matrix.sh \
                        scripts/probe-aarch64-busybox-matrix.sh; do
            sh -n "$script"
          done
          python3 -m py_compile scripts/m161-qmp-verify.py
          python3 scripts/check-prebuilt-profile-catalog.py
          python3 scripts/check-three-isa-core.py
          python3 scripts/check-architecture-boundaries.py
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -g -o /tmp/m161-fbdev-core-test \
            scripts/test-fbdev-core.c kernel/drivers/display/fbdev.c
          ASAN_OPTIONS=detect_leaks=0 /tmp/m161-fbdev-core-test
      - name: Install native QEMU with RAMFB UEFI and original signed Alpine packages
        timeout-minutes: 14
        run: |
          set -eu
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'clang:clang' 'ld.lld:lld' 'readelf:binutils' \
                      'cpio:cpio' 'mke2fs:e2fsprogs' 'xorriso:xorriso' \
                      'mformat:mtools' 'sgdisk:gdisk' 'qemu-riscv64:qemu-user'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          case '${{ matrix.port }}' in
            amd64)
              command -v qemu-system-x86_64 >/dev/null || missing="$missing qemu-system-x86"
              test -f /usr/share/OVMF/OVMF_CODE_4M.fd || \
              test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf" ;;
            riscv64)
              command -v qemu-system-riscv64 >/dev/null || missing="$missing qemu-system-misc"
              test -f /usr/share/qemu-efi-riscv64/RISCV_VIRT_CODE.fd || missing="$missing qemu-efi-riscv64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
            arm64)
              command -v qemu-system-aarch64 >/dev/null || missing="$missing qemu-system-arm"
              test -f /usr/share/AAVMF/AAVMF_CODE.fd || \
              test -f /usr/share/qemu-efi-aarch64/QEMU_EFI.fd || missing="$missing qemu-efi-aarch64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
          esac
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
      - name: Three ISA signed ImageMagick fbgrab and independent QEMU QMP screendump
        timeout-minutes: 58
        run: sh scripts/probe-m161-batch.sh ${{ matrix.port }}
      - name: Preserve actual QEMU RGB screenshot PNG proof and guest serial logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m161-real-hardware-pixels-${{ matrix.port }}-proof
          path: |
            build/external/m161-batch/${{ matrix.port }}/apk-install.log
            build/external/m161-batch/${{ matrix.port }}/requested-packages.txt
            build/external/m161-batch/${{ matrix.port }}/*.sha256
            build/external/m161-batch/${{ matrix.port }}/m161-qmp-check.log
            build/external/m161-batch/${{ matrix.port }}/m161-qmp-screen.ppm
            build/busybox-source-parity-x86/m161-batch.clean.log
            build/busybox-source-parity-x86/m161-batch.serial.log
            build/port-riscv64/full/matrix-source/m161-batch.clean.log
            build/port-riscv64/full/matrix-source/m161-batch.serial.log
            build/port-aarch64/full/matrix-source/m161-batch.clean.log
            build/port-aarch64/full/matrix-source/m161-batch.serial.log
          if-no-files-found: ignore
