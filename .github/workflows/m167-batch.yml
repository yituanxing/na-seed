name: NaSeed M167 multi-process input desktop and signed Linux applications three ISA

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/m167-batch.yml'
      - 'scripts/m167-*'
      - 'scripts/check-m167-fb-pwrite.sh'
      - 'scripts/test-m167-fb-pwrite.c'
      - 'scripts/check-m167-desktop.sh'
      - 'scripts/test-m105-pty-isig.sh'
      - 'scripts/test-m105-pty-isig-kernel.c'
      - 'scripts/check-m166-input-port.sh'
      - 'scripts/check-m107-unix.sh'
      - 'scripts/m161-qmp-verify.py'
      - 'scripts/native-qemu-target.sh'
      - 'scripts/port-boot-until.sh'
      - 'scripts/probe-m167-batch.sh'
      - 'scripts/stage-m167-prebuilt.sh'
      - 'scripts/host-configure-m167-batch.sh'
      - 'scripts/probe-x86-busybox-parity.sh'
      - 'scripts/probe-riscv64-busybox-matrix.sh'
      - 'scripts/probe-aarch64-busybox-matrix.sh'
      - 'scripts/stage-alpine-prebuilt-overlay.sh'
      - 'scripts/prebuilt-profile-catalog.tsv'
      - 'rootfs/alpine/packages-m167-batch.txt'
      - 'tests/m167-*'
      - 'user/desktop/**'
      - 'kernel/**'
      - 'ports/**'
      - 'Makefile'
      - 'scripts/build-riscv64-full.sh'
      - 'scripts/build-aarch64-full.sh'
      - 'scripts/run.sh'

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-multiprocess-desktop:
    name: M167 QEMU separate image+terminal app surfaces real hardware / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
      - name: Exact-ABI input IPC and desktop host gates
        run: |
          set -eu
          for script in scripts/check-m167-desktop.sh \
                        scripts/probe-m167-batch.sh \
                        scripts/stage-m167-prebuilt.sh \
                        scripts/host-configure-m167-batch.sh; do
            sh -n "$script"
          done
          python3 -m py_compile scripts/m161-qmp-verify.py scripts/m167-qmp-verify.py
          python3 scripts/check-prebuilt-profile-catalog.py
          python3 scripts/check-three-isa-core.py
          python3 scripts/check-architecture-boundaries.py
          sh scripts/check-m167-fb-pwrite.sh
          sh scripts/check-m167-desktop.sh
          sh scripts/test-m105-pty-isig.sh
          sh scripts/check-m166-input-port.sh
          sh scripts/check-m107-unix.sh
          cc -std=c11 -O2 -Wall -Wextra -Werror -static -fsyntax-only \
            user/desktop/protocol.c user/desktop/naseed-desktop.c \
            user/desktop/naseed-image.c user/desktop/naseed-terminal.c
      - name: Install native Linux ABI compilers QEMU EFI and staging tools
        timeout-minutes: 18
        run: |
          set -eu
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'clang:clang' 'ld.lld:lld' 'readelf:binutils' \
                      'cpio:cpio' 'mke2fs:e2fsprogs' 'xorriso:xorriso' \
                      'mformat:mtools' 'sgdisk:gdisk' 'gcc:gcc' \
                      'qemu-riscv64:qemu-user'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          case '${{ matrix.port }}' in
            amd64)
              command -v qemu-system-x86_64 >/dev/null || missing="$missing qemu-system-x86"
              test -f /usr/share/OVMF/OVMF_CODE_4M.fd || \
              test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf" ;;
            riscv64)
              command -v riscv64-linux-gnu-gcc >/dev/null || missing="$missing gcc-riscv64-linux-gnu"
              test -f /usr/riscv64-linux-gnu/include/bits/wordsize.h && \
              test -f /usr/riscv64-linux-gnu/lib/libc.a || \
                missing="$missing libc6-dev-riscv64-cross"
              command -v qemu-system-riscv64 >/dev/null || missing="$missing qemu-system-misc"
              test -f /usr/share/qemu-efi-riscv64/RISCV_VIRT_CODE.fd || missing="$missing qemu-efi-riscv64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
            arm64)
              command -v aarch64-linux-gnu-gcc >/dev/null || missing="$missing gcc-aarch64-linux-gnu"
              test -f /usr/aarch64-linux-gnu/include/bits/wordsize.h && \
              test -f /usr/aarch64-linux-gnu/lib/libc.a || \
                missing="$missing libc6-dev-arm64-cross"
              command -v qemu-system-aarch64 >/dev/null || missing="$missing qemu-system-arm"
              test -f /usr/share/AAVMF/AAVMF_CODE.fd || \
              test -f /usr/share/qemu-efi-aarch64/QEMU_EFI.fd || missing="$missing qemu-efi-aarch64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
          esac
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
      - name: Native QEMU input drives independent app surfaces and physical pixels
        timeout-minutes: 58
        run: sh scripts/probe-m167-batch.sh ${{ matrix.port }}
      - name: Preserve authenticated signed ELFs and independent QMP screen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m167-multiprocess-desktop-${{ matrix.port }}
          path: |
            build/external/m167-batch/${{ matrix.port }}/apk-install.log
            build/external/m167-batch/${{ matrix.port }}/*.sha256
            build/external/m167-batch/${{ matrix.port }}/m167-qmp-check.log
            build/external/m167-batch/${{ matrix.port }}/m167-*.ppm
            build/busybox-source-parity-x86/m167-batch.clean.log
            build/busybox-source-parity-x86/m167-batch.serial.log
            build/port-riscv64/full/matrix-source/m167-batch.clean.log
            build/port-riscv64/full/matrix-source/m167-batch.serial.log
            build/port-aarch64/full/matrix-source/m167-batch.clean.log
            build/port-aarch64/full/matrix-source/m167-batch.serial.log
          if-no-files-found: ignore
