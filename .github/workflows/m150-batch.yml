name: NaSeed M150 26 NEW signed Alpine archive and forensic ELFs

on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  signed-original-software:
    name: M150 26 signed ELFs / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        port: ${{ fromJSON((github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-m150-multiarch')) && '["amd64","riscv64","arm64"]' || '["amd64"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
      - name: Check manifest, host fixture and three-ISA source gates
        timeout-minutes: 4
        run: |
          set -eu
          for script in scripts/stage-m150-prebuilt.sh \
                        scripts/probe-m150-batch.sh \
                        scripts/host-configure-m150-batch.sh \
                        tests/m150-batch-run.sh; do
            sh -n "$script"
          done
          python3 scripts/check-prebuilt-profile-catalog.py
          python3 scripts/check-three-isa-core.py
          test "$(awk '!/^#/ && NF {n++} END {print n+0}' scripts/m150-original-elfs.txt)" -eq 26
          test "$(awk '!/^#/ && NF {n++} END {print n+0}' scripts/m150-expected-markers.txt)" -eq 27
          test "$(awk '!/^#/ && NF {print $0}' scripts/m150-original-elfs.txt | sort -u | wc -l)" -eq 26
          test "$(awk '!/^#/ && NF {print $0}' scripts/m150-expected-markers.txt | sort -u | wc -l)" -eq 27
      - name: Install APK host tooling and native QEMU system
        timeout-minutes: 12
        run: sh scripts/ci-install-signed-alpine-qemu-deps.sh ${{ matrix.port }} --arm64-efi-fallback mke2fs:e2fsprogs
      - name: Native QEMU 26 authentic signed Alpine program behaviors
        timeout-minutes: 48
        run: sh scripts/probe-m150-batch.sh ${{ matrix.port }}
      - name: Preserve signed ELF hashes, APK provenance and guest serial
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m150-original-${{ matrix.port }}-proof
          path: |
            build/external/m150-batch/${{ matrix.port }}/apk-install.log
            build/external/m150-batch/${{ matrix.port }}/requested-packages.txt
            build/external/m150-batch/${{ matrix.port }}/*.sha256
            build/busybox-source-parity-x86/m150-batch.clean.log
            build/busybox-source-parity-x86/m150-batch.serial.log
            build/port-riscv64/full/matrix-source/m150-batch.clean.log
            build/port-riscv64/full/matrix-source/m150-batch.serial.log
            build/port-aarch64/full/matrix-source/m150-batch.clean.log
            build/port-aarch64/full/matrix-source/m150-batch.serial.log
          if-no-files-found: ignore
