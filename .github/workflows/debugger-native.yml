name: NaSeed native debugger acceptance
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Original debugger and ptrace acceptance profile
        type: choice
        required: true
        options:
          - m72-strace
          - m73-strace
          - m74-strace
          - m75-gdb
          - m76-gdb
concurrency:
  group: ${{ github.workflow }}-${{ inputs.profile }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-inspection:
    name: ${{ inputs.profile }} genuine debugger gate / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    env:
      PROFILE: ${{ inputs.profile }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Shared kernel architecture and profile-specific ptrace contracts
        run: |
          set -eu
          case "$PROFILE" in
            m72-strace|m73-strace|m74-strace|m75-gdb|m76-gdb) ;;
            *) exit 2 ;;
          esac
          milestone=${PROFILE%%-*}
          for script in "scripts/stage-$milestone-prebuilt.sh" "scripts/probe-$PROFILE.sh" "tests/$PROFILE-run.sh"; do
            sh -n "$script"
          done
          if [ "$PROFILE" = m76-gdb ]; then
            sh -n tests/m77-gdb-run.sh
            sh -n tests/m78-gdb-run.sh
          fi
          python3 scripts/check-three-isa-core.py
          python3 scripts/check-prebuilt-profile-catalog.py
          python3 scripts/check-native-qemu-target.py
          if [ "$PROFILE" = m76-gdb ]; then
            cc -std=c11 -Wall -Wextra -Werror -I kernel scripts/test-rv64-ptrace-step.c -o /tmp/nas-rv64-ptrace-step
            /tmp/nas-rv64-ptrace-step
          fi
          cc -std=c11 -Wall -Wextra -Werror -ffunction-sections -fdata-sections -Wl,--gc-sections -I kernel scripts/test-ptrace-owner.c kernel/task/ptrace.c -o /tmp/nas-ptrace-owner
          /tmp/nas-ptrace-owner
          case "$PROFILE" in
            m74-strace|m75-gdb|m76-gdb)
              cc -std=c11 -Wall -Wextra -Werror -ffunction-sections -fdata-sections -Wl,--gc-sections -I kernel scripts/test-ptrace-wait-ownership.c kernel/task/process.c -o /tmp/nas-ptrace-wait
              /tmp/nas-ptrace-wait ;;
          esac
          case "$PROFILE" in
            m75-gdb|m76-gdb)
              cc -std=c11 -Wall -Wextra -Werror -ffunction-sections -fdata-sections -Wl,--gc-sections -I kernel scripts/test-remote-task-read.c kernel/mm/remote_copy.c kernel/mm/mm.c -o /tmp/nas-remote
              /tmp/nas-remote ;;
          esac
      - name: Install native QEMU and host rootfs tools
        timeout-minutes: 12
        env:
          PORT: ${{ matrix.port }}
        run: sh scripts/ci-install-signed-alpine-qemu-deps.sh "$PORT" --explicit-tools clang:clang ld.lld:lld readelf:binutils cpio:cpio xorriso:xorriso mformat:mtools sgdisk:gdisk qemu-riscv64:qemu-user
      - name: Original debugger in native QEMU
        timeout-minutes: 24
        env:
          PORT: ${{ matrix.port }}
        run: sh "scripts/probe-$PROFILE.sh" "$PORT"
      - name: Retain actual QEMU and APK failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.profile }}-${{ matrix.port }}
          path: |
            build/external/${{ inputs.profile }}/${{ matrix.port }}/apk-install.log
            build/external/${{ inputs.profile }}/${{ matrix.port }}/requested-packages.txt
            build/busybox-source-parity-x86/m72-strace.clean.log
            build/busybox-source-parity-x86/m73-follow.clean.log
            build/busybox-source-parity-x86/m74-attach.clean.log
            build/busybox-source-parity-x86/m75-attach.clean.log
            build/busybox-source-parity-x86/m76-source.clean.log
            build/busybox-source-parity-x86/m77-attach.clean.log
            build/busybox-source-parity-x86/m78-step.clean.log
            build/port-riscv64/full/matrix-source/m72-strace.clean.log
            build/port-riscv64/full/matrix-source/m73-follow.clean.log
            build/port-riscv64/full/matrix-source/m74-attach.clean.log
            build/port-riscv64/full/matrix-source/m75-attach.clean.log
            build/port-riscv64/full/matrix-source/m76-source.clean.log
            build/port-riscv64/full/matrix-source/m77-attach.clean.log
            build/port-riscv64/full/matrix-source/m78-step.clean.log
            build/port-aarch64/full/matrix-source/m72-strace.clean.log
            build/port-aarch64/full/matrix-source/m73-follow.clean.log
            build/port-aarch64/full/matrix-source/m74-attach.clean.log
            build/port-aarch64/full/matrix-source/m75-attach.clean.log
            build/port-aarch64/full/matrix-source/m76-source.clean.log
            build/port-aarch64/full/matrix-source/m77-attach.clean.log
            build/port-aarch64/full/matrix-source/m78-step.clean.log
          if-no-files-found: ignore
