name: NaSeed M173 typed bus resources and dynamic desktop three-ISA acceptance

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/m173-batch.yml'
      - 'user/desktop/**'
      - 'scripts/check-m173-batch.sh'
      - 'scripts/probe-m173-batch.sh'
      - 'scripts/stage-m173-*'
      - 'scripts/m173-*'
      - 'kernel/drivers/core/bus.*'
      - 'kernel/platform/virtio_mmio_qemu.c'
      - 'kernel/platform/x86_virtio_pci.c'
      - 'ports/uboot/**'
      - 'kernel/drivers/input/**'
      - 'scripts/test-driver-bus.c'
      - 'scripts/test-m166-virtio-input-port.c'
      - 'scripts/test-uboot-original-virtio-net-port.c'
      - 'scripts/test-lwip-native-boot.c'
      - 'scripts/full-kernel-core.sources'
      - 'scripts/build-riscv64-full.sh'
      - 'scripts/build-aarch64-full.sh'
      - 'Makefile'

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  production-host-gates:
    name: M173 typed-resource and dynamic-session host tests
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
      - name: Three-ISA code boundaries and focused device tests
        run: |
          set -eu
          sh -n scripts/check-m173-batch.sh
          python3 scripts/check-three-isa-core.py
          python3 scripts/check-architecture-boundaries.py
          sh scripts/check-m173-batch.sh

  native-qemu:
    name: M173 dynamic fifth GUI client through real QEMU / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    needs: production-host-gates
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
      - name: Install native and cross Linux toolchains, EFI and system QEMU
        timeout-minutes: 18
        run: |
          set -eu
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'cmake:cmake' 'g++:g++' 'clang:clang' 'ld.lld:lld' \
                      'readelf:binutils' 'cpio:cpio' 'mke2fs:e2fsprogs' \
                      'xorriso:xorriso' 'mformat:mtools' 'sgdisk:gdisk' \
                      'gcc:gcc' 'qemu-riscv64:qemu-user'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          case '${{ matrix.port }}' in
            amd64)
              command -v qemu-system-x86_64 >/dev/null || missing="$missing qemu-system-x86"
              test -f /usr/share/OVMF/OVMF_CODE_4M.fd || \
              test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf" ;;
            riscv64)
              command -v riscv64-linux-gnu-gcc >/dev/null || missing="$missing gcc-riscv64-linux-gnu"
              command -v riscv64-linux-gnu-g++ >/dev/null || missing="$missing g++-riscv64-linux-gnu"
              test -f /usr/riscv64-linux-gnu/include/bits/wordsize.h && \
              test -f /usr/riscv64-linux-gnu/lib/libc.a || missing="$missing libc6-dev-riscv64-cross"
              command -v qemu-system-riscv64 >/dev/null || missing="$missing qemu-system-misc"
              test -f /usr/share/qemu-efi-riscv64/RISCV_VIRT_CODE.fd || missing="$missing qemu-efi-riscv64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
            arm64)
              command -v aarch64-linux-gnu-gcc >/dev/null || missing="$missing gcc-aarch64-linux-gnu"
              command -v aarch64-linux-gnu-g++ >/dev/null || missing="$missing g++-aarch64-linux-gnu"
              test -f /usr/aarch64-linux-gnu/include/bits/wordsize.h && \
              test -f /usr/aarch64-linux-gnu/lib/libc.a || missing="$missing libc6-dev-arm64-cross"
              command -v qemu-system-aarch64 >/dev/null || missing="$missing qemu-system-arm"
              test -f /usr/share/AAVMF/AAVMF_CODE.fd || \
              test -f /usr/share/qemu-efi-aarch64/QEMU_EFI.fd || missing="$missing qemu-efi-aarch64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
          esac
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
      - name: Boot actual guest, exercise externally launched fifth LVGL window and QMP
        timeout-minutes: 58
        run: sh scripts/probe-m173-batch.sh ${{ matrix.port }}
      - name: Preserve guest output and physical display evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m173-architecture-${{ matrix.port }}
          path: |
            build/external/m168-batch/${{ matrix.port }}/m173-qmp-check.log
            build/external/m168-batch/${{ matrix.port }}/m173-*.ppm
            build/external/m171-lvgl/${{ matrix.port }}/build.log
            build/busybox-source-parity-x86/m173-batch.clean.log
            build/busybox-source-parity-x86/m173-batch.serial.log
            build/port-riscv64/full/matrix-source/m173-batch.clean.log
            build/port-riscv64/full/matrix-source/m173-batch.serial.log
            build/port-aarch64/full/matrix-source/m173-batch.clean.log
            build/port-aarch64/full/matrix-source/m173-batch.serial.log
          if-no-files-found: ignore
