name: Temporary GPU libdrm caller symbolization
on:
  push:
    branches: [experiment/tgoskits-gpu-owner-20261128]
    paths: ['.github/workflows/tgos-debug-symbolize.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  locate-null-strlen-caller:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Prepare exact experimental x86 kernel toolchain
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends clang lld make git binutils curl
          rustup toolchain install nightly-2026-11-13 --profile minimal --component rust-src --target x86_64-unknown-none
      - name: Resolve actual crash caller from the same NaSeed kernel ELF
        run: |
          make ARCH=x86_64 NAS_ENABLE_VIRTIO_GPU=1 NAS_EXPERIMENT_TGOS_DRM_FFI=1 NAS_EXPERIMENT_TGOS_GPU_OWNER=1 kernel
          nm build/kernel.elf | grep -F ' nas_tgos_original_gpu_pci_identity'
          echo 'Real caller of strlen(NULL) from original libdrm test:'
          addr2line -f -C -e build/kernel.elf 0xffffffff8004fe20
          addr2line -f -C -e build/kernel.elf 0xffffffff8004fe1f
