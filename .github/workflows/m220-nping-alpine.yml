name: NaSeed M220 original Alpine Nping first/reopen real host UDP and PCAP

# Trigger the exact-head pilot only when its workflow changes. Shared M197/M205
# changes also serve M218/M219 and must not relaunch all expensive cohorts.
on:
  push:
    branches: [naseed-app-batch2]
    paths:
      - '.github/workflows/m220-nping-alpine.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-nping-amd64:
    name: Real signed Nping host UDP+QEMU PCAP both boots / amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: true
      - name: Require independent phase-specific host and QEMU wire oracles
        run: |
          set -eu
          python3 scripts/test-m220-nping-host.py
          python3 scripts/test-m218-ifstat-host.py
          python3 scripts/test-m219-utmpdump-host.py
          python3 scripts/test-m215-alpine-host.py
          python3 scripts/check-three-isa-core.py
          python3 scripts/check-architecture-boundaries.py
          sh scripts/check-lwip-socket-abi.sh
      - name: Install native x86 QEMU, physical ext4 and ELF tools
        timeout-minutes: 18
        run: |
          set -eu
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'cmake:cmake' 'g++:g++' 'clang:clang' 'ld.lld:lld' \
                      'qemu-system-x86_64:qemu-system-x86' \
                      'readelf:binutils' 'cpio:cpio' 'mke2fs:e2fsprogs' \
                      'debugfs:e2fsprogs' 'e2fsck:e2fsprogs' \
                      'xorriso:xorriso' 'mformat:mtools' 'sgdisk:gdisk' \
                      'curl:curl' 'python3:python3' 'openssl:openssl'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          test -f /usr/share/OVMF/OVMF_CODE_4M.fd || \
            test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf"
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
      - name: Verify original signed native Nping and independent offline APK
        timeout-minutes: 18
        run: |
          set -eu
          sh scripts/inventory-m141-signed-apks.sh amd64 m220
          tsv=build/external/m220-candidate-inventory/amd64/candidates.tsv
          awk -F '\t' 'NR > 1 {n++; if ($3 != "NATIVE_ELF" || length($4) != 64 || $4 ~ /[^0-9a-f]/) bad++}
            END {if (n != 1 || bad) exit 1}' "$tsv"
          echo '[M220 SIGNED HOST ELF PASS] no guest UDP success claimed'
      - name: Two native QEMUs, two original Nping calls and host wire oracles
        timeout-minutes: 65
        env:
          NAS_M220_PUBLIC_QEMU_TIMEOUT: '3000'
          NAS_M220_PUBLIC_SECONDS: '2900'
          NAS_M220_REOPEN_SECONDS: '900'
        run: sh scripts/probe-m220-alpine-pilot.sh amd64
      - name: Preserve real host UDP, two captures, guest UART and signed ext4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m220-original-nping-amd64
          path: |
            build/external/m220-candidate-inventory/amd64/candidates.tsv
            build/external/m220-candidate-inventory/amd64/signed-cache.sha256
            build/external/m220-candidate-inventory/amd64/apk-install.log
            build/external/m220-candidate-inventory/amd64/apk-offline-proof.log
            build/external/m191-alpine-rootfs/amd64/m220-compat-report.json
            build/external/m191-alpine-rootfs/amd64/m220-first-runner.log
            build/external/m191-alpine-rootfs/amd64/m197-live.serial.log
            build/external/m191-alpine-rootfs/amd64/m197-reopen-runner.log
            build/external/m191-alpine-rootfs/amd64/m197-public-wire.json
            build/external/m191-alpine-rootfs/amd64/m197-public-wire.pcap
            build/external/m191-alpine-rootfs/amd64/m220-first-host-udp.log
            build/external/m191-alpine-rootfs/amd64/m220-first-wire.json
            build/external/m191-alpine-rootfs/amd64/m220-reopen-host-udp.log
            build/external/m191-alpine-rootfs/amd64/m220-reopen-wire.pcap
            build/external/m191-alpine-rootfs/amd64/m220-reopen-wire.json
            build/acceptance/**/m197-batch*.log

  original-nping-cross:
    name: Real signed Nping host UDP+QEMU PCAP both boots / ${{ matrix.port }}
    needs: [original-nping-amd64]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        port: [riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: true
      - name: Require real Nping wire semantics and shared ISA contracts
        run: |
          set -eu
          python3 scripts/test-m220-nping-host.py
          python3 scripts/check-three-isa-core.py
          python3 scripts/check-architecture-boundaries.py
      - name: Install native cross-QEMU, cross-GCC, firmware and ext4 tools
        timeout-minutes: 20
        run: |
          set -eu
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'cmake:cmake' 'g++:g++' 'clang:clang' 'ld.lld:lld' \
                      'readelf:binutils' 'cpio:cpio' 'mke2fs:e2fsprogs' \
                      'debugfs:e2fsprogs' 'e2fsck:e2fsprogs' \
                      'xorriso:xorriso' 'mformat:mtools' 'sgdisk:gdisk' \
                      'curl:curl' 'python3:python3' 'openssl:openssl'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          case '${{ matrix.port }}' in
            riscv64)
              command -v riscv64-linux-gnu-gcc >/dev/null || missing="$missing gcc-riscv64-linux-gnu"
              command -v riscv64-linux-gnu-g++ >/dev/null || missing="$missing g++-riscv64-linux-gnu"
              test -f /usr/riscv64-linux-gnu/include/bits/wordsize.h && \
              test -f /usr/riscv64-linux-gnu/lib/libc.a || missing="$missing libc6-dev-riscv64-cross"
              command -v qemu-system-riscv64 >/dev/null || missing="$missing qemu-system-misc"
              test -f /usr/share/qemu-efi-riscv64/RISCV_VIRT_CODE.fd || missing="$missing qemu-efi-riscv64" ;;
            arm64)
              command -v aarch64-linux-gnu-gcc >/dev/null || missing="$missing gcc-aarch64-linux-gnu"
              command -v aarch64-linux-gnu-g++ >/dev/null || missing="$missing g++-aarch64-linux-gnu"
              test -f /usr/aarch64-linux-gnu/include/bits/wordsize.h && \
              test -f /usr/aarch64-linux-gnu/lib/libc.a || missing="$missing libc6-dev-arm64-cross"
              command -v qemu-system-aarch64 >/dev/null || missing="$missing qemu-system-arm"
              test -f /usr/share/AAVMF/AAVMF_CODE.fd || \
              test -f /usr/share/qemu-efi-aarch64/QEMU_EFI.fd || missing="$missing qemu-efi-aarch64" ;;
          esac
          test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu"
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
      - name: Verify signed original cross-ISA Nping ELF and package closure
        timeout-minutes: 20
        run: |
          set -eu
          sh scripts/inventory-m141-signed-apks.sh '${{ matrix.port }}' m220
          tsv='build/external/m220-candidate-inventory/${{ matrix.port }}/candidates.tsv'
          awk -F '\t' 'NR > 1 {n++; if ($3 != "NATIVE_ELF" || length($4) != 64 || $4 ~ /[^0-9a-f]/) bad++}
            END {if (n != 1 || bad) exit 1}' "$tsv"
      - name: Two target-native QEMUs, actual host UDP and exact captures
        timeout-minutes: 105
        env:
          NAS_M220_PUBLIC_QEMU_TIMEOUT: '4500'
          NAS_M220_PUBLIC_SECONDS: '4400'
          NAS_M220_REOPEN_SECONDS: '900'
        run: sh scripts/probe-m220-alpine-pilot.sh '${{ matrix.port }}'
      - name: Preserve native ELF, independent wire and durable ext4 proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m220-original-nping-${{ matrix.port }}
          path: |
            build/external/m220-candidate-inventory/${{ matrix.port }}/candidates.tsv
            build/external/m220-candidate-inventory/${{ matrix.port }}/signed-cache.sha256
            build/external/m220-candidate-inventory/${{ matrix.port }}/apk-install.log
            build/external/m220-candidate-inventory/${{ matrix.port }}/apk-offline-proof.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m220-compat-report.json
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m220-first-runner.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m197-live.serial.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m197-reopen-runner.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m197-public-wire.json
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m197-public-wire.pcap
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m220-first-host-udp.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m220-first-wire.json
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m220-reopen-host-udp.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m220-reopen-wire.pcap
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m220-reopen-wire.json
            build/acceptance/**/m197-batch*.log
