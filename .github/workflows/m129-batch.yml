name: NaSeed M129 15 new signed process and monitoring ELF, QEMU three ISAs
on:
  pull_request:
    paths:
      - '.github/workflows/m129-batch.yml'
      - 'tests/m129-*'
      - 'scripts/m129-*'
      - 'scripts/probe-m129-batch.sh'
      - 'scripts/stage-m129-prebuilt.sh'
      - 'scripts/stage-alpine-prebuilt-overlay.sh'
      - 'scripts/prebuilt-profile-catalog.tsv'
      - 'scripts/check-prebuilt-profile-catalog.py'
      - 'scripts/check-native-qemu-target.py'
      - 'scripts/native-qemu-target.sh'
      - 'scripts/probe-x86-busybox-parity.sh'
      - 'scripts/probe-riscv64-busybox-matrix.sh'
      - 'scripts/probe-aarch64-busybox-matrix.sh'
      - 'rootfs/alpine/**'
      - 'kernel/**'
      - 'ports/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  signed-original-software:
    name: M129 15 signed native process tools / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify signed catalog and full guest contract
        timeout-minutes: 3
        run: |
          set -eu
          sh -n scripts/stage-alpine-prebuilt-overlay.sh \
                scripts/stage-m129-prebuilt.sh \
                scripts/probe-m129-batch.sh \
                tests/m129-batch-run.sh
          python3 scripts/check-prebuilt-profile-catalog.py
          python3 scripts/check-native-qemu-target.py
          python3 scripts/check-three-isa-core.py
          cc -O2 -std=c11 -Wall -Wextra -Werror -fno-builtin -I kernel \
            scripts/test-m129-itimer-host.c kernel/time/clock.c \
            -o /tmp/naseed-m129-itimer-host
          /tmp/naseed-m129-itimer-host
          sh scripts/check-m105-signal-group.sh
      - name: Install signed APK staging tools and native target QEMU
        timeout-minutes: 12
        run: |
          set -eu
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'clang:clang' 'ld.lld:lld' 'readelf:binutils' 'cpio:cpio' \
                      'xorriso:xorriso' 'mformat:mtools' \
                      'sgdisk:gdisk' 'qemu-riscv64:qemu-user'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          case "${{ matrix.port }}" in
            amd64)
              command -v qemu-system-x86_64 >/dev/null || missing="$missing qemu-system-x86"
              test -f /usr/share/OVMF/OVMF_CODE_4M.fd || \
              test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf" ;;
            riscv64)
              command -v qemu-system-riscv64 >/dev/null || missing="$missing qemu-system-misc"
              test -f /usr/share/qemu-efi-riscv64/RISCV_VIRT_CODE.fd || missing="$missing qemu-efi-riscv64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
            arm64)
              command -v qemu-system-aarch64 >/dev/null || missing="$missing qemu-system-arm"
              test -f /usr/share/AAVMF/AAVMF_CODE.fd || missing="$missing qemu-efi-aarch64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
          esac
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
      - name: Run 15 independent original ELFs in one real NaSeed guest
        timeout-minutes: 45
        run: sh scripts/probe-m129-batch.sh ${{ matrix.port }}
      - name: Preserve signed APK provenance and actual serial on success
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: m129-signed-process-batch-pass-${{ matrix.port }}
          path: |
            build/external/m129-batch/${{ matrix.port }}/apk-install.log
            build/external/m129-batch/${{ matrix.port }}/requested-packages.txt
            build/external/m129-batch/${{ matrix.port }}/*.sha256
            build/busybox-source-parity-x86/m129-batch.clean.log
            build/port-riscv64/full/matrix-source/m129-batch.clean.log
            build/port-aarch64/full/matrix-source/m129-batch.clean.log
          if-no-files-found: error
      - name: Preserve all failed serial and signed native rootfs for group triage
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m129-signed-process-batch-fail-${{ matrix.port }}
          path: |
            build/external/m129-batch/${{ matrix.port }}/apk-install.log
            build/external/m129-batch/${{ matrix.port }}/requested-packages.txt
            build/external/m129-batch/${{ matrix.port }}/rootfs.cpio
            build/external/m129-batch/${{ matrix.port }}/*.sha256
            build/busybox-source-parity-x86/m129-batch.clean.log
            build/port-riscv64/full/matrix-source/m129-batch.clean.log
            build/port-aarch64/full/matrix-source/m129-batch.clean.log
          if-no-files-found: ignore
