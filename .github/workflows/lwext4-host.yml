name: NaSeed pinned lwext4 real ext4 RamDisk acceptance
on:
  pull_request:
    paths:
      - 'third_party/lwext4/**'
      - 'kernel/block/**'
      - 'kernel/drivers/block/**'
      - 'kernel/drivers/port/**'
      - 'kernel/drivers/core/**'
      - 'kernel/drivers/virtio/**'
      - 'scripts/test-virtio-pci.c'
      - 'scripts/test-virtio-transport.c'
      - 'scripts/check-shared-kernel-build.sh'
      - 'scripts/test-driver-bus.c'
      - 'scripts/test-driver-dma.c'
      - 'scripts/build-riscv64-full.sh'
      - 'ports/unikraft/**'
      - 'ports/uboot/**'
      - 'third_party/uboot/**'
      - 'scripts/test-uboot-original-virtio-blk-port.c'
      - 'docs/virtio-upstream-provenance.md'
      - 'third_party/unikraft/**'
      - 'scripts/test-unikraft-ring.c'
      - 'scripts/test-unikraft-blk-abi.c'
      - 'scripts/check-block-foundation.sh'
      - 'scripts/test-block-driver-port.c'
      - 'kernel/platform/aarch64_virtio.c'
      - 'kernel/platform/riscv64_virtio.c'
      - 'kernel/platform/virtio_mmio_qemu.*'
      - 'kernel/platform/x86_virtio_pci.c'
      - 'kernel/arch/x86_64/mmu.c'
      - 'kernel/arch/x86_64/mmu.h'
      - 'scripts/probe-lwext4-virtio-pci-x86.sh'
      - 'scripts/run.sh'
      - 'Makefile'
      - 'kernel/arch/riscv64/io.c'
      - 'ports/lwext4/**'
      - 'ports/littlefs/**'
      - 'third_party/littlefs/**'
      - 'scripts/check-littlefs-block.sh'
      - 'scripts/test-littlefs-block.c'
      - 'scripts/check-ext4-fsck-clean.sh'
      - 'kernel/fs/vfs*'
      - 'kernel/fs/metadata_syscall.c'
      - 'user/ext4-guest-read.S'
      - 'user/ext4-guest-write.S'
      - 'user/ext4-guest-rw.c'
      - 'user/ext4-guest-rw-x86.ld'
      - 'user/**/ext4-rw-syscall.S'
      - 'scripts/build-lwext4-native-rw-probes.sh'
      - 'scripts/build-aarch64-full.sh'
      - 'scripts/build-lwext4-guest.sh'
      - 'scripts/probe-riscv64-full.sh'
      - 'scripts/probe-aarch64-full.sh'
      - 'scripts/probe-lwext4-writable-x86.sh'
      - 'scripts/probe-lwext4-syscall-x86.sh'
      - 'scripts/probe-lwext4-busybox-x86.sh'
      - 'kernel/mm/heap.*'
      - 'scripts/check-lwext4-ramdisk.sh'
      - 'scripts/test-lwext4-ramdisk.c'
      - '.github/workflows/lwext4-host.yml'
  workflow_dispatch:
jobs:
  lwext4-real-ext4-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify real BlockDevice and third-party driver port (host and 3 ISAs)
        run: sh scripts/check-block-foundation.sh
      - name: 'Second independent upstream FS: pinned littlefs against shared BlockDevice'
        run: sh scripts/check-littlefs-block.sh
      - name: Build pinned upstream lwext4 and exercise real ext4 via NaSeed RamDisk
        run: |
          command -v cmake
          command -v mke2fs
          command -v e2fsck
          sh scripts/check-lwext4-ramdisk.sh
          sh scripts/check-lwext4-freestanding.sh
          sudo apt-get -o Acquire::Retries=1 update -qq
          sudo apt-get -y install --no-install-recommends lld
          sh scripts/check-lwext4-guest-link.sh
      - name: Link real NaSeed kernel ELF with opt-in lwext4 on all supported ISAs
        run: |
          make -j2 NAS_ENABLE_LWEXT4=1 kernel
          NAS_ENABLE_LWEXT4=1 sh scripts/build-riscv64-full.sh
          NAS_ENABLE_LWEXT4=1 sh scripts/build-aarch64-full.sh
          test -s build/kernel.elf
          test -s build/port-riscv64/full/kernel.elf
          test -s build/port-aarch64/full/kernel.elf
          echo '[LWEXT4 OPT-IN KERNEL LINK PASS] x86-64 / RV64 / AArch64'
      - name: Boot the real x86 kernel with the ext4 image as a Limine module
        run: |
          sudo apt-get -y install --no-install-recommends ovmf qemu-system-x86 xorriso cpio
          sh scripts/probe-lwext4-guest-x86.sh
      - name: Actual Linux openat and read on ext4 from x86 ring3 ELF
        run: sh scripts/probe-lwext4-syscall-x86.sh
      - name: Real ring3 Linux openat/write/fsync/lseek/read/reopen against explicitly writable ephemeral ext4
        run: sh scripts/probe-lwext4-writable-x86.sh
      - name: Original pinned Debian BusyBox reads and enumerates ext4 through Linux VFS
        run: sh scripts/probe-lwext4-busybox-x86.sh
      - name: Boot the exact same real ext4 image through native RV64 and AArch64 QEMU
        run: |
          sudo apt-get -y install --no-install-recommends qemu-system-misc qemu-system-arm qemu-efi-aarch64 qemu-efi-riscv64 gdisk mtools
          NAS_ENABLE_LWEXT4=1 NAS_LWEXT4_TEST_IMAGE=build/external/lwext4/ext4.img sh scripts/probe-riscv64-full.sh
          NAS_ENABLE_LWEXT4=1 NAS_LWEXT4_TEST_IMAGE=build/external/lwext4/ext4.img sh scripts/probe-aarch64-full.sh
      - name: One source Linux ext4 RW syscalls in genuine x86-64 RV64 AArch64 QEMU
        run: |
          sh scripts/build-lwext4-native-rw-probes.sh
          NAS_LWEXT4_RW_PROBE=build/lwext4-native-rw/x86_64/probe.elf sh scripts/probe-lwext4-writable-x86.sh
          NAS_ENABLE_LWEXT4=1 NAS_LWEXT4_TEST_IMAGE=build/external/lwext4/ext4.img NAS_LWEXT4_RW_PROBE=build/lwext4-native-rw/riscv64/probe.elf sh scripts/probe-riscv64-full.sh
          NAS_ENABLE_LWEXT4=1 NAS_LWEXT4_TEST_IMAGE=build/external/lwext4/ext4.img NAS_LWEXT4_RW_PROBE=build/lwext4-native-rw/aarch64/probe.elf sh scripts/probe-aarch64-full.sh
      - name: Genuine x86-64 modern VirtIO-PCI disk, independent ext4 persistence and e2fsck
        run: |
          cp build/external/lwext4/ext4.img build/external/lwext4/virtio-persistent-x86.img
          NAS_VIRTIO_BLK_IMAGE=build/external/lwext4/virtio-persistent-x86.img NAS_LWEXT4_RW_PROBE=build/lwext4-native-rw/x86_64/probe.elf sh scripts/probe-lwext4-virtio-pci-x86.sh
          sh scripts/check-ext4-fsck-clean.sh build/external/lwext4/virtio-persistent-x86.img
          debugfs -R 'cat /sandbox/cross-isa-created' build/external/lwext4/virtio-persistent-x86.img > build/external/lwext4/virtio-x86-content.txt
          grep -Fq 'NaSeed one portable Linux ELF for x86 RV64 AArch64 ext4 RW' build/external/lwext4/virtio-x86-content.txt
          echo '[VIRTIO-BLK PCI HOST PERSISTENCE PASS] x86 real hardware disk bytes survived QEMU'
      - name: Genuine AArch64 VirtIO-MMIO disk driver, independent ext4 image persistence and e2fsck
        run: |
          cp build/external/lwext4/ext4.img build/external/lwext4/virtio-persistent.img
          NAS_ENABLE_LWEXT4=1 NAS_ENABLE_VIRTIO_BLK=1 sh scripts/build-aarch64-full.sh
          NAS_ENABLE_LWEXT4=1 NAS_ENABLE_VIRTIO_BLK=1 NAS_LWEXT4_RW_PROBE=build/lwext4-native-rw/aarch64/probe.elf NAS_VIRTIO_BLK_IMAGE=build/external/lwext4/virtio-persistent.img sh scripts/probe-aarch64-full.sh
          sh scripts/check-ext4-fsck-clean.sh build/external/lwext4/virtio-persistent.img
          debugfs -R 'cat /sandbox/cross-isa-created' build/external/lwext4/virtio-persistent.img > build/external/lwext4/virtio-persisted-content.txt
          grep -Fq 'NaSeed one portable Linux ELF for x86 RV64 AArch64 ext4 RW' build/external/lwext4/virtio-persisted-content.txt
          echo '[VIRTIO-BLK HOST PERSISTENCE PASS] hardware driver ext4 bytes survived QEMU'
      - name: Genuine RV64 VirtIO-MMIO disk driver, independent ext4 image persistence and e2fsck
        run: |
          cp build/external/lwext4/ext4.img build/external/lwext4/virtio-persistent-rv.img
          NAS_ENABLE_LWEXT4=1 NAS_ENABLE_VIRTIO_BLK=1 sh scripts/build-riscv64-full.sh
          NAS_ENABLE_LWEXT4=1 NAS_ENABLE_VIRTIO_BLK=1 NAS_LWEXT4_RW_PROBE=build/lwext4-native-rw/riscv64/probe.elf NAS_VIRTIO_BLK_IMAGE=build/external/lwext4/virtio-persistent-rv.img sh scripts/probe-riscv64-full.sh
          sh scripts/check-ext4-fsck-clean.sh build/external/lwext4/virtio-persistent-rv.img
          debugfs -R 'cat /sandbox/cross-isa-created' build/external/lwext4/virtio-persistent-rv.img > build/external/lwext4/virtio-rv-content.txt
          grep -Fq 'NaSeed one portable Linux ELF for x86 RV64 AArch64 ext4 RW' build/external/lwext4/virtio-rv-content.txt
          echo '[VIRTIO-BLK RV64 HOST PERSISTENCE PASS] hardware driver ext4 bytes survived QEMU'
