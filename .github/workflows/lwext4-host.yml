name: NaSeed pinned lwext4 real ext4 RamDisk acceptance
on:
  pull_request:
    paths:
      - 'third_party/lwext4/**'
      - 'kernel/block/**'
      - 'ports/lwext4/**'
      - 'kernel/fs/vfs*'
      - 'kernel/fs/metadata_syscall.c'
      - 'user/ext4-guest-read.S'
      - 'scripts/probe-lwext4-syscall-x86.sh'
      - 'kernel/mm/heap.*'
      - 'scripts/check-lwext4-ramdisk.sh'
      - 'scripts/test-lwext4-ramdisk.c'
      - '.github/workflows/lwext4-host.yml'
  workflow_dispatch:
jobs:
  lwext4-real-ext4-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned upstream lwext4 and exercise real ext4 via NaSeed RamDisk
        run: |
          command -v cmake
          command -v mke2fs
          command -v e2fsck
          sh scripts/check-lwext4-ramdisk.sh
          sh scripts/check-lwext4-freestanding.sh
          sudo apt-get -o Acquire::Retries=1 update -qq
          sudo apt-get -y install --no-install-recommends lld
          sh scripts/check-lwext4-guest-link.sh
      - name: Link real NaSeed kernel ELF with opt-in lwext4 on all supported ISAs
        run: |
          make -j2 NAS_ENABLE_LWEXT4=1 kernel
          NAS_ENABLE_LWEXT4=1 sh scripts/build-riscv64-full.sh
          NAS_ENABLE_LWEXT4=1 sh scripts/build-aarch64-full.sh
          test -s build/kernel.elf
          test -s build/port-riscv64/full/kernel.elf
          test -s build/port-aarch64/full/kernel.elf
          echo '[LWEXT4 OPT-IN KERNEL LINK PASS] x86-64 / RV64 / AArch64'
      - name: Boot the real x86 kernel with the ext4 image as a Limine module
        run: |
          sudo apt-get -y install --no-install-recommends ovmf qemu-system-x86 xorriso cpio
          sh scripts/probe-lwext4-guest-x86.sh
      - name: Actual Linux openat and read on ext4 from x86 ring3 ELF
        run: sh scripts/probe-lwext4-syscall-x86.sh
      - name: Boot the exact same real ext4 image through native RV64 and AArch64 QEMU
        run: |
          sudo apt-get -y install --no-install-recommends qemu-system-misc qemu-system-arm qemu-efi-aarch64 qemu-efi-riscv64 gdisk mtools
          NAS_ENABLE_LWEXT4=1 NAS_LWEXT4_TEST_IMAGE=build/external/lwext4/ext4.img sh scripts/probe-riscv64-full.sh
          NAS_ENABLE_LWEXT4=1 NAS_LWEXT4_TEST_IMAGE=build/external/lwext4/ext4.img sh scripts/probe-aarch64-full.sh
