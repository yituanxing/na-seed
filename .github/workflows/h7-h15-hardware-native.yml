      - 'scripts/ci-install-x86-deps.sh'
      - 'tests/h15-usb-serial-class-host.c'
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        required: true
        default: h7
        description: Original standalone native QEMU hardware acceptance
        options: [h7, h8, h9, h10, h11, h12, h13, h14, h15, all]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pick:
    runs-on: ubuntu-24.04
    outputs:
      profiles: ${{ steps.select.outputs.profiles }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Preserve per-hardware changed paths and H15-only feature PR
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PROFILE: ${{ inputs.profile }}
