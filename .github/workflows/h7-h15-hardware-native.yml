r.sh","kernel/platform/x86_qemu_hid_input.h","kernel/platform/x86_h11_bar.h","kernel/platform/x86_h12_hid.*","kernel/platform/x86_h11_usb.*","kernel/platform/x86_h1_ecam.*","kernel/drivers/usb/**","kernel/drivers/input/**","kernel/drivers/evdev/**","kernel/fs/input_chrdev.*","kernel/fs/syscall.c","kernel/drivers/port/**","kernel/init/main.c","kernel/boot_image.c","kernel/kernel.c","ports/lwext4/**","scripts/h12-*","scripts/check-h12-*.sh","tests/h12-*","scripts/stage-alpine-display.sh","scripts/stage-alpine-prebuilt-overlay.sh","scripts/stage-h8-alpine-nvme.sh","scripts/build-lwext4-guest.sh","limine-h12-usb-hid.conf","scripts/run.sh","Makefile","scripts/acceptance/check-qemu-usb-negative.sh","scripts/acceptance/check-qemu-usb-hid.sh","scripts/acceptance/qmp-hid-evtest.py","scripts/m161-qmp-verify.py","kernel/lib/endian.h"],"h13":["refactor/naseed-cleanup-*","scripts/ci-install-x86-deps.sh","kernel/platform/x86_qemu_hw_contract.h","kernel/platform/x86_qemu_xhci.h","scripts/acceptance/stage-qemu-usb-alpine.sh","scripts/acceptance/build-qemu-hardware-iso.sh","scripts/acceptance/qemu-negative-observer.sh","kernel/platform/x86_qemu_hid_input.h","kernel/platform/x86_h11_bar.h","kernel/platform/x86_h13_mouse.*","kernel/platform/x86_h11_usb.*","kernel/platform/x86_h1_ecam.*","kernel/drivers/usb/**","kernel/drivers/input/**","kernel/drivers/evdev/**","kernel/fs/input_chrdev.*","kernel/fs/syscall.c","kernel/drivers/port/**","kernel/init/main.c","kernel/boot_image.c","kernel/kernel.c","ports/lwext4/**","scripts/h13-*","scripts/check-h13-*.sh","tests/h13-*","scripts/stage-alpine-display.sh","scripts/stage-alpine-prebuilt-overlay.sh","scripts/stage-h8-alpine-nvme.sh","scripts/build-lwext4-guest.sh","limine-h13-usb-mouse.conf","scripts/run.sh","Makefile","scripts/acceptance/check-qemu-usb-negative.sh","scripts/acceptance/check-qemu-usb-hid.sh","scripts/acceptance/qmp-hid-evtest.py","scripts/m161-qmp-verify.py","kernel/lib/endian.h"],"h14":["refactor/naseed-cleanup-*","scripts/ci