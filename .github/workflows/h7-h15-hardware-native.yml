          elif event == 'pull_request':
              chosen = ['h15']
          else:
              before = os.environ.get('BEFORE', '')
              if not before or set(before) == {'0'}:
                  chosen = list(owners)
              else:
                  diff = subprocess.run(['git','diff','--name-only',before,
