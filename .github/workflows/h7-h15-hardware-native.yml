  native:
    needs: [pick]
    if: ${{ needs.pick.outputs.profiles != '[]' }}
    name: ${{ matrix.profile }} physical source-verified QEMU
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.profile == 'h7' && 50 || (matrix.profile == 'h8' || matrix.profile == 'h9' || matrix.profile == 'h10') && 65 || matrix.profile == 'h11' && 80 || 90 }}
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.pick.outputs.profiles) }}
    steps:
