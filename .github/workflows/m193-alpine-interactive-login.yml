name: NaSeed M193 original Alpine interactive root login on three ISA

on:
  workflow_dispatch:
  push:
    branches: [naseed-app-batch2]
    paths:
      - 'scripts/m193-*'
      - 'scripts/probe-m193-alpine-login.sh'
      - 'scripts/probe-m191-alpine-root.sh'
      - 'scripts/m191-*'
      - 'kernel/init/**'
      - 'kernel/fs/**'
      - 'kernel/arch/linux_syscall_abi.h'
      - 'kernel/syscall/**'
      - 'kernel/boot_image.c'
      - 'kernel/drivers/tty*'
      - 'kernel/task/**'
      - 'rootfs/alpine/**'

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  original-alpine-login:
    name: M193 original Alpine root login to ash and sh / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
      - name: Validate independent interactive proof and architecture boundaries
        run: |
          set -eu
          sh -n scripts/probe-m193-alpine-login.sh scripts/probe-m191-alpine-root.sh
          python3 -m py_compile scripts/m193-alpine-login-overlay.py scripts/m193-alpine-uart.py
          cc -std=c11 -Wall -Wextra -Werror scripts/test-syscall-abi.c -o /tmp/naseed-m193-syscall-abi
          /tmp/naseed-m193-syscall-abi
          python3 scripts/check-three-isa-core.py
          python3 scripts/check-architecture-boundaries.py
          python3 scripts/m191-host-smoke.py
          python3 scripts/test-m191-export-alpine-elf.py
          sh scripts/check-m191-root-provider.sh
          python3 - <<'PY'
          from pathlib import Path
          import runpy
          lines = [line for line in Path('scripts/m193-login-cases.tsv').read_text().splitlines() if line and not line.startswith('#')]
          assert lines == ['m193-batch\tcpio\t \t-\t-\t/sbin/init'], lines
          uart = runpy.run_path('scripts/m193-alpine-uart.py', run_name='m193_qa')
          assert uart['shell_prompt']('naseed:~# \x1b[6n')
          assert uart['output_line']('naseed:~# id -u\n0\n', '0')
          assert not uart['output_line']('naseed:~# echo 0\n', '0')
          PY
      - name: Install native QEMU, ext4, Alpine signature verification tools and crypt helper
        timeout-minutes: 18
        run: |
          set -eu
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'cmake:cmake' 'g++:g++' 'clang:clang' 'ld.lld:lld' \
                      'readelf:binutils' 'cpio:cpio' 'mke2fs:e2fsprogs' \
                      'debugfs:e2fsprogs' 'e2fsck:e2fsprogs' \
                      'xorriso:xorriso' 'mformat:mtools' 'sgdisk:gdisk' \
                      'curl:curl' 'python3:python3' 'openssl:openssl'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          case '${{ matrix.port }}' in
            amd64)
              command -v qemu-system-x86_64 >/dev/null || missing="$missing qemu-system-x86"
              test -f /usr/share/OVMF/OVMF_CODE_4M.fd || \
              test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf" ;;
            riscv64)
              command -v qemu-system-riscv64 >/dev/null || missing="$missing qemu-system-misc"
              test -f /usr/share/qemu-efi-riscv64/RISCV_VIRT_CODE.fd || missing="$missing qemu-efi-riscv64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
            arm64)
              command -v qemu-system-aarch64 >/dev/null || missing="$missing qemu-system-arm"
              test -f /usr/share/qemu-efi-aarch64/QEMU_EFI.fd || missing="$missing qemu-efi-aarch64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
          esac
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
          command -v sudo
      - name: M191 strict clean root then original Alpine UART login and POSIX shell commands
        timeout-minutes: 70
        run: sh scripts/probe-m193-alpine-login.sh ${{ matrix.port }}
      - name: Keep raw real-QEMU serial and original Alpine staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m193-original-alpine-interactive-${{ matrix.port }}
          path: |
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m193-login-runner.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/apk-install.log
            build/busybox-source-parity-x86/m193-batch.clean.log
            build/busybox-source-parity-x86/m193-batch.serial.log
            build/port-riscv64/full/matrix-source/m193-batch.clean.log
            build/port-riscv64/full/matrix-source/m193-batch.serial.log
            build/port-aarch64/full/matrix-source/m193-batch.clean.log
            build/port-aarch64/full/matrix-source/m193-batch.serial.log
          if-no-files-found: ignore
