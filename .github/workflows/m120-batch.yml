name: NaSeed M120 15 signed native LibTIFF image applications, one QEMU per ISA
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  signed-original-software:
    name: M120 15 signed native LibTIFF image applications / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify signed catalog, host-only image fixtures and guest contracts
        timeout-minutes: 3
        run: |
          set -eu
          sh -n scripts/stage-alpine-prebuilt-overlay.sh \
                scripts/stage-m120-prebuilt.sh \
                scripts/host-configure-m120-batch.sh \
                scripts/probe-m120-batch.sh \
                tests/m120-batch-run.sh
          python3 scripts/check-prebuilt-profile-catalog.py
          python3 scripts/check-native-qemu-target.py
          python3 scripts/check-three-isa-core.py
      - name: Install signed APK staging tools and target QEMU on Linux host
        timeout-minutes: 12
        run: sh scripts/ci-install-signed-alpine-qemu-deps.sh ${{ matrix.port }}
      - name: Run 15 original signed LibTIFF Linux ELF applications inside ONE NaSeed guest
        timeout-minutes: 45
        run: sh scripts/probe-m120-batch.sh ${{ matrix.port }}
      - name: Preserve original signed APK provenance and actual guest serial on success
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: m120-signed-libtiff-batch-pass-${{ matrix.port }}
          path: |
            build/external/m120-batch/${{ matrix.port }}/apk-install.log
            build/external/m120-batch/${{ matrix.port }}/requested-packages.txt
            build/external/m120-batch/${{ matrix.port }}/*.sha256
            build/busybox-source-parity-x86/m120-batch.clean.log
            build/port-riscv64/full/matrix-source/m120-batch.clean.log
            build/port-aarch64/full/matrix-source/m120-batch.clean.log
          if-no-files-found: error
      - name: Preserve actual failed serial and original native rootfs for triage
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m120-signed-libtiff-batch-fail-${{ matrix.port }}
          path: |
            build/external/m120-batch/${{ matrix.port }}/apk-install.log
            build/external/m120-batch/${{ matrix.port }}/requested-packages.txt
            build/external/m120-batch/${{ matrix.port }}/rootfs.cpio
            build/external/m120-batch/${{ matrix.port }}/*.sha256
            build/busybox-source-parity-x86/m120-batch.clean.log
            build/port-riscv64/full/matrix-source/m120-batch.clean.log
            build/port-aarch64/full/matrix-source/m120-batch.clean.log
          if-no-files-found: ignore
