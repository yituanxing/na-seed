name: NaSeed M56 genuine upstream BusyBox in-guest Kbuild — three ISAs
# Genuine guest GCC/Make source build: deliberately diagnostic-only. Do not
# automatically rebuild large originals during prebuilt-program PRs.
on:
  workflow_dispatch:
jobs:
  native-build:
    name: original upstream BusyBox built inside NaSeed / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU boot and compiler tools
        timeout-minutes: 12
        run: |
          set -eu
          sh scripts/ci-install-signed-alpine-qemu-deps.sh ${{ matrix.port }} --explicit-tools clang:clang ld.lld:lld readelf:binutils cpio:cpio xorriso:xorriso mformat:mtools sgdisk:gdisk qemu-riscv64:qemu-user
      - name: Genuine guest GNU Make + GCC + Kconfig + BusyBox binary execution
        timeout-minutes: 70
        run: sh scripts/probe-m56-native-busybox.sh ${{ matrix.port }}
      - name: Preserve native Kbuild phase durations and successful original guest serial
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m56-native-perf-${{ matrix.port }}
          path: |
            build/busybox-source-parity-x86/m56-busybox.clean.log
            build/port-riscv64/full/matrix-source/m56-busybox.clean.log
            build/port-aarch64/full/matrix-source/m56-busybox.clean.log
          retention-days: 14
          if-no-files-found: ignore
      - name: Preserve exact failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m56-genuine-guest-busybox-${{ matrix.port }}
          path: |
            build/external/m56-native-busybox/${{ matrix.port }}/apk-install.log
            build/external/m56-native-busybox/${{ matrix.port }}/requested-packages.txt
            build/busybox-source-parity-x86/m56-busybox.clean.log
            build/port-riscv64/full/matrix-source/m56-busybox.clean.log
            build/port-aarch64/full/matrix-source/m56-busybox.clean.log
          if-no-files-found: ignore
