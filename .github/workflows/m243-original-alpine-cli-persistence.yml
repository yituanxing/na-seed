name: NaSeed M243 original Alpine apk OpenRC same-QEMU reboot

# Focused original command-line distribution gate, push-triggered and native.
# Avoid replaying M240's historical nine-SSH-PTY matrix on every iteration.
on:
  push:
    branches: [na-alpine-direct-use]
    paths:
      - '.github/workflows/m243-original-alpine-cli-persistence.yml'
      - 'scripts/probe-m243-alpine-cli.sh'
      - 'scripts/probe-m241-alpine-poweroff.sh'
      - 'scripts/m243-alpine-cli-uart.py'
      - 'scripts/m243-verify-cli-disk.py'
      - 'scripts/test-m243-alpine-cli-uart.py'
      - 'kernel/init/main.c'
      - 'kernel/platform/platform.h'
      - 'scripts/acceptance/qemu-netdev.sh'

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-cli-persistence:
    name: Original Alpine public apk + auto OpenRC after SAME QEMU reset / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: true
      - name: Validate strict public-package and two-epoch host oracles
        run: |
          set -eu
          sh -n scripts/probe-m243-alpine-cli.sh scripts/probe-m241-alpine-poweroff.sh
          python3 -m py_compile scripts/m243-alpine-cli-uart.py scripts/m243-verify-cli-disk.py
          python3 scripts/test-m243-alpine-cli-uart.py
          python3 scripts/test-m242-alpine-reboot-uart.py
          sh scripts/check-m241-original-alpine-shutdown.sh
      - name: Install native QEMU, ext4 and signed Alpine dependencies
        timeout-minutes: 18
        run: |
          set -eu
          PATH=/usr/sbin:/sbin:$PATH
          export PATH
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'cmake:cmake' 'g++:g++' 'clang:clang' 'ld.lld:lld' \
                      'readelf:binutils' 'cpio:cpio' 'mke2fs:e2fsprogs' \
                      'debugfs:e2fsprogs' 'e2fsck:e2fsprogs' \
                      'xorriso:xorriso' 'mformat:mtools' 'sgdisk:gdisk' \
                      'curl:curl' 'python3:python3' 'openssl:openssl'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          case '${{ matrix.port }}' in
            amd64)
              command -v qemu-system-x86_64 >/dev/null || missing="$missing qemu-system-x86"
              test -f /usr/share/OVMF/OVMF_CODE_4M.fd || \
              test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf" ;;
            riscv64)
              command -v qemu-system-riscv64 >/dev/null || missing="$missing qemu-system-misc"
              test -f /usr/share/qemu-efi-riscv64/RISCV_VIRT_CODE.fd || missing="$missing qemu-efi-riscv64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
            arm64)
              command -v qemu-system-aarch64 >/dev/null || missing="$missing qemu-system-arm"
              test -f /usr/share/qemu-efi-aarch64/QEMU_EFI.fd || missing="$missing qemu-efi-aarch64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
          esac
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
      - name: Restore proven three-ISA Limine firmware seed
        uses: ./.github/actions/naseed-limine-seed
        with:
          github-token: ${{ github.token }}
      - name: Original signed APK + OpenRC persisted across one REAL same-QEMU reset
        timeout-minutes: 40
        env:
          NAS_M243_DIAG_SECONDS: '735'
          NAS_M243_QEMU_TIMEOUT: '780'
        run: sh scripts/probe-m243-alpine-cli.sh ${{ matrix.port }}
      - name: Preserve immutable physical ext4 UART and public wire evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m243-original-alpine-public-apk-openrc-reboot-${{ matrix.port }}
          path: |
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m243-*.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m243-*.serial.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m243-*.pcap
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m241-*.log
            build/busybox-source-parity-x86/m193-batch.clean.log
            build/busybox-source-parity-x86/m193-batch.serial.log
            build/port-riscv64/full/matrix-source/m193-batch.clean.log
            build/port-riscv64/full/matrix-source/m193-batch.serial.log
            build/port-aarch64/full/matrix-source/m193-batch.clean.log
            build/port-aarch64/full/matrix-source/m193-batch.serial.log
          if-no-files-found: warn
          retention-days: 7
