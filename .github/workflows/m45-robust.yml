name: NaSeed M45 native Linux robust-futex owner death and genuine pthread Zstandard
# M50: retained as an opt-in single-milestone diagnostic. PR auto-validation
# has moved to m50-alpine-matrix.yml: same twelve scripts/real QEMU checks,
# grouped by native ISA and workload class to reuse installation and builds.
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  installed-packages:
    name: Linux robust list recovery and original zstd / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Install headless QEMU and boot toolchain
        timeout-minutes: 12
        run: |
          set -eu
          sh scripts/ci-install-signed-alpine-qemu-deps.sh ${{ matrix.port }} --explicit-tools clang:clang ld.lld:lld readelf:binutils cpio:cpio xorriso:xorriso mformat:mtools sgdisk:gdisk qemu-riscv64:qemu-user
      - name: Reject CPIO fixed-file-count regressions before expensive package fetch
        run: sh scripts/check-bootfs-scale.sh
      - name: Run real Linux robust-futex owner death then unchanged signed zstd on native QEMU
        timeout-minutes: 12
        run: sh scripts/probe-m45-robust.sh ${{ matrix.port }}
      - name: Preserve original package/ELF/serial evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m45-robust-${{ matrix.port }}
          path: |
            build/external/m45-robust/${{ matrix.port }}/apk-install.log
            build/external/m45-robust/${{ matrix.port }}/requested-packages.txt
            build/external/m45-robust/${{ matrix.port }}/rootfs/tests/run-group.sh
            build/busybox-source-parity-x86/m45-robust.clean.log
            build/port-riscv64/full/matrix-source/m45-robust.clean.log
            build/port-aarch64/full/matrix-source/m45-robust.clean.log
          if-no-files-found: ignore
