name: NaSeed M141 five signed Alpine BIND9 offline ELFs (x86 QEMU)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/m141-bind-offline-cohort.yml'
      - 'scripts/m141-bind-offline-cohort-cases.tsv'
      - 'scripts/probe-m141-bind-offline-cohort.sh'
      - 'scripts/stage-m141-prebuilt.sh'
      - 'tests/m141-dns-run.sh'
      - 'tests/m141-system-run.sh'
      - 'scripts/m141-original-elfs.txt'
      - 'kernel/fs/**'
      - 'kernel/syscall/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  x86-original-bind-offline:
    name: One x86 QEMU boot, five real signed BIND9 executable semantics
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
      - name: Validate exact five original Alpine ELFs and one-boot manifest
        run: |
          set -eu
          sh -n scripts/probe-m141-bind-offline-cohort.sh
          sh -n tests/m141-dns-run.sh
          sh -n tests/m141-system-run.sh
          test "$(awk -F '\t' '$1 !~ /^#/ && NF {n++} END {print n+0}' scripts/m141-bind-offline-cohort-cases.tsv)" -eq 1
          for elf in usr/bin/arpaname usr/bin/named-rrchecker \
                     usr/bin/named-checkzone usr/sbin/rndc-confgen \
                     usr/sbin/ddns-confgen; do
            grep -Fxq "$elf" scripts/m141-original-elfs.txt
          done
          grep -Fq M141_SYSTEM_BIND_OFFLINE_COHORT_PASS scripts/m141-bind-offline-cohort-cases.tsv
      - name: Install native QEMU and signed Alpine staging tools
        timeout-minutes: 12
        run: |
          set -eu
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'clang:clang' 'ld.lld:lld' 'readelf:binutils' \
                      'cpio:cpio' 'xorriso:xorriso' 'mformat:mtools' \
                      'sgdisk:gdisk' 'qemu-riscv64:qemu-user'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          command -v qemu-system-x86_64 >/dev/null || missing="$missing qemu-system-x86"
          test -f /usr/share/OVMF/OVMF_CODE_4M.fd || \
          test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf"
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
      - name: Execute five untouched Alpine BIND9 tools against true fixtures
        timeout-minutes: 35
        run: sh scripts/probe-m141-bind-offline-cohort.sh
      - name: Preserve original ELF hashes and complete x86 QEMU logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m141-bind-offline-five-amd64-qemu
          path: |
            build/external/m141-batch/amd64/apk-install.log
            build/external/m141-batch/amd64/requested-packages.txt
            build/external/m141-batch/amd64/*.sha256
            build/busybox-source-parity-x86/m141-batch.clean.log
            build/busybox-source-parity-x86/m141-batch.serial.log
          if-no-files-found: ignore
