name: NaSeed M194 original Alpine APK OpenRC services and durable root on three ISA

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/m194-alpine-services-persistence.yml'
      - 'scripts/m194-*'
      - 'scripts/probe-m194-alpine-services.sh'
      - 'scripts/probe-m193-alpine-login.sh'
      - 'scripts/m193-alpine-*'
      - 'scripts/probe-m191-alpine-root.sh'
      - 'scripts/m191-*'
      - 'kernel/init/**'
      - 'kernel/fs/**'
      - 'kernel/arch/linux_syscall_abi.h'
      - 'kernel/syscall/**'
      - 'kernel/boot_image.c'
      - 'kernel/drivers/tty*'
      - 'kernel/task/**'
      - 'rootfs/alpine/**'

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  alpine-apk-services-durable:
    name: M194 actual Alpine APK OpenRC crond and two-boot ext4 / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
      - name: Check strict two-boot oracle and M191/M193 shared boundaries
        run: |
          set -eu
          sh -n scripts/probe-m194-alpine-services.sh scripts/probe-m193-alpine-login.sh scripts/probe-m191-alpine-root.sh
          python3 -m py_compile scripts/m194-alpine-uart.py scripts/m194-alpine-disk-check.py scripts/m193-alpine-login-overlay.py
          cc -std=c11 -Wall -Wextra -Werror scripts/test-syscall-abi.c -o /tmp/naseed-m194-syscall-abi
          /tmp/naseed-m194-syscall-abi
          cc -std=c11 -Wall -Wextra -Werror scripts/test-generic64-clone.c -o /tmp/naseed-m194-generic64-abi
          /tmp/naseed-m194-generic64-abi
          cc -std=c11 -Wall -Wextra -Werror scripts/test-riscv-hwprobe.c -o /tmp/naseed-m194-riscv-hwprobe
          /tmp/naseed-m194-riscv-hwprobe
          cc -std=c11 -Wall -Wextra -Werror -fno-builtin -I kernel \
            scripts/test-procfs.c kernel/fs/procfs.c kernel/uts.c kernel/lib/string.c \
            -o /tmp/naseed-m194-procfs
          /tmp/naseed-m194-procfs
          python3 scripts/check-three-isa-core.py
          python3 scripts/check-architecture-boundaries.py
          python3 scripts/m191-host-smoke.py
          python3 scripts/test-m191-export-alpine-elf.py
          sh scripts/check-m191-root-provider.sh
          python3 - <<'PY'
          from pathlib import Path
          import runpy
          def rows(name):
              return [line for line in Path(name).read_text().splitlines() if line and not line.startswith('#')]
          assert rows('scripts/m194-alpine-cases.tsv') == ['m194-batch\tcpio\t \t-\t-\t/sbin/init']
          assert rows('scripts/m194-alpine-reopen-cases.tsv') == [
              'm194-batch\tcpio\tsh -c "test -s /etc/apk/world && cat /root/m194-persistent.txt"\tM194_DURABLE_REAL_EXT4_2026\t-\t/bin/busybox']
          uart = runpy.run_path('scripts/m194-alpine-uart.py', run_name='m194_ci_test')
          assert len(uart['COMMANDS']) == 13
          assert uart['step_observed']('apk --version\nM194_APK_ELF_RC=0\n', 'M194_APK_ELF_RC=0')
          assert not uart['step_observed']('echo M194_APK_ELF_RC=0\n', 'M194_APK_ELF_RC=0')
          assert uart['step_observed']('M194_CROND_PID=123\n', uart['COMMANDS'][6][1])
          assert not uart['step_observed']('M194_CROND_PID=spoof\n', uart['COMMANDS'][6][1])
          PY
      - name: Install real native QEMU, ext4, official Alpine and crypt tools
        timeout-minutes: 18
        run: |
          set -eu
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'cmake:cmake' 'g++:g++' 'clang:clang' 'ld.lld:lld' \
                      'readelf:binutils' 'cpio:cpio' 'mke2fs:e2fsprogs' \
                      'debugfs:e2fsprogs' 'e2fsck:e2fsprogs' \
                      'xorriso:xorriso' 'mformat:mtools' 'sgdisk:gdisk' \
                      'curl:curl' 'python3:python3' 'openssl:openssl'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          case '${{ matrix.port }}' in
            amd64)
              command -v qemu-system-x86_64 >/dev/null || missing="$missing qemu-system-x86"
              test -f /usr/share/OVMF/OVMF_CODE_4M.fd || \
              test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf" ;;
            riscv64)
              command -v qemu-system-riscv64 >/dev/null || missing="$missing qemu-system-misc"
              test -f /usr/share/qemu-efi-riscv64/RISCV_VIRT_CODE.fd || missing="$missing qemu-efi-riscv64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
            arm64)
              command -v qemu-system-aarch64 >/dev/null || missing="$missing qemu-system-arm"
              test -f /usr/share/qemu-efi-aarch64/QEMU_EFI.fd || missing="$missing qemu-efi-aarch64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
          esac
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
          command -v sudo
      - name: Verify crash-to-reopen ext4 sync durability on host
        if: matrix.port == 'amd64'
        timeout-minutes: 8
        run: sh scripts/check-lwext4-ramdisk.sh
      - name: M194 actual Alpine offline APK and crond start/status/stop then same ext4 readback after second native boot
        timeout-minutes: 70
        run: sh scripts/probe-m194-alpine-services.sh ${{ matrix.port }}
      - name: Save two real-QEMU boots and signed rootfs evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m194-alpine-apk-openrc-persistence-${{ matrix.port }}
          path: |
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m194-service-runner.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m194-reopen-runner.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m194-live.serial.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/apk-install.log
            build/busybox-source-parity-x86/m194-batch.clean.log
            build/busybox-source-parity-x86/m194-batch.serial.log
            build/port-riscv64/full/matrix-source/m194-batch.clean.log
            build/port-riscv64/full/matrix-source/m194-batch.serial.log
            build/port-aarch64/full/matrix-source/m194-batch.clean.log
            build/port-aarch64/full/matrix-source/m194-batch.serial.log
          if-no-files-found: ignore
