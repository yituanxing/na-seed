name: NaSeed M151 35 NEW signed Alpine multimedia codecs

on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  original-multimedia:
    name: M151 35 native signed Alpine codecs / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        port: ${{ fromJSON((github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-m151-multiarch') || contains(github.event.pull_request.labels.*.name, 'run-m151-155-multiarch')) && '["amd64","riscv64","arm64"]' || '["amd64"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
      - name: Verify profile schemas, scripts and 35 historically new ELF identities
        timeout-minutes: 5
        run: |
          set -eu
          for script in scripts/stage-m151-prebuilt.sh \
                        scripts/probe-m151-batch.sh \
                        scripts/host-configure-m151-batch.sh \
                        tests/m151-batch-run.sh \
                        scripts/stage-alpine-prebuilt-overlay.sh; do
            sh -n "$script"
          done
          python3 scripts/check-prebuilt-profile-catalog.py
          python3 scripts/check-three-isa-core.py
          sh scripts/check-vfs-provider.sh
          sh scripts/check-m86-txn.sh
          test "$(awk '!/^#/ && NF {n++} END {print n+0}' scripts/m151-original-elfs.txt)" -eq 35
          test "$(awk '!/^#/ && NF {n++} END {print n+0}' scripts/m151-expected-markers.txt)" -eq 36
          test "$(awk '!/^#/ && NF {print $0}' scripts/m151-original-elfs.txt | sort -u | wc -l)" -eq 35
          for elf in $(sed -e '/^#/d' -e '/^$/d' scripts/m151-original-elfs.txt); do
            for prior in scripts/m[0-9]*-original-elfs.txt; do
              test "$prior" = scripts/m151-original-elfs.txt && continue
              if grep -Fxq "$elf" "$prior"; then
                echo "Historical collision: $elf in $prior" >&2
                exit 1
              fi
            done
          done
          grep -Fq 'run-m151-155-multiarch' .github/workflows/m151-batch.yml
      - name: Install signed APK staging and actual system-QEMU prerequisites
        timeout-minutes: 13
        run: |
          set -eu
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'clang:clang' 'ld.lld:lld' 'readelf:binutils' \
                      'cpio:cpio' 'mke2fs:e2fsprogs' 'xorriso:xorriso' \
                      'mformat:mtools' 'sgdisk:gdisk' \
                      'qemu-riscv64:qemu-user'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          case '${{ matrix.port }}' in
            amd64)
              command -v qemu-system-x86_64 >/dev/null || missing="$missing qemu-system-x86"
              test -f /usr/share/OVMF/OVMF_CODE_4M.fd || \
                test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf" ;;
            riscv64)
              command -v qemu-system-riscv64 >/dev/null || missing="$missing qemu-system-misc"
              test -f /usr/share/qemu-efi-riscv64/RISCV_VIRT_CODE.fd || missing="$missing qemu-efi-riscv64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
            arm64)
              command -v qemu-system-aarch64 >/dev/null || missing="$missing qemu-system-arm"
              test -f /usr/share/AAVMF/AAVMF_CODE.fd || \
                test -f /usr/share/qemu-efi-aarch64/QEMU_EFI.fd || missing="$missing qemu-efi-aarch64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
          esac
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
          # Native x86 ISO builder hides stderr: catch missing xorriso here.
          command -v xorriso
          command -v python3
          command -v mke2fs
      - name: Execute all 35 original ELFs with 23 real media format roundtrips
        timeout-minutes: 63
        run: sh scripts/probe-m151-batch.sh ${{ matrix.port }}
      - name: Preserve actual guest serial and original signed ELF SHA256
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m151-original-multimedia-${{ matrix.port }}-proof
          path: |
            build/external/m151-batch/${{ matrix.port }}/apk-install.log
            build/external/m151-batch/${{ matrix.port }}/requested-packages.txt
            build/external/m151-batch/${{ matrix.port }}/*.sha256
            build/busybox-source-parity-x86/m151-batch.clean.log
            build/busybox-source-parity-x86/m151-batch.serial.log
            build/port-riscv64/full/matrix-source/m151-batch.clean.log
            build/port-riscv64/full/matrix-source/m151-batch.serial.log
            build/port-aarch64/full/matrix-source/m151-batch.clean.log
            build/port-aarch64/full/matrix-source/m151-batch.serial.log
          if-no-files-found: ignore
