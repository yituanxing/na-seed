name: NaSeed ARM64 full-kernel gate
on:
  pull_request:
    paths:
      - 'kernel/**'
      - 'scripts/full-kernel-core.sources'
      - 'scripts/check-full-kernel-sources.sh'
      - 'scripts/check-linux-stat.c'
      - 'scripts/test-fcntl-abi.c'
      - 'scripts/build-aarch64-full.sh'
      - 'scripts/probe-aarch64-full.sh'
      - 'scripts/probe-aarch64-busybox-matrix.sh'
      - 'scripts/fetch-alpine-native.sh'
      - 'scripts/stage-alpine-native-rootfs.sh'
      - 'scripts/probe-alpine-native-dynamic.sh'
      - 'scripts/probe-alpine-native-matrix.sh'
      - 'scripts/alpine-native-fixtures.txt'
      - 'scripts/check-alpine-native-fixtures.sh'
      - 'scripts/busybox-static-fixtures.txt'
      - 'scripts/busybox-parity-cases.tsv'
      - 'scripts/m32-paged-tmpfs-cases.tsv'
      - 'scripts/probe-paged-tmpfs.sh'
      - 'scripts/m31-date-cases.tsv'
      - 'scripts/probe-m31-date.sh'
      - 'scripts/native-qemu-target.sh'
      - 'scripts/check-native-qemu-target.py'
      - 'limine-aarch64-full.conf'
      - '.github/workflows/arm64-full.yml'
  push:
    branches: [main]
    paths:
      - 'kernel/**'
      - 'scripts/full-kernel-core.sources'
      - 'scripts/check-full-kernel-sources.sh'
      - 'scripts/check-linux-stat.c'
      - 'scripts/test-fcntl-abi.c'
      - 'scripts/build-aarch64-full.sh'
      - 'scripts/probe-aarch64-full.sh'
      - 'scripts/probe-aarch64-busybox-matrix.sh'
      - 'scripts/fetch-alpine-native.sh'
      - 'scripts/stage-alpine-native-rootfs.sh'
      - 'scripts/probe-alpine-native-dynamic.sh'
      - 'scripts/probe-alpine-native-matrix.sh'
      - 'scripts/alpine-native-fixtures.txt'
      - 'scripts/check-alpine-native-fixtures.sh'
      - 'scripts/busybox-static-fixtures.txt'
      - 'scripts/busybox-parity-cases.tsv'
      - 'scripts/m32-paged-tmpfs-cases.tsv'
      - 'scripts/probe-paged-tmpfs.sh'
      - 'scripts/m31-date-cases.tsv'
      - 'scripts/probe-m31-date.sh'
      - 'scripts/native-qemu-target.sh'
      - 'scripts/check-native-qemu-target.py'
      - 'limine-aarch64-full.conf'
      - '.github/workflows/arm64-full.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install only missing AArch64 EDK2/QEMU/native tools
        timeout-minutes: 8
        run: |
          set -eu
          # The former unbounded apt update/install stalled repeated M38 and
          # M40 full-kernel jobs while unrelated native regression was green.
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for pair in 'clang:clang' 'ld.lld:lld' 'readelf:binutils' \
                      'mformat:mtools' 'sgdisk:gdisk' 'cpio:cpio' \
                      'qemu-aarch64:qemu-user' \
                      'qemu-system-aarch64:qemu-system-arm'; do
            bin=${pair%%:*}
            pkg=${pair#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          test -s /usr/share/qemu-efi-aarch64/QEMU_EFI.fd || \
            missing="$missing qemu-efi-aarch64"
          test -s /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu"
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
                 -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
      - name: Verify pinned native Alpine fixture and exact test matrix
        run: |
          sh scripts/check-alpine-native-fixtures.sh
          python3 scripts/check-native-qemu-target.py
      - name: Build and boot THE shared Task/ELF/FS/syscall kernel on real ARM64
        run: NASEED_ARM_FULL_TIMEOUT=25 sh scripts/probe-aarch64-full.sh
      - name: M31 real CLOCK_REALTIME — native Debian date inside ARM64 kernel
        run: sh scripts/probe-m31-date.sh arm64
      - name: ARM64 — native Debian BusyBox canonical 17-case parity matrix
        run: sh scripts/probe-aarch64-busybox-matrix.sh
      - name: ARM64 original BusyBox copy and exec from sparse paged tmpfs
        run: sh scripts/probe-paged-tmpfs.sh arm64
      - name: Native Alpine AArch64 dynamic BusyBox seven-case parity (SHA256 pinned)
        run: sh scripts/probe-alpine-native-matrix.sh arm64
      - name: Upload real UART and semihosting evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: naseed-arm64-full-boot
          path: |
            build/port-aarch64/full/serial.log
            build/port-aarch64/full/matrix/*.serial.log
          if-no-files-found: ignore
