name: NaSeed M125 15 signed original Netpbm image transformations, one QEMU per ISA
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  signed-original-software:
    name: M125 15 signed native Netpbm image tools / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify signed catalog, host-only image fixtures and guest contracts
        timeout-minutes: 3
        run: |
          set -eu
          sh -n scripts/stage-alpine-prebuilt-overlay.sh \
                scripts/stage-m125-prebuilt.sh \
                scripts/host-configure-m125-batch.sh \
                scripts/probe-m125-batch.sh \
                tests/m125-batch-run.sh
          python3 scripts/check-prebuilt-profile-catalog.py
          python3 scripts/check-native-qemu-target.py
          python3 scripts/check-three-isa-core.py
      - name: Install signed APK staging tools and native target QEMU on Linux host
        timeout-minutes: 12
        run: sh scripts/ci-install-signed-alpine-qemu-deps.sh ${{ matrix.port }}
      - name: Run 15 original signed Netpbm ELFs inside ONE real NaSeed guest
        timeout-minutes: 45
        run: sh scripts/probe-m125-batch.sh ${{ matrix.port }}
      - name: Preserve original signed APK provenance and actual guest serial on success
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: m125-signed-netpbm-image-batch-pass-${{ matrix.port }}
          path: |
            build/external/m125-batch/${{ matrix.port }}/apk-install.log
            build/external/m125-batch/${{ matrix.port }}/requested-packages.txt
            build/external/m125-batch/${{ matrix.port }}/*.sha256
            build/busybox-source-parity-x86/m125-batch.clean.log
            build/port-riscv64/full/matrix-source/m125-batch.clean.log
            build/port-aarch64/full/matrix-source/m125-batch.clean.log
          if-no-files-found: error
      - name: Preserve actual failed serial and original native rootfs for triage
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m125-signed-netpbm-image-batch-fail-${{ matrix.port }}
          path: |
            build/external/m125-batch/${{ matrix.port }}/apk-install.log
            build/external/m125-batch/${{ matrix.port }}/requested-packages.txt
            build/external/m125-batch/${{ matrix.port }}/rootfs.cpio
            build/external/m125-batch/${{ matrix.port }}/*.sha256
            build/busybox-source-parity-x86/m125-batch.clean.log
            build/port-riscv64/full/matrix-source/m125-batch.clean.log
            build/port-aarch64/full/matrix-source/m125-batch.clean.log
          if-no-files-found: ignore
