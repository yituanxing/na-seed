name: NaSeed M249 original Debian glibc dash physical ext4 root

# A separate, real physical-root boot. M248's CPIO-only direct-PID1 gates
# remain independent and unchanged. PASS requires the original signed Debian
# ELF to execute from mounted ext4 / and the disk to pass host readback.
on:
  push:
    branches: [na-alpine-direct-use]
    paths:
      - '.github/workflows/m249-debian-ext4-root.yml'
      - 'scripts/m249-*'
      - 'tests/m249-*'
      - 'docs/m249-*'
      - 'scripts/m248-*'
      - 'scripts/m245-*'
      - 'scripts/m247-*'
      - 'scripts/probe-riscv64-busybox-matrix.sh'
      - 'scripts/probe-aarch64-busybox-matrix.sh'
      - 'scripts/probe-x86-busybox-parity.sh'
      - 'scripts/native-source-qemu.sh'
      - 'scripts/run.sh'
      - 'scripts/build-riscv64-full.sh'
      - 'scripts/build-aarch64-full.sh'
      - 'kernel/boot_image.c'
      - 'kernel/init/main.c'
      - 'kernel/fs/**'
      - 'kernel/task/**'
      - 'kernel/mm/**'
      - 'kernel/drivers/virtio_blk*'
      - 'ports/lwext4/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-debian-ext4-pid1:
    name: Original Debian glibc dash from physical ext4 root / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: true
      - name: Check M249 host contracts and syntax
        run: |
          set -eu
          test -s scripts/m249-probe-debian-ext4.sh
          test -s scripts/m249-debian-ext4-disk.py
          sh -n scripts/m249-probe-debian-ext4.sh
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for p in sorted(Path('scripts').glob('m249-*.py')):
              ast.parse(p.read_text(encoding='utf-8'), filename=str(p))
          PY
          python3 -B tests/m248-debian-multiarch-host.py
          sh scripts/check-m191-pid1-quiesce.sh
          if test -s tests/m249-debian-ext4-host.py; then
            python3 -B tests/m249-debian-ext4-host.py
          fi
      - name: Install authenticated Debian and native QEMU tools
        timeout-minutes: 15
        run: |
          set -eu
          PATH=/usr/sbin:/sbin:$PATH
          export PATH
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'cmake:cmake' 'g++:g++' 'clang:clang' 'ld.lld:lld' \
                      'readelf:binutils' 'cpio:cpio' 'xorriso:xorriso' \
                      'mformat:mtools' 'sgdisk:gdisk' 'curl:curl' \
                      'python3:python3' 'dpkg-deb:dpkg' 'apt-cache:apt' \
                      'mke2fs:e2fsprogs' 'e2fsck:e2fsprogs' 'debugfs:e2fsprogs'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          test -s /usr/share/keyrings/debian-archive-keyring.gpg || \
            missing="$missing debian-archive-keyring"
          case '${{ matrix.port }}' in
            amd64)
              command -v qemu-system-x86_64 >/dev/null || missing="$missing qemu-system-x86"
              test -s /usr/share/OVMF/OVMF_CODE_4M.fd || \
              test -s /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf"
              ;;
            riscv64)
              command -v qemu-system-riscv64 >/dev/null || missing="$missing qemu-system-misc"
              test -s /usr/share/qemu-efi-riscv64/RISCV_VIRT_CODE.fd || \
                missing="$missing qemu-efi-riscv64"
              ;;
            arm64)
              command -v qemu-system-aarch64 >/dev/null || missing="$missing qemu-system-arm"
              test -s /usr/share/qemu-efi-aarch64/QEMU_EFI.fd || \
                missing="$missing qemu-efi-aarch64"
              ;;
            *) echo 'Unreviewed M249 native QEMU port' >&2; exit 2 ;;
          esac
          test -s /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu"
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
      - name: Restore pinned, working multi-ISA Limine seed
        uses: ./.github/actions/naseed-limine-seed
        with:
          github-token: ${{ github.token }}
      - name: Genuine signed Debian ELF runs as PID1 from ext4 physical root
        timeout-minutes: 29
        run: sh scripts/m249-probe-debian-ext4.sh ${{ matrix.port }}
      - name: Preserve source proofs, real QEMU serial and ext4 checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m249-debian-glibc-physical-root-${{ matrix.port }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            build/m249-debian-ext4/${{ matrix.port }}/source/manifest.json
            build/m249-debian-ext4/${{ matrix.port }}/*.tsv
            build/m249-debian-ext4/${{ matrix.port }}/*.log
            build/port-*/full/matrix-source/m249-batch.clean.log
            build/port-*/full/matrix-source/m249-batch.serial.log
            build/busybox-source-parity-x86/m249-batch.clean.log
            build/busybox-source-parity-x86/m249-batch.serial.log
