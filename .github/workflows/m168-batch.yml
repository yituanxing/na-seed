name: NaSeed M168 three client browser terminal image desktop eight screens three ISA (M169 idle/IPC safety)

on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser-terminal-image-desktop:
    name: M168 three independent client apps real hardware QMP / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
      - name: Exact Linux ABI IPC surface and image+terminal+browser host gates
        run: |
          set -eu
          for script in scripts/probe-m168-batch.sh \
                        scripts/stage-m168-prebuilt.sh \
                        scripts/host-configure-m168-batch.sh; do
            sh -n "$script"
          done
          python3 -m py_compile scripts/m161-qmp-verify.py \
            scripts/m167-qmp-verify.py scripts/m168-qmp-verify.py
          python3 scripts/check-prebuilt-profile-catalog.py
          python3 scripts/check-three-isa-core.py
          python3 scripts/check-architecture-boundaries.py
          sh scripts/check-m167-fb-pwrite.sh
          sh scripts/check-m167-desktop.sh
          sh scripts/check-m168-desktop.sh
          sh scripts/test-m105-pty-isig.sh
          sh scripts/check-m166-input-port.sh
          sh scripts/check-m107-unix.sh
          cc -std=c11 -O2 -Wall -Wextra -Werror -static -fsyntax-only \
            user/desktop/protocol.c user/desktop/text.c \
            user/desktop/naseed-desktop.c user/desktop/naseed-image.c \
            user/desktop/naseed-terminal.c user/desktop/naseed-browser.c
      - name: Install Linux static compilers EFI QEMU and APK staging tools
        timeout-minutes: 18
        run: sh scripts/ci-install-signed-alpine-qemu-deps.sh ${{ matrix.port }} --arm64-efi-fallback --cross-c mke2fs:e2fsprogs gcc:gcc
      - name: Boot true QEMU and drive three windows from physical input
        timeout-minutes: 58
        run: sh scripts/probe-m168-batch.sh ${{ matrix.port }}
      - name: Preserve signed APK binaries logs and eight independent screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m168-desktop-three-apps-${{ matrix.port }}
          path: |
            build/external/m168-batch/${{ matrix.port }}/apk-install.log
            build/external/m168-batch/${{ matrix.port }}/*.sha256
            build/external/m168-batch/${{ matrix.port }}/m168-qmp-check.log
            build/external/m168-batch/${{ matrix.port }}/m168-*.ppm
            build/busybox-source-parity-x86/m168-batch.clean.log
            build/busybox-source-parity-x86/m168-batch.serial.log
            build/port-riscv64/full/matrix-source/m168-batch.clean.log
            build/port-riscv64/full/matrix-source/m168-batch.serial.log
            build/port-aarch64/full/matrix-source/m168-batch.clean.log
            build/port-aarch64/full/matrix-source/m168-batch.serial.log
          if-no-files-found: ignore
