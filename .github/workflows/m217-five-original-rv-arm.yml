name: NaSeed M217 original five Alpine ELFs, RV64 ARM64 first and reopen

# One acceptance-branch push of THIS workflow only. No kernel/header/tests
# source changes should accidentally schedule two expensive native QEMU runs.
on:
  push:
    branches: [naseed-app-batch2]
    paths:
      - '.github/workflows/m217-five-original-rv-arm.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-five-cross-isa:
    name: Five signed native Alpine ELF and durable ext4 / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 135
    strategy:
      fail-fast: false
      matrix:
        port: [riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: true
      - name: Check M215 strict genuine-ELF contract, shared timerfd and three ISA
        run: |
          set -eu
          python3 scripts/test-m215-alpine-host.py
          python3 scripts/test-m213-alpine-host.py
          python3 scripts/test-m206-alpine-host.py
          python3 scripts/check-three-isa-core.py
          python3 scripts/check-architecture-boundaries.py
          sh scripts/check-timerfd.sh
          sh scripts/check-m191-pid1-quiesce.sh
          sh -n scripts/probe-m215-alpine-pilot.sh
      - name: Install native QEMU, cross-GCC, UEFI and physical ext4 host tools
        timeout-minutes: 18
        run: |
          set -eu
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'cmake:cmake' 'g++:g++' 'clang:clang' 'ld.lld:lld' \
                      'readelf:binutils' 'cpio:cpio' 'mke2fs:e2fsprogs' \
                      'debugfs:e2fsprogs' 'e2fsck:e2fsprogs' \
                      'xorriso:xorriso' 'mformat:mtools' 'sgdisk:gdisk' \
                      'curl:curl' 'python3:python3' 'openssl:openssl'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          case '${{ matrix.port }}' in
            riscv64)
              command -v riscv64-linux-gnu-gcc >/dev/null || missing="$missing gcc-riscv64-linux-gnu"
              command -v riscv64-linux-gnu-g++ >/dev/null || missing="$missing g++-riscv64-linux-gnu"
              test -f /usr/riscv64-linux-gnu/include/bits/wordsize.h && \
              test -f /usr/riscv64-linux-gnu/lib/libc.a || missing="$missing libc6-dev-riscv64-cross"
              command -v qemu-system-riscv64 >/dev/null || missing="$missing qemu-system-misc"
              test -f /usr/share/qemu-efi-riscv64/RISCV_VIRT_CODE.fd || missing="$missing qemu-efi-riscv64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
            arm64)
              command -v aarch64-linux-gnu-gcc >/dev/null || missing="$missing gcc-aarch64-linux-gnu"
              command -v aarch64-linux-gnu-g++ >/dev/null || missing="$missing g++-aarch64-linux-gnu"
              test -f /usr/aarch64-linux-gnu/include/bits/wordsize.h && \
              test -f /usr/aarch64-linux-gnu/lib/libc.a || missing="$missing libc6-dev-arm64-cross"
              command -v qemu-system-aarch64 >/dev/null || missing="$missing qemu-system-arm"
              test -f /usr/share/AAVMF/AAVMF_CODE.fd || \
              test -f /usr/share/qemu-efi-aarch64/QEMU_EFI.fd || missing="$missing qemu-efi-aarch64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
          esac
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
      - name: Require five signed target-native ELFs and independent offline APK resolution
        timeout-minutes: 20
        run: |
          set -eu
          sh scripts/inventory-m141-signed-apks.sh '${{ matrix.port }}' m215
          tsv='build/external/m215-candidate-inventory/${{ matrix.port }}/candidates.tsv'
          awk -F '\t' 'NR > 1 { n++; if ($3 != "NATIVE_ELF") bad++ }
            END { if (n != 5 || bad) exit 1 }' "$tsv"
          unique=$(awk -F '\t' 'NR > 1 { print $4 }' "$tsv" | sort -u | wc -l)
          test "$unique" -eq 5
          echo '[M217 SIGNED NATIVE ELF PASS] ${{ matrix.port }} exactly five distinct genuine signed ELF SHA'
      - name: Run real five original Alpine ELFs in first and independently reopened native QEMU
        timeout-minutes: 95
        env:
          NAS_M215_PUBLIC_QEMU_TIMEOUT: '4500'
          NAS_M215_PUBLIC_SECONDS: '4400'
          NAS_M215_REOPEN_SECONDS: '900'
        run: sh scripts/probe-m215-alpine-pilot.sh '${{ matrix.port }}'
      - name: Summarize actual first/reopen guest result, never invent PASS
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          port = '${{ matrix.port }}'
          report = Path('build/external/m191-alpine-rootfs') / port / 'm215-compat-report.json'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              if report.exists():
                  result = json.loads(report.read_text())
                  print(f"### M217 {port}: {result['newly_installed_full_pass_entrypoints']}/{result['total_entrypoints']} genuine original Alpine ELFs, first+reopen", file=out)
                  print(f"Failed: {', '.join(result['failures']) if result['failures'] else 'none'}", file=out)
              else:
                  print(f'### M217 {port}: no complete guest/report proof', file=out)
          PY
      - name: Preserve native ELF identity, guest/wire and physical root evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m217-original-five-${{ matrix.port }}
          path: |
            build/external/m215-candidate-inventory/${{ matrix.port }}/candidates.tsv
            build/external/m215-candidate-inventory/${{ matrix.port }}/signed-cache.sha256
            build/external/m215-candidate-inventory/${{ matrix.port }}/apk-install.log
            build/external/m215-candidate-inventory/${{ matrix.port }}/apk-offline-proof.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m215-compat-report.json
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m215-first-runner.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m197-live.serial.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m197-reopen-runner.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m197-public-wire.json
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m197-public-wire.pcap
            build/acceptance/**/m197-batch*.log
            build/port-riscv64/full/matrix-source/m197-batch*.log
            build/port-aarch64/full/matrix-source/m197-batch*.log
          if-no-files-found: ignore
