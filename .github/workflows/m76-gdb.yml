name: NaSeed M76/M77/M78 GNU GDB source attach and genuine instruction stepping
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  original-inspection:
    name: original GNU GDB source, live attach and step / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Shared kernel architecture and host procfs owner
        run: |
          set -eu
          sh -n scripts/stage-m76-prebuilt.sh scripts/probe-m76-gdb.sh tests/m76-gdb-run.sh tests/m77-gdb-run.sh tests/m78-gdb-run.sh
          python3 scripts/check-three-isa-core.py
          python3 scripts/check-prebuilt-profile-catalog.py
          python3 scripts/check-native-qemu-target.py
          cc -std=c11 -Wall -Wextra -Werror -I kernel scripts/test-rv64-ptrace-step.c -o /tmp/nas-rv64-ptrace-step
          /tmp/nas-rv64-ptrace-step
          cc -std=c11 -Wall -Wextra -Werror -ffunction-sections -fdata-sections -Wl,--gc-sections -I kernel scripts/test-ptrace-owner.c kernel/task/ptrace.c -o /tmp/nas-m76-ptrace-owner
          /tmp/nas-m76-ptrace-owner
          cc -std=c11 -Wall -Wextra -Werror -ffunction-sections -fdata-sections -Wl,--gc-sections -I kernel scripts/test-ptrace-wait-ownership.c kernel/task/process.c -o /tmp/nas-m76-ptrace-wait
          /tmp/nas-m76-ptrace-wait
          cc -std=c11 -Wall -Wextra -Werror -ffunction-sections -fdata-sections -Wl,--gc-sections -I kernel scripts/test-remote-task-read.c kernel/mm/remote_copy.c kernel/mm/mm.c -o /tmp/nas-m76-remote
          /tmp/nas-m76-remote
      - name: Install native QEMU and host rootfs tools
        timeout-minutes: 12
        run: |
          set -eu
          sh scripts/ci-install-signed-alpine-qemu-deps.sh ${{ matrix.port }} --explicit-tools clang:clang ld.lld:lld readelf:binutils cpio:cpio xorriso:xorriso mformat:mtools sgdisk:gdisk qemu-riscv64:qemu-user
      - name: Original GNU GDB source attach and real CPU stepping in native QEMU
        timeout-minutes: 24
        run: sh scripts/probe-m76-gdb.sh ${{ matrix.port }}
      - name: Retain all actual QEMU and apk failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m76-gdb-${{ matrix.port }}
          path: |
            build/external/m76-gdb/${{ matrix.port }}/apk-install.log
            build/external/m76-gdb/${{ matrix.port }}/requested-packages.txt
            build/busybox-source-parity-x86/m76-source.clean.log
            build/busybox-source-parity-x86/m77-attach.clean.log
            build/busybox-source-parity-x86/m78-step.clean.log
            build/port-riscv64/full/matrix-source/m76-source.clean.log
            build/port-riscv64/full/matrix-source/m77-attach.clean.log
            build/port-riscv64/full/matrix-source/m78-step.clean.log
            build/port-aarch64/full/matrix-source/m76-source.clean.log
            build/port-aarch64/full/matrix-source/m77-attach.clean.log
            build/port-aarch64/full/matrix-source/m78-step.clean.log
          if-no-files-found: ignore
