name: NaSeed M55 original cJSON CMake-Ninja native diagnostics
on:
  workflow_dispatch:
  workflow_call:
jobs:
  cmake:
    name: Upstream cJSON CTest / ${{ matrix.port }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      # A PR metadata opt-in has a synthetic merge ref; always test the
      # requested PR's exact head, not that merge or a moving branch tip.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record the actual guest source revision
        run: git rev-parse HEAD
      - name: Install QEMU boot and compiler tools
        timeout-minutes: 12
        run: |
          set -eu
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'clang:clang' 'ld.lld:lld' 'readelf:binutils' 'cpio:cpio' \
                      'xorriso:xorriso' 'mformat:mtools' 'sgdisk:gdisk' \
                      'qemu-riscv64:qemu-user'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          case "${{ matrix.port }}" in
            amd64)
              command -v qemu-system-x86_64 >/dev/null || missing="$missing qemu-system-x86"
              test -f /usr/share/OVMF/OVMF_CODE_4M.fd || \
                test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf" ;;
            riscv64)
              command -v qemu-system-riscv64 >/dev/null || missing="$missing qemu-system-misc"
              test -f /usr/share/qemu-efi-riscv64/RISCV_VIRT_CODE.fd || missing="$missing qemu-efi-riscv64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
            arm64)
              command -v qemu-system-aarch64 >/dev/null || missing="$missing qemu-system-arm"
              test -f /usr/share/AAVMF/AAVMF_CODE.fd || missing="$missing qemu-efi-aarch64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
          esac
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
          if [ "${{ matrix.port }}" = riscv64 ]; then
            python3 -m pip install --user --break-system-packages --disable-pip-version-check 'virt-firmware==26.5.4'
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
      - name: Native real upstream cJSON configure/build/CTests/rebuild
        timeout-minutes: 65
        run: sh scripts/probe-m55-cjson.sh ${{ matrix.port }}
      - name: Preserve exact guest evidence on success and failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m55-cmake-${{ matrix.port }}
          retention-days: 14
          path: |
            build/external/m55-cjson/${{ matrix.port }}/apk-install.log
            build/external/m55-cjson/${{ matrix.port }}/requested-packages.txt
            build/busybox-source-parity-x86/m55-cjson.clean.log
            build/port-riscv64/full/matrix-source/m55-cjson.clean.log
            build/port-aarch64/full/matrix-source/m55-cjson.clean.log
          if-no-files-found: ignore
