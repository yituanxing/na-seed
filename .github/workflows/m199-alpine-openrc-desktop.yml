name: NaSeed M199 original Alpine OpenRC persistent graphical session

# M198's independent physical-Vim proof gates this costlier OpenRC test.
# Single-branch push deltas avoid re-running the entire cumulative PR diff.
on:
  workflow_dispatch:
  push:
    branches: [naseed-app-batch2]
    paths:
      - 'scripts/m199-*'
      - 'scripts/stage-m199-alpine-openrc.sh'
      - 'rootfs/alpine/naseed-desktop.openrc'
      - 'docs/m199-*'

permissions:
  contents: read

concurrency:
  group: m199-openrc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-alpine-openrc:
    name: M199 two original Alpine init boots and physical GPU / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Original OpenRC and two genuine Alpine PID1 boot contracts
        run: |
          set -eu
          sh -n scripts/probe-m191-alpine-root.sh \
                scripts/probe-m197-alpine-software-cohort.sh \
                scripts/stage-m198-alpine-desktop.sh \
                scripts/stage-m199-alpine-openrc.sh \
                rootfs/alpine/naseed-desktop.openrc
          python3 -m py_compile scripts/m199-alpine-uart.py \
            scripts/m199-qmp-alpine-openrc.py \
            scripts/m199-alpine-disk-check.py \
            scripts/m188-qmp-extras.py scripts/m194-alpine-uart.py
          python3 scripts/test-m199-openrc-host.py
          python3 scripts/test-m194-uart-prompt.py
          python3 scripts/check-three-isa-core.py
          python3 scripts/check-architecture-boundaries.py
          test -s third_party/lvgl/CMakeLists.txt
          test -s third_party/lwip/src/include/lwip/init.h
      - name: Install real system-QEMU and native cross compilers
        timeout-minutes: 20
        run: |
          set -eu
          sh scripts/ci-install-signed-alpine-qemu-deps.sh ${{ matrix.port }} --arm64-efi-fallback --cross-cxx --explicit-tools cmake:cmake g++:g++ clang:clang ld.lld:lld readelf:binutils cpio:cpio mke2fs:e2fsprogs debugfs:e2fsprogs e2fsck:e2fsprogs xorriso:xorriso mformat:mtools sgdisk:gdisk curl:curl python3:python3 openssl:openssl
          command -v sudo
      - name: Two authentic Alpine init/OpenRC boots, physical QMP and ext4
        timeout-minutes: 98
        env:
          NAS_M199_ORIGINAL_OPENRC_DESKTOP: '1'
        run: sh scripts/probe-m197-alpine-software-cohort.sh ${{ matrix.port }}
      - name: Preserve both genuine boots and independent screenshot oracles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m199-original-alpine-openrc-${{ matrix.port }}
          path: |
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m197-public-wire.pcap
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m197-public-wire.json
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m199-first-runner.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m199-reboot-runner.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m199-first.serial.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m199-first-qmp.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m199-reboot-qmp.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m199-qmp-*.pass
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m187-m199-*.ppm
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m188-*-vim-visible.ppm
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m188-m199-*.ppm
            build/busybox-source-parity-x86/m197-batch.clean.log
            build/busybox-source-parity-x86/m197-batch.serial.log
            build/port-riscv64/full/matrix-source/m197-batch.clean.log
            build/port-riscv64/full/matrix-source/m197-batch.serial.log
            build/port-aarch64/full/matrix-source/m197-batch.clean.log
            build/port-aarch64/full/matrix-source/m197-batch.serial.log
          if-no-files-found: ignore
