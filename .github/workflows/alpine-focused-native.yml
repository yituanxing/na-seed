name: NaSeed native Alpine focused legacy diagnostics
# Manual diagnostics only. M50 grouped acceptance remains the automatic owner.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Original native workload
        required: true
        type: choice
        options: [m38, m39, m40, m41, m42, m43, m44, m45, m46, m47, m48, m49, m51, m52, m53, m54, m65, m66, m67, m69, m70, m79]
concurrency:
  group: ${{ github.workflow }}-${{ inputs.profile }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original:
    name: ${{ inputs.profile }} native QEMU / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON('{"m38":40,"m39":40,"m40":40,"m41":40,"m42":40,"m43":40,"m44":40,"m45":40,"m46":40,"m47":40,"m48":40,"m49":40,"m51":45,"m52":45,"m53":50,"m54":60,"m65":35,"m66":35,"m67":35,"m69":35,"m70":35,"m79":35}')[inputs.profile] }}
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    env:
      PROFILE: ${{ inputs.profile }}
      PORT: ${{ matrix.port }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Select original workload and evidence paths
        id: profile
        run: |
          set -eu
          case "$PROFILE" in
            m38)
              probe=scripts/probe-m38-native-gcc.sh
              artifact=m38-native-alpine-gcc
              bootfs=1
              evidence="build/external/m38-gcc/$PORT/apk-install.log
              build/external/m38-gcc/$PORT/requested-packages.txt
              build/external/m38-gcc/$PORT/rootfs/tests/hello.c
              build/busybox-source-parity-x86/m38-gcc.clean.log
              build/port-riscv64/full/matrix-source/m38-gcc.clean.log
              build/port-aarch64/full/matrix-source/m38-gcc.clean.log" ;;
            m39)
              probe=scripts/probe-m39-packages.sh
              artifact=m39-packages
              bootfs=1
              evidence="build/external/m39-packages/$PORT/apk-install.log
              build/external/m39-packages/$PORT/requested-packages.txt
              build/external/m39-packages/$PORT/rootfs/tests/run-packages.sh
              build/busybox-source-parity-x86/m39-packages.clean.log
              build/port-riscv64/full/matrix-source/m39-packages.clean.log
              build/port-aarch64/full/matrix-source/m39-packages.clean.log" ;;
            m40)
              probe=scripts/probe-m40-archives.sh
              artifact=m40-archives
              bootfs=1
              evidence="build/external/m40-archives/$PORT/apk-install.log
              build/external/m40-archives/$PORT/requested-packages.txt
              build/external/m40-archives/$PORT/rootfs/tests/run-archives.sh
              build/busybox-source-parity-x86/m40-archives.clean.log
              build/port-riscv64/full/matrix-source/m40-archives.clean.log
              build/port-aarch64/full/matrix-source/m40-archives.clean.log" ;;
            m41)
              probe=scripts/probe-m41-unix.sh
              artifact=m41-unix
              bootfs=1
              evidence="build/external/m41-unix/$PORT/apk-install.log
              build/external/m41-unix/$PORT/requested-packages.txt
              build/external/m41-unix/$PORT/rootfs/tests/run-unix.sh
              build/busybox-source-parity-x86/m41-unix.clean.log
              build/port-riscv64/full/matrix-source/m41-unix.clean.log
              build/port-aarch64/full/matrix-source/m41-unix.clean.log" ;;
            m42)
              probe=scripts/probe-m42-pthread.sh
              artifact=m42-pthread
              bootfs=1
              evidence="build/external/m42-pthread/$PORT/apk-install.log
              build/external/m42-pthread/$PORT/requested-packages.txt
              build/external/m42-pthread/$PORT/rootfs/tests/run-pthread.sh
              build/busybox-source-parity-x86/m42-pthread.clean.log
              build/port-riscv64/full/matrix-source/m42-pthread.clean.log
              build/port-aarch64/full/matrix-source/m42-pthread.clean.log" ;;
            m43)
              probe=scripts/probe-m43-zstd.sh
              artifact=m43-zstd
              bootfs=1
              evidence="build/external/m43-zstd/$PORT/apk-install.log
              build/external/m43-zstd/$PORT/requested-packages.txt
              build/external/m43-zstd/$PORT/rootfs/tests/run-zstd.sh
              build/busybox-source-parity-x86/m43-zstd.clean.log
              build/port-riscv64/full/matrix-source/m43-zstd.clean.log
              build/port-aarch64/full/matrix-source/m43-zstd.clean.log" ;;
            m44)
              probe=scripts/probe-m44-threadgroup.sh
              artifact=m44-group
              bootfs=1
              evidence="build/external/m44-group/$PORT/apk-install.log
              build/external/m44-group/$PORT/requested-packages.txt
              build/external/m44-group/$PORT/rootfs/tests/run-group.sh
              build/busybox-source-parity-x86/m44-group.clean.log
              build/port-riscv64/full/matrix-source/m44-group.clean.log
              build/port-aarch64/full/matrix-source/m44-group.clean.log" ;;
            m45)
              probe=scripts/probe-m45-robust.sh
              artifact=m45-robust
              bootfs=1
              evidence="build/external/m45-robust/$PORT/apk-install.log
              build/external/m45-robust/$PORT/requested-packages.txt
              build/external/m45-robust/$PORT/rootfs/tests/run-group.sh
              build/busybox-source-parity-x86/m45-robust.clean.log
              build/port-riscv64/full/matrix-source/m45-robust.clean.log
              build/port-aarch64/full/matrix-source/m45-robust.clean.log" ;;
            m46)
              probe=scripts/probe-m46-exec.sh
              artifact=m46-exec
              bootfs=1
              evidence="build/external/m46-exec/$PORT/apk-install.log
              build/external/m46-exec/$PORT/requested-packages.txt
              build/external/m46-exec/$PORT/rootfs/tests/run-group.sh
              build/busybox-source-parity-x86/m46-exec.clean.log
              build/port-riscv64/full/matrix-source/m46-exec.clean.log
              build/port-aarch64/full/matrix-source/m46-exec.clean.log" ;;
            m47)
              probe=scripts/probe-m47-tgkill.sh
              artifact=m47-tgkill
              bootfs=1
              evidence="build/external/m47-tgkill/$PORT/apk-install.log
              build/external/m47-tgkill/$PORT/requested-packages.txt
              build/external/m47-tgkill/$PORT/rootfs/tests/run-group.sh
              build/busybox-source-parity-x86/m47-tgkill.clean.log
              build/port-riscv64/full/matrix-source/m47-tgkill.clean.log
              build/port-aarch64/full/matrix-source/m47-tgkill.clean.log" ;;
            m48)
              probe=scripts/probe-m48-parallel.sh
              artifact=m48-native-parallel
              bootfs=1
              evidence="build/external/m48-parallel/$PORT/apk-install.log
              build/external/m48-parallel/$PORT/requested-packages.txt
              build/external/m48-parallel/$PORT/rootfs/tests/m48-parallel.mk
              build/busybox-source-parity-x86/m48-parallel.clean.log
              build/port-riscv64/full/matrix-source/m48-parallel.clean.log
              build/port-aarch64/full/matrix-source/m48-parallel.clean.log" ;;
            m49)
              probe=scripts/probe-m49-capacity.sh
              artifact=m49-native-capacity
              bootfs=1
              evidence="build/external/m49-capacity/$PORT/apk-install.log
              build/external/m49-capacity/$PORT/requested-packages.txt
              build/external/m49-capacity/$PORT/rootfs/tests/m49-parallel.mk
              build/busybox-source-parity-x86/m49-capacity.clean.log
              build/port-riscv64/full/matrix-source/m49-capacity.clean.log
              build/port-aarch64/full/matrix-source/m49-capacity.clean.log" ;;
            m51)
              probe=scripts/probe-m51-git.sh
              artifact=m51-git
              bootfs=0
              evidence="build/external/m51-git/$PORT/apk-install.log
              build/external/m51-git/$PORT/requested-packages.txt
              build/busybox-source-parity-x86/m51-git.clean.log
              build/port-riscv64/full/matrix-source/m51-git.clean.log
              build/port-aarch64/full/matrix-source/m51-git.clean.log" ;;
            m52)
              probe=scripts/probe-m52-python.sh
              artifact=m52-python
              bootfs=0
              evidence="build/external/m52-python/$PORT/apk-install.log
              build/external/m52-python/$PORT/requested-packages.txt
              build/busybox-source-parity-x86/m52-python.clean.log
              build/port-riscv64/full/matrix-source/m52-python.clean.log
              build/port-aarch64/full/matrix-source/m52-python.clean.log" ;;
            m53)
              probe=scripts/probe-m53-vim.sh
              artifact=m53-vim
              bootfs=0
              evidence="build/external/m53-vim/$PORT/apk-install.log
              build/external/m53-vim/$PORT/requested-packages.txt
              build/external/m53-vim/$PORT/live-serial.log
              build/busybox-source-parity-x86/m53-vim.clean.log
              build/port-riscv64/full/matrix-source/m53-vim.clean.log
              build/port-aarch64/full/matrix-source/m53-vim.clean.log" ;;
            m54)
              probe=scripts/probe-m54-dev.sh
              artifact=m54-dev
              bootfs=0
              evidence="build/external/m54-dev/$PORT/apk-install.log
              build/external/m54-dev/$PORT/requested-packages.txt
              build/busybox-source-parity-x86/m54-dev.clean.log
              build/port-riscv64/full/matrix-source/m54-dev.clean.log
              build/port-aarch64/full/matrix-source/m54-dev.clean.log" ;;
            m65)
              probe=scripts/probe-m65-procfs.sh
              artifact=m65-procps
              bootfs=0
              evidence="build/external/m65-observe/$PORT/apk-install.log
              build/external/m65-observe/$PORT/requested-packages.txt
              build/busybox-source-parity-x86/m65-procfs.clean.log
              build/port-riscv64/full/matrix-source/m65-procfs.clean.log
              build/port-aarch64/full/matrix-source/m65-procfs.clean.log" ;;
            m66)
              probe=scripts/probe-m66-monitor.sh
              artifact=m66-procps
              bootfs=0
              evidence="build/external/m66-monitor/$PORT/apk-install.log
              build/external/m66-monitor/$PORT/requested-packages.txt
              build/busybox-source-parity-x86/m66-monitor.clean.log
              build/port-riscv64/full/matrix-source/m66-monitor.clean.log
              build/port-aarch64/full/matrix-source/m66-monitor.clean.log" ;;
            m67)
              probe=scripts/probe-m67-control.sh
              artifact=m67-control
              bootfs=0
              evidence="build/external/m67-control/$PORT/apk-install.log
              build/external/m67-control/$PORT/requested-packages.txt
              build/busybox-source-parity-x86/m67-control.clean.log
              build/port-riscv64/full/matrix-source/m67-control.clean.log
              build/port-aarch64/full/matrix-source/m67-control.clean.log" ;;
            m69)
              probe=scripts/probe-m69-inspect.sh
              artifact=m69-inspect
              bootfs=0
              evidence="build/external/m69-inspect/$PORT/apk-install.log
              build/external/m69-inspect/$PORT/requested-packages.txt
              build/busybox-source-parity-x86/m69-inspect.clean.log
              build/port-riscv64/full/matrix-source/m69-inspect.clean.log
              build/port-aarch64/full/matrix-source/m69-inspect.clean.log" ;;
            m70)
              probe=scripts/probe-m70-vmfd.sh
              artifact=m70-vmfd
              bootfs=0
              evidence="build/external/m70-vmfd/$PORT/apk-install.log
              build/external/m70-vmfd/$PORT/requested-packages.txt
              build/busybox-source-parity-x86/m70-vmfd.clean.log
              build/port-riscv64/full/matrix-source/m70-vmfd.clean.log
              build/port-aarch64/full/matrix-source/m70-vmfd.clean.log" ;;
            m79)
              probe=scripts/probe-m79-workflow.sh
              artifact=m79-workflow
              bootfs=0
              evidence="build/external/m39-packages/$PORT/apk-install.log
              build/external/m79-workflow/$PORT/apk-install.log
              build/external/m79-workflow/$PORT/requested-packages.txt
              build/busybox-source-parity-x86/m79-workflow.clean.log
              build/port-riscv64/full/matrix-source/m79-workflow.clean.log
              build/port-aarch64/full/matrix-source/m79-workflow.clean.log" ;;
            *) exit 2 ;;
          esac
          test -f "$probe"
          printf 'probe=%s\nartifact=%s\nbootfs=%s\n' "$probe" "$artifact" "$bootfs" >> "$GITHUB_OUTPUT"
          {
            echo 'paths<<NASEED_PATHS'
            printf '%s\n' "$evidence" | sed 's/^[[:space:]]*//'
            echo NASEED_PATHS
          } >> "$GITHUB_OUTPUT"
      - name: Identify actual QEMU-tested commit
        run: git rev-parse HEAD
      - name: Original procfs and process ownership host checks
        if: contains(fromJSON('["m65","m66","m67","m69","m70"]'), inputs.profile)
        run: |
          set -eu
          case "$PROFILE" in
            m65) guest=tests/m65-procfs-run.sh ;;
            m66) guest=tests/m66-monitor-run.sh ;;
            m67) guest=tests/m67-control-run.sh ;;
            m69) guest=tests/m69-trace-prep-run.sh ;;
            m70) guest=tests/m70-vmfd-run.sh ;;
            *) exit 2 ;;
          esac
          for file in scripts/stage-alpine-basic.sh "${{ steps.profile.outputs.probe }}" "$guest"; do
            sh -n "$file"
          done
          python3 scripts/check-three-isa-core.py
          python3 scripts/check-prebuilt-profile-catalog.py
          python3 scripts/check-native-qemu-target.py
          cc -std=c11 -Wall -Wextra -Werror -fno-builtin -I kernel scripts/test-procfs.c kernel/fs/procfs.c kernel/lib/string.c -o /tmp/nas-procfs-host
          /tmp/nas-procfs-host
      - name: Original integrated developer workflow host checks
        if: inputs.profile == 'm79'
        run: |
          set -eu
          sh -n scripts/stage-alpine-prebuilt-overlay.sh scripts/stage-alpine-basic.sh scripts/probe-m79-workflow.sh tests/m79-workflow-run.sh
          bash -n tests/m79-workflow.bash
          python3 -m py_compile tests/m79-validate.py
          python3 scripts/check-three-isa-core.py
          python3 scripts/check-prebuilt-profile-catalog.py
          python3 scripts/check-native-qemu-target.py
      - name: Install native QEMU and boot tools
        if: inputs.profile != 'm42'
        timeout-minutes: 12
        run: |
          set -eu
          sh scripts/ci-install-signed-alpine-qemu-deps.sh ${{ matrix.port }} --explicit-tools clang:clang ld.lld:lld readelf:binutils cpio:cpio xorriso:xorriso mformat:mtools sgdisk:gdisk qemu-riscv64:qemu-user
      - name: Install M42 native pthread prerequisites
        if: inputs.profile == 'm42'
        timeout-minutes: 12
        run: |
          set -eu
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'clang:clang' 'ld.lld:lld' 'readelf:binutils' 'cpio:cpio' \
                      'xorriso:xorriso' 'mformat:mtools' 'sgdisk:gdisk' \
                      'qemu-riscv64:qemu-user'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          case "${{ matrix.port }}" in
            amd64)
              command -v gcc >/dev/null || missing="$missing gcc"
              command -v qemu-system-x86_64 >/dev/null || missing="$missing qemu-system-x86"
              test -f /usr/share/OVMF/OVMF_CODE_4M.fd || \
                test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf" ;;
            riscv64)
              command -v riscv64-linux-gnu-gcc >/dev/null || \
                missing="$missing gcc-riscv64-linux-gnu libc6-dev-riscv64-cross"
              command -v qemu-system-riscv64 >/dev/null || missing="$missing qemu-system-misc"
              test -f /usr/share/qemu-efi-riscv64/RISCV_VIRT_CODE.fd || missing="$missing qemu-efi-riscv64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
            arm64)
              command -v aarch64-linux-gnu-gcc >/dev/null || \
                missing="$missing gcc-aarch64-linux-gnu libc6-dev-arm64-cross"
              command -v qemu-system-aarch64 >/dev/null || missing="$missing qemu-system-arm"
              test -f /usr/share/AAVMF/AAVMF_CODE.fd || missing="$missing qemu-efi-aarch64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
          esac
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
      - name: Reject CPIO fixed-file-count regressions
        if: steps.profile.outputs.bootfs == '1'
        run: sh scripts/check-host-fixture.sh bootfs-scale
      - name: Execute original native workload
        timeout-minutes: ${{ fromJSON('{"m38":24,"m39":12,"m40":12,"m41":12,"m42":12,"m43":12,"m44":12,"m45":12,"m46":12,"m47":12,"m48":24,"m49":24,"m51":28,"m52":28,"m53":36,"m54":47,"m65":24,"m66":24,"m67":24,"m69":24,"m70":24,"m79":24}')[inputs.profile] }}
        run: sh "${{ steps.profile.outputs.probe }}" "$PORT"
      - name: Preserve A014 genuine guest ownership-race serial evidence
        if: always() && inputs.profile == 'm42'
        uses: actions/upload-artifact@v4
        with:
          name: a014-m42-native-${{ matrix.port }}
          retention-days: 14
          path: |
            build/busybox-source-parity-x86/m42-pthread.clean.log
            build/port-riscv64/full/matrix-source/m42-pthread.clean.log
            build/port-aarch64/full/matrix-source/m42-pthread.clean.log
          if-no-files-found: ignore
      - name: Preserve original package and serial failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.profile.outputs.artifact }}-${{ matrix.port }}
          path: ${{ steps.profile.outputs.paths }}
          if-no-files-found: ignore
