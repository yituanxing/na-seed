name: NaSeed native Alpine GCC and musl development rootfs
on:
  pull_request:
    paths:
      - 'rootfs/alpine/**'
      - 'kernel/bootfs.c'
      - 'kernel/bootfs.h'
      - 'scripts/test-bootfs-scale.c'
      - 'scripts/check-bootfs-scale.sh'
      - 'scripts/probe-m38-native-gcc.sh'
      - 'scripts/m38-gcc-cases.tsv'
      - 'tests/m38-gcc-hello.c'
      - 'scripts/probe-x86-busybox-parity.sh'
      - 'scripts/probe-riscv64-busybox-matrix.sh'
      - 'scripts/probe-aarch64-busybox-matrix.sh'
      - 'scripts/run.sh'
      - '.github/workflows/m38-alpine-gcc.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  gcc-musl:
    name: stock Alpine GCC + musl builds an ELF inside NaSeed / ${{ matrix.port }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Install headless QEMU and boot toolchain
        timeout-minutes: 12
        run: |
          set -eu
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'clang:clang' 'ld.lld:lld' 'readelf:binutils' 'cpio:cpio' \
                      'xorriso:xorriso' 'mformat:mtools' 'sgdisk:gdisk' \
                      'qemu-riscv64:qemu-user'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          case "${{ matrix.port }}" in
            amd64)
              command -v qemu-system-x86_64 >/dev/null || missing="$missing qemu-system-x86"
              test -f /usr/share/OVMF/OVMF_CODE_4M.fd || \
                test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf" ;;
            riscv64)
              command -v qemu-system-riscv64 >/dev/null || missing="$missing qemu-system-misc"
              test -f /usr/share/qemu-efi-riscv64/RISCV_VIRT_CODE.fd || missing="$missing qemu-efi-riscv64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
            arm64)
              command -v qemu-system-aarch64 >/dev/null || missing="$missing qemu-system-arm"
              test -f /usr/share/AAVMF/AAVMF_CODE.fd || missing="$missing qemu-efi-aarch64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
          esac
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
      - name: Reject CPIO fixed-file-count regressions before expensive package fetch
        run: sh scripts/check-bootfs-scale.sh
      - name: Install distro packages and test original GCC inside full native QEMU
        timeout-minutes: 24
        run: sh scripts/probe-m38-native-gcc.sh ${{ matrix.port }}
      - name: Preserve original package/ELF/serial evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m38-native-alpine-gcc-${{ matrix.port }}
          path: |
            build/external/m38-gcc/${{ matrix.port }}/requested-packages.txt
            build/external/m38-gcc/${{ matrix.port }}/rootfs/tests/hello.c
            build/busybox-source-parity-x86/m38-gcc.clean.log
            build/port-riscv64/full/matrix-source/m38-gcc.clean.log
            build/port-aarch64/full/matrix-source/m38-gcc.clean.log
          if-no-files-found: ignore
