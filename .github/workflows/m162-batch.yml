name: NaSeed M162 native HTTPS PNG to actual framebuffer hardware pixels

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/m162-batch.yml'
      - 'scripts/m162-*'
      - 'scripts/stage-m162-prebuilt.sh'
      - 'scripts/probe-m162-batch.sh'
      - 'scripts/host-configure-m162-batch.sh'
      - 'scripts/check-m162-wire-display.py'
      - 'scripts/m160-image-wire-server.py'
      - 'scripts/m161-qmp-verify.py'
      - 'scripts/stage-alpine-prebuilt-overlay.sh'
      - 'scripts/prebuilt-profile-catalog.tsv'
      - 'rootfs/alpine/packages-m162-batch.txt'
      - 'tests/m162-*'
      - 'scripts/run.sh'
      - 'kernel/**'
      - 'ports/**'

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  signed-https-visible-screen:
    name: M162 original Linux clients to real display QMP / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
      - name: Verify original ELF reuse and authenticated image-to-display contract
        run: |
          set -eu
          for script in scripts/stage-m162-prebuilt.sh scripts/probe-m162-batch.sh \
                        scripts/host-configure-m162-batch.sh tests/m162-batch-run.sh; do
            sh -n "$script"
          done
          python3 -m py_compile scripts/m160-image-wire-server.py scripts/m161-qmp-verify.py
          python3 scripts/check-prebuilt-profile-catalog.py
          python3 scripts/check-m162-wire-display.py
          python3 scripts/check-three-isa-core.py
          python3 scripts/check-architecture-boundaries.py
      - name: Install original Alpine APK, QEMU RAMFB, OpenSSL and native ISA tools
        timeout-minutes: 14
        run: |
          set -eu
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'clang:clang' 'ld.lld:lld' 'readelf:binutils' \
                      'cpio:cpio' 'mke2fs:e2fsprogs' 'xorriso:xorriso' \
                      'mformat:mtools' 'sgdisk:gdisk' 'openssl:openssl' \
                      'qemu-riscv64:qemu-user'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          case '${{ matrix.port }}' in
            amd64)
              command -v qemu-system-x86_64 >/dev/null || missing="$missing qemu-system-x86"
              test -f /usr/share/OVMF/OVMF_CODE_4M.fd || \
              test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf" ;;
            riscv64)
              command -v qemu-system-riscv64 >/dev/null || missing="$missing qemu-system-misc"
              test -f /usr/share/qemu-efi-riscv64/RISCV_VIRT_CODE.fd || missing="$missing qemu-efi-riscv64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
            arm64)
              command -v qemu-system-aarch64 >/dev/null || missing="$missing qemu-system-arm"
              test -f /usr/share/AAVMF/AAVMF_CODE.fd || \
              test -f /usr/share/qemu-efi-aarch64/QEMU_EFI.fd || missing="$missing qemu-efi-aarch64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
          esac
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
      - name: Native three ISA live CA-TLS PNG decode and true QEMU RGB screen
        timeout-minutes: 58
        run: sh scripts/probe-m162-batch.sh ${{ matrix.port }}
      - name: Preserve original signed binaries true TLS requests and physical screen PPM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m162-real-https-to-visible-pixels-${{ matrix.port }}
          path: |
            build/external/m162-batch/${{ matrix.port }}/apk-install.log
            build/external/m162-batch/${{ matrix.port }}/requested-packages.txt
            build/external/m162-batch/${{ matrix.port }}/*.sha256
            build/external/m162-batch/${{ matrix.port }}/host-m162-wire.log
            build/external/m162-batch/${{ matrix.port }}/host-tls.crt
            build/external/m162-batch/${{ matrix.port }}/virtio-m162-display.pcap
            build/external/m162-batch/${{ matrix.port }}/m162-qmp-check.log
            build/external/m162-batch/${{ matrix.port }}/m162-qmp-screen.ppm
            build/busybox-source-parity-x86/m162-batch.clean.log
            build/busybox-source-parity-x86/m162-batch.serial.log
            build/port-riscv64/full/matrix-source/m162-batch.clean.log
            build/port-riscv64/full/matrix-source/m162-batch.serial.log
            build/port-aarch64/full/matrix-source/m162-batch.clean.log
            build/port-aarch64/full/matrix-source/m162-batch.serial.log
          if-no-files-found: ignore
