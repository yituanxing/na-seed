name: NaSeed M118 15 independent original elfutils ELF and DWARF applications, one QEMU per ISA
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  signed-original-software:
    name: M118 15 signed original ELF/DWARF checks / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify signed catalog, host-only fixtures and guest expectations
        timeout-minutes: 3
        run: |
          set -eu
          sh -n scripts/stage-alpine-prebuilt-overlay.sh \
                scripts/stage-m118-prebuilt.sh \
                scripts/host-configure-m118-batch.sh \
                scripts/probe-m118-batch.sh \
                tests/m118-batch-run.sh
          python3 scripts/check-prebuilt-profile-catalog.py
          python3 scripts/check-native-qemu-target.py
          python3 scripts/check-three-isa-core.py
      - name: Install host LLVM, signed APK staging and target QEMU
        timeout-minutes: 12
        run: sh scripts/ci-install-signed-alpine-qemu-deps.sh ${{ matrix.port }}
      - name: Run 15 signed original elfutils ELFs inside ONE NaSeed QEMU guest
        timeout-minutes: 45
        run: sh scripts/probe-m118-batch.sh ${{ matrix.port }}
      - name: Preserve signed APK provenance and actual guest serial on success
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: m118-signed-original-elf-batch-pass-${{ matrix.port }}
          path: |
            build/external/m118-batch/${{ matrix.port }}/apk-install.log
            build/external/m118-batch/${{ matrix.port }}/requested-packages.txt
            build/external/m118-batch/${{ matrix.port }}/*.sha256
            build/busybox-source-parity-x86/m118-batch.clean.log
            build/port-riscv64/full/matrix-source/m118-batch.clean.log
            build/port-aarch64/full/matrix-source/m118-batch.clean.log
          if-no-files-found: error
      - name: Preserve actual failed guest serial and original native rootfs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m118-signed-original-elf-batch-fail-${{ matrix.port }}
          path: |
            build/external/m118-batch/${{ matrix.port }}/apk-install.log
            build/external/m118-batch/${{ matrix.port }}/requested-packages.txt
            build/external/m118-batch/${{ matrix.port }}/rootfs.cpio
            build/external/m118-batch/${{ matrix.port }}/*.sha256
            build/busybox-source-parity-x86/m118-batch.clean.log
            build/port-riscv64/full/matrix-source/m118-batch.clean.log
            build/port-aarch64/full/matrix-source/m118-batch.clean.log
          if-no-files-found: ignore
