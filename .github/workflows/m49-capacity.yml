name: NaSeed M49 48-task native GNU Make -j4 xargs -P4 and 24 simultaneous children
# M50: retained as an opt-in single-milestone diagnostic. PR auto-validation
# has moved to m50-alpine-matrix.yml: same twelve scripts/real QEMU checks,
# grouped by native ISA and workload class to reuse installation and builds.
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  gcc-musl:
    name: native real Make -j4, xargs -P4, 24 live children / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Install headless QEMU and boot toolchain
        timeout-minutes: 12
        run: |
          set -eu
          sh scripts/ci-install-signed-alpine-qemu-deps.sh ${{ matrix.port }} --explicit-tools clang:clang ld.lld:lld readelf:binutils cpio:cpio xorriso:xorriso mformat:mtools sgdisk:gdisk qemu-riscv64:qemu-user
      - name: Reject CPIO fixed-file-count regressions before expensive package fetch
        run: sh scripts/check-bootfs-scale.sh
      - name: Run real 4-way GNU Make GCC and GNU xargs with 24 forked children inside native QEMU
        timeout-minutes: 24
        run: sh scripts/probe-m49-capacity.sh ${{ matrix.port }}
      - name: Preserve original package/ELF/serial evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m49-native-capacity-${{ matrix.port }}
          path: |
            build/external/m49-capacity/${{ matrix.port }}/apk-install.log
            build/external/m49-capacity/${{ matrix.port }}/requested-packages.txt
            build/external/m49-capacity/${{ matrix.port }}/rootfs/tests/m49-parallel.mk
            build/busybox-source-parity-x86/m49-capacity.clean.log
            build/port-riscv64/full/matrix-source/m49-capacity.clean.log
            build/port-aarch64/full/matrix-source/m49-capacity.clean.log
          if-no-files-found: ignore
