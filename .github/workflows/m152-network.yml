name: NaSeed M152 35 original Alpine DNS SMTP and network diagnostics ELF

on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  signed-network-m152:
    name: M152 35 new ELF + real DNS and SMTP / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        port: ${{ fromJSON((github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-m152-multiarch') || contains(github.event.pull_request.labels.*.name, 'run-m151-155-multiarch')) && '["amd64","riscv64","arm64"]' || '["amd64"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
      - name: Validate unique signed ELF inventory and host guest syntax
        run: |
          set -eu
          for f in scripts/stage-m152-prebuilt.sh scripts/probe-m152-network-cohort.sh scripts/host-configure-m152-batch.sh tests/m152-network-run.sh; do sh -n "$f"; done
          python3 -m py_compile scripts/m152-host-oracle.py
          python3 tests/m152-host-oracle-selftest.py
          python3 scripts/check-prebuilt-profile-catalog.py
          test "$(awk '$1 !~ /^#/ && NF {n++} END {print n+0}' scripts/m152-original-elfs.txt)" -eq 35
          test "$(awk '$1 !~ /^#/ && NF {print $0}' scripts/m152-original-elfs.txt | sort -u | wc -l)" -eq 35
          test "$(awk -F '\t' '$1 !~ /^#/ && NF {n++} END {print n+0}' scripts/m152-network-cases.tsv)" -eq 1
          test "$(awk -F '\t' '$1 !~ /^#/ && NF {n++} END {print n+0}' scripts/m152-rootfs-copies.tsv)" -eq 2
          test "$(grep -v '^#' scripts/m152-original-elfs.txt)" = "$(grep -v '^#' tests/m152-original-elfs.txt)"
          grep -q '^m152-batch[[:space:]]' scripts/prebuilt-profile-catalog.tsv
          for elf in $(grep -v '^#' scripts/m152-original-elfs.txt); do
            for old in scripts/m[0-9]*-original-elfs.txt; do
              test "$old" = scripts/m152-original-elfs.txt && continue
              ! grep -Fxq "$elf" "$old" || { echo "duplicate $elf $old" >&2; exit 1; }
            done
          done
      - name: Install QEMU and signed Alpine staging prerequisites
        timeout-minutes: 12
        run: |
          set -eu
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'clang:clang' 'ld.lld:lld' 'readelf:binutils' 'cpio:cpio' 'xorriso:xorriso' 'mformat:mtools' 'sgdisk:gdisk' 'qemu-riscv64:qemu-user'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          case '${{ matrix.port }}' in
            amd64)
              command -v qemu-system-x86_64 >/dev/null || missing="$missing qemu-system-x86"
              test -f /usr/share/OVMF/OVMF_CODE_4M.fd || test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf" ;;
            riscv64)
              command -v qemu-system-riscv64 >/dev/null || missing="$missing qemu-system-misc"
              test -f /usr/share/qemu-efi-riscv64/RISCV_VIRT_CODE.fd || missing="$missing qemu-efi-riscv64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
            arm64)
              command -v qemu-system-aarch64 >/dev/null || missing="$missing qemu-system-arm"
              test -f /usr/share/AAVMF/AAVMF_CODE.fd || test -f /usr/share/qemu-efi-aarch64/QEMU_EFI.fd || missing="$missing qemu-efi-aarch64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
          esac
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
      - name: Native upstream lwIP and SocketPort targeted tests
        timeout-minutes: 10
        run: sh scripts/check-lwip-foundation.sh
      - name: Genuine signed ${{ matrix.port }} QEMU DNS and SMTP
        timeout-minutes: 48
        run: sh scripts/probe-m152-network-cohort.sh ${{ matrix.port }}
      - name: Preserve QEMU serial native SHA and independent host wire oracle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m152-original-network-35elf-${{ matrix.port }}-qemu
          path: |
            build/external/m152-batch/${{ matrix.port }}/apk-install.log
            build/external/m152-batch/${{ matrix.port }}/requested-packages.txt
            build/external/m152-batch/${{ matrix.port }}/*.sha256
            build/external/m152-batch/${{ matrix.port }}/host-m152-protocols.log
            build/external/m152-batch/${{ matrix.port }}/m152-virtio-wire.pcap
            build/busybox-source-parity-x86/m152-batch.clean.log
            build/busybox-source-parity-x86/m152-batch.serial.log
            build/port-riscv64/full/matrix-source/m152-batch.clean.log
            build/port-riscv64/full/matrix-source/m152-batch.serial.log
            build/port-aarch64/full/matrix-source/m152-batch.clean.log
            build/port-aarch64/full/matrix-source/m152-batch.serial.log
          if-no-files-found: ignore
