name: NaSeed H8 real NVMe ext4 original Alpine musl BusyBox Lua jq SQLite

on:
  push:
    branches:
      - feat/na-hw-h0-pci-20261110
    paths:
      - '.github/workflows/h8-qemu-nvme-alpine-userland.yml'
      - 'kernel/platform/x86_h3_nvme.*'
      - 'kernel/platform/x86_h1_ecam.*'
      - 'kernel/drivers/core/pci_resources.*'
      - 'kernel/drivers/nvme/**'
      - 'kernel/drivers/port/**'
      - 'kernel/arch/x86_64/mmu.*'
      - 'kernel/init/main.c'
      - 'kernel/boot_image.c'
      - 'kernel/kernel.c'
      - 'ports/lwext4/**'
      - 'scripts/check-h8-*.sh'
      - 'scripts/h8-guest-workload.sh'
      - 'scripts/stage-h8-alpine-nvme.sh'
      - 'scripts/build-h8-nvme-iso.sh'
      - 'scripts/build-lwext4-guest.sh'
      - 'limine-h8-nvme.conf'
      - 'scripts/run.sh'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h8-real-nvme-alpine-musl-root-${{ github.ref }}
  cancel-in-progress: false

jobs:
  h8-real-nvme-original-alpine-musl-userspace:
    name: QEMU UEFI NVMe -> ext4 / -> original Alpine musl BusyBox Lua jq SQLite
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install C toolchain, signed APK verification utilities, ext4, QEMU and OVMF
        timeout-minutes: 15
        run: |
          set -eu
          missing=''
          for spec in 'clang:clang' 'ld.lld:lld' 'cc:gcc' 'cmake:cmake' \
                      'readelf:binutils' 'cpio:cpio' 'mke2fs:e2fsprogs' \
                      'debugfs:e2fsprogs' 'sha256sum:coreutils' \
                      'curl:curl' 'tar:tar' 'gzip:gzip' 'openssl:openssl' \
                      'xorriso:xorriso' 'qemu-system-x86_64:qemu-system-x86'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          if [ ! -s /usr/share/OVMF/OVMF_CODE_4M.fd ] &&
             [ ! -s /usr/share/OVMF/OVMF_CODE.fd ]; then
            missing="$missing ovmf"
          fi
          if [ -n "$missing" ]; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends $missing
          fi
      - name: H0-H8 host regressions, no writable backend, script syntax
        timeout-minutes: 8
        run: |
          set -eu
          sh -n scripts/stage-h8-alpine-nvme.sh
          sh -n scripts/h8-guest-workload.sh
          sh -n scripts/build-h8-nvme-iso.sh
          sh -n scripts/check-h8-nvme-alpine-qemu.sh
          sh -n scripts/check-h8-no-nvme-qemu.sh
          sh -n scripts/build-lwext4-guest.sh
          sh -n scripts/run.sh
          make hw-h8-host-check
      - name: Build isolated H8 kernel and authentic signed original Alpine musl NVMe root
        timeout-minutes: 33
        run: |
          set -eu
          make hw-h8-iso
          readelf -h build/h8-qemu-only/kernel.elf | grep -q 'Machine:.*Advanced Micro Devices X86-64'
          (cd build/h8-qemu-only && sha256sum -c h8-media-before.sha256)
          sha256sum -c build/h8-qemu-only/h8-original-alpine-elfs.sha256
      - name: Genuine QEMU UEFI original Alpine dynamic musl user programs from NVMe / root
        timeout-minutes: 7
        run: sh scripts/check-h8-nvme-alpine-qemu.sh
      - name: Negative control absent NVMe must refuse root, dynamic loader, and all Alpine tests
        timeout-minutes: 3
        run: sh scripts/check-h8-no-nvme-qemu.sh
      - name: Preserve real positive and negative QEMU serial logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h8-qemu-nvme-original-alpine-musl-real-serial
          path: |
            build/h8-qemu-only/h8-qemu-uefi-serial.log
            build/h8-qemu-only/h8-qemu-uefi-clean.log
            build/h8-qemu-only/h8-no-nvme-uefi-serial.log
            build/h8-qemu-only/h8-no-nvme-uefi-clean.log
          if-no-files-found: ignore
      - name: Preserve kernel, UEFI media, original APK provenance and readonly NVMe digest
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: h8-qemu-nvme-original-alpine-musl-verified-artifacts
          path: |
            build/h8-qemu-only/kernel.elf
            build/h8-qemu-only/naseed.iso
            build/h8-qemu-only/h8-media-before.sha256
            build/h8-qemu-only/h8-original-alpine-elfs.sha256
          if-no-files-found: error
