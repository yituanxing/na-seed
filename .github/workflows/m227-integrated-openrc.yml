name: NaSeed M227 headless Alpine OpenRC seven-program two-native-boot cohort

# M227.5: both true original Alpine PID1 boots, HTTP and OpenRC now passed.
# The final 512MiB disposable physical ext4 oracle must receive its explicit
# disk geometry; the immutable signed M191 baseline remains 256MiB. This workflow
# launches amd64 only. Older software
# workflows keep their own path filters; unrelated changes do not relaunch M227.
on:
  push:
    branches: [naseed-app-batch2]
    paths:
      - '.github/workflows/m227-integrated-openrc.yml'
  workflow_dispatch:
    inputs:
      port:
        description: 'Run amd64 first; select all only after the native x86 pilot proves stable'
        type: choice
        required: true
        default: amd64
        options: [amd64, riscv64, arm64, all]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-alpine-headless:
    name: Signed Alpine real OpenRC auto-restart and HTTP / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        port: ${{ fromJSON(github.event_name == 'push' && '["amd64"]' || (inputs.port == 'all' && '["amd64","riscv64","arm64"]' || format('["{0}"]', inputs.port))) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: true
      - name: Native PID1 and no-second-manual-start static contracts
        run: |
          set -eu
          python3 scripts/test-m227-openrc-contract.py
          python3 scripts/test-m227-uart-login.py
          python3 scripts/check-three-isa-core.py
          python3 scripts/check-architecture-boundaries.py
          python3 scripts/test-m197-alpine-host.py
      - name: Install original Alpine staging, native QEMU and cross ABI tools
        timeout-minutes: 20
        run: |
          set -eu
          PATH=/usr/sbin:/sbin:$PATH
          export PATH
          sh scripts/ci-install-signed-alpine-qemu-deps.sh ${{ matrix.port }} --arm64-efi-fallback --cross-cxx --explicit-tools cmake:cmake g++:g++ clang:clang ld.lld:lld readelf:binutils cpio:cpio mke2fs:e2fsprogs debugfs:e2fsprogs e2fsck:e2fsprogs xorriso:xorriso mformat:mtools sgdisk:gdisk curl:curl python3:python3 openssl:openssl
      - name: Two genuine Alpine /sbin/init native QEMUs, signed OpenRC service
        timeout-minutes: 85
        env:
          NAS_M227_INTEGRATED_OPENRC: '1'
          NAS_M227_PUBLIC_QEMU_TIMEOUT: '2600'
          NAS_M227_FIRST_SECONDS: '2450'
          NAS_M227_REOPEN_QEMU_TIMEOUT: '1000'
          NAS_M227_REOPEN_SECONDS: '850'
        run: sh scripts/probe-m197-alpine-software-cohort.sh '${{ matrix.port }}'
      - name: Preserve physical UART, public WAN PCAP and ext4 host proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m227-openrc-original-${{ matrix.port }}
          path: |
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m227-first.serial.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m227-first-runner.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m227-reopen-runner.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m197-public-wire.pcap
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m197-public-wire.json
            build/acceptance/**/m197-batch*.log
          if-no-files-found: warn
