name: NaSeed original independent RamFS against common VFS (host + three ISA)
on:
  pull_request:
    paths:
      - 'third_party/jkent_ramfs/**'
      - 'ports/ramfs/**'
      - 'scripts/test-upstream-ramfs-vfs.c'
      - 'scripts/check-upstream-ramfs-vfs.sh'
      - 'scripts/build-ramfs-guest.sh'
      - 'kernel/fs/vfs*'
      - 'kernel/fs/lookup*'
      - 'kernel/init/main.c'
      - 'scripts/build-riscv64-full.sh'
      - 'scripts/build-aarch64-full.sh'
      - 'Makefile'
      - '.github/workflows/upstream-ramfs.yml'
  workflow_dispatch:
jobs:
  original-ramfs-provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Unmodified upstream source hashes, host real VFS, three native ISA relocatable objects
        run: sh scripts/check-upstream-ramfs-vfs.sh
      - name: Opt-in real x86 kernel link with independent RAM file system
        run: make NAS_ENABLE_RAMFS=1 build/kernel.elf
      - name: Opt-in real RV64 kernel link with independent RAM file system
        run: NAS_ENABLE_RAMFS=1 sh scripts/build-riscv64-full.sh
      - name: Opt-in real AArch64 kernel link with independent RAM file system
        run: NAS_ENABLE_RAMFS=1 sh scripts/build-aarch64-full.sh
