name: NaSeed M158 30 NEW signed Alpine classic image codecs

on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  signed-original-software:
    name: M158 signed picture-codec roundtrips / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
      - name: Check official APK provenance, historical uniqueness and guest cases
        timeout-minutes: 4
        run: |
          set -eu
          for script in scripts/stage-m158-prebuilt.sh \
                        scripts/probe-m158-batch.sh \
                        scripts/host-configure-m158-batch.sh \
                        tests/m158-batch-run.sh; do
            sh -n "$script"
          done
          python3 scripts/check-prebuilt-profile-catalog.py
          python3 scripts/check-m158-inventory.py
          python3 scripts/check-three-isa-core.py
          python3 scripts/check-architecture-boundaries.py
          test "$(awk '!/^#/ && NF {n++} END {print n+0}' scripts/m158-original-elfs.txt)" -eq 30
          test "$(awk '!/^#/ && NF {print $0}' scripts/m158-original-elfs.txt | sort -u | wc -l)" -eq 30
      - name: Install Alpine staging dependencies and native QEMU
        timeout-minutes: 14
        run: sh scripts/ci-install-signed-alpine-qemu-deps.sh ${{ matrix.port }} --arm64-efi-fallback mke2fs:e2fsprogs
      - name: Native three-ISA signed picture-codec semantics
        timeout-minutes: 54
        run: sh scripts/probe-m158-batch.sh ${{ matrix.port }}
      - name: Preserve signed images, provenance and real guest serial
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m158-original-${{ matrix.port }}-proof
          path: |
            build/external/m158-batch/${{ matrix.port }}/apk-install.log
            build/external/m158-batch/${{ matrix.port }}/requested-packages.txt
            build/external/m158-batch/${{ matrix.port }}/*.sha256
            build/busybox-source-parity-x86/m158-batch.clean.log
            build/busybox-source-parity-x86/m158-batch.serial.log
            build/port-riscv64/full/matrix-source/m158-batch.clean.log
            build/port-riscv64/full/matrix-source/m158-batch.serial.log
            build/port-aarch64/full/matrix-source/m158-batch.clean.log
            build/port-aarch64/full/matrix-source/m158-batch.serial.log
          if-no-files-found: ignore
