name: NaSeed M40 prebuilt GNU tar + XZ Utils archive operations
# M50: retained as an opt-in single-milestone diagnostic. PR auto-validation
# has moved to m50-alpine-matrix.yml: same twelve scripts/real QEMU checks,
# grouped by native ISA and workload class to reuse installation and builds.
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  installed-packages:
    name: original GNU tar + XZ Utils archive lifecycle inside NaSeed / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Install headless QEMU and boot toolchain
        timeout-minutes: 12
        run: |
          set -eu
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'clang:clang' 'ld.lld:lld' 'readelf:binutils' 'cpio:cpio' \
                      'xorriso:xorriso' 'mformat:mtools' 'sgdisk:gdisk' \
                      'qemu-riscv64:qemu-user'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          case "${{ matrix.port }}" in
            amd64)
              command -v qemu-system-x86_64 >/dev/null || missing="$missing qemu-system-x86"
              test -f /usr/share/OVMF/OVMF_CODE_4M.fd || \
                test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf" ;;
            riscv64)
              command -v qemu-system-riscv64 >/dev/null || missing="$missing qemu-system-misc"
              test -f /usr/share/qemu-efi-riscv64/RISCV_VIRT_CODE.fd || missing="$missing qemu-efi-riscv64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
            arm64)
              command -v qemu-system-aarch64 >/dev/null || missing="$missing qemu-system-arm"
              test -f /usr/share/AAVMF/AAVMF_CODE.fd || missing="$missing qemu-efi-aarch64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
          esac
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
      - name: Reject CPIO fixed-file-count regressions before expensive package fetch
        run: sh scripts/check-bootfs-scale.sh
      - name: Run original GNU tar + XZ tools inside all three NaSeed QEMU targets
        timeout-minutes: 12
        run: sh scripts/probe-m40-archives.sh ${{ matrix.port }}
      - name: Preserve original package/ELF/serial evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m40-archives-${{ matrix.port }}
          path: |
            build/external/m40-archives/${{ matrix.port }}/apk-install.log
            build/external/m40-archives/${{ matrix.port }}/requested-packages.txt
            build/external/m40-archives/${{ matrix.port }}/rootfs/tests/run-archives.sh
            build/busybox-source-parity-x86/m40-archives.clean.log
            build/port-riscv64/full/matrix-source/m40-archives.clean.log
            build/port-aarch64/full/matrix-source/m40-archives.clean.log
          if-no-files-found: ignore
