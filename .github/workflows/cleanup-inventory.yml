name: NaSeed whole-tree cleanup inventory
on:
  push:
    branches: ['refactor/naseed-cleanup-*']
    paths:
      - 'scripts/audit-cleanup-inventory.py'
      - '.github/workflows/cleanup-inventory.yml'
      - 'scripts/acceptance/**'
      - '.github/workflows/**'
      - 'scripts/prebuilt-profile-catalog.tsv'
      - 'kernel/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Inventory exact source tree and repeated blocks
        run: python3 scripts/audit-cleanup-inventory.py
      - name: Retain whole-tree reference inventory
        uses: actions/upload-artifact@v4
        with:
          name: cleanup-reference-inventory
          path: build/cleanup-references.tsv
          if-no-files-found: error
          retention-days: 7
