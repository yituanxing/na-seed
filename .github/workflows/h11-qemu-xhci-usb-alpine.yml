name: NaSeed H11 real QEMU xHCI USB Mass Storage original Alpine musl BusyBox Lua jq SQLite

on:
  push:
    branches:
      - feat/na-hw-h0-pci-20261110
    paths:
      - '.github/workflows/h11-qemu-xhci-usb-alpine.yml'
      - 'kernel/platform/x86_h11_usb.*'
      - 'kernel/platform/x86_h1_ecam.*'
      - 'kernel/drivers/usb/**'
      - 'kernel/drivers/core/pci_resources.*'
      - 'kernel/drivers/port/**'
      - 'kernel/arch/x86_64/mmu.*'
      - 'kernel/init/main.c'
      - 'kernel/boot_image.c'
      - 'kernel/kernel.c'
      - 'ports/lwext4/**'
      - 'tests/h11-*.c'
      - 'scripts/check-h11-*.sh'
      - 'scripts/h11-guest-workload.sh'
      - 'scripts/stage-h11-usb-alpine.sh'
      - 'scripts/build-h11-usb-iso.sh'
      - 'scripts/stage-h8-alpine-nvme.sh'
      - 'scripts/build-lwext4-guest.sh'
      - 'limine-h11-usb.conf'
      - 'scripts/run.sh'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h11-qemu-xhci-original-alpine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  h11-real-xhci-usb-mass-storage-original-alpine:
    name: Real QEMU xHCI USB BOT/SCSI -> readonly ext4 / -> signed original Alpine musl ELF
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install C toolchain, signed original Alpine verification, ext4, QEMU and OVMF
        timeout-minutes: 15
        run: |
          set -eu
          missing=''
          for spec in 'clang:clang' 'ld.lld:lld' 'cc:gcc' 'cmake:cmake' \
                      'readelf:binutils' 'cpio:cpio' 'mke2fs:e2fsprogs' \
                      'debugfs:e2fsprogs' 'sha256sum:coreutils' \
                      'curl:curl' 'tar:tar' 'gzip:gzip' 'openssl:openssl' \
                      'xorriso:xorriso' 'qemu-system-x86_64:qemu-system-x86'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          if [ ! -s /usr/share/OVMF/OVMF_CODE_4M.fd ] &&
             [ ! -s /usr/share/OVMF/OVMF_CODE.fd ]; then
            missing="$missing ovmf"
          fi
          if [ -n "$missing" ]; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends $missing
          fi
      - name: H0-H2 hardware inventory, H11 xHCI and SCSI BOT host regressions and shell syntax
        timeout-minutes: 8
        run: |
          set -eu
          sh -n scripts/stage-h11-usb-alpine.sh
          sh -n scripts/h11-guest-workload.sh
          sh -n scripts/build-h11-usb-iso.sh
          sh -n scripts/check-h11-usb-qemu.sh
          sh -n scripts/check-h11-no-usb-media-qemu.sh
          sh -n scripts/check-h11-no-xhci-qemu.sh
          sh -n scripts/check-h11-usb-host.sh
          sh -n scripts/build-lwext4-guest.sh
          sh -n scripts/run.sh
          make hw-h11-host-check
      - name: Build isolated H11 xHCI kernel and original signed Alpine USB ext4 media / UEFI ISO
        timeout-minutes: 35
        run: |
          set -eu
          make hw-h11-iso
          readelf -h build/h11-qemu-only/kernel.elf | grep -q 'Machine:.*Advanced Micro Devices X86-64'
          (cd build/h11-qemu-only && sha256sum -c h11-media-before.sha256)
          sha256sum -c build/h11-qemu-only/h11-original-alpine-elfs.sha256
      - name: Genuine QEMU UEFI xHCI USB Mass Storage SCSI readonly ext4 boots original Alpine userland
        timeout-minutes: 10
        run: sh scripts/check-h11-usb-qemu.sh
      - name: Negative genuine QEMU with xHCI but no USB mass-storage disk blocks Alpine
        timeout-minutes: 3
        run: sh scripts/check-h11-no-usb-media-qemu.sh
      - name: Negative genuine QEMU with no xHCI blocks Alpine and no fallback
        timeout-minutes: 3
        run: sh scripts/check-h11-no-xhci-qemu.sh
      - name: Verify original USB backing image and signed ELF bytes unchanged after all genuine boots
        if: success()
        run: |
          set -eu
          (cd build/h11-qemu-only && sha256sum -c h11-media-before.sha256)
          sha256sum -c build/h11-qemu-only/h11-original-alpine-elfs.sha256
      - name: Preserve real USB-positive, no-media and no-controller QEMU serial transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h11-qemu-xhci-usb-original-alpine-real-serial
          path: |
            build/h11-qemu-only/h11-qemu-uefi-serial.log
            build/h11-qemu-only/h11-qemu-uefi-clean.log
            build/h11-qemu-only/h11-no-media-uefi-serial.log
            build/h11-qemu-only/h11-no-media-uefi-clean.log
            build/h11-qemu-only/h11-no-xhci-uefi-serial.log
            build/h11-qemu-only/h11-no-xhci-uefi-clean.log
          if-no-files-found: ignore
      - name: Preserve H11 kernel, USB media digest, original APK ELF manifest and UEFI ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: h11-qemu-xhci-usb-original-alpine-verified-artifacts
          path: |
            build/h11-qemu-only/kernel.elf
            build/h11-qemu-only/naseed.iso
            build/h11-qemu-only/h11-media-before.sha256
            build/h11-qemu-only/h11-original-alpine-elfs.sha256
          if-no-files-found: error
