name: NaSeed M205 original Alpine software, native first and second QEMU

on:
  # One deliberate new-software discovery run. Changes to kernel or case
  # probes do NOT restart three 75-minute public WAN boots automatically.
  # Recheck genuine signed APK cache transactions, real PTY input and
  # native INET_DIAG TCP listeners in three independent QEMU guests.
  # Bind target-root and container cache views to the SAME original APK bytes;
  # prove fresh offline installation in writable scratch, then run 20 native
  # original Alpine ELFs across independent first and reopen QEMU boots.
  # Recheck genuine cached APK after lwext4 statfs/fstatfs superblock support;
  # also carry real netdev byte/packet accounting for original procfs readers.
  push:
    branches: [naseed-app-batch2]
    paths:
      - '.github/workflows/m205-original-alpine-software.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-signed-alpine:
    name: M205 real 20 ELF entrypoints and durable ext4 / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: true
      - name: Validate new unaccepted ELF manifest, real guest oracle and shared ABI
        run: |
          set -eu
          python3 scripts/check-m141-candidates.py --profile m205
          python3 scripts/test-m205-alpine-host.py
          python3 scripts/test-m197-alpine-host.py
          python3 scripts/test-m204-alpine-host.py
          sh scripts/check-m191-pid1-quiesce.sh
          mkdir -p build/m205-host
          cc -std=c11 -Wall -Wextra -Werror scripts/test-syscall-abi.c \
            -o build/m205-host/syscall-abi
          build/m205-host/syscall-abi
          cc -std=c11 -Wall -Wextra -Werror scripts/test-generic64-clone.c \
            -o build/m205-host/generic64-abi
          build/m205-host/generic64-abi
          python3 scripts/check-three-isa-core.py
          python3 scripts/check-architecture-boundaries.py
          sh -n scripts/probe-m197-alpine-software-cohort.sh
          sh -n scripts/probe-m205-alpine-compat-cohort.sh
          sh -n tests/m205-software-workload.sh
          python3 -m py_compile scripts/m205-alpine-uart.py scripts/m205-compat-report.py
      - name: Install native ISA QEMU, cross-GCC and real ext4 host tools
        timeout-minutes: 18
        run: |
          set -eu
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'cmake:cmake' 'g++:g++' 'clang:clang' 'ld.lld:lld' \
                      'readelf:binutils' 'cpio:cpio' 'mke2fs:e2fsprogs' \
                      'debugfs:e2fsprogs' 'e2fsck:e2fsprogs' \
                      'xorriso:xorriso' 'mformat:mtools' 'sgdisk:gdisk' \
                      'curl:curl' 'python3:python3' 'openssl:openssl'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          case '${{ matrix.port }}' in
            amd64)
              command -v qemu-system-x86_64 >/dev/null || missing="$missing qemu-system-x86"
              test -f /usr/share/OVMF/OVMF_CODE_4M.fd || \
              test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf" ;;
            riscv64)
              command -v riscv64-linux-gnu-gcc >/dev/null || missing="$missing gcc-riscv64-linux-gnu"
              command -v riscv64-linux-gnu-g++ >/dev/null || missing="$missing g++-riscv64-linux-gnu"
              test -f /usr/riscv64-linux-gnu/include/bits/wordsize.h && \
              test -f /usr/riscv64-linux-gnu/lib/libc.a || missing="$missing libc6-dev-riscv64-cross"
              command -v qemu-system-riscv64 >/dev/null || missing="$missing qemu-system-misc"
              test -f /usr/share/qemu-efi-riscv64/RISCV_VIRT_CODE.fd || missing="$missing qemu-efi-riscv64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
            arm64)
              command -v aarch64-linux-gnu-gcc >/dev/null || missing="$missing gcc-aarch64-linux-gnu"
              command -v aarch64-linux-gnu-g++ >/dev/null || missing="$missing g++-aarch64-linux-gnu"
              test -f /usr/aarch64-linux-gnu/include/bits/wordsize.h && \
              test -f /usr/aarch64-linux-gnu/lib/libc.a || missing="$missing libc6-dev-arm64-cross"
              command -v qemu-system-aarch64 >/dev/null || missing="$missing qemu-system-arm"
              test -f /usr/share/AAVMF/AAVMF_CODE.fd || \
              test -f /usr/share/qemu-efi-aarch64/QEMU_EFI.fd || missing="$missing qemu-efi-aarch64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
          esac
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
      - name: Fail-closed signed Alpine ELF census for this exact QEMU commit
        timeout-minutes: 18
        run: |
          set -eu
          sh scripts/inventory-m141-signed-apks.sh ${{ matrix.port }} m205
          tsv=build/external/m205-candidate-inventory/${{ matrix.port }}/candidates.tsv
          awk -F '\t' 'NR > 1 { n++; if ($3 != "NATIVE_ELF") bad++ } END {
            if (n != 20 || bad) { print "[M205 SIGNED ELF FAIL] wrong ELF count/status"; exit 1 }
          }' "$tsv"
          unique=$(awk -F '\t' 'NR > 1 { print $4 }' "$tsv" | sort -u | wc -l)
          test "$unique" -eq 19 || {
            echo "[M205 SIGNED ELF FAIL] expected 19 real unique SHA, got $unique" >&2
            exit 1
          }
          echo "[M205 SIGNED ELF PASS] 20 native paths, 19 independent real ELF SHA"
      - name: Run real M197 signed public HTTPS and M205 per-ELF first/reopen QEMU
        timeout-minutes: 95
        env:
          NAS_M205_REQUIRE_ALL: '0'
          NAS_M205_PUBLIC_QEMU_TIMEOUT: '4500'
          NAS_M205_PUBLIC_SECONDS: '4400'
          NAS_M205_REOPEN_SECONDS: '900'
        run: sh scripts/probe-m205-alpine-compat-cohort.sh ${{ matrix.port }}
      - name: Summarize actual guest outcome without equating discovery to PASS
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          port = '${{ matrix.port }}'
          root = Path('build/external/m191-alpine-rootfs') / port
          result = root / 'm205-compat-report.json'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              if result.exists():
                  payload = json.loads(result.read_text())
                  print(f"### M205 {port}: real Alpine candidate discovery", file=summary)
                  print('20 candidate entrypoints; 19 distinct SHA require the independent signed-APK gate.', file=summary)
                  print(f"Full entrypoints: {payload['newly_installed_full_pass_entrypoints']}/{payload['total_entrypoints']}", file=summary)
              else:
                  print(f'### M205 {port}: incomplete QEMU/host proof (no report)', file=summary)
          PY
      - name: Preserve raw guest logs, real first/reopen result and wire proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m205-original-alpine-${{ matrix.port }}
          # On early guest command failure the M197 runner exits before it
          # copies UART to m197-live.serial.log. Preserve native per-ISA logs.
          path: |
            build/external/m205-candidate-inventory/${{ matrix.port }}/apk-install.log
            build/external/m205-candidate-inventory/${{ matrix.port }}/candidates.tsv
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m205-compat-report.json
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m205-first-runner.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m197-live.serial.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m197-reopen-runner.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m197-public-wire.json
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m197-public-wire.pcap
            build/acceptance/**/m197-batch*.log
            build/busybox-source-parity-x86/m197-batch*.log
            build/port-riscv64/full/matrix-source/m197-batch*.log
            build/port-aarch64/full/matrix-source/m197-batch*.log
          if-no-files-found: ignore
