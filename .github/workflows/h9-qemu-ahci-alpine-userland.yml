name: NaSeed H9 Q35 AHCI SATA original Alpine musl BusyBox Lua jq SQLite

on:
  push:
    branches:
      - feat/na-hw-h0-pci-20261110
    paths:
      - '.github/workflows/h9-qemu-ahci-alpine-userland.yml'
      - 'kernel/platform/x86_h9_ahci.*'
      - 'kernel/platform/x86_h1_ecam.*'
      - 'kernel/drivers/ahci/**'
      - 'kernel/drivers/core/pci_resources.*'
      - 'kernel/drivers/port/**'
      - 'kernel/arch/x86_64/mmu.*'
      - 'kernel/init/main.c'
      - 'kernel/boot_image.c'
      - 'kernel/kernel.c'
      - 'ports/lwext4/**'
      - 'tests/h9-*.c'
      - 'scripts/check-h9-*.sh'
      - 'scripts/h9-guest-workload.sh'
      - 'scripts/stage-h9-ahci-alpine.sh'
      - 'scripts/build-h9-ahci-iso.sh'
      - 'scripts/stage-h8-alpine-nvme.sh'
      - 'scripts/build-lwext4-guest.sh'
      - 'limine-h9-ahci.conf'
      - 'scripts/run.sh'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h9-qemu-readonly-sata-original-alpine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  h9-real-q35-ahci-sata-original-alpine-userland:
    name: QEMU Q35 ICH9 AHCI -> readonly SATA ext4 / -> signed original Alpine musl ELF
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install C toolchain, original Alpine APK verification, ext4, QEMU and OVMF
        timeout-minutes: 15
        run: |
          set -eu
          missing=''
          for spec in 'clang:clang' 'ld.lld:lld' 'cc:gcc' 'cmake:cmake' \
                      'readelf:binutils' 'cpio:cpio' 'mke2fs:e2fsprogs' \
                      'debugfs:e2fsprogs' 'sha256sum:coreutils' \
                      'curl:curl' 'tar:tar' 'gzip:gzip' 'openssl:openssl' \
                      'xorriso:xorriso' 'qemu-system-x86_64:qemu-system-x86'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          if [ ! -s /usr/share/OVMF/OVMF_CODE_4M.fd ] &&
             [ ! -s /usr/share/OVMF/OVMF_CODE.fd ]; then
            missing="$missing ovmf"
          fi
          if [ -n "$missing" ]; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends $missing
          fi
      - name: H0-H2 hardware inventory and H9 protocol fake host regression
        timeout-minutes: 8
        run: |
          set -eu
          sh -n scripts/stage-h9-ahci-alpine.sh
          sh -n scripts/h9-guest-workload.sh
          sh -n scripts/build-h9-ahci-iso.sh
          sh -n scripts/check-h9-ahci-alpine-qemu.sh
          sh -n scripts/check-h9-no-ahci-qemu.sh
          sh -n scripts/build-lwext4-guest.sh
          sh -n scripts/run.sh
          make hw-h9-host-check
      - name: Isolated H9 Q35 AHCI kernel, original signed Alpine SATA root and UEFI ISO
        timeout-minutes: 33
        run: |
          set -eu
          make hw-h9-iso
          readelf -h build/h9-qemu-only/kernel.elf | grep -q 'Machine:.*Advanced Micro Devices X86-64'
          (cd build/h9-qemu-only && sha256sum -c h9-media-before.sha256)
          sha256sum -c build/h9-qemu-only/h9-original-alpine-elfs.sha256
      - name: Real QEMU UEFI ICH9 AHCI SATA ext4 root executes signed original Alpine programs
        timeout-minutes: 7
        run: sh scripts/check-h9-ahci-alpine-qemu.sh
      - name: Negative real QEMU with no SATA HDD rejects optical and CPIO substitutes
        timeout-minutes: 3
        run: sh scripts/check-h9-no-ahci-qemu.sh
      - name: Preserve genuine positive and no-SATA negative serial transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h9-qemu-ich9-ahci-original-alpine-real-serial
          path: |
            build/h9-qemu-only/h9-qemu-uefi-serial.log
            build/h9-qemu-only/h9-qemu-uefi-clean.log
            build/h9-qemu-only/h9-no-sata-uefi-serial.log
            build/h9-qemu-only/h9-no-sata-uefi-clean.log
          if-no-files-found: ignore
      - name: Preserve kernel, SATA media digest, original APK ELF hashes and UEFI ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: h9-qemu-ahci-original-alpine-readonly-verified-artifacts
          path: |
            build/h9-qemu-only/kernel.elf
            build/h9-qemu-only/naseed.iso
            build/h9-qemu-only/h9-media-before.sha256
            build/h9-qemu-only/h9-original-alpine-elfs.sha256
          if-no-files-found: error
