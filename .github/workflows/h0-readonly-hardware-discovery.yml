name: NaSeed H0 read-only firmware and PCI discovery

on:
  push:
    branches:
      - feat/na-hw-h0-pci-20261110
    paths:
      - '.github/workflows/h0-readonly-hardware-discovery.yml'
      - 'kernel/kernel.c'
      - 'kernel/drivers/core/pci_scan.*'
      - 'kernel/drivers/serial.*'
      - 'kernel/platform/firmware_acpi.*'
      - 'kernel/platform/x86_h0_pci.*'
      - 'scripts/check-h0-acpi-host.sh'
      - 'scripts/check-pci-scan.sh'
      - 'scripts/test-pci-scan.c'
      - 'tests/h0-acpi-host.c'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h0-hardware-${{ github.ref }}
  cancel-in-progress: false

jobs:
  read-only-host-and-x86-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Prepare freestanding build tools
        run: |
          if ! command -v ld.lld >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq lld
          fi
          command -v clang
          command -v ld.lld
          command -v cc
      - name: ACPI table and PCI topology fail-closed host tests
        run: make hw-h0-host-check
      - name: Build isolated H0 kernel with real Limine RSDP handoff
        run: make hw-h0-kernel
      - name: Check x86-64 ELF and H0 symbols
        run: |
          readelf -h build/h0-hardware/kernel.elf | grep -q 'Machine:.*Advanced Micro Devices X86-64'
          nm build/h0-hardware/kernel.elf > build/h0-hardware/h0-symbols.txt
          grep -q ' nas_acpi_probe$' build/h0-hardware/h0-symbols.txt
          grep -q ' nas_pci_scan_root$' build/h0-hardware/h0-symbols.txt
          grep -q ' nas_x86_h0_pci_inventory$' build/h0-hardware/h0-symbols.txt
      - name: Prepare UEFI ISO and virtual firmware test tools
        run: |
          missing=''
          command -v xorriso >/dev/null || missing="$missing xorriso"
          command -v qemu-system-x86_64 >/dev/null || missing="$missing qemu-system-x86"
          if [ ! -s /usr/share/OVMF/OVMF_CODE_4M.fd ] &&
             [ ! -s /usr/share/OVMF/OVMF_CODE.fd ]; then
            missing="$missing ovmf"
          fi
          if [ -n "$missing" ]; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends $missing
          fi
      - name: Boot isolated H0 UEFI image in QEMU without any writable disk
        timeout-minutes: 5
        run: |
          make hw-h0-iso
          set +e
          timeout 50s sh scripts/run.sh build/h0-hardware/naseed.iso > build/h0-hardware/h0-qemu-uefi-serial.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            tail -80 build/h0-hardware/h0-qemu-uefi-serial.log
            exit "$rc"
          fi
          tail -80 build/h0-hardware/h0-qemu-uefi-serial.log
          grep -Fq '[H0 ACPI] XSDT=' build/h0-hardware/h0-qemu-uefi-serial.log
          grep -Fq '[H0 PCI]' build/h0-hardware/h0-qemu-uefi-serial.log
          grep -Fq '[H0 COMPLETE] firmware inventory only; no physical disk I/O' build/h0-hardware/h0-qemu-uefi-serial.log
      - name: Preserve firmware discovery serial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h0-x86-qemu-uefi-serial
          path: build/h0-hardware/h0-qemu-uefi-serial.log
          if-no-files-found: ignore
      - name: Preserve bootable H0 ISO for offline spare-PC verification
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: h0-x86-readonly-uefi-iso
          path: build/h0-hardware/naseed.iso
          if-no-files-found: error
