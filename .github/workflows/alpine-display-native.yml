name: NaSeed native signed TLS, image and display acceptance
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Original signed TLS or physical display workload
        required: true
        type: choice
        options: [m156, m160, m161, m162, m164]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ inputs.profile }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    name: ${{ inputs.profile }} original signed software / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.profile == 'm156' && 75 || 80 }}
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    env:
      PROFILE: ${{ inputs.profile }}
      PORT: ${{ matrix.port }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: true
      - name: Select exact host checks and immutable evidence paths
        id: profile
        run: |
          set -eu
          case "$PROFILE" in
            m156)
              probe=scripts/probe-m156-https-wire-smoke.sh; work="build/external/m156-https/$PORT"
              fixture=scripts/host-configure-m156-https.sh; guest=tests/m156-https-run.sh
              artifact="m156-original-alpine-verified-https-$PORT"
              extra='host-m156-https.log host-tls.crt virtio-m156-https.pcap' ;;
            m160)
              probe=scripts/probe-m160-batch.sh; work="build/external/m160-batch/$PORT"
              fixture=scripts/host-configure-m160-batch.sh; guest=tests/m160-batch-run.sh
              artifact="m160-original-wire-png-$PORT-proof"
              extra='host-*.log host-tls.crt *.pcap' ;;
            m161)
              probe=scripts/probe-m161-batch.sh; work="build/external/m161-batch/$PORT"
              fixture=scripts/host-configure-m161-batch.sh; guest=tests/m161-batch-run.sh
              artifact="m161-real-hardware-pixels-$PORT-proof"
              extra='m161-qmp-check.log m161-qmp-screen.ppm' ;;
            m162)
              probe=scripts/probe-m162-batch.sh; work="build/external/m162-batch/$PORT"
              fixture=scripts/host-configure-m162-batch.sh; guest=tests/m162-batch-run.sh
              artifact="m162-real-https-to-visible-pixels-$PORT"
              extra='host-m162-wire.log host-tls.crt virtio-m162-display.pcap m162-qmp-check.log m162-qmp-screen.ppm' ;;
            m164)
              probe=scripts/probe-m164-batch.sh; work="build/external/m164-batch/$PORT"
              fixture=scripts/host-configure-m164-batch.sh; guest=tests/m164-input-display.c
              artifact="m164-physical-serial-screen-$PORT"
              extra='m164-serial-qmp-check.log m164-first.ppm m164-unchanged.ppm m164-flipped.ppm' ;;
            *) exit 2 ;;
          esac
          echo "probe=$probe" >> "$GITHUB_OUTPUT"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          {
            echo 'evidence<<EOF'
            printf '%s\n' "$work/apk-install.log" "$work/*.sha256"
            [ "$PROFILE" = m164 ] || printf '%s\n' "$work/requested-packages.txt"
            set -f
            for f in $extra; do printf '%s\n' "$work/$f"; done
            set +f
            for logs in build/busybox-source-parity-x86 build/port-riscv64/full/matrix-source build/port-aarch64/full/matrix-source; do
              printf '%s\n' "$logs/$PROFILE-batch.clean.log" "$logs/$PROFILE-batch.serial.log"
            done
            echo EOF
          } >> "$GITHUB_OUTPUT"
          for f in scripts/stage-alpine-display.sh "$probe" "$fixture"; do sh -n "$f"; done
          [ "$PROFILE" = m164 ] || sh -n "$guest"
          python3 scripts/check-prebuilt-profile-catalog.py
          case "$PROFILE" in
            m156)
              python3 -m py_compile scripts/m156-https-wire-server.py
              grep -Fq 'm156-https' scripts/prebuilt-profile-catalog.tsv
              test "$(awk -F '\t' '$1 !~ /^#/ && NF {n++} END {print n+0}' scripts/m156-https-cases.tsv)" -eq 1 ;;
            m160)
              python3 -m py_compile scripts/m160-image-wire-server.py
              python3 scripts/check-m160-wire-inventory.py ;;
            m161)
              sh -n scripts/run.sh; sh -n scripts/probe-riscv64-busybox-matrix.sh; sh -n scripts/probe-aarch64-busybox-matrix.sh
              python3 -m py_compile scripts/m161-qmp-verify.py
              gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -g -o /tmp/m161-fbdev-core-test scripts/test-fbdev-core.c kernel/drivers/display/fbdev.c
              ASAN_OPTIONS=detect_leaks=0 /tmp/m161-fbdev-core-test ;;
            m162)
              python3 -m py_compile scripts/m160-image-wire-server.py scripts/m161-qmp-verify.py
              python3 scripts/check-m162-wire-display.py ;;
            m164)
              for f in scripts/probe-x86-busybox-parity.sh scripts/probe-riscv64-busybox-matrix.sh scripts/probe-aarch64-busybox-matrix.sh; do sh -n "$f"; done
              python3 -m py_compile scripts/m161-qmp-verify.py scripts/m164-serial-qmp-verify.py
              python3 scripts/check-m164-interactive.py ;;
          esac
          if [ "$PROFILE" != m156 ]; then
            python3 scripts/check-three-isa-core.py
            python3 scripts/check-architecture-boundaries.py
          fi
      - name: Install native QEMU, firmware and signed Alpine APK dependencies
        timeout-minutes: ${{ inputs.profile == 'm164' && 18 || 14 }}
        run: |
          set -eu
          case "$PROFILE" in
            m156) sh scripts/ci-install-signed-alpine-qemu-deps.sh "$PORT" --arm64-efi-fallback --explicit-tools clang:clang ld.lld:lld readelf:binutils cpio:cpio mke2fs:e2fsprogs xorriso:xorriso mformat:mtools sgdisk:gdisk openssl:openssl qemu-riscv64:qemu-user ;;
            m160|m162) sh scripts/ci-install-signed-alpine-qemu-deps.sh "$PORT" --arm64-efi-fallback mke2fs:e2fsprogs openssl:openssl ;;
            m161) sh scripts/ci-install-signed-alpine-qemu-deps.sh "$PORT" --arm64-efi-fallback mke2fs:e2fsprogs ;;
            m164) sh scripts/ci-install-signed-alpine-qemu-deps.sh "$PORT" --arm64-efi-fallback --cross-c mke2fs:e2fsprogs gcc:gcc ;;
            *) exit 2 ;;
          esac
      - name: Execute actual native QEMU with the selected independent guest oracle
        timeout-minutes: ${{ inputs.profile == 'm156' && 54 || 58 }}
        env:
          PROBE: ${{ steps.profile.outputs.probe }}
        run: sh "$PROBE" "$PORT"
      - name: Preserve certificate, wire, screen, serial and original APK hash evidence
        if: always() && steps.profile.outputs.evidence != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.profile.outputs.artifact }}
          path: ${{ steps.profile.outputs.evidence }}
          if-no-files-found: ignore
