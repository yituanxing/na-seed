name: Audited one-time branch cleanup
# This file only auto-runs when added/modified on main. It is also
# manually dispatchable for an audited retry. It does NOT run on PRs.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prune-historical-branches.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete_verified_old_heads:
    if: github.repository == 'yituanxing/na-seed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Delete only pinned, audited obsolete PR heads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          failures=0
          pruned=0
          skipped=0
          while IFS='|' read -r kind number branch expected_sha expected_tree; do
            [ -n "$branch" ] || continue
            case "$branch" in
              main|HEAD) echo "[REFUSE] protected branch: $branch"; exit 1 ;;
            esac
            details="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number")"
            pr_state="$(printf '%s' "$details" | jq -r '.state')"
            pr_merged="$(printf '%s' "$details" | jq -r '.merged_at // ""')"
            pr_head="$(printf '%s' "$details" | jq -r '.head.sha')"
            pr_branch="$(printf '%s' "$details" | jq -r '.head.ref')"
            if [ "$pr_state" != closed ] || [ "$pr_head" != "$expected_sha" ] || [ "$pr_branch" != "$branch" ]; then
              echo "[REFUSE] PR #$number metadata changed for $branch"
              failures=$((failures + 1))
              continue
            fi
            if [ "$kind" = merged ]; then
              if [ -z "$pr_merged" ]; then
                echo "[REFUSE] PR #$number was not merged"; failures=$((failures + 1)); continue
              fi
            elif [ "$kind" = equivalent ]; then
              if [ -n "$pr_merged" ]; then
                echo "[REFUSE] unexpected merged state for $branch"; failures=$((failures + 1)); continue
              fi
              current_tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$expected_sha" --jq '.tree.sha')"
              if [ "$current_tree" != "$expected_tree" ]; then
                echo "[REFUSE] byte-equivalent audited tree mismatch: $branch"; failures=$((failures + 1)); continue
              fi
            elif [ "$kind" = superseded ]; then
              if [ -n "$pr_merged" ] || ! printf '%s' "$details" | jq -er '.body | test("Superseded")' >/dev/null; then
                echo "[REFUSE] superseded status not established: $branch"; failures=$((failures + 1)); continue
              fi
            else
              echo "[REFUSE] unknown category: $kind"; exit 1
            fi

            actual_sha="$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')"
            if [ -z "$actual_sha" ]; then
              echo "[SKIP] already deleted: $branch"; skipped=$((skipped + 1)); continue
            fi
            if [ "$actual_sha" != "$expected_sha" ]; then
              echo "[REFUSE] head changed: $branch"; failures=$((failures + 1)); continue
            fi
            echo "[DELETE] #$number $branch"
            if git push origin --delete "$branch"; then
              pruned=$((pruned + 1))
            else
              echo "[FAILED] remote deletion: $branch"; failures=$((failures + 1))
            fi
          done <<'AUDITED_HEADS'
