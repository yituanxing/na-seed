name: NaSeed M74 signed strace -p already-running process native three-ISA gate
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  original-inspection:
    name: original strace -p live unrelated process gate on NaSeed / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Shared kernel architecture and host procfs owner
        run: |
          set -eu
          sh -n scripts/stage-m74-prebuilt.sh scripts/probe-m74-strace.sh tests/m74-strace-run.sh
          python3 scripts/check-three-isa-core.py
          python3 scripts/check-prebuilt-profile-catalog.py
          python3 scripts/check-native-qemu-target.py
          cc -std=c11 -Wall -Wextra -Werror -ffunction-sections -fdata-sections -Wl,--gc-sections -I kernel scripts/test-ptrace-owner.c kernel/task/ptrace.c -o /tmp/nas-m74-ptrace-owner
          /tmp/nas-m74-ptrace-owner
          cc -std=c11 -Wall -Wextra -Werror -ffunction-sections -fdata-sections -Wl,--gc-sections -I kernel scripts/test-ptrace-wait-ownership.c kernel/task/process.c -o /tmp/nas-m74-ptrace-wait
          /tmp/nas-m74-ptrace-wait
      - name: Install native QEMU and host rootfs tools
        timeout-minutes: 12
        run: |
          set -eu
          sh scripts/ci-install-signed-alpine-qemu-deps.sh ${{ matrix.port }} --explicit-tools clang:clang ld.lld:lld readelf:binutils cpio:cpio xorriso:xorriso mformat:mtools sgdisk:gdisk qemu-riscv64:qemu-user
      - name: Original Alpine strace real syscall-stop in native QEMU
        timeout-minutes: 24
        run: sh scripts/probe-m74-strace.sh ${{ matrix.port }}
      - name: Retain all actual QEMU and apk failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m74-strace-${{ matrix.port }}
          path: |
            build/external/m74-strace/${{ matrix.port }}/apk-install.log
            build/external/m74-strace/${{ matrix.port }}/requested-packages.txt
            build/busybox-source-parity-x86/m74-attach.clean.log
            build/port-riscv64/full/matrix-source/m74-attach.clean.log
            build/port-aarch64/full/matrix-source/m74-attach.clean.log
          if-no-files-found: ignore
