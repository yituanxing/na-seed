name: NaSeed M83 original native GCC Make upstream zlib three-FS two-boot acceptance
on:
  pull_request:
    paths:
      - '.github/workflows/m83-source.yml'
      - 'scripts/m83-*'
      - 'scripts/stage-m83-*'
      - 'scripts/probe-m83-*'
      - 'scripts/stage-alpine-prebuilt-overlay.sh'
      - 'scripts/prebuilt-profile-catalog.tsv'
      - 'scripts/probe-x86-busybox-parity.sh'
      - 'scripts/probe-riscv64-busybox-matrix.sh'
      - 'scripts/probe-aarch64-busybox-matrix.sh'
      - 'scripts/native-qemu-target.sh'
      - 'rootfs/alpine/**'
      - 'tests/m83-source-run.sh'
      - 'kernel/**'
      - 'ports/**'
jobs:
  m83:
    name: M83 original signed GCC/Make upstream zlib, build then reboot / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Install genuine host QEMU/ELF and lwext4 ext4 check tools
        timeout-minutes: 12
        run: |
          set -eu
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'clang:clang' 'ld.lld:lld' 'readelf:binutils' \
                      'ar:binutils' 'cpio:cpio' 'xorriso:xorriso' \
                      'mformat:mtools' 'sgdisk:gdisk' 'qemu-riscv64:qemu-user' \
                      'cmake:cmake' 'cc:gcc' 'mke2fs:e2fsprogs' \
                      'e2fsck:e2fsprogs' 'debugfs:e2fsprogs'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          case "${{ matrix.port }}" in
            amd64)
              command -v qemu-system-x86_64 >/dev/null || missing="$missing qemu-system-x86"
              test -f /usr/share/OVMF/OVMF_CODE_4M.fd || \
                test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf" ;;
            riscv64)
              command -v qemu-system-riscv64 >/dev/null || missing="$missing qemu-system-misc"
              test -f /usr/share/qemu-efi-riscv64/RISCV_VIRT_CODE.fd || missing="$missing qemu-efi-riscv64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
            arm64)
              command -v qemu-system-aarch64 >/dev/null || missing="$missing qemu-system-arm"
              test -f /usr/share/AAVMF/AAVMF_CODE.fd || missing="$missing qemu-efi-aarch64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
          esac
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
      - name: Two real QEMU boots per ISA, unchanged original zlib and ext4 physical replay
        timeout-minutes: 85
        run: sh scripts/probe-m83-source-build.sh ${{ matrix.port }}
      - name: Retain proven original toolchain provenance and two-boot ELF/Make evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: m83-source-pass-${{ matrix.port }}
          path: |
            build/external/m83-source/${{ matrix.port }}/*.sha256
            build/external/m83-source/${{ matrix.port }}/m83-built-example.elf
            build/external/m83-source/${{ matrix.port }}/m83-built-libz.a
            build/external/m83-source/${{ matrix.port }}/m83-replay-example.elf
            build/external/m83-source/${{ matrix.port }}/m83-replay-libz.a
            build/external/m83-source/${{ matrix.port }}/*result.txt
            build/busybox-source-parity-x86/m83-*.clean.log
            build/port-riscv64/full/matrix-source/m83-*.clean.log
            build/port-aarch64/full/matrix-source/m83-*.clean.log
          if-no-files-found: error
      - name: Preserve original ELF and on-disk ext4 failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m83-native-source-${{ matrix.port }}
          path: |
            build/external/m83-source/${{ matrix.port }}/*.sha256
            build/external/m83-source/${{ matrix.port }}/*result.txt
            build/external/m83-source/${{ matrix.port }}/apk-install.log
            build/external/m83-source/${{ matrix.port }}/requested-packages.txt
            build/external/m83-source/${{ matrix.port }}/*debugfs*.log
            build/external/m83-source/${{ matrix.port }}/m83-physical-ext4.img
            build/busybox-source-parity-x86/m83-*.clean.log
            build/port-riscv64/full/matrix-source/m83-*.clean.log
            build/port-aarch64/full/matrix-source/m83-*.clean.log
          if-no-files-found: ignore
