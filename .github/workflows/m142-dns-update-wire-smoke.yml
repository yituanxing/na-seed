name: NaSeed M142 signed Alpine nsupdate + Nping wire (x86 QEMU)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  x86-rfc2136-and-nping:
    name: One QEMU boot, RFC2136 update/query + unprivileged UDP oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
      - name: Validate signed original Alpine targets and strict DNS packet oracle
        run: |
          set -eu
          test "$(git -C third_party/lwip rev-parse HEAD)" = \
            77dcd25a72509eb83f72b033d219b1d40cd8eb95
          sh -n tests/m142-dns-update-run.sh
          sh -n scripts/probe-m142-dns-update-wire-smoke.sh
          sh -n scripts/run.sh
          python3 scripts/test-m142-dns-update-server.py
          test "$(awk -F '\t' '$1 !~ /^#/ && NF {n++} END {print n+0}' scripts/m142-dns-update-cases.tsv)" -eq 1
          grep -Fq 'tests/m142-dns-update-run.sh' scripts/m141-rootfs-copies.tsv
          for program in nsupdate host nping; do
            grep -Fxq "usr/bin/$program" scripts/m141-original-elfs.txt
          done
      - name: Install native QEMU and signed Alpine staging tools
        timeout-minutes: 12
        run: |
          set -eu
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'clang:clang' 'ld.lld:lld' 'readelf:binutils' \
                      'cpio:cpio' 'xorriso:xorriso' 'mformat:mtools' \
                      'sgdisk:gdisk' 'qemu-riscv64:qemu-user'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          command -v qemu-system-x86_64 >/dev/null || missing="$missing qemu-system-x86"
          test -f /usr/share/OVMF/OVMF_CODE_4M.fd || \
          test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf"
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
      - name: Probe signed nsupdate RFC2136 and Nping UDP against real host state
        timeout-minutes: 35
        run: sh scripts/probe-m142-dns-update-wire-smoke.sh
      - name: Preserve signed executable hashes, serial and packet evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m142-rfc2136-nping-amd64-qemu
          path: |
            build/external/m141-batch/amd64/apk-install.log
            build/external/m141-batch/amd64/requested-packages.txt
            build/external/m141-batch/amd64/*.sha256
            build/external/m141-batch/amd64/host-m142-dns-update.log
            build/external/m141-batch/amd64/virtio-m142-dns-update.pcap
            build/busybox-source-parity-x86/m142-batch.clean.log
            build/busybox-source-parity-x86/m142-batch.serial.log
          if-no-files-found: ignore
