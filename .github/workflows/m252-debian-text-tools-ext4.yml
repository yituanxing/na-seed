name: NaSeed M252 signed Debian glibc grep sed find physical ext4 UART

# Three additional ORIGINAL signed Debian 13 grep/sed/find ELF, genuine dynamic
# loader and recursively checked shared libraries, exercised inside NaSeed
# through native three-ISA QEMU, physical ext4 and a live interactive UART.
on:
  push:
    # Integration branches enter this same three-ISA job through M254's
    # workflow_call, avoiding a second redundant QEMU boot per ISA.
    branches: [na-alpine-direct-use]
    paths:
      - '.github/workflows/m252-debian-text-tools-ext4.yml'
      - 'scripts/m252-*'
      - 'scripts/m251-*'
      - 'tests/m252-*'
      - 'tests/m251-*'
      - 'scripts/m250-*'
      - 'tests/m250-*'
      - 'scripts/m249-*'
      - 'scripts/m248-*'
      - 'scripts/m245-*'
      - 'scripts/m193-*'
      - 'scripts/native-qemu-target.sh'
      - 'scripts/probe-riscv64-busybox-matrix.sh'
      - 'scripts/probe-aarch64-busybox-matrix.sh'
      - 'scripts/probe-x86-busybox-parity.sh'
      - 'scripts/native-source-qemu.sh'
      - 'scripts/run.sh'
      - 'scripts/build-riscv64-full.sh'
      - 'scripts/build-aarch64-full.sh'
      - 'kernel/boot_image.c'
      - 'kernel/arch/linux_stat_abi.h'
      - 'kernel/arch/linux_syscall_abi.h'
      - 'kernel/syscall/ops.h'
      - 'kernel/init/main.c'
      - 'kernel/fs/**'
      - 'kernel/task/**'
      - 'kernel/mm/**'
      - 'kernel/drivers/tty*'
      - 'kernel/drivers/virtio_blk*'
      - 'ports/lwext4/**'
  workflow_dispatch:
  workflow_call:
    inputs:
      m254_shell:
        description: 'Extend M252 real QEMU boot with original Debian dash child lifecycle and ext4 oracle'
        required: false
        type: boolean
        default: false
      m255_init:
        description: 'Use original signed Debian sysvinit-core PID1 and observe inittab respawn (diagnostic only)'
        required: false
        type: boolean
        default: false
      m256_initctl:
        description: 'Use signed original Debian telinit via real tmpfs initctl FIFO to switch runlevel 3 (diagnostic only)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  # Reusable jobs inherit the caller's github.workflow name. Give this inner
  # gate a distinct group or GitHub cancels M254 before creating any job as a
  # self-deadlock between caller and callee.
  group: ${{ github.workflow }}-${{ github.ref }}-m252-native-worker
  cancel-in-progress: false

jobs:
  original-debian-three-text-tools:
    name: Signed Debian/glibc three original ELF real UART/ext4 / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: true
      - name: Reject unsigned provenance or synthetic serial success
        run: |
          set -eu
          sh -n scripts/m252-probe-debian-text-tools.sh
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for p in sorted(Path('scripts').glob('m252-*.py')):
              ast.parse(p.read_text(encoding='utf-8'), filename=str(p))
          PY
          python3 -B tests/m252-debian-provenance-host.py
          python3 -B tests/m252-debian-uart-host.py
          python3 -B tests/m254-debian-shell-host.py
          python3 -B tests/m255-debian-init-host.py
          python3 -B tests/m256-debian-initctl-host.py
          python3 -B tests/m251-debian-provenance-host.py
          python3 -B tests/m251-debian-uart-host.py
          python3 -B tests/m250-debian-interactive-host.py
          python3 -B tests/m249-debian-ext4-host.py
          python3 -B tests/m248-debian-multiarch-host.py
          mkdir -p build/m252-host
          gcc -std=c11 -Wall -Wextra -Werror tests/m251-statx-abi-host.c \
            -o build/m252-host/statx-abi
          build/m252-host/statx-abi
          sh scripts/check-m191-pid1-quiesce.sh
      - name: Install Debian signature and native QEMU/cross GCC dependencies
        timeout-minutes: 16
        run: |
          set -eu
          PATH=/usr/sbin:/sbin:$PATH
          export PATH
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'cmake:cmake' 'g++:g++' 'clang:clang' 'ld.lld:lld' \
                      'readelf:binutils' 'cpio:cpio' 'xorriso:xorriso' \
                      'mformat:mtools' 'sgdisk:gdisk' 'curl:curl' \
                      'python3:python3' 'dpkg-deb:dpkg' 'apt-cache:apt' \
                      'mke2fs:e2fsprogs' 'e2fsck:e2fsprogs' 'debugfs:e2fsprogs'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          test -s /usr/share/keyrings/debian-archive-keyring.gpg || \
            missing="$missing debian-archive-keyring"
          case '${{ matrix.port }}' in
            amd64)
              command -v qemu-system-x86_64 >/dev/null || missing="$missing qemu-system-x86"
              test -s /usr/share/OVMF/OVMF_CODE_4M.fd || \
              test -s /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf"
              command -v gcc >/dev/null || missing="$missing gcc"
              ;;
            riscv64)
              command -v qemu-system-riscv64 >/dev/null || missing="$missing qemu-system-misc"
              test -s /usr/share/qemu-efi-riscv64/RISCV_VIRT_CODE.fd || \
                missing="$missing qemu-efi-riscv64"
              command -v riscv64-linux-gnu-gcc >/dev/null || \
                missing="$missing gcc-riscv64-linux-gnu"
              test -s /usr/riscv64-linux-gnu/include/bits/wordsize.h || \
                missing="$missing libc6-dev-riscv64-cross"
              ;;
            arm64)
              command -v qemu-system-aarch64 >/dev/null || missing="$missing qemu-system-arm"
              test -s /usr/share/qemu-efi-aarch64/QEMU_EFI.fd || \
                missing="$missing qemu-efi-aarch64"
              command -v aarch64-linux-gnu-gcc >/dev/null || \
                missing="$missing gcc-aarch64-linux-gnu"
              test -s /usr/aarch64-linux-gnu/include/bits/wordsize.h || \
                missing="$missing libc6-dev-arm64-cross"
              ;;
            *) echo 'Unreviewed M252 native ISA' >&2; exit 2 ;;
          esac
          test -s /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu"
          if [ -n "$missing" ]; then
            sudo timeout --signal=TERM --kill-after=5s 120s \
              apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo timeout --signal=TERM --kill-after=5s 360s \
              env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
      - name: Restore pinned three-ISA Limine seed
        uses: ./.github/actions/naseed-limine-seed
        with:
          github-token: ${{ github.token }}
      - name: Verify and execute three original Debian ELF on NaSeed physical ext4
        timeout-minutes: 35
        env:
          NAS_ENABLE_M254_DEBIAN_SHELL: ${{ inputs.m254_shell && '1' || '0' }}
          NAS_ENABLE_M255_DEBIAN_INIT: ${{ inputs.m255_init && '1' || '0' }}
          NAS_ENABLE_M256_DEBIAN_INITCTL: ${{ inputs.m256_initctl && '1' || '0' }}
        run: sh scripts/m252-probe-debian-text-tools.sh ${{ matrix.port }}
      - name: Retain signed provenance, UART evidence, unmount and disk readback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m252-signed-debian-text-tools-ext4-${{ matrix.port }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            build/m252-debian-text-tools/${{ matrix.port }}/source/manifest.json
            build/m252-debian-text-tools/${{ matrix.port }}/m251-extra.json
            build/m252-debian-text-tools/${{ matrix.port }}/m252-extra.json
            build/m252-debian-text-tools/${{ matrix.port }}/*.tsv
            build/m252-debian-text-tools/${{ matrix.port }}/*.log
            build/m254-debian-shell/${{ matrix.port }}/source/manifest.json
            build/m254-debian-shell/${{ matrix.port }}/m251-extra.json
            build/m254-debian-shell/${{ matrix.port }}/m252-extra.json
            build/m254-debian-shell/${{ matrix.port }}/*.tsv
            build/m254-debian-shell/${{ matrix.port }}/*.log
            build/m255-debian-init/${{ matrix.port }}/source/manifest.json
            build/m255-debian-init/${{ matrix.port }}/m251-extra.json
            build/m255-debian-init/${{ matrix.port }}/m252-extra.json
            build/m255-debian-init/${{ matrix.port }}/m255-extra.json
            build/m255-debian-init/${{ matrix.port }}/*.tsv
            build/m255-debian-init/${{ matrix.port }}/*.log
            build/m256-debian-initctl/${{ matrix.port }}/source/manifest.json
            build/m256-debian-initctl/${{ matrix.port }}/m251-extra.json
            build/m256-debian-initctl/${{ matrix.port }}/m252-extra.json
            build/m256-debian-initctl/${{ matrix.port }}/m255-extra.json
            build/m256-debian-initctl/${{ matrix.port }}/m256-extra.json
            build/m256-debian-initctl/${{ matrix.port }}/*.tsv
            build/m256-debian-initctl/${{ matrix.port }}/*.log
            build/port-*/full/matrix-source/m252-batch.clean.log
            build/port-*/full/matrix-source/m252-batch.serial.log
            build/port-*/full/matrix-source/m254-shell.clean.log
            build/port-*/full/matrix-source/m254-shell.serial.log
            build/port-*/full/matrix-source/m255-init.clean.log
            build/port-*/full/matrix-source/m255-init.serial.log
            build/port-*/full/matrix-source/m256-initctl.clean.log
            build/port-*/full/matrix-source/m256-initctl.serial.log
            build/busybox-source-parity-x86/m252-batch.clean.log
            build/busybox-source-parity-x86/m252-batch.serial.log
            build/busybox-source-parity-x86/m254-shell.clean.log
            build/busybox-source-parity-x86/m254-shell.serial.log
            build/busybox-source-parity-x86/m255-init.clean.log
            build/busybox-source-parity-x86/m255-init.serial.log
            build/busybox-source-parity-x86/m256-initctl.clean.log
            build/busybox-source-parity-x86/m256-initctl.serial.log
