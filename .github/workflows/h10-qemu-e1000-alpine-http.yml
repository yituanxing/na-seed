name: NaSeed H10 real PCI E1000 Alpine BusyBox HTTP over lwIP

on:
  push:
    branches:
      - feat/na-hw-h0-pci-20261110
    paths:
      - '.github/workflows/h10-qemu-e1000-alpine-http.yml'
      - 'kernel/platform/x86_h10_e1000.*'
      - 'kernel/platform/x86_h1_ecam.*'
      - 'kernel/drivers/e1000/**'
      - 'kernel/drivers/core/pci_resources.*'
      - 'kernel/drivers/port/**'
      - 'kernel/init/main.c'
      - 'kernel/kernel.c'
      - 'kernel/boot_image.c'
      - 'ports/lwip/**'
      - 'ports/lwext4/**'
      - 'tests/h10-*.c'
      - 'scripts/*h10*.sh'
      - 'scripts/stage-h8-alpine-nvme.sh'
      - 'scripts/m223-http-server.py'
      - 'scripts/m223-http-host.sh'
      - 'scripts/build-lwext4-guest.sh'
      - 'scripts/run.sh'
      - 'limine-h10-e1000.conf'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h10-qemu-pci-e1000-original-alpine-http-${{ github.ref }}
  cancel-in-progress: false

jobs:
  h10-real-pci-e1000-original-alpine-http:
    name: QEMU PCI 82540EM -> lwIP DHCP TCP -> original Alpine wget host SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install C, signed Alpine staging, ext4, QEMU and OVMF
        timeout-minutes: 15
        run: |
          set -eu
          missing=''
          for spec in 'clang:clang' 'ld.lld:lld' 'cc:gcc' 'cmake:cmake' \
                      'readelf:binutils' 'cpio:cpio' 'mke2fs:e2fsprogs' \
                      'debugfs:e2fsprogs' 'sha256sum:coreutils' \
                      'curl:curl' 'tar:tar' 'gzip:gzip' 'openssl:openssl' \
                      'xorriso:xorriso' 'python3:python3' \
                      'qemu-system-x86_64:qemu-system-x86'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          if [ ! -s /usr/share/OVMF/OVMF_CODE_4M.fd ] &&
             [ ! -s /usr/share/OVMF/OVMF_CODE.fd ]; then
            missing="$missing ovmf"
          fi
          if [ -n "$missing" ]; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends $missing
          fi
      - name: Host E1000 descriptor/DMA regressions, H8 root acceptance and shell syntax
        timeout-minutes: 8
        run: |
          set -eu
          sh -n scripts/run.sh
          sh -n scripts/stage-h10-e1000-alpine.sh
          sh -n scripts/h10-guest-e1000-http.sh
          sh -n scripts/build-h10-e1000-iso.sh
          sh -n scripts/check-h10-e1000-qemu.sh
          sh -n scripts/check-h10-no-e1000-qemu.sh
          make hw-h10-host-check
      - name: Build isolated signed Alpine NVMe and E1000 QEMU-only UEFI boot
        timeout-minutes: 33
        run: |
          set -eu
          make hw-h10-iso
          readelf -h build/h10-qemu-only/kernel.elf | grep -q 'Machine:.*Advanced Micro Devices X86-64'
          (cd build/h10-qemu-only && sha256sum -c h10-media-before.sha256)
          sha256sum -c build/h10-qemu-only/h10-original-alpine-elfs.sha256
      - name: Genuine E1000 PCI DMA and lwIP DHCP TCP host-only random HTTP GET
        timeout-minutes: 8
        run: sh scripts/check-h10-e1000-qemu.sh
      - name: Negative genuine QEMU no-E1000 refuses signed Alpine network program
        timeout-minutes: 3
        run: sh scripts/check-h10-no-e1000-qemu.sh
      - name: Preserve independent guest, wire and host HTTP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h10-pci-e1000-original-alpine-wget-real-wire
          path: |
            build/h10-qemu-only/h10-qemu-uefi-serial.log
            build/h10-qemu-only/h10-qemu-uefi-clean.log
            build/h10-qemu-only/h10-no-e1000-uefi-serial.log
            build/h10-qemu-only/h10-no-e1000-uefi-clean.log
            build/h10-qemu-only/h10-wire.pcap
            build/h10-qemu-only/m223-first-host-http.log
          if-no-files-found: ignore
      - name: Preserve checksummed kernel, immutable Alpine root and official ELF identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h10-pci-e1000-original-alpine-media-provenance
          path: |
            build/h10-qemu-only/kernel.elf
            build/h10-qemu-only/h10-media-before.sha256
            build/h10-qemu-only/h10-original-alpine-elfs.sha256
            build/h10-qemu-only/naseed.iso
          if-no-files-found: ignore
