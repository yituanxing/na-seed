name: NaSeed M80/M81/M82 original Alpine programs, VFS and Make — native three ISA
on:
  pull_request:
    paths:
      - 'tests/m80-*'
      - 'tests/m81-*'
      - 'tests/m82-*'
      - 'scripts/m80-*'
      - 'scripts/m81-*'
      - 'scripts/probe-m80-batch.sh'
      - 'scripts/stage-m80-prebuilt.sh'
      - 'scripts/stage-alpine-prebuilt-overlay.sh'
      - 'scripts/prebuilt-profile-catalog.tsv'
      - 'scripts/check-prebuilt-profile-catalog.py'
      - 'scripts/native-qemu-target.sh'
      - 'scripts/probe-x86-busybox-parity.sh'
      - 'scripts/probe-riscv64-busybox-matrix.sh'
      - 'scripts/probe-aarch64-busybox-matrix.sh'
      - 'scripts/check-native-qemu-target.py'
      - 'rootfs/alpine/packages-m80-batch.txt'
      - 'kernel/**'
      - '.github/workflows/m80-batch.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  real-programs:
    name: original Alpine programs, FS and GNU Make / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate original three-ISA catalog and shared kernel boundaries
        run: |
          set -eu
          sh -n scripts/stage-alpine-prebuilt-overlay.sh scripts/stage-m80-prebuilt.sh scripts/probe-m80-batch.sh tests/m80-batch-run.sh tests/m81-fs-run.sh tests/m82-make-run.sh
          python3 scripts/check-three-isa-core.py
          python3 scripts/check-prebuilt-profile-catalog.py
          python3 scripts/check-native-qemu-target.py
      - name: Install genuine cross-tools and native QEMU
        timeout-minutes: 12
        run: |
          set -eu
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'clang:clang' 'ld.lld:lld' 'readelf:binutils' 'cpio:cpio' \
                      'mke2fs:e2fsprogs' 'debugfs:e2fsprogs' 'cmake:cmake' 'cc:gcc' \
                      'xorriso:xorriso' 'mformat:mtools' 'sgdisk:gdisk' \
                      'qemu-riscv64:qemu-user'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          case "${{ matrix.port }}" in
            amd64)
              command -v qemu-system-x86_64 >/dev/null || missing="$missing qemu-system-x86"
              test -f /usr/share/OVMF/OVMF_CODE_4M.fd || \
                test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf" ;;
            riscv64)
              command -v qemu-system-riscv64 >/dev/null || missing="$missing qemu-system-misc"
              test -f /usr/share/qemu-efi-riscv64/RISCV_VIRT_CODE.fd || missing="$missing qemu-efi-riscv64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
            arm64)
              command -v qemu-system-aarch64 >/dev/null || missing="$missing qemu-system-arm"
              test -f /usr/share/AAVMF/AAVMF_CODE.fd || missing="$missing qemu-efi-aarch64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
          esac
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
      - name: 'Genuine signed Alpine ELF batch: functional text, archive, SQL and rsync'
        timeout-minutes: 28
        run: sh scripts/probe-m80-batch.sh ${{ matrix.port }}
      - name: 'M81/M82: genuine Alpine programs and GNU Make on tmpfs, upstream RamFS and physical VirtIO-Blk ext4'
        timeout-minutes: 40
        run: NAS_M81_FS=1 sh scripts/probe-m80-batch.sh ${{ matrix.port }}
      - name: Preserve actual rootfs provenance and guest serial on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m80-m81-m82-batch-${{ matrix.port }}
          path: |
            build/external/m80-batch/${{ matrix.port }}/apk-install.log
            build/external/m80-batch/${{ matrix.port }}/m82-original-gnu-make.sha256
            build/external/m80-batch/${{ matrix.port }}/requested-packages.txt
            build/external/m80-batch/${{ matrix.port }}/rootfs.cpio
            build/external/m80-batch/${{ matrix.port }}/m81-physical-ext4.img
            build/external/m80-batch/${{ matrix.port }}/m81-ext4-persisted.txt
            build/external/m80-batch/${{ matrix.port }}/m82-ext4-persisted.txt
            build/external/m80-batch/${{ matrix.port }}/m82-ext4-make-output.txt
            build/busybox-source-parity-x86/m80-batch.clean.log
            build/busybox-source-parity-x86/m81-fs.clean.log
            build/port-riscv64/full/matrix-source/m80-batch.clean.log
            build/port-riscv64/full/matrix-source/m81-fs.clean.log
            build/port-aarch64/full/matrix-source/m80-batch.clean.log
            build/port-aarch64/full/matrix-source/m81-fs.clean.log
          if-no-files-found: ignore
