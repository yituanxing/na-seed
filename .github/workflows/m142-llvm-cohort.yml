name: NaSeed M142 nine signed Alpine LLVM21 and Clang ELFs (one x86 QEMU)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/m142-llvm-cohort.yml'
      - 'scripts/m142-llvm-cohort-cases.tsv'
      - 'scripts/probe-m142-llvm-cohort.sh'
      - 'scripts/m141-rootfs-copies.tsv'
      - 'scripts/stage-m141-prebuilt.sh'
      - 'tests/m142-llvm-cohort-run.sh'
      - 'tests/m141-toolchain-run.sh'
      - 'kernel/fs/**'
      - 'kernel/task/**'
      - 'kernel/mm/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  x86-original-llvm-cohort:
    name: Nine untouched signed Alpine LLVM21/Clang binary semantics
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
      - name: Verify signed source inventory and one-boot nine-program oracle
        run: |
          set -eu
          sh -n scripts/probe-m142-llvm-cohort.sh
          sh -n tests/m142-llvm-cohort-run.sh
          sh -n tests/m141-toolchain-run.sh
          test "$(awk -F '\t' '$1 !~ /^#/ && NF {n++} END {print n+0}' scripts/m142-llvm-cohort-cases.tsv)" -eq 1
          awk -F '\t' '$1=="tests/m142-llvm-cohort-run.sh" && $2==$1 {found++} END {exit found==1?0:1}' scripts/m141-rootfs-copies.tsv
          for elf in usr/bin/llvm21-tblgen usr/bin/llvm21-remarkutil usr/bin/llvm21-rc usr/bin/llvm21-reduce usr/bin/llvm21-lto usr/bin/llvm21-ar usr/bin/llvm21-strip usr/bin/llvm21-addr2line usr/bin/clang; do
            grep -Fxq "$elf" scripts/m141-original-elfs.txt
          done
          grep -Fq M142_SIGNED_LLVM_COHORT_PASS scripts/m142-llvm-cohort-cases.tsv
      - name: Install QEMU and official signed Alpine staging prerequisites
        timeout-minutes: 12
        run: |
          set -eu
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'clang:clang' 'ld.lld:lld' 'readelf:binutils' \
                      'cpio:cpio' 'xorriso:xorriso' 'mformat:mtools' \
                      'sgdisk:gdisk'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          command -v qemu-system-x86_64 >/dev/null || missing="$missing qemu-system-x86"
          test -f /usr/share/OVMF/OVMF_CODE_4M.fd || \
          test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf"
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
      - name: Prove nine original signed Alpine LLVM21/Clang ELF semantics
        timeout-minutes: 40
        run: sh scripts/probe-m142-llvm-cohort.sh
      - name: Preserve exact signed hashes and original-program QEMU serial
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m142-nine-original-llvm-clang-amd64-qemu
          path: |
            build/external/m141-batch/amd64/apk-install.log
            build/external/m141-batch/amd64/requested-packages.txt
            build/external/m141-batch/amd64/*.sha256
            build/busybox-source-parity-x86/m141-batch.clean.log
            build/busybox-source-parity-x86/m141-batch.serial.log
          if-no-files-found: ignore
