name: NaSeed three-ISA native TinyCC
on:
  # Genuine guest TinyCC/Make software builds remain fully testable on demand;
  # app-batch PRs run host-prebuilt binaries only, never build inside NaSeed.
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  native-tcc:
    name: original upstream TinyCC / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Guard original three-ISA QEMU routing without private maps
        run: python3 scripts/check-native-qemu-target.py
      - name: Install missing genuine cross compiler and native QEMU
        timeout-minutes: 9
        run: |
          set -eu
          missing=''
          for spec in 'git:git' 'gcc:gcc' 'make:make' 'readelf:binutils' \
                      'nm:binutils' 'sha256sum:coreutils' 'tar:tar' \
                      'clang:clang' 'ld.lld:lld' 'cpio:cpio' \
                      'xorriso:xorriso'; do
            binary=${spec%%:*}; package=${spec#*:}
            command -v "$binary" >/dev/null 2>&1 || missing="$missing $package"
          done
          case "${{ matrix.port }}" in
            amd64)
              command -v qemu-system-x86_64 >/dev/null || missing="$missing qemu-system-x86"
              test -f /usr/share/OVMF/OVMF_CODE_4M.fd || \
                test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf" ;;
            riscv64)
              command -v riscv64-linux-gnu-gcc >/dev/null || \
                missing="$missing gcc-riscv64-linux-gnu libc6-dev-riscv64-cross"
              command -v qemu-riscv64 >/dev/null || missing="$missing qemu-user"
              command -v qemu-system-riscv64 >/dev/null || missing="$missing qemu-system-misc"
              # The EFI virtio ROM is supplied by ipxe-qemu (Ubuntu package),
              # not qemu-system-data. Without it QEMU cannot boot the
              # native virtio disk even when the emulator is installed.
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu"
              command -v sgdisk >/dev/null || missing="$missing gdisk"
              command -v mformat >/dev/null || missing="$missing mtools"
              test -f /usr/share/qemu-efi-riscv64/RISCV_VIRT_CODE.fd || \
                missing="$missing qemu-efi-riscv64" ;;
            arm64)
              command -v aarch64-linux-gnu-gcc >/dev/null || \
                missing="$missing gcc-aarch64-linux-gnu libc6-dev-arm64-cross"
              command -v qemu-aarch64 >/dev/null || missing="$missing qemu-user"
              command -v qemu-system-aarch64 >/dev/null || missing="$missing qemu-system-arm"
              # The EFI virtio ROM is supplied by ipxe-qemu (Ubuntu package),
              # not qemu-system-data. Without it QEMU cannot boot the
              # native virtio disk even when the emulator is installed.
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu"
              command -v sgdisk >/dev/null || missing="$missing gdisk"
              command -v mformat >/dev/null || missing="$missing mtools"
              test -f /usr/share/AAVMF/AAVMF_CODE.fd || \
                missing="$missing qemu-efi-aarch64" ;;
          esac
          if [ -n "$missing" ]; then
            sh scripts/ci-ubuntu-mirror.sh
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get \
              -o Acquire::Retries=1 -o Acquire::http::Timeout=30 \
              install -y --no-install-recommends $missing
          fi
          echo '[M33] upstream GCC, GNU tools and headless QEMU ready'
      - name: Linux oracle and real native NaSeed QEMU TinyCC
        run: sh scripts/probe-m33-native-tcc.sh ${{ matrix.port }}
      - name: Cache SHA256-pinned GNU Make 4.4.1 source tarball
        uses: actions/cache@v4
        with:
          path: build/deps/external/make-4.4.1.tar.gz
          key: naseed-gnu-make-4.4.1-dd16fb1d67bfab79a72f5e8390735c49
      - name: Complete three-ISA original GNU Make + TinyCC + linked tmpfs ELF execution
        timeout-minutes: 9
        run: sh scripts/probe-m34-native-make.sh ${{ matrix.port }}
      - name: Original upstream AES project multi-object Make build and NIST test in NaSeed
        timeout-minutes: 8
        run: sh scripts/probe-m35-aes.sh ${{ matrix.port }}
      - name: Real zlib 1.3.1 ten-object build, deflate/inflate and dynamic tmpfs slab gate
        timeout-minutes: 9
        run: sh scripts/probe-m36-zlib.sh ${{ matrix.port }}
      - name: Upstream zlib native GNU Make -j2, stat, touch and selective relink
        timeout-minutes: 12
        run: sh scripts/probe-m37-incremental.sh ${{ matrix.port }}
      - name: Attach upstream build, native ELF and serial diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m33-native-tcc-${{ matrix.port }}
          path: |
            build/external/m33-tcc/${{ matrix.port }}/configure.log
            build/external/m33-tcc/${{ matrix.port }}/build.log
            build/external/m33-tcc/${{ matrix.port }}/linux-preprocess.log
            build/external/m33-tcc/${{ matrix.port }}/artifacts.sha256
            build/external/m33-tcc/${{ matrix.port }}/first.o
            build/external/m34-gnumake/${{ matrix.port }}/configure.log
            build/external/m34-gnumake/${{ matrix.port }}/build.log
            build/external/m34-gnumake/${{ matrix.port }}/linux-version.log
            build/external/m34-gnumake/${{ matrix.port }}/linux-generated-exec.log
            build/external/m34-gnumake/${{ matrix.port }}/native-hello
            build/external/m35-aes/${{ matrix.port }}/linux-nist.log
            build/external/m35-aes/${{ matrix.port }}/aes.o
            build/external/m35-aes/${{ matrix.port }}/aes-check
            build/external/m36-zlib/${{ matrix.port }}/linux-deflate.log
            build/external/m36-zlib/${{ matrix.port }}/zlib-check
            build/external/m36-zlib/${{ matrix.port }}/check.o
            build/busybox-source-parity-x86/m37-incremental.serial.log
            build/port-riscv64/full/matrix-source/m37-incremental.serial.log
            build/port-aarch64/full/matrix-source/m37-incremental.serial.log

            build/busybox-source-parity-x86/m36-*.serial.log
            build/port-riscv64/full/matrix-source/m36-*.serial.log
            build/port-aarch64/full/matrix-source/m36-*.serial.log
            build/busybox-source-parity-x86/m35-*.serial.log
            build/port-riscv64/full/matrix-source/m35-*.serial.log
            build/port-aarch64/full/matrix-source/m35-*.serial.log
            build/busybox-source-parity-x86/m34-*.serial.log
            build/port-riscv64/full/matrix-source/m34-*.serial.log
            build/port-aarch64/full/matrix-source/m34-*.serial.log
            build/busybox-source-parity-x86/tcc-*.serial.log
            build/port-riscv64/full/matrix-source/tcc-*.serial.log
            build/port-aarch64/full/matrix-source/tcc-*.serial.log
          if-no-files-found: ignore
