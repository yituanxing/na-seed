name: NaSeed M54 native integrated developer workstation diagnostics
on:
  workflow_dispatch:
jobs:
  dev:
    name: Original Vim/Git/GCC/Make/Python / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Install headless QEMU and native build toolchain
        timeout-minutes: 12
        run: |
          set -eu
          sh scripts/ci-install-signed-alpine-qemu-deps.sh ${{ matrix.port }} --explicit-tools clang:clang ld.lld:lld readelf:binutils cpio:cpio xorriso:xorriso mformat:mtools sgdisk:gdisk qemu-riscv64:qemu-user
      - name: Build and run the entire native developer workflow in NaSeed
        timeout-minutes: 47
        run: sh scripts/probe-m54-dev.sh ${{ matrix.port }}
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m54-dev-${{ matrix.port }}
          path: |
            build/external/m54-dev/${{ matrix.port }}/apk-install.log
            build/external/m54-dev/${{ matrix.port }}/requested-packages.txt
            build/busybox-source-parity-x86/m54-dev.clean.log
            build/port-riscv64/full/matrix-source/m54-dev.clean.log
            build/port-aarch64/full/matrix-source/m54-dev.clean.log
          if-no-files-found: ignore
