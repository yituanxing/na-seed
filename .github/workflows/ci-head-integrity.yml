name: NaSeed exact PR head checkout integrity
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/check-ci-checkout-head.py'
      - 'scripts/check-three-isa-core.py'
      - 'scripts/check-prebuilt-profile-catalog.py'
      - 'scripts/check-native-qemu-target.py'
      - 'scripts/probe-alpine-workload.sh'
      - 'scripts/native-alpine-matrix.tsv'
      - 'scripts/check-native-alpine-matrix.py'
      - 'scripts/probe-alpine-batch.sh'
      - 'scripts/host-configure-alpine-fixtures.sh'
      - 'scripts/stage-alpine-prebuilt-overlay.sh'
      - 'scripts/probe-alpine-signed-batch.sh'
      - 'scripts/stage-alpine-signed-batch.sh'
      - 'scripts/stage-alpine-basic.sh'
      - 'scripts/stage-alpine-network.sh'
      - 'scripts/probe-m*-network*.sh'
      - 'scripts/probe-m143-http-wire-smoke.sh'
      - 'scripts/probe-m144-server-cohort.sh'
      - 'scripts/probe-m145-service-multiarch.sh'
      - 'scripts/stage-alpine-prebuilt-overlay.sh'
      - 'scripts/prebuilt-profile-catalog.tsv'
      - 'scripts/*-rootfs-copies.tsv'
      - 'rootfs/alpine/packages-*.txt'
      - 'scripts/ci-install-signed-alpine-qemu-deps.sh'
      - 'scripts/check-ci-alpine-deps.py'
      - 'kernel/fs/**'
      - 'kernel/lib/endian.h'
      - 'ports/lwip/socket_port.c'
      - 'scripts/check-file-readiness.sh'
      - 'kernel/arch/**'
      - 'kernel/platform/**'
      - 'kernel/time/**'
      - 'scripts/test-platform-contracts.c'
      - 'kernel/mm/**'
      - 'kernel/task/**'
      - 'scripts/check-netlink-providers.sh'
      - 'scripts/test-netlink-*.c'
      - 'scripts/check-host-fixture.sh'
      - 'scripts/test-pt-directory.c'
      - 'scripts/acceptance/**'
      - 'scripts/m25[0124]-debian-uart.py'
      - 'tests/m25[0124]-debian-*-host.py'
      - 'scripts/probe-m*-batch.sh'
      - 'scripts/probe-native-desktop.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checkout-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check every PR job uses submitted source, never synthetic merge
        run: python3 scripts/check-ci-checkout-head.py

      - name: Validate M157 M158 M159 M163 M165 distinct signed ELF case and marker contracts
        run: python3 scripts/check-signed-elf-batch-inventory.py
      - name: Exercise original PATH_MAX, live Dentry depth and namespace syscall invariants
        run: sh scripts/check-path-contract-host.sh
      - name: Check M204 genuine post-reopen checkpoint eligibility, origin and SHA negative cases
        run: python3 scripts/test-m204-checkpoint.py -q
      - name: Verify the sole M167-M170 desktop host evidence chain
        run: sh scripts/check-m170-desktop.sh
      - name: Verify consolidated peripheral profile syntax and strict host contracts
        run: |
          bash -n scripts/acceptance/h0-h6-pci-nvme.sh
          bash -n scripts/acceptance/h7-h15-hardware.sh
          python3 scripts/test-m203-fbcon-oracle.py
          python3 -B tests/m255-debian-init-host.py

      - name: Validate canonical signed APK profile manifests
        run: |
          python3 scripts/check-prebuilt-profile-catalog.py
          python3 scripts/check-native-alpine-matrix.py
          sh -n scripts/probe-alpine-workload.sh

      - name: Check shared Alpine dependency installer without apt or network
        run: python3 scripts/check-ci-alpine-deps.py

      - name: Check sole OpenFile readiness interface and existing FD host regressions
        run: sh scripts/check-file-readiness.sh

      - name: Exercise actual RV64 and ARM64 directory paths, including allocation rollback
        run: sh scripts/check-host-fixture.sh pt-directory

      - name: Verify shared native batch marker checker and every migrated manifest
        run: python3 scripts/acceptance/test-batch-markers.py

      - name: Verify shared ELF admission and hashing gates
        run: |
          python3 scripts/acceptance/test-elf-admission.py
          python3 scripts/acceptance/test-host-fixture-dispatch.py

      - name: Run all four real kernel-buffer Netlink protocol regressions
        run: sh scripts/check-netlink-providers.sh

      - name: Check shared USB fixture and negative-observer shell entry points
        run: sh scripts/acceptance/check-shared-usb-host.sh
      - name: Run four original local host-only acceptance cohorts
        run: |
          sh scripts/acceptance/run-local-alpine-cohort.sh m235 --host-only
          sh scripts/acceptance/run-local-alpine-cohort.sh m236 --host-only
          sh scripts/acceptance/run-local-alpine-cohort.sh m237 --host-only
          sh scripts/acceptance/run-local-alpine-cohort.sh m238 --host-only

      - name: Verify common PCI, VirtIO class and MM policy contracts
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -I third_party/unikraft/include -I ports/unikraft/include scripts/test-platform-contracts.c -o /tmp/naseed-platform-none
          /tmp/naseed-platform-none
          cc -std=c11 -O2 -Wall -Wextra -Werror -I third_party/unikraft/include -I ports/unikraft/include -DNAS_ENABLE_VIRTIO_BLK=1 -DNAS_ENABLE_VIRTIO_NET=1 -DNAS_ENABLE_VIRTIO_INPUT=1 -DNAS_ENABLE_VIRTIO_GPU=1 -DNAS_ENABLE_VIRTIO_BLK_ASYNC=1 scripts/test-platform-contracts.c -o /tmp/naseed-platform-all
          /tmp/naseed-platform-all

      - name: Verify Debian UART profiles and shared transport contracts without native QEMU
        run: |
          python3 -B tests/m250-debian-interactive-host.py
          python3 -B tests/m251-debian-uart-host.py
          python3 -B tests/m252-debian-uart-host.py

      - name: Verify complete native Linux syscall decoder maps
        run: |
          for flags in '' '-DNAS_TEST_RV64' '-DNAS_TEST_ARM64'; do
            cc -std=c11 -O2 -Wall -Wextra -Werror $flags scripts/test-linux-syscall-map.c -o /tmp/naseed-syscall-map
            /tmp/naseed-syscall-map
          done
