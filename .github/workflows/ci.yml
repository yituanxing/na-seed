name: NaSeed userspace regressions
on:
  push:
    branches: [main]
  pull_request:

# Collapse superseded PR commits into a single expensive QEMU suite. Keep
# pushed main regressions independent; only pull-request runs are canceled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang lld xorriso qemu-system-x86 ovmf musl-tools binutils cpio
      - name: Preflight audit, shell syntax, kernel compile and link
        run: sh scripts/preflight.sh
      - name: Cache verified static GNU Bash
        uses: actions/cache@v4
        with:
          path: build/userspace/bash
          key: naseed-musl-bash-5.2.37-${{ runner.os }}-${{ hashFiles('scripts/build-bash.sh') }}
      - name: Validate a restored Bash binary without compiling it
        run: |
          if [ -f build/userspace/bash ]; then
            readelf -h build/userspace/bash | grep -q 'EXEC (Executable file)'
            if readelf -l build/userspace/bash | grep -q INTERP; then exit 1; fi
            test "$(build/userspace/bash --noprofile --norc -c 'echo hello')" = hello
            echo '[CACHE] restored static Bash verified; no source rebuild'
          fi
      - name: Build and boot real kernel
        run: make smoke
      - name: Build authentic static Bash and probe actual QEMU behavior
        run: BASH_REQUIRE_PASS=1 make bash-probe
      - name: Probe official Debian prebuilt static Bash and BusyBox
        run: DEBIAN_REQUIRE_PASS=1 make debian-probe
      - name: Stage official Alpine prebuilt dynamic ELF and musl runtime
        run: make alpine-fetch
      - name: Diagnose real BusyBox producer early close and pipe lifecycle
        run: make ash-lifecycle-probe
      - name: Unmodified BusyBox bare PATH applets through real CPIO symlinks
        run: make ash-symlinks-probe
      - name: Authentic BusyBox shell scratch files and read-only CPIO boundary
        run: make ash-tmp-probe
      - name: BusyBox directory creation, removal, and open inode lifecycle
        run: make ash-tree-probe
      - name: Real Alpine BusyBox cp/mv, rename atomicity, and open inode lifecycle
        run: make ash-rename-probe
      - name: Real BusyBox FD inheritance, dup offsets and last-close lifecycle
        run: make ash-fds-probe
      - name: Real BusyBox pathname traversal, symlink and dotdot semantics
        run: make ash-paths-probe
      - name: Direct ring3 openat ABI flags and readonly CPIO error semantics
        run: make path-abi-probe
      - name: Pipe backend reuse and cascading original BusyBox pipelines
        run: make ash-pipe-backend-probe
      - name: Limine archive-only initramfs boot, default and explicit authentic BusyBox ELF
        run: make boot-handoff-probe
      - name: Real BusyBox ash pipeline pipe/pipe2 and EOF under QEMU
        run: make ash-pipes-probe
      - name: Boot genuine Alpine dynamic BusyBox and report ABI blockers
        run: ALPINE_REQUIRE_PASS=1 make alpine-probe
      - name: Verify multiple Alpine BusyBox applets via Limine cmdline
        run: make alpine-argv-probe
      - name: Real archive-backed Alpine BusyBox ls and cat under QEMU
        run: make alpine-fs-probe
      - name: Real Alpine BusyBox ELF loaded entirely from CPIO
        run: make alpine-archive-probe
      - name: Select between two authentic CPIO executables and reject invalid paths
        run: make alpine-selector-probe
      - name: Accept real BusyBox ash cwd/FD/readiness and diagnose process blockers
        run: make ash-diagnostic
      - name: Unmodified Alpine BusyBox ash execve CPIO process replacement
        run: make ash-execve-probe
      - name: Real BusyBox ash fork, execve, wait4 and parent continuation
        run: make ash-fork-probe
      - name: Attach serial log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: naseed-serial
          path: |
            build/serial.log
            build/bash-serial.log
            build/debian-*-serial.log
            build/alpine-serial.log
            build/alpine-argv-*-serial.log
            build/alpine-fs-*-serial.log
            build/alpine-archive-*-serial.log
            build/alpine-selector-*-serial.log
            build/ash-diag-*-serial.log
            build/ash-exec-*-serial.log
            build/ash-fork-*-serial.log
            build/ash-pipe-*-serial.log
            build/ash-life-*-serial.log
            build/ash-link-*-serial.log
            build/ash-tmp-*-serial.log
            build/ash-tree-*-serial.log
            build/ash-rename-*-serial.log
            build/ash-fd-*-serial.log
            build/ash-path-*-serial.log
            build/ash-pipe-backend-*-serial.log
            build/boot-handoff-*-serial.log
            build/path-abi-serial.log
          if-no-files-found: ignore
