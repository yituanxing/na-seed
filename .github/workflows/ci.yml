name: NaSeed userspace regressions
on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang lld xorriso qemu-system-x86 ovmf musl-tools binutils cpio
      - name: Preflight audit, shell syntax, kernel compile and link
        run: sh scripts/preflight.sh
      - name: Cache verified static GNU Bash
        uses: actions/cache@v4
        with:
          path: build/userspace/bash
          key: naseed-musl-bash-5.2.37-${{ runner.os }}-${{ hashFiles('scripts/build-bash.sh') }}
      - name: Validate a restored Bash binary without compiling it
        run: |
          if [ -f build/userspace/bash ]; then
            readelf -h build/userspace/bash | grep -q 'EXEC (Executable file)'
            if readelf -l build/userspace/bash | grep -q INTERP; then exit 1; fi
            test "$(build/userspace/bash --noprofile --norc -c 'echo hello')" = hello
            echo '[CACHE] restored static Bash verified; no source rebuild'
          fi
      - name: Build and boot real kernel
        run: make smoke
      - name: Build authentic static Bash and probe actual QEMU behavior
        run: BASH_REQUIRE_PASS=1 make bash-probe
      - name: Probe official Debian prebuilt static Bash and BusyBox
        run: DEBIAN_REQUIRE_PASS=1 make debian-probe
      - name: Stage official Alpine prebuilt dynamic ELF and musl runtime
        run: make alpine-fetch
      - name: Boot genuine Alpine dynamic BusyBox and report ABI blockers
        run: ALPINE_REQUIRE_PASS=1 make alpine-probe
      - name: Verify multiple Alpine BusyBox applets via Limine cmdline
        run: make alpine-argv-probe
      - name: Real archive-backed Alpine BusyBox ls and cat under QEMU
        run: make alpine-fs-probe
      - name: Real Alpine BusyBox ELF loaded entirely from CPIO
        run: make alpine-archive-probe
      - name: Select between two authentic CPIO executables and reject invalid paths
        run: make alpine-selector-probe
      - name: Accept real BusyBox ash cwd/FD/readiness and diagnose process blockers
        run: make ash-diagnostic
      - name: Attach serial log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: naseed-serial
          path: |
            build/serial.log
            build/bash-serial.log
            build/debian-*-serial.log
            build/alpine-serial.log
            build/alpine-argv-*-serial.log
            build/alpine-fs-*-serial.log
            build/alpine-archive-*-serial.log
            build/alpine-selector-*-serial.log
            build/ash-diag-*-serial.log
          if-no-files-found: ignore
