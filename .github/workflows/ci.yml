name: NaSeed userspace regressions
on:
  push:
    branches: [main]
  pull_request:

# Collapse superseded PR commits into a single expensive QEMU suite. Keep
# pushed main regressions independent; only pull-request runs are canceled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang lld xorriso qemu-system-x86 ovmf musl-tools binutils cpio
      - name: Shared ELF PT_LOAD loader regression (x86/RV64/ARM64)
        run: cc -std=c11 -Wall -Wextra -Werror scripts/test-elf-segments.c kernel/task/elf_segments.c -o /tmp/naseed-segments-test && /tmp/naseed-segments-test
      - name: Shared ELF64 structural regression (x86/RV64/ARM64)
        run: cc -std=c11 -Wall -Wextra -Werror scripts/test-elf-format.c -o /tmp/naseed-elf-test && /tmp/naseed-elf-test
      - name: Linux syscall semantic decoder regression
        run: cc -std=c11 -Wall -Wextra -Werror scripts/test-syscall-abi.c -o /tmp/naseed-syscall-test && /tmp/naseed-syscall-test
      - name: Anonymous VM range reuse, split, fork ownership and bounded capacity
        run: cc -std=c11 -Wall -Wextra -Werror scripts/test-anon-regions.c kernel/mm/anon_regions.c -o /tmp/naseed-anon && /tmp/naseed-anon
      - name: Linux anonymous mmap ABI ignored fd including x86 zero-extended -1
        run: cc -std=c11 -Wall -Wextra -Werror scripts/test-mmap-abi.c -o /tmp/naseed-mmap-abi && /tmp/naseed-mmap-abi
      - name: Linux mmap/mprotect permission policy regression
        run: cc -std=c11 -Wall -Wextra -Werror scripts/test-vm-prot.c -o /tmp/naseed-vm-prot && /tmp/naseed-vm-prot
      - name: Linux open flags ABI regression (including ARM64 values)
        run: cc -std=c11 -Wall -Wextra -Werror scripts/test-fcntl-abi.c -o /tmp/naseed-fcntl-abi && /tmp/naseed-fcntl-abi
      - name: Verify one full-kernel core TU manifest across ISAs
        run: sh scripts/check-full-kernel-sources.sh
      - name: Verify native x86-64 stat layout
        run: cc -std=c11 -Wall -Wextra -Werror -c scripts/check-linux-stat.c -o /tmp/naseed-stat.o
      - name: Verify 4 original pinned Alpine dynamic native package digests
        run: sh scripts/check-alpine-native-fixtures.sh
      - name: Verify one Debian BusyBox fixture for all architectures
        run: sh scripts/check-busybox-fixtures.sh
      - name: Verify real-QEMU marker monitor fails closed
        run: sh scripts/test-port-boot-monitor.sh
      - name: Verify generic64 fork+child-TID and unsupported clone forms
        run: cc -std=c11 -Wall -Wextra -Werror scripts/test-generic64-clone.c -o /tmp/naseed-generic64-clone && /tmp/naseed-generic64-clone
      - name: Preflight audit, shell syntax, kernel compile and link
        run: sh scripts/preflight.sh
      - name: Cache verified static GNU Bash
        uses: actions/cache@v4
        with:
          path: build/userspace/bash
          key: naseed-musl-bash-5.2.37-${{ runner.os }}-${{ hashFiles('scripts/build-bash.sh') }}
      - name: Validate a restored Bash binary without compiling it
        run: |
          if [ -f build/userspace/bash ]; then
            readelf -h build/userspace/bash | grep -q 'EXEC (Executable file)'
            if readelf -l build/userspace/bash | grep -q INTERP; then exit 1; fi
            test "$(build/userspace/bash --noprofile --norc -c 'echo hello')" = hello
            echo '[CACHE] restored static Bash verified; no source rebuild'
          fi
      - name: Build and boot real kernel
        run: make smoke
      - name: Build authentic static Bash and probe actual QEMU behavior
        run: BASH_REQUIRE_PASS=1 make bash-probe
      - name: Probe official Debian prebuilt static Bash and BusyBox
        run: DEBIAN_REQUIRE_PASS=1 make debian-probe
      - name: x86 Debian static BusyBox — same 17 cases as RV64
        run: sh scripts/probe-x86-busybox-parity.sh
      - name: Stage official Alpine prebuilt dynamic ELF and musl runtime
        run: make alpine-fetch
      - name: Diagnose real BusyBox producer early close and pipe lifecycle
        run: make ash-lifecycle-probe
      - name: Unmodified BusyBox bare PATH applets through real CPIO symlinks
        run: make ash-symlinks-probe
      - name: Authentic BusyBox shell scratch files and read-only CPIO boundary
        run: make ash-tmp-probe
      - name: BusyBox directory creation, removal, and open inode lifecycle
        run: make ash-tree-probe
      - name: Real Alpine BusyBox cp/mv, rename atomicity, and open inode lifecycle
        run: make ash-rename-probe
      - name: Real BusyBox FD inheritance, dup offsets and last-close lifecycle
        run: make ash-fds-probe
      - name: Real BusyBox pathname traversal, symlink and dotdot semantics
        run: make ash-paths-probe
      - name: Direct ring3 openat ABI flags and readonly CPIO error semantics
        run: make path-abi-probe
      - name: Pipe backend reuse and cascading original BusyBox pipelines
        run: make ash-pipe-backend-probe
      - name: Limine archive-only initramfs boot, default and explicit authentic BusyBox ELF
        run: make boot-handoff-probe
      - name: Repeated real BusyBox fork, wait, tmpfs tombstone, pipe and SIGPIPE lifecycle
        run: make ash-resources-probe
      - name: Native execve of real CPIO shebang scripts and BusyBox shell workflows
        run: make shebang-abi-probe
      - name: Real BusyBox ash pipeline pipe/pipe2 and EOF under QEMU
        run: make ash-pipes-probe
      - name: Boot genuine Alpine dynamic BusyBox and report ABI blockers
        run: ALPINE_REQUIRE_PASS=1 make alpine-probe
      - name: Verify multiple Alpine BusyBox applets via Limine cmdline
        run: make alpine-argv-probe
      - name: Real archive-backed Alpine BusyBox ls and cat under QEMU
        run: make alpine-fs-probe
      - name: Real Alpine BusyBox ELF loaded entirely from CPIO
        run: make alpine-archive-probe
      - name: Select between two authentic CPIO executables and reject invalid paths
        run: make alpine-selector-probe
      - name: Accept real BusyBox ash cwd/FD/readiness and diagnose process blockers
        run: make ash-diagnostic
      - name: Unmodified Alpine BusyBox ash execve CPIO process replacement
        run: make ash-execve-probe
      - name: Real BusyBox ash fork, execve, wait4 and parent continuation
        run: make ash-fork-probe
      - name: Attach serial log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: naseed-serial
          path: |
            build/serial.log
            build/bash-serial.log
            build/debian-*-serial.log
            build/busybox-parity-x86/*.serial.log
            build/alpine-serial.log
            build/alpine-argv-*-serial.log
            build/alpine-fs-*-serial.log
            build/alpine-archive-*-serial.log
            build/alpine-selector-*-serial.log
            build/ash-diag-*-serial.log
            build/ash-exec-*-serial.log
            build/ash-fork-*-serial.log
            build/ash-pipe-*-serial.log
            build/ash-life-*-serial.log
            build/ash-link-*-serial.log
            build/ash-tmp-*-serial.log
            build/ash-tree-*-serial.log
            build/ash-rename-*-serial.log
            build/ash-fd-*-serial.log
            build/ash-path-*-serial.log
            build/ash-pipe-backend-*-serial.log
            build/boot-handoff-*-serial.log
            build/ash-resource-*-serial.log
            build/ash-shebang-*-serial.log
            build/path-abi-serial.log
          if-no-files-found: ignore
  riscv64_m0:
    name: RISC-V real Limine/OpenSBI boot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install cross-build and UEFI/QEMU tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang lld binutils mtools gdisk cpio qemu-user \
            qemu-system-misc qemu-efi-riscv64
      - name: Shared ELF PT_LOAD loader host regression
        run: cc -std=c11 -Wall -Wextra -Werror scripts/test-elf-segments.c kernel/task/elf_segments.c -o /tmp/naseed-segments-test && /tmp/naseed-segments-test
      - name: Verify reused ELF64 validator
        run: cc -std=c11 -Wall -Wextra -Werror scripts/test-elf-format.c -o /tmp/naseed-elf-test && /tmp/naseed-elf-test
      - name: Verify exact generic64 fork+child-TID clone decoder
        run: cc -std=c11 -Wall -Wextra -Werror scripts/test-generic64-clone.c -o /tmp/naseed-generic64-clone && /tmp/naseed-generic64-clone
      - name: Verify asm-generic 64-bit stat layout (RV64)
        run: clang --target=riscv64-unknown-elf -march=rv64imac -mabi=lp64 -std=c11 -Wall -Wextra -Werror -ffreestanding -fsyntax-only scripts/check-linux-stat.c
      - name: Validate asm-generic syscall decoder with RV64 Clang
        run: clang --target=riscv64-unknown-elf -march=rv64imac -mabi=lp64 -std=c11 -Wall -Wextra -Werror -ffreestanding -fsyntax-only scripts/check-linux-syscalls.c
      - name: Compile the entire shared kernel source set for RV64
        run: make ARCH=riscv64 build/deps/limine.h && ARCH=riscv64 sh scripts/check-shared-kernel-build.sh
      - name: Compile and boot RV64 full shared kernel (real ELF + common syscall)
        run: sh scripts/probe-riscv64-full.sh
      - name: Compare actual amd64/RV64 BusyBox applet configuration
        run: sh scripts/compare-busybox-applets.sh
      - name: Execute official RV64 Debian static BusyBox via full shared kernel
        run: sh scripts/probe-riscv64-busybox.sh
      - name: Verify native RV64 BusyBox command and CPIO filesystem matrix
        run: sh scripts/probe-riscv64-busybox-matrix.sh
      - name: Compile and boot genuine RV64 M0 kernel
        run: sh scripts/probe-riscv64-m0.sh
      - name: Native Alpine RV64 dynamic BusyBox seven-case parity (SHA256 pinned)
        run: sh scripts/probe-alpine-native-matrix.sh riscv64
      - name: Attach riscv64 boot console on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: naseed-riscv64-m0
          path: |
            build/port-riscv64/serial.log
            build/port-riscv64/full/serial.log
            build/port-riscv64/full/matrix/*.serial.log
            build/port-riscv64/full/applet-parity/*
          if-no-files-found: ignore
  aarch64_m0:
    name: AArch64 real UEFI/Limine boot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install AArch64 UEFI/QEMU and cross-compiler tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang lld binutils mtools gdisk \
            qemu-system-arm qemu-efi-aarch64
      - name: Verify asm-generic 64-bit stat layout (ARM64)
        run: clang --target=aarch64-none-elf -march=armv8-a -std=c11 -Wall -Wextra -Werror -ffreestanding -fsyntax-only scripts/check-linux-stat.c
      - name: Validate asm-generic syscall decoder with ARM64 Clang
        run: clang --target=aarch64-none-elf -march=armv8-a -std=c11 -Wall -Wextra -Werror -ffreestanding -fsyntax-only scripts/check-linux-syscalls.c
      - name: Compile the entire shared kernel source set for AArch64
        run: make ARCH=aarch64 build/deps/limine.h && ARCH=aarch64 sh scripts/check-shared-kernel-build.sh
      - name: Compile and QEMU-boot genuine AArch64 M0 kernel
        run: sh scripts/probe-aarch64-m0.sh
      - name: Boot complete shared Task/ELF/FS/syscall kernel in real AArch64 EL0
        run: sh scripts/probe-aarch64-full.sh
      - name: Attach aarch64 boot diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: naseed-aarch64-m0
          path: |
            build/port-aarch64/serial.log
            build/port-aarch64/full/serial.log
          if-no-files-found: ignore

  source_busybox:
    name: Controlled source BusyBox / ${{ matrix.port }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Install native cross toolchain and QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y make gcc binutils curl bzip2 xorriso \
            clang lld cpio mtools gdisk qemu-user
          case "${{ matrix.port }}" in
            amd64)
              sudo apt-get install -y qemu-system-x86 ovmf ;;
            riscv64)
              sudo apt-get install -y gcc-riscv64-linux-gnu libc6-dev-riscv64-cross \
                qemu-system-misc qemu-efi-riscv64 ;;
            arm64)
              sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross \
                qemu-system-arm qemu-efi-aarch64 ;;
          esac
      - name: Local Kconfig, fixture and shared-harness preflight
        run: sh scripts/check-source-busybox.sh
      - name: Cache SHA256-pinned upstream BusyBox source tarball
        uses: actions/cache@v4
        with:
          path: build/deps/source-busybox/busybox-1.37.0.tar.bz2
          key: naseed-source-busybox-1.37.0-3311dff32e746499
      - name: Build original BusyBox from one SHA256-pinned source and Kconfig
        run: sh scripts/build-source-busybox.sh ${{ matrix.port }}
      - name: Execute seven full-kernel source workloads incl. original static ELF VM/fork stress
        run: sh scripts/probe-source-busybox.sh ${{ matrix.port }}
      - name: Upload native source BusyBox/serial evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: naseed-source-busybox-${{ matrix.port }}
          path: |
            build/source-busybox/${{ matrix.port }}/verified.config
            build/source-busybox/${{ matrix.port }}/artifacts.sha256
            build/busybox-source-parity-x86/*.serial.log
            build/port-riscv64/full/matrix-source/*.serial.log
            build/port-aarch64/full/matrix-source/*.serial.log
          if-no-files-found: ignore
