name: NaSeed userspace regressions
on:
  push:
    branches: [main]
    # Only pure documentation / completed one-off cleanup edits skip the
    # heavyweight main QEMU suite. Kernel, scripts, test fixtures, boot
    # configs, Makefile and CI changes continue to trigger it.
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/prune-historical-branches.yml'
      - 'scripts/prune-merged-branches.sh'
  pull_request:
    # A Lua-only source/test update uses the focused three-ISA Lua workflow.
    # Shared boot-harness or kernel changes still run the full BusyBox gates.
    paths-ignore:
      - 'docs/**'
      - 'scripts/build-external-lua.sh'
      - 'scripts/stage-external-lua-rootfs.sh'
      - 'scripts/probe-external-lua.sh'
      - 'scripts/lua-native-cases.tsv'
      - 'tests/lua-*.lua'
      - '.github/workflows/lua.yml'
      - 'scripts/build-external-tcc.sh'
      - 'scripts/stage-external-tcc-rootfs.sh'
      - 'scripts/probe-external-tcc.sh'
      - 'scripts/tcc-native-cases.tsv'
      - 'tests/tcc-first.c'
      - '.github/workflows/tcc.yml'
      - 'scripts/build-external-nano.sh'
      - 'scripts/stage-external-nano-rootfs.sh'
      - 'scripts/probe-external-nano.sh'
      - 'scripts/nano-pty-oracle.py'
      - 'scripts/nano-serial-check.py'
      - 'tests/nano-native-init.c'
      - 'tests/nano-note.txt'
      - '.github/workflows/nano.yml'
      - 'scripts/build-external-2048.sh'
      - 'scripts/stage-external-2048-rootfs.sh'
      - 'scripts/probe-external-2048.sh'
      - 'scripts/2048-pty-oracle.py'
      - 'scripts/2048-serial-check.py'
      - 'tests/2048-native-init.c'
      - '.github/workflows/game-2048.yml'
      - 'scripts/build-external-gnumake.sh'
      - 'scripts/stage-external-gnumake-rootfs.sh'
      - 'scripts/probe-external-gnumake.sh'
      - 'scripts/gnumake-serial-check.py'
      - 'tests/gnumake-native-init.c'
      - 'tests/gnumake-real.mk'
      - '.github/workflows/gnumake.yml'
      # One dedicated 3-ISA focused Make/TinyCC matrix owns these paths.
      # Full main-branch regression still runs after the accepted squash.
      - 'scripts/build-m33-native-tcc.sh'
      - 'scripts/stage-m33-native-tcc-rootfs.sh'
      - 'scripts/m33-native-tcc-cases.tsv'
      - 'scripts/probe-m33-native-tcc.sh'
      - 'scripts/build-m34-native-gnumake.sh'
      - 'scripts/stage-m34-native-make-rootfs.sh'
      - 'scripts/m34-native-make-cases.tsv'
      - 'scripts/probe-m34-native-make.sh'
      - 'tests/m34-portable-hello.c'
      - 'tests/m34-native.mk'
      - '.github/workflows/m33-native-tcc.yml'

# Collapse superseded PR commits into a single expensive QEMU suite. Keep
# pushed main regressions independent; only pull-request runs are canceled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# GitHub runner already supplies most build tools. QEMU's suggested GUI,
# SPICE and multimedia stack are unnecessary for the strictly headless
# serial/UEFI regressions. Suppress recommends on all seven existing
# acceptance shards; do not remove any of the actual tests or ISAs.
jobs:
  # Preserve all seven known-good QEMU tests on the previously validated
  # Ubuntu 24.04 image. On M61, ubuntu-latest switched to 26.04 and
  # legacy QEMU startup/timeout behavior regressed (unrelated to C rebuild).
  # Requalify 26.04 with full native QEMU before migrating this gate.
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install dependencies
        run: |
          sh scripts/ci-ubuntu-mirror.sh
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
          sudo apt-get install -y --no-install-recommends clang lld xorriso qemu-system-x86 ovmf musl-tools binutils cpio
      - name: Boot-seeded ChaCha20 known-answer and getrandom ABI regression
        run: cc -std=c11 -Wall -Wextra -Werror -I kernel scripts/test-random.c kernel/random.c -o /tmp/naseed-random-test && /tmp/naseed-random-test
      - name: M64 real wait-owner reset and per-thread isolation regression
        run: cc -std=c11 -Wall -Wextra -Werror -ffunction-sections -fdata-sections -Wl,--gc-sections -I kernel scripts/test-task-wait-owner.c kernel/task/wait.c -o /tmp/naseed-task-wait && /tmp/naseed-task-wait
      - name: M63 real tmpfs inode-dentry and hardlink lifetime regression
        run: cc -std=c11 -Wall -Wextra -Werror -I kernel scripts/test-tmp-namespace.c kernel/tmpfs.c kernel/fs/tmp_namespace.c -o /tmp/naseed-tmp-namespace && /tmp/naseed-tmp-namespace
      - name: M108 indexed tmpfs namespace large-directory and inode-recycle regression
        run: sh scripts/check-m108-tmp-index.sh
      - name: Shared scalable CPIO archive index regression (>1200 files)
        run: sh scripts/check-bootfs-scale.sh
      - name: Page-granularity shared usercopy regression (cross-page, RX, read-only, atomic failures)
        run: cc -std=c11 -Wall -Wextra -Werror -fno-builtin -I kernel scripts/test-usercopy-pages.c kernel/mm/usercopy.c kernel/lib/string.c -o /tmp/naseed-usercopy-pages && /tmp/naseed-usercopy-pages
      - name: M106 real filesystem syscall usercopy and pipe/socket transaction regression
        run: sh scripts/check-m106-usercopy-syscalls.sh
      - name: NAS-A013 Linux PTY oracle and real NaSeed TTY readv/VMIN/EOF contract
        run: sh scripts/check-a013-linux-tty-vectors.sh
      - name: M107 Path-owned AF_UNIX inode namespace, SCM_RIGHTS and Linux ABI oracle
        run: sh scripts/check-m107-unix.sh
      - name: Shared ELF PT_LOAD loader regression (x86/RV64/ARM64)
        run: cc -std=c11 -Wall -Wextra -Werror scripts/test-elf-segments.c kernel/task/elf_segments.c -o /tmp/naseed-segments-test && /tmp/naseed-segments-test
      - name: Shared ELF64 structural regression (x86/RV64/ARM64)
        run: cc -std=c11 -Wall -Wextra -Werror scripts/test-elf-format.c -o /tmp/naseed-elf-test && /tmp/naseed-elf-test
      - name: Linux syscall semantic decoder regression
        run: cc -std=c11 -Wall -Wextra -Werror scripts/test-syscall-abi.c -o /tmp/naseed-syscall-test && /tmp/naseed-syscall-test
      - name: Anonymous VM range reuse, split, fork ownership and bounded capacity
        run: cc -std=c11 -Wall -Wextra -Werror scripts/test-anon-regions.c kernel/mm/anon_regions.c -o /tmp/naseed-anon && /tmp/naseed-anon
      - name: Linux wait4 signed pid_t ABI regression including zero-extended -1
        run: cc -std=c11 -Wall -Wextra -Werror scripts/test-wait-pid-abi.c -o /tmp/naseed-wait-pid && /tmp/naseed-wait-pid
      - name: Linux anonymous mmap ABI ignored fd including x86 zero-extended -1
        run: cc -std=c11 -Wall -Wextra -Werror scripts/test-mmap-abi.c -o /tmp/naseed-mmap-abi && /tmp/naseed-mmap-abi
      # These are compiled HOST fixtures. M91-M102 additionally cross-compile
      # target-ISA objects, but do not boot a native guest. System-QEMU Linux
      # ELF acceptance lives in the separate native jobs/workflows below.
      - name: '[HOST + TARGET-COMPILE] M102 TTY/COW fork and ash buffer permissions'
        run: sh scripts/check-m102-tty-cow.sh
      - name: '[HOST + TARGET-COMPILE] M101 COW fault and ptrace isolation'
        run: sh scripts/check-m101-cow.sh
      - name: '[HOST + TARGET-COMPILE] M100 failed user signal-frame isolation'
        run: sh scripts/check-m100-signal-failure.sh
      # One actual host fixture covers both M98 policy and M99 ring-scan
      # cases. It does NOT prove native IRQ frame save/restore on three ISAs.
      - name: '[HOST + TARGET-COMPILE] M98/M99 scheduler policy and ring fairness'
        run: sh scripts/check-m98-sched-core.sh
      - name: '[HOST + TARGET-COMPILE] M97 timed waits and scheduler service'
        run: sh scripts/check-m97-k-timeouts.sh
      - name: '[HOST + TARGET-COMPILE] M96 semaphore and bounded mailbox'
        run: sh scripts/check-m96-k-sync.sh
      - name: '[HOST + TARGET-COMPILE] M95 worker C frames and event wake'
        run: sh scripts/check-m95-kthread.sh
      - name: '[HOST + TARGET-COMPILE] M94 wake-ready and blocked completion'
        run: sh scripts/check-m94-run-state.sh
      - name: '[HOST + TARGET-COMPILE] M93 futex wake/requeue/cancel'
        run: sh scripts/check-m93-futex-queues.sh
      - name: '[HOST + TARGET-COMPILE] M92 wait queues and cancellation'
        run: sh scripts/check-m92-wait-queue.sh
      - name: '[HOST + TARGET-COMPILE] M91 kernel C continuations and assembly'
        run: sh scripts/check-m91-kcontext.sh
      - name: '[HOST] M90 multi-fd wait registration and readiness'
        run: sh scripts/check-m90-io-wait.sh
      - name: '[HOST] M89 open-file-description readiness'
        run: sh scripts/check-m89-poll.sh
      - name: '[HOST] M88 exception and MM fault policy'
        run: sh scripts/check-m88-exceptions.sh
      - name: '[HOST + x86 OBJECT] M88 user ISR routing and saved error frames'
        run: sh scripts/check-x86-isr-routing.sh
      - name: '[HOST] x86 production PTE NX and ELF overlap compatibility'
        run: sh scripts/check-x86-nx.sh
      - name: '[HOST + x86 OBJECT] x86 early NXE capability and EFER bootstrap contract'
        run: sh scripts/check-x86-nxe-bootstrap.sh
      - name: '[HOST + TARGET-COMPILE] M103 Linux clone TID and robust futex lifecycle'
        run: sh scripts/check-m103-thread-tid-lifecycle.sh
      - name: '[HOST] M105 ELF PT_LOAD overlap and COW fault model'
        run: sh scripts/check-m105-elf-permissions.sh
      - name: '[HOST] M105 PTY ISIG Linux oracle and production ldisc model'
        run: sh scripts/test-m105-pty-isig.sh
      - name: '[HOST] M105 signal group and zombie leader routing model'
        run: sh scripts/check-m105-signal-group.sh
      - name: '[HOST] M105 production boot argv parser above 256 bytes and 4096-byte boundary'
        run: sh scripts/check-m105-boot-argv.sh
      - name: '[HOST] Fail-closed CI proof-type and milestone mapping audit'
        run: python3 scripts/check-ci-proof-map.py
      - name: Linux mmap/mprotect permission policy regression
        run: cc -std=c11 -Wall -Wextra -Werror scripts/test-vm-prot.c -o /tmp/naseed-vm-prot && /tmp/naseed-vm-prot
      - name: M62 real FD owner AoS/dup/fork/CLONE_FILES/last-close regression
        run: cc -std=c11 -Wall -Wextra -Werror -I kernel scripts/test-fd-entry-model.c kernel/fd.c -o /tmp/naseed-fd-model && /tmp/naseed-fd-model
      - name: Linux open flags ABI regression (including ARM64 values)
        run: cc -std=c11 -Wall -Wextra -Werror scripts/test-fcntl-abi.c -o /tmp/naseed-fcntl-abi && /tmp/naseed-fcntl-abi
      - name: A009/A010 Linux fcntl and positional append oracle
        run: sh scripts/check-a009-a010-linux-fcntl.sh
      - name: Single CPU Linux affinity mask/size ABI
        run: cc -std=c11 -Wall -Wextra -Werror scripts/test-cpu-affinity.c -o /tmp/naseed-affinity && /tmp/naseed-affinity
      - name: Process-owned POSIX record locks and overlapping ranges
        run: cc -std=c11 -Wall -Wextra -Werror scripts/test-posix-locks.c -o /tmp/naseed-posix-locks && /tmp/naseed-posix-locks
      - name: Linux umask/create-mode ABI semantics
        run: cc -std=c11 -Wall -Wextra -Werror scripts/test-fs-mode-abi.c -o /tmp/naseed-fs-mode && /tmp/naseed-fs-mode
      - name: Verify all shared kernel objects are actually linked on x86, RV64 and ARM64
        run: python3 scripts/check-three-isa-core.py && sh scripts/check-full-kernel-sources.sh
      - name: Verify real guest performance markers reject failed or partial applications
        run: |
          python3 scripts/test-native-perf-report.py
          python3 scripts/test-native-perf-profile.py
          sh -n scripts/native-profile-guest.sh
          sh -n tests/native-perf-clock.sh
          sh -n tests/m38-gcc-build.sh
          sh -n tests/m55-cjson-run.sh
          sh -n tests/m56-busybox-run.sh
      - name: Verify native x86-64 stat layout
        run: cc -std=c11 -Wall -Wextra -Werror -c scripts/check-linux-stat.c -o /tmp/naseed-stat.o
      - name: Verify original SHA256 BusyBox and signed target-ISA musl provenance
        run: sh scripts/check-alpine-native-fixtures.sh
      - name: Offline pinned Alpine transport failover and digest regression
        run: sh scripts/test-pinned-alpine-apk.sh
      - name: Verify one Debian BusyBox fixture for all architectures
        run: sh scripts/check-busybox-fixtures.sh
      - name: Verify real-QEMU marker monitor fails closed
        run: sh scripts/test-port-boot-monitor.sh
      - name: Verify generic64 fork+child-TID and unsupported clone forms
        run: cc -std=c11 -Wall -Wextra -Werror scripts/test-generic64-clone.c -o /tmp/naseed-generic64-clone && /tmp/naseed-generic64-clone
      - name: Preflight audit, shell syntax, kernel compile and link
        run: sh scripts/preflight.sh
      - name: Cache verified static GNU Bash
        uses: actions/cache@v4
        with:
          path: build/userspace/bash
          key: naseed-musl-bash-5.2.37-${{ runner.os }}-${{ hashFiles('scripts/build-bash.sh') }}
      - name: Validate a restored Bash binary without compiling it
        run: |
          if [ -f build/userspace/bash ]; then
            readelf -h build/userspace/bash | grep -q 'EXEC (Executable file)'
            if readelf -l build/userspace/bash | grep -q INTERP; then exit 1; fi
            test "$(build/userspace/bash --noprofile --norc -c 'echo hello')" = hello
            echo '[CACHE] restored static Bash verified; no source rebuild'
          fi
      - name: Build and boot real kernel
        run: make smoke
      - name: Build authentic static Bash and probe actual QEMU behavior
        run: BASH_REQUIRE_PASS=1 make bash-probe
      - name: Probe official Debian prebuilt static Bash and BusyBox
        run: DEBIAN_REQUIRE_PASS=1 make debian-probe
      - name: x86 Debian static BusyBox — same 17 cases as RV64
        run: sh scripts/probe-x86-busybox-parity.sh
      - name: x86 original BusyBox copy and exec from sparse paged tmpfs
        run: sh scripts/probe-paged-tmpfs.sh amd64
      - name: Attach serial log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: naseed-serial
          path: |
            build/serial.log
            build/bash-serial.log
            build/debian-*-serial.log
            build/busybox-parity-x86/*.serial.log
            build/alpine-serial.log
            build/alpine-argv-*-serial.log
            build/alpine-fs-*-serial.log
            build/alpine-archive-*-serial.log
            build/alpine-selector-*-serial.log
            build/ash-diag-*-serial.log
            build/ash-exec-*-serial.log
            build/ash-fork-*-serial.log
            build/ash-pipe-*-serial.log
            build/ash-life-*-serial.log
            build/ash-link-*-serial.log
            build/ash-tmp-*-serial.log
            build/ash-tree-*-serial.log
            build/ash-rename-*-serial.log
            build/ash-fd-*-serial.log
            build/ash-path-*-serial.log
            build/ash-pipe-backend-*-serial.log
            build/boot-handoff-*-serial.log
            build/ash-resource-*-serial.log
            build/ash-shebang-*-serial.log
            build/path-abi-serial.log
          if-no-files-found: ignore

  x86_fs:
    name: x86 native BusyBox VFS / path / archive regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install x86 userland / QEMU dependencies
        timeout-minutes: 8
        run: sh scripts/ci-install-x86-deps.sh
      - name: Build shared x86 kernel and stage authentic Alpine/musl binaries
        run: |
          make kernel
          make alpine-fetch
      - name: Unmodified BusyBox bare PATH applets through real CPIO symlinks
        run: make ash-symlinks-probe
      - name: Authentic BusyBox shell scratch files and read-only CPIO boundary
        run: make ash-tmp-probe
      - name: BusyBox directory creation, removal, and open inode lifecycle
        run: make ash-tree-probe
      - name: Real Alpine BusyBox cp/mv, rename atomicity, and open inode lifecycle
        run: make ash-rename-probe
      - name: Real BusyBox FD inheritance, dup offsets and last-close lifecycle
        run: make ash-fds-probe
      - name: Real BusyBox pathname traversal, symlink and dotdot semantics
        run: make ash-paths-probe
      - name: Direct ring3 openat ABI flags and readonly CPIO error semantics
        run: make path-abi-probe
      - name: Limine archive-only initramfs boot, default and explicit authentic BusyBox ELF
        run: make boot-handoff-probe
      - name: Native execve of real CPIO shebang scripts and BusyBox shell workflows
        run: make shebang-abi-probe
      - name: Real archive-backed Alpine BusyBox ls and cat under QEMU
        run: make alpine-fs-probe
      - name: Real Alpine BusyBox ELF loaded entirely from CPIO
        run: make alpine-archive-probe
      - name: Select between two authentic CPIO executables and reject invalid paths
        run: make alpine-selector-probe
      - name: Upload x86-fs serial evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: naseed-x86-fs-serial
          path: |
            build/*.serial.log
            build/**/*.serial.log
            build/serial.log
          if-no-files-found: ignore

  x86_process:
    name: x86 native BusyBox process / pipe / ABI regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install x86 userland / QEMU dependencies
        timeout-minutes: 8
        run: sh scripts/ci-install-x86-deps.sh
      - name: Build shared x86 kernel and stage authentic Alpine/musl binaries
        run: |
          make kernel
          make alpine-fetch
      - name: Diagnose real BusyBox producer early close and pipe lifecycle
        run: make ash-lifecycle-probe
      - name: Pipe backend reuse and cascading original BusyBox pipelines
        run: make ash-pipe-backend-probe
      - name: Repeated real BusyBox fork, wait, tmpfs tombstone, pipe and SIGPIPE lifecycle
        run: make ash-resources-probe
      - name: Real BusyBox ash pipeline pipe/pipe2 and EOF under QEMU
        run: make ash-pipes-probe
      - name: Boot genuine Alpine dynamic BusyBox and report ABI blockers
        run: ALPINE_REQUIRE_PASS=1 make alpine-probe
      - name: Verify multiple Alpine BusyBox applets via Limine cmdline
        run: make alpine-argv-probe
      - name: Accept real BusyBox ash cwd/FD/readiness and diagnose process blockers
        run: make ash-diagnostic
      - name: Unmodified Alpine BusyBox ash execve CPIO process replacement
        run: make ash-execve-probe
      - name: Real BusyBox ash fork, execve, wait4 and parent continuation
        run: make ash-fork-probe
      - name: Upload x86-process serial evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: naseed-x86-process-serial
          path: |
            build/*.serial.log
            build/**/*.serial.log
            build/serial.log
          if-no-files-found: ignore

  riscv64_m0:
    name: RISC-V real Limine/OpenSBI boot
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install cross-build and UEFI/QEMU tools
        run: |
          sh scripts/ci-ubuntu-mirror.sh
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
          sudo apt-get install -y --no-install-recommends clang lld binutils mtools gdisk cpio qemu-user \
            qemu-system-misc qemu-efi-riscv64
      - name: Shared ELF PT_LOAD loader host regression
        run: cc -std=c11 -Wall -Wextra -Werror scripts/test-elf-segments.c kernel/task/elf_segments.c -o /tmp/naseed-segments-test && /tmp/naseed-segments-test
      - name: Verify reused ELF64 validator
        run: cc -std=c11 -Wall -Wextra -Werror scripts/test-elf-format.c -o /tmp/naseed-elf-test && /tmp/naseed-elf-test
      - name: Verify exact generic64 fork+child-TID clone decoder
        run: cc -std=c11 -Wall -Wextra -Werror scripts/test-generic64-clone.c -o /tmp/naseed-generic64-clone && /tmp/naseed-generic64-clone
      - name: Verify asm-generic 64-bit stat layout (RV64)
        run: clang --target=riscv64-unknown-elf -march=rv64imac -mabi=lp64 -std=c11 -Wall -Wextra -Werror -ffreestanding -fsyntax-only scripts/check-linux-stat.c
      - name: Validate asm-generic syscall decoder with RV64 Clang
        run: clang --target=riscv64-unknown-elf -march=rv64imac -mabi=lp64 -std=c11 -Wall -Wextra -Werror -ffreestanding -fsyntax-only scripts/check-linux-syscalls.c
      - name: Compile the entire shared kernel source set for RV64
        run: make ARCH=riscv64 build/deps/limine.h && ARCH=riscv64 sh scripts/check-shared-kernel-build.sh
      - name: Compile and boot RV64 full shared kernel (real ELF + common syscall)
        run: sh scripts/probe-riscv64-full.sh
      - name: Compare actual amd64/RV64 BusyBox applet configuration
        run: sh scripts/compare-busybox-applets.sh
      - name: Execute official RV64 Debian static BusyBox via full shared kernel
        run: sh scripts/probe-riscv64-busybox.sh
      - name: Verify native RV64 BusyBox command and CPIO filesystem matrix
        run: sh scripts/probe-riscv64-busybox-matrix.sh
      - name: RV64 original BusyBox copy and exec from sparse paged tmpfs
        run: sh scripts/probe-paged-tmpfs.sh riscv64
      - name: Compile and boot genuine RV64 M0 kernel
        run: sh scripts/probe-riscv64-m0.sh
      - name: Native Alpine RV64 dynamic BusyBox seven-case parity (SHA256 pinned)
        run: sh scripts/probe-alpine-native-matrix.sh riscv64
      - name: Attach riscv64 boot console on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: naseed-riscv64-m0
          path: |
            build/port-riscv64/serial.log
            build/port-riscv64/full/serial.log
            build/port-riscv64/full/matrix/*.serial.log
            build/port-riscv64/full/applet-parity/*
          if-no-files-found: ignore
  aarch64_m0:
    name: AArch64 real UEFI/Limine boot
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install AArch64 UEFI/QEMU and cross-compiler tools
        run: |
          sh scripts/ci-ubuntu-mirror.sh
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
          sudo apt-get install -y --no-install-recommends clang lld binutils mtools gdisk \
            qemu-system-arm qemu-efi-aarch64
      - name: Verify asm-generic 64-bit stat layout (ARM64)
        run: clang --target=aarch64-none-elf -march=armv8-a -std=c11 -Wall -Wextra -Werror -ffreestanding -fsyntax-only scripts/check-linux-stat.c
      - name: Validate asm-generic syscall decoder with ARM64 Clang
        run: clang --target=aarch64-none-elf -march=armv8-a -std=c11 -Wall -Wextra -Werror -ffreestanding -fsyntax-only scripts/check-linux-syscalls.c
      - name: Compile the entire shared kernel source set for AArch64
        run: make ARCH=aarch64 build/deps/limine.h && ARCH=aarch64 sh scripts/check-shared-kernel-build.sh
      - name: Compile and QEMU-boot genuine AArch64 M0 kernel
        run: sh scripts/probe-aarch64-m0.sh
      - name: Boot complete shared Task/ELF/FS/syscall kernel in real AArch64 EL0
        run: sh scripts/probe-aarch64-full.sh
      - name: Attach aarch64 boot diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: naseed-aarch64-m0
          path: |
            build/port-aarch64/serial.log
            build/port-aarch64/full/serial.log
          if-no-files-found: ignore

  source_busybox:
    name: Controlled source BusyBox / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    # M103/M104/M105 add four bounded real native QEMU boots after the
    # upstream BusyBox source workload; no second source build per milestone.
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        # ARM64 full-kernel parity remains in its own fast gate. The
        # expensive source-BusyBox ARM64 rebuild is a separate focused PR,
        # weekly or explicit gate for Task/exception and M103 changes.
        port: [amd64, riscv64]
    steps:
      - uses: actions/checkout@v4
      - name: Install only missing headless cross toolchain and QEMU
        timeout-minutes: 5
        run: |
          set -eu
          # All three source-BusyBox shards need the same tests and images.
          # Avoid repeatedly installing the runner's preinstalled GCC,
          # Clang, Make and binutils. Keep apt signature verification on.
          missing=''
          for spec in 'make:make' 'gcc:gcc' 'readelf:binutils' \
                      'curl:curl' 'bzip2:bzip2' 'xorriso:xorriso' \
                      'clang:clang' 'ld.lld:lld' 'cpio:cpio' \
                      'mformat:mtools' 'sgdisk:gdisk' \
                      'qemu-riscv64:qemu-user'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            if ! command -v "$bin" >/dev/null 2>&1; then
              missing="$missing $pkg"
            fi
          done
          case "${{ matrix.port }}" in
            amd64)
              command -v qemu-system-x86_64 >/dev/null || missing="$missing qemu-system-x86"
              test -f /usr/share/OVMF/OVMF_CODE_4M.fd || \
                test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf" ;;
            riscv64)
              command -v riscv64-linux-gnu-gcc >/dev/null || \
                missing="$missing gcc-riscv64-linux-gnu libc6-dev-riscv64-cross"
              command -v qemu-system-riscv64 >/dev/null || missing="$missing qemu-system-misc"
              test -f /usr/share/qemu-efi-riscv64/RISCV_VIRT_CODE.fd || \
                missing="$missing qemu-efi-riscv64" ;;
            arm64)
              command -v aarch64-linux-gnu-gcc >/dev/null || \
                missing="$missing gcc-aarch64-linux-gnu libc6-dev-arm64-cross"
              command -v qemu-system-aarch64 >/dev/null || missing="$missing qemu-system-arm"
              test -f /usr/share/AAVMF/AAVMF_CODE.fd || \
                missing="$missing qemu-efi-aarch64" ;;
          esac
          if [ -n "$missing" ]; then
            sh scripts/ci-ubuntu-mirror.sh
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 \
              update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get \
              -o Acquire::Retries=1 -o Acquire::http::Timeout=30 \
              install -y --no-install-recommends $missing
          fi
          echo '[CI] required native cross compiler and headless QEMU verified'
      - name: Local Kconfig, fixture and shared-harness preflight
        run: sh scripts/check-source-busybox.sh
      - name: Cache SHA256-pinned upstream BusyBox source tarball
        uses: actions/cache@v4
        with:
          path: build/deps/source-busybox/busybox-1.37.0.tar.bz2
          key: naseed-source-busybox-1.37.0-3311dff32e746499
      - name: Build original BusyBox from one SHA256-pinned source and Kconfig
        run: sh scripts/build-source-busybox.sh ${{ matrix.port }}
      - name: Ten native source workloads with PID1 reaping and POSIX session-group semantics
        run: sh scripts/probe-source-busybox.sh ${{ matrix.port }}
      - name: M103 native clone TID and robust futex regression in actual QEMU guest
        run: sh scripts/probe-m103-tid.sh ${{ matrix.port }}
      - name: M104 real user exceptions isolate the child, parent continues in QEMU
        run: sh scripts/test-m104-probe.sh ${{ matrix.port }}
      - name: '[NATIVE QEMU] M105 physical TTY signal group and zombie-leader worker / ${{ matrix.port }}'
        timeout-minutes: 5
        run: sh scripts/probe-m105-signal-group.sh ${{ matrix.port }}
      - name: '[NATIVE QEMU] M105 real CPU RW/RX JIT and private fork COW / ${{ matrix.port }}'
        timeout-minutes: 5
        run: sh scripts/test-m105-native-jit-probe.sh ${{ matrix.port }}
      - name: '[NATIVE QEMU] Path-first openat(dirfd) and owned File lifecycle / ${{ matrix.port }}'
        timeout-minutes: 5
        run: sh scripts/probe-path-first-dirfd-native.sh ${{ matrix.port }}
      - name: Upload native source BusyBox/serial evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: naseed-source-busybox-${{ matrix.port }}
          path: |
            build/source-busybox/${{ matrix.port }}/verified.config
            build/source-busybox/${{ matrix.port }}/artifacts.sha256
            build/source-busybox/${{ matrix.port }}/m103-linux-oracle.log
            build/source-busybox/${{ matrix.port }}/m104-linux-oracle.log
            build/source-busybox/${{ matrix.port }}/m105-linux-oracle.log
            build/source-busybox/${{ matrix.port }}/m105-signal-group
            build/source-busybox/${{ matrix.port }}/m105-native-jit-linux-oracle.log
            build/source-busybox/${{ matrix.port }}/path-first-dirfd-linux-oracle.log
            build/busybox-source-parity-x86/*.serial.log
            build/busybox-source-parity-x86/m103-tid.clean.log
            build/busybox-source-parity-x86/m104-exception.clean.log
            build/busybox-source-parity-x86/m105-signal-group.serial.log
            build/busybox-source-parity-x86/m105-native-jit.clean.log
            build/busybox-source-parity-x86/path-first-dirfd.serial.log
            build/m28-x86-preempt/preempt.serial.log
            build/port-riscv64/full/matrix-source/*.serial.log
            build/port-riscv64/full/matrix-source/m103-tid.clean.log
            build/port-riscv64/full/matrix-source/m104-exception.clean.log
            build/port-riscv64/full/matrix-source/m105-signal-group.serial.log
            build/port-riscv64/full/matrix-source/m105-native-jit.clean.log
            build/port-riscv64/full/matrix-source/path-first-dirfd.serial.log
            build/port-aarch64/full/matrix-source/*.serial.log
            build/port-aarch64/full/matrix-source/m105-signal-group.serial.log
            build/port-aarch64/full/matrix-source/m105-native-jit.clean.log
          if-no-files-found: ignore
