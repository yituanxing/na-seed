name: NaSeed M0+M1 QEMU smoke
on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang lld xorriso qemu-system-x86 ovmf
      - name: Build and boot real kernel
        run: make smoke
      - name: Attach serial log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: naseed-serial
          path: build/serial.log
          if-no-files-found: ignore
