name: NaSeed M224 signed nmap iperf3 ncat real TCP in two QEMUs

# M224 targeted x86 retry: reject original iperf3 JSON error even if bytes
# reached the host, and retain the actual guest JSON error from physical ext4.
# Do not replay already accepted M218-M223 long-running native-QEMU jobs.
on:
  push:
    branches: [naseed-app-batch2]
    paths:
      - '.github/workflows/m224-tcp-alpine.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tcp-original-amd64:
    name: Signed original TCP port scan throughput and random ncat 2 QEMUs / amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: true
      - name: Require exact signed original TCP ELF boundaries and host-wire-disk negatives
        run: |
          set -eu
          python3 scripts/test-m224-tcp-host.py
          python3 scripts/test-m223-http-host.py
          python3 scripts/test-m222-ssh-host.py
          python3 scripts/check-three-isa-core.py
          python3 scripts/check-architecture-boundaries.py
          sh scripts/check-lwip-socket-abi.sh
      - name: Install host iperf3 x86 QEMU ext4 and official Alpine signing tools
        timeout-minutes: 20
        run: |
          set -eu
          PATH=/usr/sbin:/sbin:$PATH
          export PATH
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'cmake:cmake' 'g++:g++' 'clang:clang' 'ld.lld:lld' \
                      'iperf3:iperf3' 'qemu-system-x86_64:qemu-system-x86' \
                      'readelf:binutils' 'cpio:cpio' 'mke2fs:e2fsprogs' \
                      'debugfs:e2fsprogs' 'e2fsck:e2fsprogs' \
                      'xorriso:xorriso' 'mformat:mtools' 'sgdisk:gdisk' \
                      'curl:curl' 'python3:python3' 'openssl:openssl'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          test -f /usr/share/OVMF/OVMF_CODE_4M.fd || \
            test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf"
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
          command -v iperf3
      - name: Prove real upstream lwIP refused TCP RST errno and socket foundation
        timeout-minutes: 12
        run: |
          set -eu
          sh scripts/check-lwip-foundation.sh
      - name: Verify signed nmap iperf3 ncat native x86 ELF SHA and offline APK closure
        timeout-minutes: 20
        run: |
          set -eu
          sh scripts/inventory-m141-signed-apks.sh amd64 m224
          tsv=build/external/m224-candidate-inventory/amd64/candidates.tsv
          awk -F '\t' 'NR > 1 {n++; if ($3 != "NATIVE_ELF" || length($4) != 64 || $4 ~ /[^0-9a-f]/) bad++}
            END {if (n != 3 || bad) exit 1}' "$tsv"
      # Capture real guest serial on physical Nmap rejection before uploading
      # fail-closed host/PCAP/ext4 evidence; no acceptance check is disabled.
      - name: First and independently reopened physical x86 QEMUs real TCP host PCAP and ext4
        timeout-minutes: 78
        env:
          NAS_M224_PUBLIC_QEMU_TIMEOUT: '3400'
          NAS_M224_PUBLIC_SECONDS: '3250'
          NAS_M224_REOPEN_SECONDS: '1150'
        run: sh scripts/probe-m224-alpine-pilot.sh amd64
      - name: Retain only signed APK original TCP host reports raw PCAP and hash sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m224-original-tcp-amd64
          path: |
            build/external/m224-candidate-inventory/amd64/candidates.tsv
            build/external/m224-candidate-inventory/amd64/signed-cache.sha256
            build/external/m224-candidate-inventory/amd64/apk-offline-proof.log
            build/external/m191-alpine-rootfs/amd64/m224-compat-report.json
            build/external/m191-alpine-rootfs/amd64/m224-first-runner.log
            build/external/m191-alpine-rootfs/amd64/m197-live.serial.log
            build/external/m191-alpine-rootfs/amd64/m197-reopen-runner.log
            build/external/m191-alpine-rootfs/amd64/m197-public-wire.pcap
            build/external/m191-alpine-rootfs/amd64/m224-first-host-tcp.log
            build/external/m191-alpine-rootfs/amd64/m224-first-wire.json
            build/external/m191-alpine-rootfs/amd64/m224-reopen-host-tcp.log
            build/external/m191-alpine-rootfs/amd64/m224-reopen-wire.pcap
            build/external/m191-alpine-rootfs/amd64/m224-reopen-wire.json
            build/external/m191-alpine-rootfs/amd64/m224-host-first/iperf3.log
            build/external/m191-alpine-rootfs/amd64/m224-host-reopen/iperf3.log
            build/acceptance/**/m197-batch*.log
          if-no-files-found: warn

  tcp-original-cross:
    name: Signed original TCP port scan throughput and random ncat 2 QEMUs / ${{ matrix.port }}
    needs: [tcp-original-amd64]
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    strategy:
      fail-fast: false
      matrix:
        port: [riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: true
      - name: Require original TCP host-wire-disk negatives and target ISA boundaries
        run: |
          set -eu
          python3 scripts/test-m224-tcp-host.py
          python3 scripts/test-m223-http-host.py
          python3 scripts/check-three-isa-core.py
          python3 scripts/check-architecture-boundaries.py
      - name: Install host iperf3 cross-GCC QEMU ELF ext4 and official Alpine tools
        timeout-minutes: 22
        run: |
          set -eu
          PATH=/usr/sbin:/sbin:$PATH
          export PATH
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'cmake:cmake' 'g++:g++' 'clang:clang' 'ld.lld:lld' \
                      'iperf3:iperf3' 'readelf:binutils' 'cpio:cpio' \
                      'mke2fs:e2fsprogs' 'debugfs:e2fsprogs' 'e2fsck:e2fsprogs' \
                      'xorriso:xorriso' 'mformat:mtools' 'sgdisk:gdisk' \
                      'curl:curl' 'python3:python3' 'openssl:openssl'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          case '${{ matrix.port }}' in
            riscv64)
              command -v riscv64-linux-gnu-gcc >/dev/null || missing="$missing gcc-riscv64-linux-gnu"
              command -v riscv64-linux-gnu-g++ >/dev/null || missing="$missing g++-riscv64-linux-gnu"
              test -f /usr/riscv64-linux-gnu/include/bits/wordsize.h && \
              test -f /usr/riscv64-linux-gnu/lib/libc.a || missing="$missing libc6-dev-riscv64-cross"
              command -v qemu-system-riscv64 >/dev/null || missing="$missing qemu-system-misc"
              test -f /usr/share/qemu-efi-riscv64/RISCV_VIRT_CODE.fd || missing="$missing qemu-efi-riscv64" ;;
            arm64)
              command -v aarch64-linux-gnu-gcc >/dev/null || missing="$missing gcc-aarch64-linux-gnu"
              command -v aarch64-linux-gnu-g++ >/dev/null || missing="$missing g++-aarch64-linux-gnu"
              test -f /usr/aarch64-linux-gnu/include/bits/wordsize.h && \
              test -f /usr/aarch64-linux-gnu/lib/libc.a || missing="$missing libc6-dev-arm64-cross"
              command -v qemu-system-aarch64 >/dev/null || missing="$missing qemu-system-arm"
              test -f /usr/share/AAVMF/AAVMF_CODE.fd || \
                test -f /usr/share/qemu-efi-aarch64/QEMU_EFI.fd || missing="$missing qemu-efi-aarch64" ;;
          esac
          test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu"
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
          command -v iperf3
      - name: Verify three exact signed native cross-ISA TCP ELF SHA and offline closure
        timeout-minutes: 22
        run: |
          set -eu
          sh scripts/inventory-m141-signed-apks.sh '${{ matrix.port }}' m224
          tsv='build/external/m224-candidate-inventory/${{ matrix.port }}/candidates.tsv'
          awk -F '\t' 'NR > 1 {n++; if ($3 != "NATIVE_ELF" || length($4) != 64 || $4 ~ /[^0-9a-f]/) bad++}
            END {if (n != 3 || bad) exit 1}' "$tsv"
      - name: First and independent reopened native cross QEMUs host TCP PCAP ext4
        timeout-minutes: 115
        env:
          NAS_M224_PUBLIC_QEMU_TIMEOUT: '5000'
          NAS_M224_PUBLIC_SECONDS: '4850'
          NAS_M224_REOPEN_SECONDS: '1700'
        run: sh scripts/probe-m224-alpine-pilot.sh '${{ matrix.port }}'
      - name: Retain only original signed APK TCP host reports two PCAPs and SHA sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m224-original-tcp-${{ matrix.port }}
          path: |
            build/external/m224-candidate-inventory/${{ matrix.port }}/candidates.tsv
            build/external/m224-candidate-inventory/${{ matrix.port }}/signed-cache.sha256
            build/external/m224-candidate-inventory/${{ matrix.port }}/apk-offline-proof.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m224-compat-report.json
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m224-first-runner.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m197-live.serial.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m197-reopen-runner.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m197-public-wire.pcap
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m224-first-host-tcp.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m224-first-wire.json
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m224-reopen-host-tcp.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m224-reopen-wire.pcap
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m224-reopen-wire.json
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m224-host-first/iperf3.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m224-host-reopen/iperf3.log
            build/acceptance/**/m197-batch*.log
          if-no-files-found: warn
