name: NaSeed M117 15 original ELF and archive/search applications, one QEMU boot per ISA
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  signed-original-software:
    name: M117 15 distinct original Linux ELF functional checks / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate original signed APK catalog and real guest assertions
        timeout-minutes: 3
        run: |
          set -eu
          sh -n scripts/stage-alpine-prebuilt-overlay.sh \
                scripts/stage-m117-prebuilt.sh \
                scripts/probe-m117-batch.sh \
                tests/m117-batch-run.sh
          python3 scripts/check-prebuilt-profile-catalog.py
          python3 scripts/check-native-qemu-target.py
          python3 scripts/check-three-isa-core.py
      - name: Install host tools and native target QEMU
        timeout-minutes: 12
        run: sh scripts/ci-install-signed-alpine-qemu-deps.sh ${{ matrix.port }}
      - name: Execute 15 signed original Linux ELFs inside ONE native QEMU guest
        timeout-minutes: 45
        run: sh scripts/probe-m117-batch.sh ${{ matrix.port }}
      - name: Retain verified APK provenance and real guest serial on pass
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: m117-signed-original-elf-batch-pass-${{ matrix.port }}
          path: |
            build/external/m117-batch/${{ matrix.port }}/apk-install.log
            build/external/m117-batch/${{ matrix.port }}/requested-packages.txt
            build/external/m117-batch/${{ matrix.port }}/*.sha256
            build/busybox-source-parity-x86/m117-batch.clean.log
            build/port-riscv64/full/matrix-source/m117-batch.clean.log
            build/port-aarch64/full/matrix-source/m117-batch.clean.log
          if-no-files-found: error
      - name: Preserve complete genuine failure serial and original ELF rootfs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m117-signed-original-elf-batch-fail-${{ matrix.port }}
          path: |
            build/external/m117-batch/${{ matrix.port }}/apk-install.log
            build/external/m117-batch/${{ matrix.port }}/requested-packages.txt
            build/external/m117-batch/${{ matrix.port }}/rootfs.cpio
            build/external/m117-batch/${{ matrix.port }}/*.sha256
            build/busybox-source-parity-x86/m117-batch.clean.log
            build/port-riscv64/full/matrix-source/m117-batch.clean.log
            build/port-aarch64/full/matrix-source/m117-batch.clean.log
          if-no-files-found: ignore
