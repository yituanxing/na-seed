name: NaSeed M127 15 original signed audio codec tools, one QEMU per ISA
on:
  # M127 passed 15/15 per ISA on run 41182559321 at a0bcb0e.
  # Archived as manual opt-in while the single active M128 batch runs.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  signed-original-software:
    name: M127 15 signed native audio codec tools / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify signed catalog, host-only audio fixtures and guest contracts
        timeout-minutes: 3
        run: |
          set -eu
          sh -n scripts/stage-alpine-prebuilt-overlay.sh \
                scripts/stage-m127-prebuilt.sh \
                scripts/host-configure-m127-batch.sh \
                scripts/probe-m127-batch.sh \
                tests/m127-batch-run.sh
          python3 scripts/check-prebuilt-profile-catalog.py
          python3 scripts/check-native-qemu-target.py
          python3 scripts/check-three-isa-core.py
      - name: Install signed APK staging tools and native target QEMU on Linux host
        timeout-minutes: 12
        run: sh scripts/ci-install-signed-alpine-qemu-deps.sh ${{ matrix.port }} ffmpeg:ffmpeg
      - name: Run 15 original signed audio codec ELFs inside ONE real NaSeed guest
        timeout-minutes: 45
        run: sh scripts/probe-m127-batch.sh ${{ matrix.port }}
      - name: Preserve original signed APK provenance and actual guest serial on success
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: m127-signed-audio-batch-pass-${{ matrix.port }}
          path: |
            build/external/m127-batch/${{ matrix.port }}/apk-install.log
            build/external/m127-batch/${{ matrix.port }}/requested-packages.txt
            build/external/m127-batch/${{ matrix.port }}/*.sha256
            build/busybox-source-parity-x86/m127-batch.clean.log
            build/port-riscv64/full/matrix-source/m127-batch.clean.log
            build/port-aarch64/full/matrix-source/m127-batch.clean.log
          if-no-files-found: error
      - name: Preserve actual failed serial and original native rootfs for triage
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m127-signed-audio-batch-fail-${{ matrix.port }}
          path: |
            build/external/m127-batch/${{ matrix.port }}/apk-install.log
            build/external/m127-batch/${{ matrix.port }}/requested-packages.txt
            build/external/m127-batch/${{ matrix.port }}/rootfs.cpio
            build/external/m127-batch/${{ matrix.port }}/*.sha256
            build/busybox-source-parity-x86/m127-batch.clean.log
            build/port-riscv64/full/matrix-source/m127-batch.clean.log
            build/port-aarch64/full/matrix-source/m127-batch.clean.log
          if-no-files-found: ignore
