name: NaSeed M144 signed five-service HTTP and RESP original Alpine ELFs

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/m144-server-cohort.yml'
      - 'scripts/m144-**'
      - 'scripts/stage-m144-prebuilt.sh'
      - 'scripts/host-configure-m144-batch.sh'
      - 'scripts/probe-m144-server-cohort.sh'
      - 'rootfs/alpine/packages-m144-batch.txt'
      - 'scripts/prebuilt-profile-catalog.tsv'
      - 'tests/m144-**'
      - 'kernel/fs/**'
      - 'kernel/fd.*'
      - 'ports/lwip/**'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  signed-http-resp:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
      - name: Check signed target manifests and guest script syntax
        run: |
          set -eu
          for f in tests/m144-*-run.sh scripts/stage-m144-prebuilt.sh scripts/host-configure-m144-batch.sh scripts/probe-m144-server-cohort.sh; do sh -n "$f"; done
          python3 -m py_compile scripts/m144-http-oracle.py
          test "$(awk '$1 !~ /^#/ && NF {n++} END {print n+0}' scripts/m144-original-elfs.txt)" -eq 5
          test "$(awk -F '\t' '$1 !~ /^#/ && NF {n++} END {print n+0}' scripts/m144-server-cases.tsv)" -eq 1
      - name: Install QEMU and signed Alpine staging host tools
        timeout-minutes: 12
        run: |
          set -eu
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'clang:clang' 'ld.lld:lld' 'readelf:binutils' 'cpio:cpio' 'xorriso:xorriso' 'mformat:mtools' 'sgdisk:gdisk'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          command -v qemu-system-x86_64 >/dev/null || missing="$missing qemu-system-x86"
          test -f /usr/share/OVMF/OVMF_CODE_4M.fd || test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf"
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
      - name: Run native upstream lwIP and real SocketPort regressions
        timeout-minutes: 10
        run: sh scripts/check-lwip-foundation.sh
      - name: Original signed Nginx HAProxy ApacheBench Valkey QEMU networking
        timeout-minutes: 40
        run: sh scripts/probe-m144-server-cohort.sh
      - name: Preserve guest serial and independent host HTTP oracle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m144-original-service-x86-qemu
          path: |
            build/external/m144-batch/amd64/apk-install.log
            build/external/m144-batch/amd64/requested-packages.txt
            build/external/m144-batch/amd64/*.sha256
            build/external/m144-batch/amd64/host-m144-http.log
            build/external/m144-batch/amd64/m144-virtio-wire.pcap
            build/busybox-source-parity-x86/m144-batch.clean.log
            build/busybox-source-parity-x86/m144-batch.serial.log
          if-no-files-found: ignore
