name: NaSeed native Alpine signed software batches
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Original signed ELF acceptance batch
        type: choice
        required: true
        options:
          - m109
          - m110
          - m111
          - m112
          - m113
          - m114
          - m115
          - m116
          - m117
          - m118
          - m119
          - m120
          - m121
          - m122
          - m123
          - m124
          - m125
          - m126
          - m127
          - m128
          - m129
          - m130
          - m131
          - m132
          - m133
          - m134
          - m135
          - m136
          - m137
          - m138
          - m139
          - m140
          - m141

concurrency:
  group: ${{ github.workflow }}-${{ inputs.profile }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-original-software:
    name: ${{ inputs.profile }} original signed Alpine ELF / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.profile == 'm109' && 50 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    env:
      PROFILE: ${{ inputs.profile }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate signed catalog, target and profile-specific host contracts
        id: profile
        timeout-minutes: ${{ contains(fromJSON('["m131","m132","m133","m134","m135","m136","m137","m138","m139","m140","m141"]'), inputs.profile) && 4 || 3 }}
        run: |
          set -eu
          case "$PROFILE" in
            m109|m110|m111|m112|m113|m114|m115|m116|m117|m118|m119|m120|m121|m122|m123|m124|m125|m126|m127|m128|m129|m130|m131|m132|m133|m134|m135|m136|m137|m138|m139|m140|m141) ;;
            *) exit 2 ;;
          esac
          case "$PROFILE" in
            m120) suffix=libtiff-batch ;;
            m121) suffix=pdf-batch ;;
            m122) suffix=netpbm-batch ;;
            m123|m124|m128) suffix=filesystem-batch ;;
            m125) suffix=netpbm-image-batch ;;
            m126) suffix=groff-text-batch ;;
            m127) suffix=audio-batch ;;
            m129|m130) suffix=process-batch ;;
            m131) suffix=image-batch ;;
            m132|m133|m134|m135|m136|m137|m139) suffix=multifamily ;;
            m138) suffix=llvm21 ;;
            m140) suffix=gnu ;;
            m141) suffix=software ;;
            *) suffix=original-elf-batch ;;
          esac
          echo "artifact=$PROFILE-signed-$suffix" >> "$GITHUB_OUTPUT"
          if [ "$PROFILE" = m141 ]; then probe=scripts/probe-m141-batch.sh; else probe=scripts/probe-alpine-signed-batch.sh; fi
          for script in scripts/stage-alpine-prebuilt-overlay.sh scripts/stage-alpine-signed-batch.sh "$probe" tests/$PROFILE-batch-run.sh; do
            sh -n "$script"
          done
          case "$PROFILE" in
            m118|m119|m120|m121|m122|m123|m124|m125|m126|m127|m128)
              if [ "$PROFILE" = m118 ]; then
                sh -n scripts/host-configure-m118-batch.sh
              else
                sh -n scripts/host-configure-alpine-fixtures.sh
              fi ;;
          esac
          if [ "$PROFILE" = m141 ]; then
            for script in tests/m141-dns-run.sh tests/m141-toolchain-run.sh tests/m141-system-run.sh; do
              sh -n "$script"
            done
          fi
          python3 scripts/check-prebuilt-profile-catalog.py
          python3 scripts/check-native-qemu-target.py
          python3 scripts/check-three-isa-core.py
          case "$PROFILE" in
            m111)
              sh scripts/check-host-fixture.sh m111-getrusage
              sh scripts/check-a005-cross-mm.sh ;;
            m124)
              sh scripts/check-host-fixture.sh m86-txn
              sh scripts/check-vfs-provider.sh ;;
            m129)
              cc -O2 -std=c11 -Wall -Wextra -Werror -fno-builtin -I kernel scripts/test-m129-itimer-host.c kernel/time/clock.c -o /tmp/naseed-m129-itimer-host
              /tmp/naseed-m129-itimer-host
              sh scripts/check-m105-signal-group.sh ;;
            m130) sh scripts/check-vfs-provider.sh ;;
            m131|m132|m133|m134|m135|m136|m137|m138|m139)
              sh scripts/check-vfs-provider.sh
              sh scripts/check-m108-tmp-index.sh ;;
            m140|m141)
              sh scripts/check-vfs-provider.sh
              sh scripts/check-host-fixture.sh m86-txn ;;
          esac
      - name: Install original signed APK staging and native QEMU tools
        timeout-minutes: 12
        env:
          PORT: ${{ matrix.port }}
        run: |
          set -eu
          set -- "$PORT"
          case "$PROFILE" in
            m119) set -- "$@" msgfmt:gettext ;;
            m123) set -- "$@" mke2fs:e2fsprogs ;;
            m127) set -- "$@" ffmpeg:ffmpeg ;;
          esac
          sh scripts/ci-install-signed-alpine-qemu-deps.sh "$@"
      - name: Execute original ELF functional batch in one native QEMU guest
        timeout-minutes: ${{ inputs.profile == 'm109' && 35 || 45 }}
        env:
          PORT: ${{ matrix.port }}
        run: |
          if [ "$PROFILE" = m141 ]; then
            sh scripts/probe-m141-batch.sh "$PORT"
          else
            sh scripts/probe-alpine-signed-batch.sh "$PORT" "$PROFILE"
          fi
      - name: Preserve signed package and native guest PASS evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.profile.outputs.artifact }}-pass-${{ matrix.port }}
          path: |
            build/external/${{ inputs.profile }}-batch/${{ matrix.port }}/apk-install.log
            build/external/${{ inputs.profile }}-batch/${{ matrix.port }}/requested-packages.txt
            build/external/${{ inputs.profile }}-batch/${{ matrix.port }}/*.sha256
            build/busybox-source-parity-x86/${{ inputs.profile }}-batch.clean.log
            build/port-riscv64/full/matrix-source/${{ inputs.profile }}-batch.clean.log
            build/port-aarch64/full/matrix-source/${{ inputs.profile }}-batch.clean.log
          if-no-files-found: error
      - name: Preserve failed native guest and signed rootfs evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.profile.outputs.artifact || inputs.profile }}-fail-${{ matrix.port }}
          path: |
            build/external/${{ inputs.profile }}-batch/${{ matrix.port }}/apk-install.log
            build/external/${{ inputs.profile }}-batch/${{ matrix.port }}/requested-packages.txt
            build/external/${{ inputs.profile }}-batch/${{ matrix.port }}/rootfs.cpio
            build/external/${{ inputs.profile }}-batch/${{ matrix.port }}/*.sha256
            build/busybox-source-parity-x86/${{ inputs.profile }}-batch.clean.log
            build/port-riscv64/full/matrix-source/${{ inputs.profile }}-batch.clean.log
            build/port-aarch64/full/matrix-source/${{ inputs.profile }}-batch.clean.log
          if-no-files-found: ignore
