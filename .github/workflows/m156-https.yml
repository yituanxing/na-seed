name: NaSeed M156 signed Alpine HTTPS TLS wire (x86 QEMU)

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/m156-https.yml'
      - 'scripts/m156-https-*'
      - 'scripts/probe-m156-https-wire-smoke.sh'
      - 'scripts/stage-m156-prebuilt.sh'
      - 'scripts/host-configure-m156-https.sh'
      - 'tests/m156-https-run.sh'
      - 'scripts/m143-*'
      - 'scripts/stage-m143-prebuilt.sh'
      - 'scripts/m156-https-rootfs-copies.tsv'
      - 'scripts/stage-alpine-prebuilt-overlay.sh'
      - 'scripts/prebuilt-profile-catalog.tsv'
      - 'rootfs/alpine/packages-m143-batch.txt'
      - 'kernel/**'
      - 'ports/**'

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  m156-authentic-https:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
      - name: Verify source, signed APK profile and strict TLS oracle
        run: |
          set -eu
          sh -n scripts/probe-m156-https-wire-smoke.sh
          sh -n scripts/stage-m156-prebuilt.sh
          sh -n scripts/host-configure-m156-https.sh
          sh -n tests/m156-https-run.sh
          python3 -m py_compile scripts/m156-https-wire-server.py
          python3 scripts/check-prebuilt-profile-catalog.py
          grep -Fq 'm156-https' scripts/prebuilt-profile-catalog.tsv
          test "$(awk -F '\t' '$1 !~ /^#/ && NF {n++} END {print n+0}' scripts/m156-https-cases.tsv)" -eq 1
      - name: Install native QEMU and signed Alpine staging prerequisites
        timeout-minutes: 14
        run: |
          set -eu
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'clang:clang' 'ld.lld:lld' 'readelf:binutils' \
                      'cpio:cpio' 'xorriso:xorriso' 'mformat:mtools' \
                      'sgdisk:gdisk' 'openssl:openssl'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          command -v qemu-system-x86_64 >/dev/null || missing="$missing qemu-system-x86"
          test -f /usr/share/OVMF/OVMF_CODE_4M.fd || \
          test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf"
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
      - name: Native signed Alpine HTTPS client to independent TLS host
        timeout-minutes: 44
        run: sh scripts/probe-m156-https-wire-smoke.sh
      - name: Preserve certificate, wire proof, guest serial and APK hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m156-original-alpine-verified-https-x86
          path: |
            build/external/m156-https/amd64/apk-install.log
            build/external/m156-https/amd64/requested-packages.txt
            build/external/m156-https/amd64/*.sha256
            build/external/m156-https/amd64/host-m156-https.log
            build/external/m156-https/amd64/host-tls.crt
            build/external/m156-https/amd64/virtio-m156-https.pcap
            build/busybox-source-parity-x86/m156-batch.clean.log
            build/busybox-source-parity-x86/m156-batch.serial.log
          if-no-files-found: ignore
