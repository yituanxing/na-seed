name: NaSeed native desktop and input acceptance
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Original desktop and input acceptance profile
        type: choice
        required: true
        options:
          - m166
          - m167
          - m168
          - m170
          - m171

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ inputs.profile }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-desktop:
    name: ${{ inputs.profile }} genuine desktop / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    env:
      PROFILE: ${{ inputs.profile }}
      PORT: ${{ matrix.port }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
      - name: Select native evidence and verify host contracts
        id: profile
        run: |
          set -eu
          case "$PROFILE" in
            m166)
              echo "artifact=m166-virtio-linux-input-desktop-$PORT" >> "$GITHUB_OUTPUT"
              echo "root=m166-batch" >> "$GITHUB_OUTPUT"
              ;;
            m167)
              echo "artifact=m167-multiprocess-desktop-$PORT" >> "$GITHUB_OUTPUT"
              echo "root=m167-batch" >> "$GITHUB_OUTPUT"
              ;;
            m168)
              echo "artifact=m168-desktop-three-apps-$PORT" >> "$GITHUB_OUTPUT"
              echo "root=m168-batch" >> "$GITHUB_OUTPUT"
              ;;
            m170)
              echo "artifact=m170-persistent-pty-$PORT" >> "$GITHUB_OUTPUT"
              echo "root=m168-batch" >> "$GITHUB_OUTPUT"
              ;;
            m171)
              echo "artifact=m171-real-lvgl-$PORT" >> "$GITHUB_OUTPUT"
              echo "root=m168-batch" >> "$GITHUB_OUTPUT"
              ;;
            *) exit 2 ;;
          esac
          case "$PROFILE" in
            m166)
              for script in scripts/check-m166-input-port.sh scripts/probe-m166-batch.sh scripts/stage-m166-prebuilt.sh scripts/host-configure-m166-batch.sh scripts/probe-x86-busybox-parity.sh scripts/probe-riscv64-busybox-matrix.sh scripts/probe-aarch64-busybox-matrix.sh; do
                sh -n "$script"
              done
              python3 -m py_compile scripts/m161-qmp-verify.py scripts/m166-qmp-verify.py
              ;;
            m167)
              for script in scripts/check-m167-desktop.sh scripts/probe-m167-batch.sh scripts/stage-m167-prebuilt.sh scripts/host-configure-m167-batch.sh; do
                sh -n "$script"
              done
              python3 -m py_compile scripts/m161-qmp-verify.py scripts/m167-qmp-verify.py
              ;;
            m168)
              for script in scripts/probe-m168-batch.sh scripts/stage-m168-prebuilt.sh scripts/host-configure-m168-batch.sh; do
                sh -n "$script"
              done
              python3 -m py_compile scripts/m161-qmp-verify.py scripts/m167-qmp-verify.py scripts/m168-qmp-verify.py
              ;;
            m170)
              for script in scripts/probe-m168-batch.sh scripts/stage-m168-prebuilt.sh scripts/host-configure-m168-batch.sh scripts/probe-m170-batch.sh; do
                sh -n "$script"
              done
              python3 -m py_compile scripts/m161-qmp-verify.py scripts/m167-qmp-verify.py scripts/m168-qmp-verify.py scripts/m170-qmp-verify.py
              ;;
            m171)
              for script in scripts/probe-m168-batch.sh scripts/stage-m168-prebuilt.sh scripts/host-configure-m168-batch.sh scripts/probe-m170-batch.sh scripts/probe-m171-batch.sh scripts/stage-m171-lvgl.sh scripts/host-configure-m171-lvgl.sh; do
                sh -n "$script"
              done
              python3 -m py_compile scripts/m161-qmp-verify.py scripts/m167-qmp-verify.py scripts/m168-qmp-verify.py scripts/m170-qmp-verify.py scripts/m171-qmp-verify.py
              ;;
          esac
          python3 scripts/check-prebuilt-profile-catalog.py
          python3 scripts/check-three-isa-core.py
          python3 scripts/check-architecture-boundaries.py
          if [ "$PROFILE" = m166 ]; then
            sh scripts/check-m166-input-port.sh
            sh scripts/check-block-foundation.sh
          else
            sh scripts/check-m167-fb-pwrite.sh
            sh scripts/check-m167-desktop.sh
            case "$PROFILE" in
              m168|m170|m171) sh scripts/check-m168-desktop.sh ;;
            esac
            case "$PROFILE" in
              m170|m171) sh scripts/check-m170-desktop.sh ;;
            esac
            if [ "$PROFILE" = m171 ]; then
              if [ "$PORT" = amd64 ]; then
                sh scripts/check-m171-desktop.sh
              fi
              test "$(git -C third_party/lvgl rev-parse HEAD)" = c016f72d4c125098287be5e83c0f1abed4706ee5
            fi
            sh scripts/test-m105-pty-isig.sh
            sh scripts/check-m166-input-port.sh
            sh scripts/check-m107-unix.sh
            set -- user/desktop/protocol.c user/desktop/text.c user/desktop/naseed-desktop.c user/desktop/naseed-image.c user/desktop/naseed-terminal.c
            if [ "$PROFILE" != m167 ]; then
              set -- "$@" user/desktop/naseed-browser.c
            fi
            cc -std=c11 -O2 -Wall -Wextra -Werror -static -fsyntax-only "$@"
          fi
      - name: Install native QEMU and cross compilers
        timeout-minutes: 18
        run: |
          set -eu
          case "$PROFILE" in
            m166|m167|m168|m170)
              sh scripts/ci-install-signed-alpine-qemu-deps.sh "$PORT" --arm64-efi-fallback --cross-c mke2fs:e2fsprogs gcc:gcc
              ;;
            m171)
              sh scripts/ci-install-signed-alpine-qemu-deps.sh "$PORT" --arm64-efi-fallback --cross-cxx cmake:cmake g++:g++ mke2fs:e2fsprogs gcc:gcc
              ;;
          esac
      - name: Execute actual desktop and input native QEMU profile
        timeout-minutes: 58
        run: sh "scripts/probe-$PROFILE-batch.sh" "$PORT"
      - name: Preserve original signed identity, guest serial and physical display evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.profile.outputs.artifact || format('{0}-{1}', inputs.profile, matrix.port) }}
          path: |
            build/external/${{ steps.profile.outputs.root }}/${{ matrix.port }}/apk-install.log
            build/external/${{ steps.profile.outputs.root }}/${{ matrix.port }}/*.sha256
            build/external/${{ steps.profile.outputs.root }}/${{ matrix.port }}/${{ inputs.profile }}-qmp-check.log
            build/external/${{ steps.profile.outputs.root }}/${{ matrix.port }}/${{ inputs.profile }}-*.ppm
            build/busybox-source-parity-x86/${{ inputs.profile }}-batch.clean.log
            build/busybox-source-parity-x86/${{ inputs.profile }}-batch.serial.log
            build/port-riscv64/full/matrix-source/${{ inputs.profile }}-batch.clean.log
            build/port-riscv64/full/matrix-source/${{ inputs.profile }}-batch.serial.log
            build/port-aarch64/full/matrix-source/${{ inputs.profile }}-batch.clean.log
            build/port-aarch64/full/matrix-source/${{ inputs.profile }}-batch.serial.log
            build/external/${{ inputs.profile }}-lvgl/${{ matrix.port }}/configure.log
            build/external/${{ inputs.profile }}-lvgl/${{ matrix.port }}/build.log
            build/external/${{ inputs.profile }}-lvgl/${{ matrix.port }}/*.sha256
            build/external/${{ inputs.profile }}-lvgl/${{ matrix.port }}/host-lvgl.log
          if-no-files-found: ignore
