name: NaSeed M75 original GNU GDB native three-ISA debug gate
on:
  pull_request:
    paths:
      - 'kernel/**'
      - 'scripts/stage-m75-prebuilt.sh'
      - 'scripts/probe-m75-gdb.sh'
      - 'scripts/m75-*'
      - 'tests/m75-*'
      - 'rootfs/alpine/packages-m75-gdb.txt'
      - 'scripts/stage-alpine-prebuilt-overlay.sh'
      - 'scripts/prebuilt-profile-catalog.tsv'
      - 'scripts/check-prebuilt-profile-catalog.py'
      - 'scripts/native-qemu-target.sh'
      - 'scripts/check-native-qemu-target.py'
      - '.github/workflows/m75-gdb.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  original-inspection:
    name: original GDB actual inferior stop and resume on NaSeed / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Shared kernel architecture and host procfs owner
        run: |
          set -eu
          sh -n scripts/stage-m75-prebuilt.sh scripts/probe-m75-gdb.sh tests/m75-gdb-run.sh
          python3 scripts/check-three-isa-core.py
          python3 scripts/check-prebuilt-profile-catalog.py
          python3 scripts/check-native-qemu-target.py
          cc -std=c11 -Wall -Wextra -Werror -ffunction-sections -fdata-sections -Wl,--gc-sections -I kernel scripts/test-ptrace-owner.c kernel/task/ptrace.c -o /tmp/nas-m75-ptrace-owner
          /tmp/nas-m75-ptrace-owner
          cc -std=c11 -Wall -Wextra -Werror -ffunction-sections -fdata-sections -Wl,--gc-sections -I kernel scripts/test-ptrace-wait-ownership.c kernel/task/process.c -o /tmp/nas-m75-ptrace-wait
          /tmp/nas-m75-ptrace-wait
          cc -std=c11 -Wall -Wextra -Werror -ffunction-sections -fdata-sections -Wl,--gc-sections -I kernel scripts/test-remote-task-read.c kernel/mm/remote_copy.c kernel/mm/mm.c -o /tmp/nas-m75-remote
          /tmp/nas-m75-remote
      - name: Install native QEMU and host rootfs tools
        timeout-minutes: 12
        run: |
          set -eu
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'clang:clang' 'ld.lld:lld' 'readelf:binutils' 'cpio:cpio' \
                      'xorriso:xorriso' 'mformat:mtools' 'sgdisk:gdisk' \
                      'qemu-riscv64:qemu-user'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          case "${{ matrix.port }}" in
            amd64)
              command -v qemu-system-x86_64 >/dev/null || missing="$missing qemu-system-x86"
              test -f /usr/share/OVMF/OVMF_CODE_4M.fd || \
                test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf" ;;
            riscv64)
              command -v qemu-system-riscv64 >/dev/null || missing="$missing qemu-system-misc"
              test -f /usr/share/qemu-efi-riscv64/RISCV_VIRT_CODE.fd || missing="$missing qemu-efi-riscv64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
            arm64)
              command -v qemu-system-aarch64 >/dev/null || missing="$missing qemu-system-arm"
              test -f /usr/share/AAVMF/AAVMF_CODE.fd || missing="$missing qemu-efi-aarch64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
          esac
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
      - name: Original Alpine GDB actual inferior in native QEMU
        timeout-minutes: 24
        run: sh scripts/probe-m75-gdb.sh ${{ matrix.port }}
      - name: Retain all actual QEMU and apk failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m75-gdb-${{ matrix.port }}
          path: |
            build/external/m75-gdb/${{ matrix.port }}/apk-install.log
            build/external/m75-gdb/${{ matrix.port }}/requested-packages.txt
            build/busybox-source-parity-x86/m75-attach.clean.log
            build/port-riscv64/full/matrix-source/m75-attach.clean.log
            build/port-aarch64/full/matrix-source/m75-attach.clean.log
          if-no-files-found: ignore
