name: NaSeed M215 five original Alpine ELFs, x86 native pilot

# One-shot push trigger: only adding/modifying this workflow schedules the
# long first/reopen QEMU, not unrelated kernel/CI changes.
on:
  push:
    branches: [naseed-app-batch2]
    paths:
      - '.github/workflows/m215-five-original-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-five-x86:
    name: Five distinct signed original ELF/first+reopen ext4 / amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: true
      - name: Check exactly five honest semantic probes and shared ABI
        run: |
          set -eu
          python3 scripts/test-m215-alpine-host.py
          python3 scripts/test-m213-alpine-host.py
          python3 scripts/test-m206-alpine-host.py
          python3 scripts/check-three-isa-core.py
          python3 scripts/check-architecture-boundaries.py
          sh scripts/check-pipe-capacity.sh
          sh scripts/check-netlink-generic.sh
          sh scripts/check-m191-pid1-quiesce.sh
      - name: Install native x86 QEMU and physical ext4 tools
        timeout-minutes: 18
        run: |
          set -eu
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'cmake:cmake' 'g++:g++' 'clang:clang' 'ld.lld:lld' \
                      'qemu-system-x86_64:qemu-system-x86' \
                      'readelf:binutils' 'cpio:cpio' 'mke2fs:e2fsprogs' \
                      'debugfs:e2fsprogs' 'e2fsck:e2fsprogs' \
                      'xorriso:xorriso' 'mformat:mtools' 'sgdisk:gdisk' \
                      'curl:curl' 'python3:python3' 'openssl:openssl'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          test -f /usr/share/OVMF/OVMF_CODE_4M.fd || \
            test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf"
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
      - name: Verify exactly five real signed native APK ELFs and unique SHA
        timeout-minutes: 18
        run: |
          set -eu
          sh scripts/inventory-m141-signed-apks.sh amd64 m215
          tsv=build/external/m215-candidate-inventory/amd64/candidates.tsv
          awk -F '\t' 'NR > 1 { n++; if ($3 != "NATIVE_ELF") bad++ } END {
            if (n != 5 || bad) exit 1
          }' "$tsv"
          unique=$(awk -F '\t' 'NR > 1 { print $4 }' "$tsv" | sort -u | wc -l)
          test "$unique" -eq 5
          echo '[M215 SIGNED ELF PASS] official Alpine APK/index signatures, 5 unique native ELF SHA'
      - name: Run real first and independent second x86 QEMU with strict five-ELF proof
        timeout-minutes: 55
        env:
          NAS_M215_PUBLIC_QEMU_TIMEOUT: '2500'
          NAS_M215_PUBLIC_SECONDS: '2400'
          NAS_M215_REOPEN_SECONDS: '600'
        run: sh scripts/probe-m215-alpine-pilot.sh amd64
      - name: Preserve genuine source, guest, wire and physical ledger evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m215-five-original-amd64
          path: |
            build/external/m215-candidate-inventory/amd64/candidates.tsv
            build/external/m215-candidate-inventory/amd64/signed-cache.sha256
            build/external/m215-candidate-inventory/amd64/apk-install.log
            build/external/m215-candidate-inventory/amd64/apk-offline-proof.log
            build/external/m191-alpine-rootfs/amd64/m215-compat-report.json
            build/external/m191-alpine-rootfs/amd64/m215-first-runner.log
            build/external/m191-alpine-rootfs/amd64/m197-live.serial.log
            build/external/m191-alpine-rootfs/amd64/m197-reopen-runner.log
            build/external/m191-alpine-rootfs/amd64/m197-public-wire.json
            build/external/m191-alpine-rootfs/amd64/m197-public-wire.pcap
            build/acceptance/**/m197-batch*.log
            build/busybox-source-parity-x86/m197-batch*.log
