name: NaSeed M58/M59/M60 original prebuilt terminal suite — three native ISAs
on:
  pull_request:
    paths:
      - 'tests/m58-*'
      - 'tests/m59-*'
      - 'tests/m60-*'
      - 'scripts/m58-runtime-cases.tsv'
      - 'scripts/m59-worktree-cases.tsv'
      - 'scripts/m60-terminal-cases.tsv'
      - 'scripts/probe-m58-runtime.sh'
      - 'scripts/probe-m59-worktree.sh'
      - 'scripts/probe-m60-terminals.sh'
      - 'scripts/stage-m58-prebuilt.sh'
      - 'scripts/stage-m59-prebuilt.sh'
      - 'scripts/stage-m60-prebuilt.sh'
      - 'scripts/stage-alpine-prebuilt-overlay.sh'
      - 'scripts/m58-original-elfs.txt'
      - 'scripts/m58-rootfs-copies.tsv'
      - 'scripts/m59-original-elfs.txt'
      - 'scripts/m59-rootfs-copies.tsv'
      - 'scripts/m60-original-elfs.txt'
      - 'scripts/m60-rootfs-copies.tsv'
      - 'scripts/probe-x86-busybox-parity.sh'
      - 'scripts/probe-riscv64-busybox-matrix.sh'
      - 'scripts/probe-aarch64-busybox-matrix.sh'
      - 'rootfs/alpine/packages-m58-runtime.txt'
      - 'rootfs/alpine/packages-m59-worktree.txt'
      - 'rootfs/alpine/packages-m60-terminal.txt'
      - 'kernel/**'
      - '.github/workflows/m58-original-runtime.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  real-programs:
    name: signed original Bash/Tcl/OpenSSL + worktree + less/tmux / ${{ matrix.port }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Validate guest test scripts and shared ISA architecture contract
        run: |
          set -eu
          sh -n scripts/stage-alpine-prebuilt-overlay.sh scripts/stage-m58-prebuilt.sh scripts/probe-m58-runtime.sh tests/m58-runtime-run.sh
          sh -n scripts/stage-m59-prebuilt.sh scripts/probe-m59-worktree.sh tests/m59-*.sh
          sh -n scripts/stage-m60-prebuilt.sh scripts/probe-m60-terminals.sh tests/m60-*.sh
          bash -n tests/m58-bash-suite.sh
          python3 scripts/check-three-isa-core.py
      - name: Install native QEMU and host rootfs tools
        timeout-minutes: 12
        run: |
          set -eu
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'clang:clang' 'ld.lld:lld' 'readelf:binutils' 'cpio:cpio' \
                      'xorriso:xorriso' 'mformat:mtools' 'sgdisk:gdisk' \
                      'qemu-riscv64:qemu-user'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          case "${{ matrix.port }}" in
            amd64)
              command -v qemu-system-x86_64 >/dev/null || missing="$missing qemu-system-x86"
              test -f /usr/share/OVMF/OVMF_CODE_4M.fd || \
                test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf" ;;
            riscv64)
              command -v qemu-system-riscv64 >/dev/null || missing="$missing qemu-system-misc"
              test -f /usr/share/qemu-efi-riscv64/RISCV_VIRT_CODE.fd || missing="$missing qemu-efi-riscv64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
            arm64)
              command -v qemu-system-aarch64 >/dev/null || missing="$missing qemu-system-arm"
              test -f /usr/share/AAVMF/AAVMF_CODE.fd || missing="$missing qemu-efi-aarch64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
          esac
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
      - name: Host-stage signed ELF and run original real programs across three native QEMU boots
        timeout-minutes: 24
        run: |
          sh scripts/probe-m58-runtime.sh ${{ matrix.port }}
          sh scripts/probe-m59-worktree.sh ${{ matrix.port }}
          sh scripts/probe-m60-terminals.sh ${{ matrix.port }}
      - name: Preserve full guest evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m58-prebuilt-${{ matrix.port }}
          path: |
            build/external/m39-packages/${{ matrix.port }}/apk-install.log
            build/external/m58-runtime/${{ matrix.port }}/apk-install.log
            build/external/m58-runtime/${{ matrix.port }}/requested-packages.txt
            build/external/m59-worktree/${{ matrix.port }}/apk-install.log
            build/external/m59-worktree/${{ matrix.port }}/requested-packages.txt
            build/external/m60-terminal/${{ matrix.port }}/apk-install.log
            build/external/m60-terminal/${{ matrix.port }}/requested-packages.txt
            build/busybox-source-parity-x86/m58-runtime.clean.log
            build/port-riscv64/full/matrix-source/m58-runtime.clean.log
            build/port-aarch64/full/matrix-source/m58-runtime.clean.log
            build/busybox-source-parity-x86/m59-worktree.clean.log
            build/port-riscv64/full/matrix-source/m59-worktree.clean.log
            build/port-aarch64/full/matrix-source/m59-worktree.clean.log
            build/busybox-source-parity-x86/m60-terminal.clean.log
            build/port-riscv64/full/matrix-source/m60-terminal.clean.log
            build/port-aarch64/full/matrix-source/m60-terminal.clean.log
          if-no-files-found: ignore
