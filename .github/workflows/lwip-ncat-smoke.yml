name: NaSeed lwIP signed Alpine Ncat loopback (x86 QEMU smoke)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-x86-ncat:
    name: Real Alpine /usr/bin/ncat, lwIP TCP, x86-64 QEMU
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
      - name: Verify pinned official lwIP source
        run: |
          set -eu
          test -s third_party/lwip/src/include/lwip/opt.h
          test "$(git -C third_party/lwip rev-parse HEAD)" = \
            77dcd25a72509eb83f72b033d219b1d40cd8eb95
      - name: Validate narrow smoke selection
        run: |
          set -eu
          sh -n scripts/probe-lwip-ncat-smoke.sh
          sh -n scripts/probe-x86-busybox-parity.sh
          sh -n scripts/stage-m141-prebuilt.sh
          test "$(awk -F '\t' '$1 !~ /^#/ && NF { count++ } END {print count+0}' scripts/lwip-ncat-cases.tsv)" -eq 1
          grep -Fq 'M141_SYSTEM_NCAT_LOOPBACK_PASS' scripts/lwip-ncat-cases.tsv
      - name: Install signed APK staging and x86 QEMU dependencies
        timeout-minutes: 12
        run: |
          set -eu
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'clang:clang' 'ld.lld:lld' 'readelf:binutils' \
                      'cpio:cpio' 'xorriso:xorriso' 'mformat:mtools' \
                      'sgdisk:gdisk' 'qemu-riscv64:qemu-user'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          command -v qemu-system-x86_64 >/dev/null || missing="$missing qemu-system-x86"
          test -f /usr/share/OVMF/OVMF_CODE_4M.fd || \
          test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf"
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
      - name: Run exactly one native signed Ncat loopback case
        timeout-minutes: 35
        run: sh scripts/probe-lwip-ncat-smoke.sh
      - name: Preserve signed APK inventory and QEMU serial
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lwip-ncat-amd64-native-qemu
          path: |
            build/external/m141-batch/amd64/apk-install.log
            build/external/m141-batch/amd64/requested-packages.txt
            build/external/m141-batch/amd64/*.sha256
            build/busybox-source-parity-x86/m141-batch.clean.log
            build/busybox-source-parity-x86/m141-batch.serial.log
          if-no-files-found: ignore
