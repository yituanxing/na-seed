name: NaSeed M116 15 original image and data-processing Linux ELFs, one QEMU boot per ISA
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  signed-original-software:
    name: M116 15 signed original Linux ELF functional checks / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate original signed APK catalog and functional guest assertions
        timeout-minutes: 3
        run: |
          set -eu
          sh -n scripts/stage-alpine-prebuilt-overlay.sh \
                scripts/stage-m116-prebuilt.sh \
                scripts/probe-m116-batch.sh \
                tests/m116-batch-run.sh
          python3 scripts/check-prebuilt-profile-catalog.py
          python3 scripts/check-native-qemu-target.py
          python3 scripts/check-three-isa-core.py
      - name: Install host tools and native target QEMU
        timeout-minutes: 12
        run: sh scripts/ci-install-signed-alpine-qemu-deps.sh ${{ matrix.port }}
      - name: Run 15 signed Alpine original binaries inside ONE NaSeed QEMU guest
        timeout-minutes: 45
        run: sh scripts/probe-m116-batch.sh ${{ matrix.port }}
      - name: Retain verified APK provenance and complete native guest serial on pass
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: m116-signed-original-elf-batch-pass-${{ matrix.port }}
          path: |
            build/external/m116-batch/${{ matrix.port }}/apk-install.log
            build/external/m116-batch/${{ matrix.port }}/requested-packages.txt
            build/external/m116-batch/${{ matrix.port }}/*.sha256
            build/busybox-source-parity-x86/m116-batch.clean.log
            build/port-riscv64/full/matrix-source/m116-batch.clean.log
            build/port-aarch64/full/matrix-source/m116-batch.clean.log
          if-no-files-found: error
      - name: Preserve genuine failure serial and unchanged original ELF rootfs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m116-signed-original-elf-batch-fail-${{ matrix.port }}
          path: |
            build/external/m116-batch/${{ matrix.port }}/apk-install.log
            build/external/m116-batch/${{ matrix.port }}/requested-packages.txt
            build/external/m116-batch/${{ matrix.port }}/rootfs.cpio
            build/external/m116-batch/${{ matrix.port }}/*.sha256
            build/busybox-source-parity-x86/m116-batch.clean.log
            build/port-riscv64/full/matrix-source/m116-batch.clean.log
            build/port-aarch64/full/matrix-source/m116-batch.clean.log
          if-no-files-found: ignore
