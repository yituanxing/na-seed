name: NaSeed M164 real serial keyboard to visible QEMU display three ISA

on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  real-hardware-console-display:
    name: M164 actual UART input and physical pixel changes / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
      - name: Enforce optional UART input and exact physical display contract
        run: |
          set -eu
          for script in scripts/probe-m164-batch.sh scripts/stage-m164-prebuilt.sh \
                        scripts/host-configure-m164-batch.sh \
                        scripts/probe-x86-busybox-parity.sh \
                        scripts/probe-riscv64-busybox-matrix.sh \
                        scripts/probe-aarch64-busybox-matrix.sh; do
            sh -n "$script"
          done
          python3 -m py_compile scripts/m161-qmp-verify.py scripts/m164-serial-qmp-verify.py
          python3 scripts/check-prebuilt-profile-catalog.py
          python3 scripts/check-m164-interactive.py
          python3 scripts/check-three-isa-core.py
          python3 scripts/check-architecture-boundaries.py
      - name: Install GCC Linux native ABI toolchains and QEMU UEFI firmware
        timeout-minutes: 18
        run: |
          set -eu
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'clang:clang' 'ld.lld:lld' 'readelf:binutils' \
                      'cpio:cpio' 'mke2fs:e2fsprogs' 'xorriso:xorriso' \
                      'mformat:mtools' 'sgdisk:gdisk' 'gcc:gcc' \
                      'qemu-riscv64:qemu-user'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          case '${{ matrix.port }}' in
            amd64)
              command -v qemu-system-x86_64 >/dev/null || missing="$missing qemu-system-x86"
              test -f /usr/share/OVMF/OVMF_CODE_4M.fd || \
              test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf" ;;
            riscv64)
              command -v riscv64-linux-gnu-gcc >/dev/null || missing="$missing gcc-riscv64-linux-gnu"
              test -f /usr/riscv64-linux-gnu/include/bits/wordsize.h && \
              test -f /usr/riscv64-linux-gnu/lib/libc.a || \
                missing="$missing libc6-dev-riscv64-cross"
              command -v qemu-system-riscv64 >/dev/null || missing="$missing qemu-system-misc"
              test -f /usr/share/qemu-efi-riscv64/RISCV_VIRT_CODE.fd || missing="$missing qemu-efi-riscv64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
            arm64)
              command -v aarch64-linux-gnu-gcc >/dev/null || missing="$missing gcc-aarch64-linux-gnu"
              test -f /usr/aarch64-linux-gnu/include/bits/wordsize.h && \
              test -f /usr/aarch64-linux-gnu/lib/libc.a || \
                missing="$missing libc6-dev-arm64-cross"
              command -v qemu-system-aarch64 >/dev/null || missing="$missing qemu-system-arm"
              test -f /usr/share/AAVMF/AAVMF_CODE.fd || \
              test -f /usr/share/qemu-efi-aarch64/QEMU_EFI.fd || missing="$missing qemu-efi-aarch64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
          esac
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
      - name: QEMU serial keyboard real invalid flip and quit three-screen proof
        timeout-minutes: 58
        run: sh scripts/probe-m164-batch.sh ${{ matrix.port }}
      - name: Preserve serial commands and independently sampled QEMU screen frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m164-physical-serial-screen-${{ matrix.port }}
          path: |
            build/external/m164-batch/${{ matrix.port }}/apk-install.log
            build/external/m164-batch/${{ matrix.port }}/*.sha256
            build/external/m164-batch/${{ matrix.port }}/m164-serial-qmp-check.log
            build/external/m164-batch/${{ matrix.port }}/m164-first.ppm
            build/external/m164-batch/${{ matrix.port }}/m164-unchanged.ppm
            build/external/m164-batch/${{ matrix.port }}/m164-flipped.ppm
            build/busybox-source-parity-x86/m164-batch.clean.log
            build/busybox-source-parity-x86/m164-batch.serial.log
            build/port-riscv64/full/matrix-source/m164-batch.clean.log
            build/port-riscv64/full/matrix-source/m164-batch.serial.log
            build/port-aarch64/full/matrix-source/m164-batch.clean.log
            build/port-aarch64/full/matrix-source/m164-batch.serial.log
          if-no-files-found: ignore
