name: NaSeed 8 signed Alpine system utilities, one x86 QEMU boot

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/lwip-system-cohort-smoke.yml'
      - 'scripts/lwip-system-cohort-cases.tsv'
      - 'scripts/probe-lwip-system-cohort-smoke.sh'
      - 'scripts/m141-rootfs-copies.tsv'
      - 'tests/m141-system-cohort-run.sh'
      - 'tests/m141-system-run.sh'
      - 'scripts/stage-m141-prebuilt.sh'
      - 'kernel/fs/**'
      - 'kernel/task/**'
      - 'ports/lwip/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  x86-eight-real-elf-system-cohort:
    name: Eight original Alpine ELFs with genuine kernel side effects
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
      - name: Verify pinned official lwIP and eight exact unique Alpine ELF targets
        run: |
          set -eu
          test "$(git -C third_party/lwip rev-parse HEAD)" = \
            77dcd25a72509eb83f72b033d219b1d40cd8eb95
          sh -n scripts/probe-lwip-system-cohort-smoke.sh
          sh -n tests/m141-system-cohort-run.sh
          sh -n tests/m141-system-run.sh
          test "$(awk -F '\t' '$1 !~ /^#/ && NF {n++} END {print n+0}' scripts/lwip-system-cohort-cases.tsv)" -eq 1
          for elf in usr/bin/tcpdump usr/bin/ssh-agent usr/bin/ssh-add bin/ionice bin/pidwait usr/bin/exch sbin/mkfs.bfs sbin/fdisk; do
            grep -Fxq "$elf" scripts/m141-original-elfs.txt
          done
          grep -Fq M141_SIGNED_SYSTEM_COHORT_PASS scripts/lwip-system-cohort-cases.tsv
      - name: Install x86 QEMU and signed Alpine rootfs staging tools
        timeout-minutes: 12
        run: |
          set -eu
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'clang:clang' 'ld.lld:lld' 'readelf:binutils' \
                      'cpio:cpio' 'xorriso:xorriso' 'mformat:mtools' \
                      'sgdisk:gdisk' 'qemu-riscv64:qemu-user'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          command -v qemu-system-x86_64 >/dev/null || missing="$missing qemu-system-x86"
          test -f /usr/share/OVMF/OVMF_CODE_4M.fd || \
          test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf"
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
      - name: Prove eight original Alpine binaries in one native x86 QEMU boot
        timeout-minutes: 35
        run: sh scripts/probe-lwip-system-cohort-smoke.sh
      - name: Preserve signed ELF hashes and independent guest diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lwip-eight-system-utilities-amd64-qemu
          path: |
            build/external/m141-batch/amd64/apk-install.log
            build/external/m141-batch/amd64/requested-packages.txt
            build/external/m141-batch/amd64/*.sha256
            build/busybox-source-parity-x86/m141-batch.clean.log
            build/busybox-source-parity-x86/m141-batch.serial.log
          if-no-files-found: ignore
