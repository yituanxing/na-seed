name: NaSeed M143 original signed Wget/aria2c/lighttpd HTTP (x86 QEMU)

on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  m143-original-http:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
      - name: Static check original signed ELF admission and HTTP oracle
        run: |
          set -eu
          for script in scripts/stage-m143-prebuilt.sh scripts/host-configure-m143-batch.sh scripts/probe-m143-http-wire-smoke.sh tests/m143-http-run.sh; do
            sh -n "$script"
          done
          python3 -m py_compile scripts/m143-http-server.py
          test "$(awk -F '\t' '$1 !~ /^#/ && NF {n++} END {print n+0}' scripts/m143-http-cases.tsv)" -eq 1
          test "$(grep -vc '^#' scripts/m143-original-elfs.txt)" -eq 3
          grep -Fxq 'tests/m143-http-run.sh	tests/m143-http-run.sh' scripts/m143-rootfs-copies.tsv || grep -Fq 'tests/m143-http-run.sh' scripts/m143-rootfs-copies.tsv
          grep -Fq 'm143-batch' scripts/prebuilt-profile-catalog.tsv
      - name: Install native QEMU and official signed Alpine staging prerequisites
        timeout-minutes: 12
        run: |
          set -eu
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'clang:clang' 'ld.lld:lld' 'readelf:binutils' \
                      'cpio:cpio' 'xorriso:xorriso' 'mformat:mtools' 'sgdisk:gdisk'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          command -v qemu-system-x86_64 >/dev/null || missing="$missing qemu-system-x86"
          test -f /usr/share/OVMF/OVMF_CODE_4M.fd || \
          test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf"
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
      - name: Real QEMU signed Wget, aria2c, curl, OpenSSL and guest lighttpd
        timeout-minutes: 40
        run: sh scripts/probe-m143-http-wire-smoke.sh
      - name: Preserve host network oracle, guest serial, signed ELF hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m143-authentic-http-amd64-qemu
          path: |
            build/external/m143-batch/amd64/apk-install.log
            build/external/m143-batch/amd64/requested-packages.txt
            build/external/m143-batch/amd64/*.sha256
            build/external/m143-batch/amd64/host-m143-http.log
            build/external/m143-batch/amd64/virtio-m143-http.pcap
            build/busybox-source-parity-x86/m143-batch.clean.log
            build/busybox-source-parity-x86/m143-batch.serial.log
          if-no-files-found: ignore
