name: NaSeed M148 35 NEW signed Alpine codec roundtrips

on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  real-signed-codecs:
    name: M148 35 new native Alpine codec ELFs / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        port: ${{ fromJSON((github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-m148-multiarch')) && '["amd64","riscv64","arm64"]' || '["amd64"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
      - name: Verify authoritative profile and 35 original ELF identities
        timeout-minutes: 4
        run: |
          set -eu
          for script in scripts/stage-m148-prebuilt.sh \
                        scripts/probe-m148-batch.sh \
                        scripts/stage-alpine-prebuilt-overlay.sh \
                        tests/m148-batch-run.sh; do
            sh -n "$script"
          done
          python3 scripts/check-prebuilt-profile-catalog.py
          python3 scripts/check-three-isa-core.py
          sh scripts/check-vfs-provider.sh
          sh scripts/check-m86-txn.sh
          test "$(awk '!/^#/ && NF {n++} END {print n+0}' scripts/m148-original-elfs.txt)" -eq 35
          test "$(awk '!/^#/ && NF {n++} END {print n+0}' scripts/m148-expected-markers.txt)" -eq 36
          test "$(awk '!/^#/ && NF {print $0}' scripts/m148-original-elfs.txt | sort -u | wc -l)" -eq 35
      - name: Install genuine Alpine APK staging tools and native QEMU
        timeout-minutes: 12
        run: |
          set -eu
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'clang:clang' 'ld.lld:lld' 'readelf:binutils' \
                      'cpio:cpio' 'mke2fs:e2fsprogs' 'xorriso:xorriso' \
                      'mformat:mtools' 'sgdisk:gdisk' \
                      'qemu-riscv64:qemu-user'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          case '${{ matrix.port }}' in
            amd64)
              command -v qemu-system-x86_64 >/dev/null || missing="$missing qemu-system-x86"
              test -f /usr/share/OVMF/OVMF_CODE_4M.fd || \
                test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf" ;;
            riscv64)
              command -v qemu-system-riscv64 >/dev/null || missing="$missing qemu-system-misc"
              test -f /usr/share/qemu-efi-riscv64/RISCV_VIRT_CODE.fd || missing="$missing qemu-efi-riscv64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
            arm64)
              command -v qemu-system-aarch64 >/dev/null || missing="$missing qemu-system-arm"
              test -f /usr/share/AAVMF/AAVMF_CODE.fd || \
                test -f /usr/share/qemu-efi-aarch64/QEMU_EFI.fd || missing="$missing qemu-efi-aarch64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
          esac
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
          # x86 runner suppresses mkisofs stderr; fail here explicitly rather
          # than reporting a later 'missing ISO' as a bootloader/kernel defect.
          command -v xorriso
          command -v mke2fs
      - name: Execute 22 true format roundtrips across 35 unchanged Alpine ELFs
        timeout-minutes: 48
        run: sh scripts/probe-m148-batch.sh ${{ matrix.port }}
      - name: Preserve full native serial and upstream signed ELF SHA256 list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m148-original-codecs-${{ matrix.port }}-proof
          path: |
            build/external/m148-batch/${{ matrix.port }}/apk-install.log
            build/external/m148-batch/${{ matrix.port }}/requested-packages.txt
            build/external/m148-batch/${{ matrix.port }}/*.sha256
            build/busybox-source-parity-x86/m148-batch.clean.log
            build/busybox-source-parity-x86/m148-batch.serial.log
            build/port-riscv64/full/matrix-source/m148-batch.clean.log
            build/port-riscv64/full/matrix-source/m148-batch.serial.log
            build/port-aarch64/full/matrix-source/m148-batch.clean.log
            build/port-aarch64/full/matrix-source/m148-batch.serial.log
          if-no-files-found: ignore
