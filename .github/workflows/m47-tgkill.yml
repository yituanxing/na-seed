name: NaSeed M47 native Linux thread-directed signals and original pthread Zstd
# M50: retained as an opt-in single-milestone diagnostic. PR auto-validation
# has moved to m50-alpine-matrix.yml: same twelve scripts/real QEMU checks,
# grouped by native ISA and workload class to reuse installation and builds.
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  installed-packages:
    name: tkill/tgkill Linux signal routing + original zstd / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Install headless QEMU and boot toolchain
        timeout-minutes: 12
        run: |
          set -eu
          sh scripts/ci-install-signed-alpine-qemu-deps.sh ${{ matrix.port }} --explicit-tools clang:clang ld.lld:lld readelf:binutils cpio:cpio xorriso:xorriso mformat:mtools sgdisk:gdisk qemu-riscv64:qemu-user
      - name: Reject CPIO fixed-file-count regressions before expensive package fetch
        run: sh scripts/check-bootfs-scale.sh
      - name: Run native TID-directed signal and group fatal exits with signed Alpine zstd
        timeout-minutes: 12
        run: sh scripts/probe-m47-tgkill.sh ${{ matrix.port }}
      - name: Preserve original package/ELF/serial evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m47-tgkill-${{ matrix.port }}
          path: |
            build/external/m47-tgkill/${{ matrix.port }}/apk-install.log
            build/external/m47-tgkill/${{ matrix.port }}/requested-packages.txt
            build/external/m47-tgkill/${{ matrix.port }}/rootfs/tests/run-group.sh
            build/busybox-source-parity-x86/m47-tgkill.clean.log
            build/port-riscv64/full/matrix-source/m47-tgkill.clean.log
            build/port-aarch64/full/matrix-source/m47-tgkill.clean.log
          if-no-files-found: ignore
