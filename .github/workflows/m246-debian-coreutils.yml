name: NaSeed M246 original Debian glibc coreutils batch x86

# New independent acceptance: four original glibc coreutils within one
# genuine NaSeed QEMU boot. Do not weaken or redefine M245.
on:
  push:
    branches: [na-alpine-direct-use]
    paths:
      - '.github/workflows/m246-debian-coreutils.yml'
      - 'scripts/m246-*'
      - 'tests/m246-*'
      - 'docs/m246-*'
      - 'scripts/m245-fetch-debian-dynamic.py'
      - 'scripts/m245-debian-versions.tsv'
      - 'scripts/fetch-busybox-fixture.sh'
      - 'scripts/stage-busybox-rootfs.sh'
      - 'scripts/probe-x86-busybox-parity.sh'
      - 'kernel/mm/vm.c'
      - 'kernel/task/elf.c'
      - 'kernel/task/elf_segments.c'
      - 'kernel/task/exec.c'
      - 'kernel/task/sched.c'
      - 'kernel/boot_image.c'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-original-debian-coreutils-batch:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: true
      - name: Offline negative contracts and real kernel mmap policy
        run: |
          set -eu
          python3 -B tests/m245-debian-dynamic-host.py
          python3 -B tests/m246-debian-coreutils-host.py
          sh -n scripts/m246-probe-debian-coreutils.sh
          sh scripts/check-m86-txn.sh
      - name: Install Debian signed-index and native x86 QEMU prerequisites
        timeout-minutes: 13
        run: |
          set -eu
          PATH=/usr/sbin:/sbin:$PATH
          export PATH
          sh scripts/ci-ubuntu-mirror.sh
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
            -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            debian-archive-keyring cmake g++ clang lld binutils cpio \
            xorriso mtools curl python3 qemu-system-x86 ovmf
          test -s /usr/share/keyrings/debian-archive-keyring.gpg
          test -s /usr/share/OVMF/OVMF_CODE_4M.fd || \
            test -s /usr/share/OVMF/OVMF_CODE.fd
      - name: Restore pinned official working Limine seed
        uses: ./.github/actions/naseed-limine-seed
        with:
          github-token: ${{ github.token }}
      - name: Four original Debian glibc programs in ONE real NaSeed QEMU
        timeout-minutes: 19
        run: sh scripts/m246-probe-debian-coreutils.sh amd64
      - name: Preserve signed package bill of materials and native serial
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m246-debian-glibc-coreutils-amd64
          retention-days: 7
          if-no-files-found: warn
          path: |
            build/m246-debian-coreutils/amd64/source/manifest.json
            build/m246-debian-coreutils/amd64/m246-cases.tsv
            build/busybox-source-parity-x86/m105-m246-debian-coreutils.clean.log
            build/busybox-source-parity-x86/m105-m246-debian-coreutils.serial.log
