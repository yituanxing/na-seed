name: NaSeed M176 network RX IRQ + original Alpine Ncat + desktop three ISA

on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  host-contract:
    name: M176 existing upstream net port, IRQ producer/consumer and strict stats
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
      - name: No device-model layering regressions
        run: |
          set -eu
          python3 scripts/check-three-isa-core.py
          python3 scripts/check-architecture-boundaries.py
          sh scripts/check-m176-net-irq.sh

  three-isa-real-wire:
    name: M176 two real NIC IRQs, original Alpine Ncat and 5-frame GUI / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    needs: host-contract
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
      - name: Install native cross toolchains, EFI and system QEMU
        timeout-minutes: 18
        run: |
          set -eu
          sh scripts/ci-install-signed-alpine-qemu-deps.sh ${{ matrix.port }} --arm64-efi-fallback --cross-cxx --explicit-tools cmake:cmake g++:g++ clang:clang ld.lld:lld readelf:binutils cpio:cpio mke2fs:e2fsprogs xorriso:xorriso mformat:mtools sgdisk:gdisk gcc:gcc qemu-riscv64:qemu-user curl:curl
      - name: Real triple-architecture network IRQ + Ncat host wire + desktop
        timeout-minutes: 78
        run: sh scripts/probe-m176-net-irq.sh ${{ matrix.port }}
      - name: Preserve guest serial, original APK, QEMU TCP PCAP and five frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m176-network-irq-${{ matrix.port }}
          path: |
            build/external/m174-software-batch/${{ matrix.port }}/m176-host-http.log
            build/external/m174-software-batch/${{ matrix.port }}/m176-wire.pcap
            build/external/m174-software-batch/${{ matrix.port }}/m174-qmp-check.log
            build/external/m174-software-batch/${{ matrix.port }}/m173-*.ppm
            build/external/m174-software-batch/${{ matrix.port }}/m174-software-original-signed-elfs.sha256
            build/external/m174-software-batch/${{ matrix.port }}/apk-install.log
            build/busybox-source-parity-x86/m174-batch.clean.log
            build/busybox-source-parity-x86/m174-batch.serial.log
            build/port-riscv64/full/matrix-source/m174-batch.clean.log
            build/port-riscv64/full/matrix-source/m174-batch.serial.log
            build/port-aarch64/full/matrix-source/m174-batch.clean.log
            build/port-aarch64/full/matrix-source/m174-batch.serial.log
          if-no-files-found: ignore
