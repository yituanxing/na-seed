name: NaSeed M109 signed Alpine original-program batch — one QEMU boot per ISA
on:
  workflow_dispatch:

# One actual QEMU boot per ISA for the ENTIRE original ELF batch. Obsolete
# PR commits must not keep three more expensive emulators running; deliberate
# dispatch runs remain independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  original-software-batch:
    name: M109 original signed Alpine ELF functional batch / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate canonical APK catalog, three ISA mapping and guest scripts
        timeout-minutes: 3
        run: |
          set -eu
          sh -n scripts/stage-alpine-prebuilt-overlay.sh \
                scripts/stage-m109-prebuilt.sh \
                scripts/probe-m109-batch.sh \
                tests/m109-batch-run.sh
          python3 scripts/check-prebuilt-profile-catalog.py
          python3 scripts/check-native-qemu-target.py
          python3 scripts/check-three-isa-core.py
      - name: Install signed APK host staging, headless QEMU and kernel tools
        timeout-minutes: 12
        run: sh scripts/ci-install-signed-alpine-qemu-deps.sh ${{ matrix.port }}
      - name: Run full original prebuilt Linux software batch inside ONE real NaSeed QEMU guest
        timeout-minutes: 35
        run: sh scripts/probe-m109-batch.sh ${{ matrix.port }}
      - name: Retain original signed-package and actual guest-serial proof
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: m109-signed-original-elf-batch-pass-${{ matrix.port }}
          path: |
            build/external/m109-batch/${{ matrix.port }}/apk-install.log
            build/external/m109-batch/${{ matrix.port }}/requested-packages.txt
            build/external/m109-batch/${{ matrix.port }}/*.sha256
            build/busybox-source-parity-x86/m109-batch.clean.log
            build/port-riscv64/full/matrix-source/m109-batch.clean.log
            build/port-aarch64/full/matrix-source/m109-batch.clean.log
          if-no-files-found: error
      - name: Retain whole guest serial and APK provenance on any failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m109-signed-original-elf-batch-fail-${{ matrix.port }}
          path: |
            build/external/m109-batch/${{ matrix.port }}/apk-install.log
            build/external/m109-batch/${{ matrix.port }}/requested-packages.txt
            build/external/m109-batch/${{ matrix.port }}/rootfs.cpio
            build/external/m109-batch/${{ matrix.port }}/*.sha256
            build/busybox-source-parity-x86/m109-batch.clean.log
            build/port-riscv64/full/matrix-source/m109-batch.clean.log
            build/port-aarch64/full/matrix-source/m109-batch.clean.log
          if-no-files-found: ignore
