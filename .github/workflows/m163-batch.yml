name: NaSeed M163 33 new signed Alpine image ELF three ISA

on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  original-image-elfs:
    name: M163 33 new real Netpbm executables / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
      - name: Audit thirty-three new signed ELF identities and real image cases
        run: |
          set -eu
          for script in scripts/stage-m163-prebuilt.sh scripts/probe-m163-batch.sh \
                        scripts/host-configure-m163-batch.sh tests/m163-batch-run.sh; do
            sh -n "$script"
          done
          python3 scripts/check-prebuilt-profile-catalog.py
          python3 scripts/check-m163-inventory.py
          python3 scripts/check-three-isa-core.py
          python3 scripts/check-architecture-boundaries.py
      - name: Install native QEMU firmware and original Alpine APK staging tools
        timeout-minutes: 14
        run: sh scripts/ci-install-signed-alpine-qemu-deps.sh ${{ matrix.port }} --arm64-efi-fallback mke2fs:e2fsprogs openssl:openssl
      - name: Execute 33 new signed original Alpine image programs on native guests
        timeout-minutes: 58
        run: sh scripts/probe-m163-batch.sh ${{ matrix.port }}
      - name: Preserve signed APK identities and true guest image operations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m163-33-original-${{ matrix.port }}
          path: |
            build/external/m163-batch/${{ matrix.port }}/apk-install.log
            build/external/m163-batch/${{ matrix.port }}/requested-packages.txt
            build/external/m163-batch/${{ matrix.port }}/*.sha256
            build/busybox-source-parity-x86/m163-batch.clean.log
            build/busybox-source-parity-x86/m163-batch.serial.log
            build/port-riscv64/full/matrix-source/m163-batch.clean.log
            build/port-riscv64/full/matrix-source/m163-batch.serial.log
            build/port-aarch64/full/matrix-source/m163-batch.clean.log
            build/port-aarch64/full/matrix-source/m163-batch.serial.log
          if-no-files-found: ignore
