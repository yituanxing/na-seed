name: NaSeed M57 official SQLite 3.54.1 native configure/Make/SQL — three ISAs
on:
  pull_request:
    paths:
      - 'tests/m57-*'
      - 'scripts/probe-m57-native-sqlite.sh'
      - 'scripts/m57-native-sqlite-cases.tsv'
      - 'rootfs/alpine/build.sh'
      - 'rootfs/alpine/packages-native-busybox.txt'
      - 'kernel/**'
      - '.github/workflows/m57-native-sqlite.yml'
  workflow_dispatch:
jobs:
  native-build:
    name: upstream SQLite built and tested inside NaSeed / ${{ matrix.port }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU boot and compiler tools
        timeout-minutes: 12
        run: |
          set -eu
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'clang:clang' 'ld.lld:lld' 'readelf:binutils' 'cpio:cpio' \
                      'xorriso:xorriso' 'mformat:mtools' 'sgdisk:gdisk' \
                      'qemu-riscv64:qemu-user'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          case "${{ matrix.port }}" in
            amd64)
              command -v qemu-system-x86_64 >/dev/null || missing="$missing qemu-system-x86"
              test -f /usr/share/OVMF/OVMF_CODE_4M.fd || \
                test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf" ;;
            riscv64)
              command -v qemu-system-riscv64 >/dev/null || missing="$missing qemu-system-misc"
              test -f /usr/share/qemu-efi-riscv64/RISCV_VIRT_CODE.fd || missing="$missing qemu-efi-riscv64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
            arm64)
              command -v qemu-system-aarch64 >/dev/null || missing="$missing qemu-system-arm"
              test -f /usr/share/AAVMF/AAVMF_CODE.fd || missing="$missing qemu-efi-aarch64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
          esac
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v openssl
          command -v docker
      - name: Official SQLite configure + guest GCC/Make + real SQL transactions
        timeout-minutes: 70
        run: sh scripts/probe-m57-native-sqlite.sh ${{ matrix.port }}
      - name: Preserve exact failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m57-native-sqlite-${{ matrix.port }}
          path: |
            build/external/m57-native-sqlite/${{ matrix.port }}/apk-install.log
            build/external/m57-native-sqlite/${{ matrix.port }}/requested-packages.txt
            build/busybox-source-parity-x86/m57-sqlite.clean.log
            build/port-riscv64/full/matrix-source/m57-sqlite.clean.log
            build/port-aarch64/full/matrix-source/m57-sqlite.clean.log
          if-no-files-found: ignore
