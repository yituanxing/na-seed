name: NaSeed VirtIO-Net + lwIP signed Alpine SSH SCP SFTP wire (x86 QEMU)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  x86-real-ssh-chain:
    name: Real PCI + DHCP + signed Alpine SSH command, SCP/SFTP transfers
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
      - name: Verify original pinned stack, three signed ELFs and one guest case
        run: |
          set -eu
          test "$(git -C third_party/lwip rev-parse HEAD)" = \
            77dcd25a72509eb83f72b033d219b1d40cd8eb95
          sh -n scripts/m142-ssh-chain-probe.sh
          sh -n tests/m142-ssh-chain-run.sh
          sh -n scripts/run.sh
          test "$(awk -F '\t' '$1 !~ /^#/ && NF { n++ } END {print n+0}' scripts/m142-ssh-chain-cases.tsv)" -eq 1
          awk -F '\t' '$1=="tests/m142-ssh-chain-run.sh" && $2==$1 {found++} END {exit found==1?0:1}' scripts/m141-rootfs-copies.tsv
          for exe in usr/bin/ssh usr/bin/scp usr/bin/sftp; do
            grep -Fxq "$exe" scripts/m141-original-elfs.txt
          done
          grep -Fq M142_SIGNED_SSH_CHAIN_CASE_PASS scripts/m142-ssh-chain-cases.tsv
      - name: Install QEMU, signed staging tools and isolated OpenSSH host
        timeout-minutes: 12
        run: |
          set -eu
          PATH=/usr/sbin:/sbin:$PATH
          export PATH
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'clang:clang' 'ld.lld:lld' 'readelf:binutils' \
                      'cpio:cpio' 'xorriso:xorriso' 'mformat:mtools' \
                      'sgdisk:gdisk' 'sshd:openssh-server' \
                      'ssh-keygen:openssh-client'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          command -v qemu-system-x86_64 >/dev/null || missing="$missing qemu-system-x86"
          test -f /usr/share/OVMF/OVMF_CODE_4M.fd || \
          test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf"
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          sudo install -d -m 0755 /run/sshd
          command -v docker
          command -v sshd
          command -v ssh-keygen
      - name: Exercise one-boot Alpine SSH SCP SFTP via temporary OpenSSH keys
        timeout-minutes: 35
        run: sh scripts/m142-ssh-chain-probe.sh
      - name: Preserve only public-key fingerprints, syscall/serial and wire proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lwip-virtio-ssh-chain-amd64-qemu
          path: |
            build/external/m141-batch/amd64/apk-install.log
            build/external/m141-batch/amd64/requested-packages.txt
            build/external/m141-batch/amd64/*.sha256
            build/external/m141-batch/amd64/host-ssh-chain-fingerprint.log
            build/external/m141-batch/amd64/host-ssh-chain.log
            build/external/m141-batch/amd64/host-ssh-chain/ssh_host_ed25519_key.pub
            build/external/m141-batch/amd64/virtio-ssh-chain-wire.pcap
            build/busybox-source-parity-x86/m141-batch.clean.log
            build/busybox-source-parity-x86/m141-batch.serial.log
          if-no-files-found: ignore
