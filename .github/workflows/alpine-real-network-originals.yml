# Unified signed original Alpine M218-M225 network cohort CI.
# All signed ELF, host negatives, two real native QEMU boots, and 16 distinct
# per-profile/per-ISA artifact inventories remain independently verifiable.
name: NaSeed M218-M225 real original Alpine network cohorts
on:
  push:
    branches: [naseed-app-batch2]
    paths:
      - '.github/workflows/alpine-real-network-originals.yml'
      - 'rootfs/alpine/*m218*'
      - 'rootfs/alpine/*m219*'
      - 'rootfs/alpine/*m220*'
      - 'rootfs/alpine/*m221*'
      - 'rootfs/alpine/*m222*'
      - 'rootfs/alpine/*m223*'
      - 'rootfs/alpine/*m224*'
      - 'rootfs/alpine/*m225*'
      - 'scripts/*m218-*'
      - 'scripts/*m219-*'
      - 'scripts/*m220-*'
      - 'scripts/*m221-*'
      - 'scripts/*m222-*'
      - 'scripts/*m223-*'
      - 'scripts/*m224-*'
      - 'scripts/*m225-*'
      - 'scripts/acceptance/ci-original-alpine-network.sh'
      - 'scripts/inventory-m141-signed-apks.sh'
      - 'scripts/probe-alpine-profile.sh'
      - 'scripts/probe-m197-alpine-software-cohort.sh'
      - 'scripts/test-m218-ifstat-host.py'
      - 'scripts/test-m219-utmpdump-host.py'
      - 'tests/m205-software-workload.sh'
      - 'tests/m218-*'
      - 'tests/m218-ifstat-workload.sh'
      - 'tests/m219-*'
      - 'tests/m219-utmpdump-workload.sh'
      - 'tests/m220-*'
      - 'tests/m221-*'
      - 'tests/m222-*'
      - 'tests/m223-*'
      - 'tests/m224-*'
      - 'tests/m225-*'
  workflow_dispatch:
    inputs:
      profile:
        description: Exact original Alpine service/profile
        type: choice
        required: true
        options: [m218, m219, m220, m221, m222, m223, m224, m225]
      port:
        description: Native ISA (or all three)
        type: choice
        default: all
        required: true
        options: [all, amd64, riscv64, arm64]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.profile || 'push' }}
  cancel-in-progress: false
jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      profiles: ${{ steps.choose.outputs.profiles }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Keep original per-profile push path selection
        id: choose
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PROFILE: ${{ inputs.profile }}
        run: |
          python3 - <<'PY'
          import fnmatch, json, os, subprocess
          owner = {"m218":["tests/m218-ifstat-workload.sh","scripts/test-m218-ifstat-host.py","tests/m205-software-workload.sh","scripts/*m218-*","tests/m218-*","rootfs/alpine/*m218*"],"m219":["tests/m219-utmpdump-workload.sh","scripts/test-m219-utmpdump-host.py","scripts/*m219-*","tests/m219-*","rootfs/alpine/*m219*"],"m220":["scripts/*m220-*","tests/m220-*","rootfs/alpine/*m220*"],"m221":["scripts/*m221-*","tests/m221-*","rootfs/alpine/*m221*"],"m222":["scripts/*m222-*","tests/m222-*","rootfs/alpine/*m222*"],"m223":["scripts/*m223-*","tests/m223-*","rootfs/alpine/*m223*"],"m224":["scripts/*m224-*","tests/m224-*","rootfs/alpine/*m224*"],"m225":["scripts/*m225-*","tests/m225-*","rootfs/alpine/*m225*"]}
          shared = {'.github/workflows/alpine-real-network-originals.yml',
                    'scripts/acceptance/ci-original-alpine-network.sh',
                    'scripts/probe-alpine-profile.sh',
                    'scripts/probe-m197-alpine-software-cohort.sh',
                    'scripts/inventory-m141-signed-apks.sh'}
          if os.environ['EVENT_NAME'] == 'workflow_dispatch':
              profiles = [os.environ['PROFILE']]
          else:
              before = os.environ.get('BEFORE', '')
              if not before or set(before) == {'0'}:
                  profiles = list(owner)
              else:
                  files = subprocess.check_output(
                      ['git', 'diff', '--name-only', before, os.environ['GITHUB_SHA']],
                      text=True).splitlines()
                  profiles = [p for p, patterns in owner.items()
                              if any(f in shared or any(fnmatch.fnmatchcase(f, pat)
                                    for pat in patterns) for f in files)]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print('profiles=' + json.dumps(profiles, separators=(',', ':')),
                    file=out)
          PY
  native:
    needs: [select]
    if: ${{ needs.select.outputs.profiles != '[]' }}
    name: ${{ matrix.profile }} original first+reopen native Alpine / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.select.outputs.profiles) }}
        port: ${{ fromJSON(github.event_name == 'push' && '["amd64","riscv64","arm64"]' || inputs.port == 'all' && '["amd64","riscv64","arm64"]' || format('["{0}"]', inputs.port)) }}
    env:
      PROFILE: ${{ matrix.profile }}
      PORT: ${{ matrix.port }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: true
      - name: Verify original protocol host negative and native-ISA contracts
        run: sh scripts/acceptance/ci-original-alpine-network.sh contract "$PROFILE" "$PORT"
      - name: Install original native QEMU and host protocol dependencies
        timeout-minutes: 25
        run: sh scripts/acceptance/ci-original-alpine-network.sh install "$PROFILE" "$PORT"
      - name: Preserve special original kernel or physical ext4 host checks
        timeout-minutes: 15
        run: sh scripts/acceptance/ci-original-alpine-network.sh extra "$PROFILE" "$PORT"
      - name: Verify signed original native ELF and official offline APK closure
        timeout-minutes: 35
        run: sh scripts/acceptance/ci-original-alpine-network.sh verify "$PROFILE" "$PORT"
      - name: Real two-boot native QEMU and independent original protocol workload
        timeout-minutes: 125
        run: sh scripts/acceptance/ci-original-alpine-network.sh runtime "$PROFILE" "$PORT"
      - name: Preserve exact original M218 amd64 evidence
        if: ${{ always() && matrix.profile == 'm218' && matrix.port == 'amd64' }}
        uses: actions/upload-artifact@v4
        with:
          name: m218-original-ifstat-amd64
          path: |
            build/external/m218-candidate-inventory/amd64/candidates.tsv
            build/external/m218-candidate-inventory/amd64/signed-cache.sha256
            build/external/m218-candidate-inventory/amd64/apk-install.log
            build/external/m218-candidate-inventory/amd64/apk-offline-proof.log
            build/external/m191-alpine-rootfs/amd64/m218-compat-report.json
            build/external/m191-alpine-rootfs/amd64/m218-first-runner.log
            build/external/m191-alpine-rootfs/amd64/m197-live.serial.log
            build/external/m191-alpine-rootfs/amd64/m197-reopen-runner.log
            build/external/m191-alpine-rootfs/amd64/m197-public-wire.json
            build/external/m191-alpine-rootfs/amd64/m197-public-wire.pcap
