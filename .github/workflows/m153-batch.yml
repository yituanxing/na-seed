name: NaSeed M153 36 NEW signed Alpine development and binary ELFs

on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  signed-original-software:
    name: M153 36 signed development ELFs / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        port: ${{ fromJSON((github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-m153-multiarch') || contains(github.event.pull_request.labels.*.name, 'run-m151-155-multiarch')) && '["amd64","riscv64","arm64"]' || '["amd64"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
      - name: Check 36 new original paths, source gates and host scripts
        timeout-minutes: 4
        run: |
          set -eu
          for script in scripts/stage-m153-prebuilt.sh \
                        scripts/probe-m153-batch.sh \
                        scripts/host-configure-m153-batch.sh \
                        tests/m153-batch-run.sh; do
            sh -n "$script"
          done
          python3 scripts/check-prebuilt-profile-catalog.py
          python3 scripts/check-three-isa-core.py
          test "$(awk '!/^#/ && NF {n++} END {print n+0}' scripts/m153-original-elfs.txt)" -eq 36
          test "$(awk '!/^#/ && NF {n++} END {print n+0}' scripts/m153-expected-markers.txt)" -eq 37
          test "$(awk '!/^#/ && NF {print $0}' scripts/m153-original-elfs.txt | sort -u | wc -l)" -eq 36
          test "$(awk '!/^#/ && NF {print $0}' scripts/m153-expected-markers.txt | sort -u | wc -l)" -eq 37
          for program in $(awk '!/^#/ && NF {print $0}' scripts/m153-original-elfs.txt); do
            matches=$(grep -Flx "$program" scripts/m[0-9]*-original-elfs.txt | wc -l)
            test "$matches" -eq 1 || { echo "M153 historical duplicate $program ($matches)" >&2; exit 1; }
          done
      - name: Install official APK host tooling and native QEMU
        timeout-minutes: 12
        run: |
          set -eu
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'clang:clang' 'ld.lld:lld' 'readelf:binutils' \
                      'cpio:cpio' 'mke2fs:e2fsprogs' 'xorriso:xorriso' \
                      'mformat:mtools' 'sgdisk:gdisk' 'qemu-riscv64:qemu-user'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          case '${{ matrix.port }}' in
            amd64)
              command -v qemu-system-x86_64 >/dev/null || missing="$missing qemu-system-x86"
              test -f /usr/share/OVMF/OVMF_CODE_4M.fd || \
                test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf" ;;
            riscv64)
              command -v qemu-system-riscv64 >/dev/null || missing="$missing qemu-system-misc"
              test -f /usr/share/qemu-efi-riscv64/RISCV_VIRT_CODE.fd || missing="$missing qemu-efi-riscv64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
            arm64)
              command -v qemu-system-aarch64 >/dev/null || missing="$missing qemu-system-arm"
              test -f /usr/share/AAVMF/AAVMF_CODE.fd || \
                test -f /usr/share/qemu-efi-aarch64/QEMU_EFI.fd || missing="$missing qemu-efi-aarch64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
          esac
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
      - name: Native QEMU 36 authentic Alpine compilation and ELF diagnostic behaviors
        timeout-minutes: 53
        run: sh scripts/probe-m153-batch.sh ${{ matrix.port }}
      - name: Preserve signed APK provenance, ELF hashes and guest serial
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m153-original-${{ matrix.port }}-proof
          path: |
            build/external/m153-batch/${{ matrix.port }}/apk-install.log
            build/external/m153-batch/${{ matrix.port }}/requested-packages.txt
            build/external/m153-batch/${{ matrix.port }}/*.sha256
            build/busybox-source-parity-x86/m153-batch.clean.log
            build/busybox-source-parity-x86/m153-batch.serial.log
            build/port-riscv64/full/matrix-source/m153-batch.clean.log
            build/port-riscv64/full/matrix-source/m153-batch.serial.log
            build/port-aarch64/full/matrix-source/m153-batch.clean.log
            build/port-aarch64/full/matrix-source/m153-batch.serial.log
          if-no-files-found: ignore
