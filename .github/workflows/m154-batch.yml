name: NaSeed M154 30 NEW signed Alpine text graphics conversion ELFs

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - '.github/workflows/m154-batch.yml'
      - 'scripts/m154-*'
      - 'scripts/stage-m154-prebuilt.sh'
      - 'scripts/probe-m154-batch.sh'
      - 'scripts/host-configure-m154-batch.sh'
      - 'scripts/stage-alpine-prebuilt-overlay.sh'
      - 'scripts/prebuilt-profile-catalog.tsv'
      - 'tests/m154-*'
      - 'rootfs/alpine/packages-m154-batch.txt'
      - 'docs/m154-*'
      - 'kernel/**'
      - 'ports/**'

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  signed-original-software:
    name: M154 30 signed ELFs / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        port: ${{ fromJSON((github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-m154-multiarch') || contains(github.event.pull_request.labels.*.name, 'run-m151-155-multiarch')) && '["amd64","riscv64","arm64"]' || '["amd64"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
      - name: Check real ELF inventory, fixtures and three-ISA source gates
        timeout-minutes: 4
        run: |
          set -eu
          for script in scripts/stage-m154-prebuilt.sh \
                        scripts/probe-m154-batch.sh \
                        scripts/host-configure-m154-batch.sh \
                        tests/m154-batch-run.sh; do
            sh -n "$script"
          done
          python3 scripts/check-prebuilt-profile-catalog.py
          python3 scripts/check-three-isa-core.py
          test "$(awk '!/^#/ && NF {n++} END {print n+0}' scripts/m154-original-elfs.txt)" -eq 30
          test "$(awk '!/^#/ && NF {n++} END {print n+0}' scripts/m154-expected-markers.txt)" -eq 31
          test "$(awk '!/^#/ && NF {print $0}' scripts/m154-original-elfs.txt | sort -u | wc -l)" -eq 30
          test "$(awk '!/^#/ && NF {print $0}' scripts/m154-expected-markers.txt | sort -u | wc -l)" -eq 31
      - name: Install APK host tooling and native QEMU system
        timeout-minutes: 12
        run: |
          set -eu
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'clang:clang' 'ld.lld:lld' 'readelf:binutils' \
                      'cpio:cpio' 'mke2fs:e2fsprogs' 'xorriso:xorriso' \
                      'mformat:mtools' 'sgdisk:gdisk' 'qemu-riscv64:qemu-user'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          case '${{ matrix.port }}' in
            amd64)
              command -v qemu-system-x86_64 >/dev/null || missing="$missing qemu-system-x86"
              test -f /usr/share/OVMF/OVMF_CODE_4M.fd || \
                test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf" ;;
            riscv64)
              command -v qemu-system-riscv64 >/dev/null || missing="$missing qemu-system-misc"
              test -f /usr/share/qemu-efi-riscv64/RISCV_VIRT_CODE.fd || missing="$missing qemu-efi-riscv64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
            arm64)
              command -v qemu-system-aarch64 >/dev/null || missing="$missing qemu-system-arm"
              test -f /usr/share/AAVMF/AAVMF_CODE.fd || \
                test -f /usr/share/qemu-efi-aarch64/QEMU_EFI.fd || missing="$missing qemu-efi-aarch64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
          esac
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
      - name: Native QEMU 30 authentic signed Alpine text and graphics behaviors
        timeout-minutes: 48
        run: sh scripts/probe-m154-batch.sh ${{ matrix.port }}
      - name: Preserve signed ELF hashes, provenance and guest serial
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m154-original-${{ matrix.port }}-proof
          path: |
            build/external/m154-batch/${{ matrix.port }}/apk-install.log
            build/external/m154-batch/${{ matrix.port }}/requested-packages.txt
            build/external/m154-batch/${{ matrix.port }}/*.sha256
            build/busybox-source-parity-x86/m154-batch.clean.log
            build/busybox-source-parity-x86/m154-batch.serial.log
            build/port-riscv64/full/matrix-source/m154-batch.clean.log
            build/port-riscv64/full/matrix-source/m154-batch.serial.log
            build/port-aarch64/full/matrix-source/m154-batch.clean.log
            build/port-aarch64/full/matrix-source/m154-batch.serial.log
          if-no-files-found: ignore
