name: NaSeed H14 genuine xHCI dual root-port USB Keyboard+Mouse original signed Alpine evtest QMP KEY_A+REL_X/Y+BTN_LEFT

on:
  push:
    branches:
      - feat/na-hw-h0-pci-20261110
    paths:
      - '.github/workflows/h14-qemu-usb-dual-hid-alpine-evtest.yml'
      - 'kernel/platform/x86_h14_dual_hid.*'
      - 'kernel/platform/x86_h11_usb.*'
      - 'kernel/platform/x86_h1_ecam.*'
      - 'kernel/drivers/usb/**'
      - 'kernel/drivers/input/**'
      - 'kernel/drivers/evdev/**'
      - 'kernel/fs/input_chrdev.*'
      - 'kernel/fs/syscall.c'
      - 'kernel/drivers/port/**'
      - 'kernel/init/main.c'
      - 'kernel/boot_image.c'
      - 'kernel/kernel.c'
      - 'ports/lwext4/**'
      - 'scripts/h14-*'
      - 'scripts/check-h14-*.sh'
      - 'tests/h14-*'
      - 'scripts/stage-h14-dual-hid-alpine.sh'
      - 'scripts/build-h14-dual-hid-iso.sh'
      - 'scripts/stage-m166-prebuilt.sh'
      - 'scripts/stage-alpine-prebuilt-overlay.sh'
      - 'scripts/stage-h8-alpine-nvme.sh'
      - 'scripts/build-lwext4-guest.sh'
      - 'limine-h14-dual-hid.conf'
      - 'scripts/run.sh'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h14-qemu-xhci-dual-hid-evtest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  h14-real-xhci-dual-hid-original-alpine-evtest:
    name: Genuine ONE QEMU xHCI with USB Keyboard+Mouse two ports -> event0/event1 -> original signed Alpine evtest
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install cross C toolchain, signed Alpine APK staging, ext4, QEMU, OVMF, Python
        timeout-minutes: 15
        run: |
          set -eu
          missing=''
          for spec in 'clang:clang' 'ld.lld:lld' 'cc:gcc' 'cmake:cmake' \
                      'readelf:binutils' 'cpio:cpio' 'mke2fs:e2fsprogs' \
                      'debugfs:e2fsprogs' 'sha256sum:coreutils' \
                      'curl:curl' 'tar:tar' 'gzip:gzip' 'openssl:openssl' \
                      'python3:python3' 'xorriso:xorriso' \
                      'qemu-system-x86_64:qemu-system-x86'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          if [ ! -s /usr/share/OVMF/OVMF_CODE_4M.fd ] &&
             [ ! -s /usr/share/OVMF/OVMF_CODE.fd ]; then
            missing="$missing ovmf"
          fi
          if [ -n "$missing" ]; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends $missing
          fi
      - name: Real H14 dual HID host regressions and H14 script/Python syntax
        timeout-minutes: 8
        run: |
          set -eu
          sh -n scripts/stage-h14-dual-hid-alpine.sh
          sh -n scripts/h14-guest-workload.sh
          sh -n scripts/build-h14-dual-hid-iso.sh
          sh -n scripts/check-h14-dual-hid-qemu.sh
          sh -n scripts/check-h14-no-usb-kbd-qemu.sh
          sh -n scripts/check-h14-no-usb-mouse-qemu.sh
          sh -n scripts/check-h14-no-xhci-qemu.sh
          sh -n scripts/check-h14-dual-hid-host.sh
          sh -n scripts/check-h14-xhci-host.sh
          sh -n scripts/run.sh
          python3 -m py_compile scripts/h14-qmp-dual-evtest.py
          make hw-h14-host-check
      - name: Build isolated H14 xHCI dual-root HID kernel, H8-original signed Alpine plus signed evtest NVMe root, UEFI ISO
        timeout-minutes: 50
        run: |
          set -eu
          make hw-h14-iso
          readelf -h build/h14-qemu-only/kernel.elf | grep -q 'Machine:.*Advanced Micro Devices X86-64'
          (cd build/h14-qemu-only && sha256sum -c h14-media-before.sha256)
          sha256sum -c build/h14-qemu-only/h14-original-alpine-elfs.sha256
      - name: REAL one xHCI concurrent keyboard+mouse, KEY_A then REL_X/Y BTN_LEFT through original signed Alpine evtest plus BusyBox/Lua/jq/SQLite
        timeout-minutes: 9
        run: sh scripts/check-h14-dual-hid-qemu.sh
      - name: Negative QEMU xHCI without usb-kbd refuses signed original evtest input
        timeout-minutes: 3
        run: sh scripts/check-h14-no-usb-kbd-qemu.sh
      - name: Negative QEMU xHCI without usb-mouse refuses signed original evtest input
        timeout-minutes: 3
        run: sh scripts/check-h14-no-usb-mouse-qemu.sh
      - name: Negative QEMU with NO xHCI refuses evtest input
        timeout-minutes: 3
        run: sh scripts/check-h14-no-xhci-qemu.sh
      - name: Reverify immutable original Alpine/evtest NVMe ext4 SHA after genuine positive and negatives
        if: success()
        run: |
          set -eu
          (cd build/h14-qemu-only && sha256sum -c h14-media-before.sha256)
          sha256sum -c build/h14-qemu-only/h14-original-alpine-elfs.sha256
      - name: Preserve dual USB keyboard/mouse, no-keyboard, no-mouse, no-xHCI serial and QMP oracle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h14-qemu-xhci-usb-dual-original-evtest-real-serial-qmp
          path: |
            build/h14-qemu-only/h14-qemu-uefi-serial.log
            build/h14-qemu-only/h14-qemu-uefi-clean.log
            build/h14-qemu-only/h14-qmp-evtest.log
            build/h14-qemu-only/h14-no-usb-kbd-uefi-serial.log
            build/h14-qemu-only/h14-no-usb-mouse-uefi-serial.log
            build/h14-qemu-only/h14-no-usb-kbd-uefi-clean.log
            build/h14-qemu-only/h14-no-usb-mouse-uefi-clean.log
            build/h14-qemu-only/h14-no-xhci-uefi-serial.log
            build/h14-qemu-only/h14-no-xhci-uefi-clean.log
          if-no-files-found: ignore
      - name: Preserve exact H14 xHCI kernel, UEFI ISO, original signed evtest/Alpine digests
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: h14-qemu-usb-dual-original-alpine-evtest-verified-artifacts
          path: |
            build/h14-qemu-only/kernel.elf
            build/h14-qemu-only/naseed.iso
            build/h14-qemu-only/h14-media-before.sha256
            build/h14-qemu-only/h14-original-alpine-elfs.sha256
          if-no-files-found: error
