name: NaSeed M175 real VirtIO Input IRQ and original Alpine desktop three-ISA acceptance

# Historical replay is explicit. M176's single real-QEMU boot now contains
# this whole input, software and desktop oracle plus native network RX IRQ;
# do not run an independent expensive M175 matrix for the same PR diff.

on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  production-host-gates:
    name: M175 shared IRQ dispatch, real input queue and platform boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
      - name: Core boundary and focused real implementation checks
        run: |
          set -eu
          python3 scripts/check-three-isa-core.py
          python3 scripts/check-architecture-boundaries.py
          sh scripts/check-m175-irq-core.sh
          sh scripts/check-m166-input-port.sh
          sh scripts/check-m174-devfs.sh
          sh scripts/m174-software-check-manifest.sh
          sh -n scripts/stage-m174-devfs-software-gui.sh
          sh -n scripts/probe-m174-batch.sh
          sh -n scripts/probe-m175-irq.sh
          python3 -m py_compile scripts/m175-qmp-verify.py

  native-qemu:
    name: M175 hardware IRQ, original Alpine ELFs and fifth LVGL / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    needs: production-host-gates
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
      - name: Install native and cross Linux toolchains, EFI and system QEMU
        timeout-minutes: 18
        run: |
          set -eu
          sh scripts/ci-install-signed-alpine-qemu-deps.sh ${{ matrix.port }} --arm64-efi-fallback --cross-cxx --explicit-tools cmake:cmake g++:g++ clang:clang ld.lld:lld readelf:binutils cpio:cpio mke2fs:e2fsprogs xorriso:xorriso mformat:mtools sgdisk:gdisk gcc:gcc qemu-riscv64:qemu-user
      - name: Real QEMU IRQ-only input with signed Alpine ELFs and physical GUI
        timeout-minutes: 72
        run: sh scripts/probe-m175-irq.sh ${{ matrix.port }}
      - name: Preserve raw serial, signed ELF checks and five physical QMP images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m175-architecture-${{ matrix.port }}
          path: |
            build/external/m174-software-batch/${{ matrix.port }}/m174-qmp-check.log
            build/external/m174-software-batch/${{ matrix.port }}/m173-*.ppm
            build/external/m174-software-batch/${{ matrix.port }}/m174-software-original-signed-elfs.sha256
            build/external/m174-software-batch/${{ matrix.port }}/apk-install.log
            build/external/m171-lvgl/${{ matrix.port }}/build.log
            build/busybox-source-parity-x86/m174-batch.clean.log
            build/busybox-source-parity-x86/m174-batch.serial.log
            build/port-riscv64/full/matrix-source/m174-batch.clean.log
            build/port-riscv64/full/matrix-source/m174-batch.serial.log
            build/port-aarch64/full/matrix-source/m174-batch.clean.log
            build/port-aarch64/full/matrix-source/m174-batch.serial.log
          if-no-files-found: ignore
