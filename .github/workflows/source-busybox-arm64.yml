name: NaSeed original-source ARM64 BusyBox (extended)
on:
  # Long-running original-source ARM64 QEMU is opt-in for PRs. The manual
  # and scheduled gates remain unconditional; the label is deliberately not
  # inherited by unrelated PRs that merely touch common MM/TTY sources.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - '.github/workflows/source-busybox-arm64.yml'
      - 'kernel/arch/aarch64/**'
      - 'kernel/mm/**'
      - 'kernel/drivers/pty*'
      - 'kernel/drivers/tty*'
      - 'scripts/probe-m105-signal-group.sh'
      - 'scripts/build-m105-signal-group.sh'
      - 'scripts/m105-signal-group-serial-check.py'
      - 'tests/m105-signal-group.c'
      - 'scripts/test-m105-native-jit-probe.sh'
      - 'scripts/test-m105-native-jit.c'
      - 'scripts/test-m105-native-jit-cases.tsv'
      - 'scripts/build-source-busybox.sh'
      - 'scripts/probe-source-busybox.sh'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  arm64-source:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-arm64-source')
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install ARM64 cross-toolchain and genuine system QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y make gcc binutils curl bzip2 xorriso             clang lld cpio mtools gdisk qemu-user gcc-aarch64-linux-gnu             libc6-dev-arm64-cross qemu-system-arm qemu-efi-aarch64
      - name: Source fixture and shared-kernel static checks
        run: sh scripts/check-source-busybox.sh
      - name: Cache the official pinned BusyBox release
        uses: actions/cache@v4
        with:
          path: build/deps/source-busybox/busybox-1.37.0.tar.bz2
          key: naseed-source-busybox-1.37.0-3311dff32e746499
      - name: Compile genuine BusyBox 1.37.0 for ARM64
        run: sh scripts/build-source-busybox.sh arm64
      - name: Run the unchanged full original-source ARM64 QEMU matrix
        run: sh scripts/probe-source-busybox.sh arm64
      - name: M103 genuine ARM64 QEMU clone TID and robust futex acceptance
        run: sh scripts/probe-m103-tid.sh arm64
      - name: M104 genuine ARM64 QEMU user-fault isolation acceptance
        run: sh scripts/test-m104-probe.sh arm64
      - name: '[NATIVE QEMU] M105 ARM64 physical TTY group signals and zombie-leader worker'
        timeout-minutes: 5
        run: sh scripts/probe-m105-signal-group.sh arm64
      - name: '[NATIVE QEMU] M105 ARM64 real CPU RW/RX JIT and private fork COW'
        timeout-minutes: 5
        run: sh scripts/test-m105-native-jit-probe.sh arm64
      - name: '[NATIVE QEMU] Path-first openat(dirfd) and owned File lifecycle / arm64'
        timeout-minutes: 5
        run: sh scripts/probe-path-first-dirfd-native.sh arm64
      - name: Attach actual guest serial logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: naseed-extended-arm64-source-logs
          path: |
            build/source-busybox/arm64/verified.config
            build/source-busybox/arm64/artifacts.sha256
            build/port-aarch64/full/matrix-source/*.serial.log
            build/port-aarch64/full/matrix-source/m103-tid.clean.log
            build/port-aarch64/full/matrix-source/m104-exception.clean.log
            build/port-aarch64/full/matrix-source/m105-signal-group.serial.log
            build/port-aarch64/full/matrix-source/m105-native-jit.clean.log
            build/port-aarch64/full/matrix-source/path-first-dirfd.serial.log
            build/source-busybox/arm64/path-first-dirfd-native
            build/source-busybox/arm64/m105-signal-group
          if-no-files-found: ignore
