name: NaSeed M79 original Bash Vim Git Python collaborative workflow — native three ISA
on:
  pull_request:
    paths:
      - 'tests/m79-*'
      - 'scripts/m79-*'
      - 'scripts/probe-m79-workflow.sh'
      - 'scripts/stage-m79-prebuilt.sh'
      - 'scripts/stage-alpine-prebuilt-overlay.sh'
      - 'scripts/prebuilt-profile-catalog.tsv'
      - 'scripts/check-prebuilt-profile-catalog.py'
      - 'scripts/native-qemu-target.sh'
      - 'scripts/check-native-qemu-target.py'
      - 'rootfs/alpine/packages-m79-workflow.txt'
      - 'kernel/**'
      - '.github/workflows/m79-workflow.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  real-programs:
    name: native original Bash + Vim + Git + Python in one boot / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Shared three-ISA architecture and genuine user workflow syntax
        run: |
          set -eu
          sh -n scripts/stage-alpine-prebuilt-overlay.sh scripts/stage-m79-prebuilt.sh scripts/probe-m79-workflow.sh tests/m79-workflow-run.sh
          bash -n tests/m79-workflow.bash
          python3 -m py_compile tests/m79-validate.py
          python3 scripts/check-three-isa-core.py
          python3 scripts/check-prebuilt-profile-catalog.py
          python3 scripts/check-native-qemu-target.py
      - name: Install native QEMU and host rootfs tools
        timeout-minutes: 12
        run: |
          set -eu
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'clang:clang' 'ld.lld:lld' 'readelf:binutils' 'cpio:cpio' \
                      'xorriso:xorriso' 'mformat:mtools' 'sgdisk:gdisk' \
                      'qemu-riscv64:qemu-user'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          case "${{ matrix.port }}" in
            amd64)
              command -v qemu-system-x86_64 >/dev/null || missing="$missing qemu-system-x86"
              test -f /usr/share/OVMF/OVMF_CODE_4M.fd || \
                test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf" ;;
            riscv64)
              command -v qemu-system-riscv64 >/dev/null || missing="$missing qemu-system-misc"
              test -f /usr/share/qemu-efi-riscv64/RISCV_VIRT_CODE.fd || missing="$missing qemu-efi-riscv64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
            arm64)
              command -v qemu-system-aarch64 >/dev/null || missing="$missing qemu-system-arm"
              test -f /usr/share/AAVMF/AAVMF_CODE.fd || missing="$missing qemu-efi-aarch64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
          esac
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
      - name: Native real Alpine Bash/Vim/Git/Python single-boot workflow
        timeout-minutes: 24
        run: sh scripts/probe-m79-workflow.sh ${{ matrix.port }}
      - name: Preserve full guest evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m79-workflow-${{ matrix.port }}
          path: |
            build/external/m39-packages/${{ matrix.port }}/apk-install.log
            build/external/m79-workflow/${{ matrix.port }}/apk-install.log
            build/external/m79-workflow/${{ matrix.port }}/requested-packages.txt
            build/busybox-source-parity-x86/m79-workflow.clean.log
            build/port-riscv64/full/matrix-source/m79-workflow.clean.log
            build/port-aarch64/full/matrix-source/m79-workflow.clean.log
          if-no-files-found: ignore
