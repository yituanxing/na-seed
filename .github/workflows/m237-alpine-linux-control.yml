name: NaSeed M237 fifteen original Alpine ELF Linux host semantics preflight

# Fast signed upstream software control only. Not NaSeed native-QEMU acceptance.
on:
  push:
    branches: [naseed-app-batch2]
    paths:
      - '.github/workflows/m237-alpine-linux-control.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-alpine-linux-amd64:
    name: Execute all fifteen original signed ELF semantics on Alpine Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify actual exact M237 guest script in two independent Linux containers
        timeout-minutes: 20
        run: |
          set -eu
          state="$RUNNER_TEMP/m237-alpine-linux-state"
          mkdir -p "$state"
          for phase in first reopen; do
            echo "[M237 LINUX CANARY] separate Alpine Linux phase=$phase"
            docker run --rm --platform linux/amd64 \
              -v "$state:/root/m237-state" \
              -v "$GITHUB_WORKSPACE/tests/m237-software-workload.sh:/tmp/m237-workload.sh:ro" \
              -v "$GITHUB_WORKSPACE/scripts/m237-candidate-elfs.tsv:/tmp/m237-candidate-elfs.tsv:ro" \
              -e NAS_M237_BOOT_PHASE="$phase" alpine:3.23 sh -ec '
                apk add --no-cache recutils yajl-tools minisign geos proj-util
                seen=0
                while IFS="$(printf "\t")" read -r package elf family probe || [ -n "$package" ]; do
                  case "$package" in package|\#*|"") continue ;; esac
                  test -x "/$elf" || {
                    echo "[M237 LINUX CANARY FAIL] original signed ELF missing: /$elf" >&2
                    exit 1
                  }
                  sha=$(sha256sum "/$elf" | cut -d" " -f1)
                  printf "%s\t%s\n" "$elf" "$sha" >> "/root/m237-state/signed-sha-${NAS_M237_BOOT_PHASE}.tsv"
                  NAS_M237_BOOT_PHASE="$NAS_M237_BOOT_PHASE" \
                    sh /tmp/m237-workload.sh --exercise "$probe" "$elf"
                  seen=$((seen+1))
                done < /tmp/m237-candidate-elfs.tsv
                test "$seen" -eq 15
                printf "[M237 LINUX 15/15] phase=%s exact original signed ELF functions\n" "$NAS_M237_BOOT_PHASE"
              '
          done
          cmp "$state/signed-sha-first.tsv" "$state/signed-sha-reopen.tsv"
          test "$(wc -l < "$state/signed-sha-first.tsv")" -eq 15
          echo '[M237 LINUX HOST PASS] 15 real signed software functions in two independent Alpine containers; NOT NaSeed QEMU PASS'
