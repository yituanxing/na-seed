name: NaSeed native signed CLI and image inventory

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Original signed inventory profile
        type: choice
        required: true
        options:
          - m159
          - m163
          - m165

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ inputs.profile }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-programs:
    name: ${{ inputs.profile }} signed original ELF inventory / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    env:
      PROFILE: ${{ inputs.profile }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
      - name: Prove signed software identity, new ELF inventory and architecture
        id: profile
        env:
          PORT: ${{ matrix.port }}
        run: |
          set -eu
          case "$PROFILE" in
            m159) artifact="m159-original-${PORT}-proof" ;;
            m163) artifact="m163-33-original-${PORT}" ;;
            m165) artifact="m165-30-new-image-elfs-${PORT}" ;;
            *) exit 2 ;;
          esac
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          for script in scripts/stage-alpine-signed-batch.sh scripts/probe-alpine-signed-batch.sh "scripts/host-configure-$PROFILE-batch.sh" "tests/$PROFILE-batch-run.sh"; do
            sh -n "$script"
          done
          if [ "$PROFILE" = m165 ]; then
            sh -n scripts/host-configure-m163-batch.sh
          fi
          python3 scripts/check-prebuilt-profile-catalog.py
          python3 "scripts/check-$PROFILE-inventory.py"
          python3 scripts/check-three-isa-core.py
          python3 scripts/check-architecture-boundaries.py
      - name: Install native QEMU and signed Alpine APK staging prerequisites
        timeout-minutes: 14
        run: sh scripts/ci-install-signed-alpine-qemu-deps.sh ${{ matrix.port }} --arm64-efi-fallback mke2fs:e2fsprogs openssl:openssl
      - name: Execute original Alpine ELF semantic workload in native QEMU
        timeout-minutes: 58
        env:
          PORT: ${{ matrix.port }}
        run: sh scripts/probe-alpine-signed-batch.sh "$PORT" "$PROFILE"
      - name: Preserve original signed APK hashes and native guest semantics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.profile.outputs.artifact || format('{0}-{1}', inputs.profile, matrix.port) }}
          path: |
            build/external/${{ inputs.profile }}-batch/${{ matrix.port }}/apk-install.log
            build/external/${{ inputs.profile }}-batch/${{ matrix.port }}/requested-packages.txt
            build/external/${{ inputs.profile }}-batch/${{ matrix.port }}/*.sha256
            build/busybox-source-parity-x86/${{ inputs.profile }}-batch.clean.log
            build/busybox-source-parity-x86/${{ inputs.profile }}-batch.serial.log
            build/port-riscv64/full/matrix-source/${{ inputs.profile }}-batch.clean.log
            build/port-riscv64/full/matrix-source/${{ inputs.profile }}-batch.serial.log
            build/port-aarch64/full/matrix-source/${{ inputs.profile }}-batch.clean.log
            build/port-aarch64/full/matrix-source/${{ inputs.profile }}-batch.serial.log
          if-no-files-found: ignore
