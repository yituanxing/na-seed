name: NaSeed M110 20 different signed original Alpine programs — one QEMU boot per ISA
on:
  workflow_dispatch:

# Avoid obsolete pull-request heads consuming 3* native emulator capacity.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  original-software-batch:
    name: M110 20 signed original Linux ELF functional tests / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate shared signed APK catalog and all guest functional oracles
        timeout-minutes: 3
        run: |
          set -eu
          sh -n scripts/stage-alpine-prebuilt-overlay.sh \
                scripts/stage-m110-prebuilt.sh \
                scripts/probe-m110-batch.sh \
                tests/m110-batch-run.sh
          python3 scripts/check-prebuilt-profile-catalog.py
          python3 scripts/check-native-qemu-target.py
          python3 scripts/check-three-isa-core.py
      - name: Install signed APK host staging, genuine headless QEMU, kernel tools
        timeout-minutes: 12
        run: |
          set -eu
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'clang:clang' 'ld.lld:lld' 'readelf:binutils' \
                      'cpio:cpio' 'xorriso:xorriso' 'mformat:mtools' \
                      'sgdisk:gdisk' 'qemu-riscv64:qemu-user'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          case "${{ matrix.port }}" in
            amd64)
              command -v qemu-system-x86_64 >/dev/null || missing="$missing qemu-system-x86"
              test -f /usr/share/OVMF/OVMF_CODE_4M.fd || \
                test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf" ;;
            riscv64)
              command -v qemu-system-riscv64 >/dev/null || missing="$missing qemu-system-misc"
              test -f /usr/share/qemu-efi-riscv64/RISCV_VIRT_CODE.fd || missing="$missing qemu-efi-riscv64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
            arm64)
              command -v qemu-system-aarch64 >/dev/null || missing="$missing qemu-system-arm"
              test -f /usr/share/AAVMF/AAVMF_CODE.fd || missing="$missing qemu-efi-aarch64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
          esac
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
      - name: Run 20 original prebuilt signed Linux apps inside ONE real NaSeed QEMU guest
        timeout-minutes: 45
        run: sh scripts/probe-m110-batch.sh ${{ matrix.port }}
      - name: Retain signed original package provenance and complete guest serial
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: m110-signed-original-elf-batch-pass-${{ matrix.port }}
          path: |
            build/external/m110-batch/${{ matrix.port }}/apk-install.log
            build/external/m110-batch/${{ matrix.port }}/requested-packages.txt
            build/external/m110-batch/${{ matrix.port }}/*.sha256
            build/busybox-source-parity-x86/m110-batch.clean.log
            build/port-riscv64/full/matrix-source/m110-batch.clean.log
            build/port-aarch64/full/matrix-source/m110-batch.clean.log
          if-no-files-found: error
      - name: Preserve the complete serial and prebuilt guest rootfs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m110-signed-original-elf-batch-fail-${{ matrix.port }}
          path: |
            build/external/m110-batch/${{ matrix.port }}/apk-install.log
            build/external/m110-batch/${{ matrix.port }}/requested-packages.txt
            build/external/m110-batch/${{ matrix.port }}/rootfs.cpio
            build/external/m110-batch/${{ matrix.port }}/*.sha256
            build/busybox-source-parity-x86/m110-batch.clean.log
            build/port-riscv64/full/matrix-source/m110-batch.clean.log
            build/port-aarch64/full/matrix-source/m110-batch.clean.log
          if-no-files-found: ignore
