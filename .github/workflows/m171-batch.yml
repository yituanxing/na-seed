name: NaSeed M171 upstream LVGL 9.4 real GUI and pointer QMP three ISA

on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser-terminal-image-desktop:
    name: M171 pinned LVGL GUI actual physical input QMP / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
      - name: Exact Linux ABI IPC surface and image+terminal+browser host gates
        run: |
          set -eu
          for script in scripts/probe-m168-batch.sh \
                        scripts/stage-m168-prebuilt.sh \
                        scripts/host-configure-m168-batch.sh \
                        scripts/probe-m170-batch.sh \
                        scripts/probe-m171-batch.sh \
                        scripts/stage-m171-lvgl.sh \
                        scripts/host-configure-m171-lvgl.sh; do
            sh -n "$script"
          done
          python3 -m py_compile scripts/m161-qmp-verify.py \
            scripts/m167-qmp-verify.py scripts/m168-qmp-verify.py \
            scripts/m170-qmp-verify.py scripts/m171-qmp-verify.py
          python3 scripts/check-prebuilt-profile-catalog.py
          python3 scripts/check-three-isa-core.py
          python3 scripts/check-architecture-boundaries.py
          sh scripts/check-m167-fb-pwrite.sh
          sh scripts/check-m167-desktop.sh
          sh scripts/check-m168-desktop.sh
          sh scripts/check-m170-desktop.sh
          if [ '${{ matrix.port }}' = amd64 ]; then
            sh scripts/check-m171-desktop.sh
          fi
          test "$(git -C third_party/lvgl rev-parse HEAD)" = c016f72d4c125098287be5e83c0f1abed4706ee5
          sh scripts/test-m105-pty-isig.sh
          sh scripts/check-m166-input-port.sh
          sh scripts/check-m107-unix.sh
          cc -std=c11 -O2 -Wall -Wextra -Werror -static -fsyntax-only \
            user/desktop/protocol.c user/desktop/text.c \
            user/desktop/naseed-desktop.c user/desktop/naseed-image.c \
            user/desktop/naseed-terminal.c user/desktop/naseed-browser.c
      - name: Install Linux static compilers EFI QEMU and APK staging tools
        timeout-minutes: 18
        run: |
          set -eu
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'cmake:cmake' 'g++:g++' 'clang:clang' 'ld.lld:lld' 'readelf:binutils' \
                      'cpio:cpio' 'mke2fs:e2fsprogs' 'xorriso:xorriso' \
                      'mformat:mtools' 'sgdisk:gdisk' 'gcc:gcc' \
                      'qemu-riscv64:qemu-user'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          case '${{ matrix.port }}' in
            amd64)
              command -v qemu-system-x86_64 >/dev/null || missing="$missing qemu-system-x86"
              test -f /usr/share/OVMF/OVMF_CODE_4M.fd || \
              test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf" ;;
            riscv64)
              command -v riscv64-linux-gnu-gcc >/dev/null || missing="$missing gcc-riscv64-linux-gnu"
              command -v riscv64-linux-gnu-g++ >/dev/null || missing="$missing g++-riscv64-linux-gnu"
              test -f /usr/riscv64-linux-gnu/include/bits/wordsize.h && \
              test -f /usr/riscv64-linux-gnu/lib/libc.a || \
                missing="$missing libc6-dev-riscv64-cross"
              command -v qemu-system-riscv64 >/dev/null || missing="$missing qemu-system-misc"
              test -f /usr/share/qemu-efi-riscv64/RISCV_VIRT_CODE.fd || missing="$missing qemu-efi-riscv64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
            arm64)
              command -v aarch64-linux-gnu-gcc >/dev/null || missing="$missing gcc-aarch64-linux-gnu"
              command -v aarch64-linux-gnu-g++ >/dev/null || missing="$missing g++-aarch64-linux-gnu"
              test -f /usr/aarch64-linux-gnu/include/bits/wordsize.h && \
              test -f /usr/aarch64-linux-gnu/lib/libc.a || \
                missing="$missing libc6-dev-arm64-cross"
              command -v qemu-system-aarch64 >/dev/null || missing="$missing qemu-system-arm"
              test -f /usr/share/AAVMF/AAVMF_CODE.fd || \
              test -f /usr/share/qemu-efi-aarch64/QEMU_EFI.fd || missing="$missing qemu-efi-aarch64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
          esac
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
      - name: Boot true QEMU and drive three windows from physical input
        timeout-minutes: 58
        run: sh scripts/probe-m171-batch.sh ${{ matrix.port }}
      - name: Preserve M171 LVGL screenshots, source revision, build logs and signed programs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m171-real-lvgl-${{ matrix.port }}
          path: |
            build/external/m168-batch/${{ matrix.port }}/apk-install.log
            build/external/m168-batch/${{ matrix.port }}/*.sha256
            build/external/m168-batch/${{ matrix.port }}/m171-qmp-check.log
            build/external/m168-batch/${{ matrix.port }}/m171-*.ppm
            build/external/m171-lvgl/${{ matrix.port }}/configure.log
            build/external/m171-lvgl/${{ matrix.port }}/build.log
            build/external/m171-lvgl/${{ matrix.port }}/*.sha256
            build/external/m171-lvgl/${{ matrix.port }}/host-lvgl.log
            build/busybox-source-parity-x86/m171-batch.clean.log
            build/busybox-source-parity-x86/m171-batch.serial.log
            build/port-riscv64/full/matrix-source/m171-batch.clean.log
            build/port-riscv64/full/matrix-source/m171-batch.serial.log
            build/port-aarch64/full/matrix-source/m171-batch.clean.log
            build/port-aarch64/full/matrix-source/m171-batch.serial.log
          if-no-files-found: ignore
