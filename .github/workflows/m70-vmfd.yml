name: NaSeed M70 original process VM/FD utilities — three native ISAs
on:
  pull_request:
    paths:
      - 'kernel/**'
      - 'scripts/test-procfs.c'
      - 'scripts/stage-m70-prebuilt.sh'
      - 'scripts/probe-m70-vmfd.sh'
      - 'scripts/m70-*'
      - 'tests/m70-*'
      - 'rootfs/alpine/packages-m70-vmfd.txt'
      - 'scripts/stage-alpine-prebuilt-overlay.sh'
      - '.github/workflows/m70-vmfd.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  original-inspection:
    name: original pmap+lsof from process VM/FD objects on NaSeed / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Shared kernel architecture and host procfs owner
        run: |
          set -eu
          sh -n scripts/stage-m70-prebuilt.sh scripts/probe-m70-vmfd.sh tests/m70-vmfd-run.sh
          python3 scripts/check-three-isa-core.py
          cc -std=c11 -Wall -Wextra -Werror -fno-builtin -I kernel scripts/test-procfs.c kernel/fs/procfs.c kernel/lib/string.c -o /tmp/nas-m70-procfs
          /tmp/nas-m70-procfs
      - name: Install native QEMU and host rootfs tools
        timeout-minutes: 12
        run: |
          set -eu
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'clang:clang' 'ld.lld:lld' 'readelf:binutils' 'cpio:cpio' \
                      'xorriso:xorriso' 'mformat:mtools' 'sgdisk:gdisk' \
                      'qemu-riscv64:qemu-user'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          case "${{ matrix.port }}" in
            amd64)
              command -v qemu-system-x86_64 >/dev/null || missing="$missing qemu-system-x86"
              test -f /usr/share/OVMF/OVMF_CODE_4M.fd || \
                test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf" ;;
            riscv64)
              command -v qemu-system-riscv64 >/dev/null || missing="$missing qemu-system-misc"
              test -f /usr/share/qemu-efi-riscv64/RISCV_VIRT_CODE.fd || missing="$missing qemu-efi-riscv64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
            arm64)
              command -v qemu-system-aarch64 >/dev/null || missing="$missing qemu-system-arm"
              test -f /usr/share/AAVMF/AAVMF_CODE.fd || missing="$missing qemu-efi-aarch64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
          esac
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
      - name: Original Alpine pmap/lsof in true native QEMU
        timeout-minutes: 24
        run: sh scripts/probe-m70-vmfd.sh ${{ matrix.port }}
      - name: Retain all actual QEMU and apk failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m70-vmfd-${{ matrix.port }}
          path: |
            build/external/m70-vmfd/${{ matrix.port }}/apk-install.log
            build/external/m70-vmfd/${{ matrix.port }}/requested-packages.txt
            build/busybox-source-parity-x86/m70-vmfd.clean.log
            build/port-riscv64/full/matrix-source/m70-vmfd.clean.log
            build/port-aarch64/full/matrix-source/m70-vmfd.clean.log
          if-no-files-found: ignore
