name: NaSeed M140 20 signed GNU and Netpbm ELFs, QEMU three ISAs
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  signed-original-software:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-m140-batch')
    name: M140 20 signed native GNU and image tools / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify signed profile and native 3-ISA invariants
        timeout-minutes: 4
        run: |
          set -eu
          for source in scripts/stage-alpine-prebuilt-overlay.sh \
                        scripts/stage-m140-prebuilt.sh \
                        scripts/probe-m140-batch.sh \
                        tests/m140-batch-run.sh; do
            sh -n "$source"
          done
          python3 scripts/check-prebuilt-profile-catalog.py
          python3 scripts/check-native-qemu-target.py
          python3 scripts/check-three-isa-core.py
          sh scripts/check-vfs-provider.sh
          sh scripts/check-m86-txn.sh
      - name: Install signed APK staging tools and native system QEMU
        timeout-minutes: 12
        run: sh scripts/ci-install-signed-alpine-qemu-deps.sh ${{ matrix.port }}
      - name: Execute 20 distinct signed ELFs and 39 functional cases in QEMU
        timeout-minutes: 45
        run: sh scripts/probe-m140-batch.sh ${{ matrix.port }}
      - name: Preserve signed SHA256 and full native QEMU PASS serial
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: m140-signed-gnu-pass-${{ matrix.port }}
          path: |
            build/external/m140-batch/${{ matrix.port }}/apk-install.log
            build/external/m140-batch/${{ matrix.port }}/requested-packages.txt
            build/external/m140-batch/${{ matrix.port }}/*.sha256
            build/busybox-source-parity-x86/m140-batch.clean.log
            build/port-riscv64/full/matrix-source/m140-batch.clean.log
            build/port-aarch64/full/matrix-source/m140-batch.clean.log
          if-no-files-found: error
      - name: Preserve entire failure serial and signed guest rootfs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m140-signed-gnu-fail-${{ matrix.port }}
          path: |
            build/external/m140-batch/${{ matrix.port }}/apk-install.log
            build/external/m140-batch/${{ matrix.port }}/requested-packages.txt
            build/external/m140-batch/${{ matrix.port }}/rootfs.cpio
            build/external/m140-batch/${{ matrix.port }}/*.sha256
            build/busybox-source-parity-x86/m140-batch.clean.log
            build/port-riscv64/full/matrix-source/m140-batch.clean.log
            build/port-aarch64/full/matrix-source/m140-batch.clean.log
          if-no-files-found: ignore
