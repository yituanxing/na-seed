name: NaSeed native Debian physical ext4 and UART
on:
  push:
    branches: [na-alpine-direct-use]
    paths:
      - 'scripts/acceptance/debian-ext4.sh'
      - '.github/workflows/debian-native-ext4.yml'
      - 'docs/m249-*'
      - 'kernel/arch/linux_stat_abi.h'
      - 'kernel/arch/linux_syscall_abi.h'
      - 'kernel/boot_image.c'
      - 'kernel/drivers/tty*'
      - 'kernel/drivers/virtio_blk*'
      - 'kernel/fs/**'
      - 'kernel/init/main.c'
      - 'kernel/mm/**'
      - 'kernel/syscall/ops.h'
      - 'kernel/task/**'
      - 'ports/lwext4/**'
      - 'scripts/build-native-full.sh'
      - 'scripts/build-aarch64-full.sh'
      - 'scripts/build-riscv64-full.sh'
      - 'scripts/m193-*'
      - 'scripts/m245-*'
      - 'scripts/m247-*'
      - 'scripts/m248-*'
      - 'scripts/m249-*'
      - 'scripts/m250-*'
      - 'scripts/m251-*'
      - 'scripts/native-qemu-target.sh'
      - 'scripts/native-source-qemu.sh'
      - 'scripts/probe-port-busybox-matrix.sh'
      - 'scripts/probe-aarch64-busybox-matrix.sh'
      - 'scripts/probe-riscv64-busybox-matrix.sh'
      - 'scripts/probe-x86-busybox-parity.sh'
      - 'scripts/run.sh'
      - 'tests/m249-*'
      - 'tests/m250-*'
      - 'tests/m251-*'
  workflow_dispatch:
    inputs:
      profile:
        description: Signed Debian native acceptance profile
        type: choice
        required: true
        options:
          - m249
          - m250
          - m251

permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.workflow }}-${{ inputs.profile || 'push' }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    name: ${{ matrix.profile }} original signed Debian / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.profile == 'm249' && 55 || matrix.profile == 'm250' && 60 || 65 }}
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.profile) || '["m249","m250","m251"]') }}
        port: [amd64, riscv64, arm64]
    env:
      PROFILE: ${{ matrix.profile }}
      PORT: ${{ matrix.port }}
    steps:
      - name: Select original native probe and evidence
        id: profile
        run: |
          set -eu
          case "$PROFILE" in
            m249)
              echo "artifact=m249-debian-glibc-physical-root-$PORT" >> "$GITHUB_OUTPUT"
              echo "probe=scripts/m249-probe-debian-ext4.sh" >> "$GITHUB_OUTPUT"
              {
                echo 'paths<<NAS_EVIDENCE'
                printf '%s\n' "build/m249-debian-ext4/$PORT/source/manifest.json" \
                  "build/m249-debian-ext4/$PORT/*.tsv" \
                  "build/m249-debian-ext4/$PORT/*.log" \
                  "build/port-*/full/matrix-source/m249-batch.clean.log" \
                  "build/port-*/full/matrix-source/m249-batch.serial.log" \
                  "build/busybox-source-parity-x86/m249-batch.clean.log" \
                  "build/busybox-source-parity-x86/m249-batch.serial.log"
                echo 'NAS_EVIDENCE'
              } >> "$GITHUB_OUTPUT" ;;
            m250)
              echo "artifact=m250-signed-debian-interactive-ext4-$PORT" >> "$GITHUB_OUTPUT"
              echo "probe=scripts/m250-probe-debian-interactive.sh" >> "$GITHUB_OUTPUT"
              {
                echo 'paths<<NAS_EVIDENCE'
                printf '%s\n' "build/m250-debian-interactive/$PORT/source/manifest.json" \
                  "build/m250-debian-interactive/$PORT/*.tsv" \
                  "build/m250-debian-interactive/$PORT/*.log" \
                  "build/port-*/full/matrix-source/m250-batch.clean.log" \
                  "build/port-*/full/matrix-source/m250-batch.serial.log" \
                  "build/busybox-source-parity-x86/m250-batch.clean.log" \
                  "build/busybox-source-parity-x86/m250-batch.serial.log"
                echo 'NAS_EVIDENCE'
              } >> "$GITHUB_OUTPUT" ;;
            m251)
              echo "artifact=m251-signed-debian-coreutils-ext4-$PORT" >> "$GITHUB_OUTPUT"
              echo "probe=scripts/m251-probe-debian-coreutils.sh" >> "$GITHUB_OUTPUT"
              {
                echo 'paths<<NAS_EVIDENCE'
                printf '%s\n' "build/m251-debian-coreutils/$PORT/source/manifest.json" \
                  "build/m251-debian-coreutils/$PORT/m251-extra.json" \
                  "build/m251-debian-coreutils/$PORT/*.tsv" \
                  "build/m251-debian-coreutils/$PORT/*.log" \
                  "build/port-*/full/matrix-source/m251-batch.clean.log" \
                  "build/port-*/full/matrix-source/m251-batch.serial.log" \
                  "build/busybox-source-parity-x86/m251-batch.clean.log" \
                  "build/busybox-source-parity-x86/m251-batch.serial.log"
                echo 'NAS_EVIDENCE'
              } >> "$GITHUB_OUTPUT" ;;
            *) exit 2 ;;
          esac
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: true
      - name: Check M249 host contracts and syntax
        if: matrix.profile == 'm249'
        run: |
          set -eu
          test -s scripts/m249-probe-debian-ext4.sh
          test -s scripts/m249-debian-ext4-disk.py
          sh -n scripts/m249-probe-debian-ext4.sh
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for p in sorted(Path('scripts').glob('m249-*.py')):
              ast.parse(p.read_text(encoding='utf-8'), filename=str(p))
          PY
          python3 -B tests/m248-debian-multiarch-host.py
          sh scripts/check-m191-pid1-quiesce.sh
          if test -s tests/m249-debian-ext4-host.py; then
            python3 -B tests/m249-debian-ext4-host.py
          fi
      - name: Reject static design regressions and command-echo fake PASS
        if: matrix.profile == 'm250'
        run: |
          set -eu
          sh -n scripts/m250-probe-debian-interactive.sh
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for p in sorted(Path('scripts').glob('m250-*.py')):
              ast.parse(p.read_text(encoding='utf-8'), filename=str(p))
          PY
          python3 -B tests/m250-debian-interactive-host.py
          python3 -B tests/m249-debian-ext4-host.py
          python3 -B tests/m248-debian-multiarch-host.py
          sh scripts/check-m191-pid1-quiesce.sh
      - name: Reject unsigned provenance or synthetic serial success
        if: matrix.profile == 'm251'
        run: |
          set -eu
          sh -n scripts/m251-probe-debian-coreutils.sh
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for p in sorted(Path('scripts').glob('m251-*.py')):
              ast.parse(p.read_text(encoding='utf-8'), filename=str(p))
          PY
          python3 -B tests/m251-debian-provenance-host.py
          python3 -B tests/m251-debian-uart-host.py
          python3 -B tests/m250-debian-interactive-host.py
          python3 -B tests/m249-debian-ext4-host.py
          python3 -B tests/m248-debian-multiarch-host.py
          mkdir -p build/m251-host
          gcc -std=c11 -Wall -Wextra -Werror tests/m251-statx-abi-host.c \
            -o build/m251-host/statx-abi
          build/m251-host/statx-abi
          sh scripts/check-m191-pid1-quiesce.sh
      - name: Install signed Debian and native QEMU/cross-GCC tools
        timeout-minutes: ${{ matrix.profile == 'm249' && 15 || matrix.profile == 'm250' && 16 || 16 }}
        run: |
          set -eu
          PATH=/usr/sbin:/sbin:$PATH
          export PATH
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'cmake:cmake' 'g++:g++' 'clang:clang' 'ld.lld:lld' \
                      'readelf:binutils' 'cpio:cpio' 'xorriso:xorriso' \
                      'mformat:mtools' 'sgdisk:gdisk' 'curl:curl' \
                      'python3:python3' 'dpkg-deb:dpkg' 'apt-cache:apt' \
                      'mke2fs:e2fsprogs' 'e2fsck:e2fsprogs' 'debugfs:e2fsprogs'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          test -s /usr/share/keyrings/debian-archive-keyring.gpg || \
            missing="$missing debian-archive-keyring"
          case "$PORT" in
            amd64)
              command -v qemu-system-x86_64 >/dev/null || missing="$missing qemu-system-x86"
              test -s /usr/share/OVMF/OVMF_CODE_4M.fd || \
              test -s /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf"
              if [ "$PROFILE" != m249 ]; then
                command -v gcc >/dev/null || missing="$missing gcc"
              fi
              ;;
            riscv64)
              command -v qemu-system-riscv64 >/dev/null || missing="$missing qemu-system-misc"
              test -s /usr/share/qemu-efi-riscv64/RISCV_VIRT_CODE.fd || \
                missing="$missing qemu-efi-riscv64"
              if [ "$PROFILE" != m249 ]; then
                command -v riscv64-linux-gnu-gcc >/dev/null || \
                  missing="$missing gcc-riscv64-linux-gnu"
                test -s /usr/riscv64-linux-gnu/include/bits/wordsize.h || \
                  missing="$missing libc6-dev-riscv64-cross"
              fi
              ;;
            arm64)
              command -v qemu-system-aarch64 >/dev/null || missing="$missing qemu-system-arm"
              test -s /usr/share/qemu-efi-aarch64/QEMU_EFI.fd || \
                missing="$missing qemu-efi-aarch64"
              if [ "$PROFILE" != m249 ]; then
                command -v aarch64-linux-gnu-gcc >/dev/null || \
                  missing="$missing gcc-aarch64-linux-gnu"
                test -s /usr/aarch64-linux-gnu/include/bits/wordsize.h || \
                  missing="$missing libc6-dev-arm64-cross"
              fi
              ;;
            *) echo 'Unreviewed native QEMU port' >&2; exit 2 ;;
          esac
          test -s /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu"
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
      - name: Restore pinned, working multi-ISA Limine seed
        uses: ./.github/actions/naseed-limine-seed
        with:
          github-token: ${{ github.token }}
      - name: Execute signed Debian in actual native system QEMU
        timeout-minutes: ${{ matrix.profile == 'm249' && 29 || matrix.profile == 'm250' && 32 || 35 }}
        env:
          PROBE: ${{ steps.profile.outputs.probe }}
        run: sh "$PROBE" "$PORT"
      - name: Preserve original source provenance and native guest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.profile.outputs.artifact }}
          retention-days: 7
          if-no-files-found: warn
          path: ${{ steps.profile.outputs.paths }}
