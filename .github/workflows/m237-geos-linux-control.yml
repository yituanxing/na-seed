name: NaSeed M237 original signed Alpine GEOS Linux control

# Host Linux differential only: this is NOT NaSeed native QEMU acceptance.
# Run on changes to this one scoped control, never replay the expensive M237
# guest suite solely for a Linux reference measurement.
on:
  push:
    branches: [naseed-app-batch2]
    paths:
      - '.github/workflows/m237-geos-linux-control.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-alpine-geos-amd64:
    name: Exact signed GEOS ELF on ordinary Alpine Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Compare the exact signed original GEOS ELF under ordinary Alpine Linux
        run: |
          docker run --rm --platform linux/amd64 alpine:3.23 sh -ec '
            apk add --no-cache geos=3.14.1-r0
            echo "[M237 LINUX CONTROL] original signed APK version:"
            apk info -v geos
            actual=$(sha256sum /usr/bin/geosop | cut -d" " -f1)
            expected=7eabe7d05c905d05804c44a93235ce24478c2d40d97307d09457a4b91bd8542a
            printf "[M237 LINUX CONTROL] geosop_sha256=%s expected_sha256=%s\n" "$actual" "$expected"
            test "$actual" = "$expected" || {
              echo "[M237 LINUX CONTROL BLOCKED] GEOS APK ELF differs from native guest, no comparison permitted"
              exit 1
            }
            wkt="POLYGON ((0 0, 4 0, 4 3, 0 3, 0 0))"
            printf "%s\n" "$wkt" > /tmp/rectangle.wkt
            /usr/bin/geosop --help >/tmp/help.log
            # Never stop after the first upstream crash: independently execute
            # each control to discriminate the exact Alpine CLI defect.
            probe() {
              mode="$1"
              shift
              rc=0
              "$@" > "/tmp/$mode.out" 2> "/tmp/$mode.err" || rc=$?
              stdout=$(head -c 100 "/tmp/$mode.out" | tr "\t\r\n" "   ")
              stderr=$(head -c 180 "/tmp/$mode.err" | tr "\t\r\n" "   ")
              printf "[M237 LINUX DIFF] mode=%s exit=%s stdout=%s stderr=%s\n" "$mode" "$rc" "$stdout" "$stderr"
            }
            probe file-area /usr/bin/geosop -a /tmp/rectangle.wkt --format=txt area
            probe literal-area /usr/bin/geosop -a "$wkt" --format=txt area
            probe stdin-area /usr/bin/geosop -a stdin --format=txt area < /tmp/rectangle.wkt
            probe file-copy /usr/bin/geosop -a /tmp/rectangle.wkt --format=txt copy
            probe literal-copy /usr/bin/geosop -a "$wkt" --format=txt copy
            probe point-area /usr/bin/geosop -a "POINT (0 0)" --format=txt area
            probe line-length /usr/bin/geosop -a "LINESTRING (0 0, 3 4)" --format=txt length
            probe verbose-polygon /usr/bin/geosop -v -a "$wkt" --format=txt area
            # GEOS 3.14.1 executeOp unconditionally dereferences *gB;
            # unary ops pass nullptr, while real binary ops supply B.
            probe point-distance /usr/bin/geosop -a "POINT (0 0)" -b "POINT (3 4)" --format=txt distance
            probe point-intersects /usr/bin/geosop -a "POINT (0 0)" -b "POINT (0 0)" --format=txt intersects
            probe point-disjoint /usr/bin/geosop -a "POINT (0 0)" -b "POINT (3 4)" --format=txt intersects
            probe polygon-intersection /usr/bin/geosop -a "$wkt" -b "$wkt" --format=txt intersection
            if grep -Eq "(^|[^0-9])5(\.0+)?($|[^0-9])" /tmp/point-distance.out &&
               grep -Eiq "true|^1$" /tmp/point-intersects.out &&
               grep -Eiq "false|^0$" /tmp/point-disjoint.out &&
               grep -Fq "POLYGON" /tmp/polygon-intersection.out; then
              echo "[M237 LINUX BINARY CONTROL PASS] exact signed geosop computes distance=5, true/false topology and polygon intersection"
            else
              echo "[M237 LINUX BINARY CONTROL FAIL] original binary GEOS operations not proven"
            fi
            # The official geometry operation must still produce a real
            # numeric area=12; a completed diagnostic is not a PASS.
            if grep -Eq "(^|[^0-9])12(\.0+)?($|[^0-9])" /tmp/file-area.out &&
               grep -Fq "POLYGON" /tmp/file-copy.out; then
              echo "[M237 LINUX CONTROL PASS] original area=12 and geometry copy succeeded; not NaSeed QEMU PASS"
            else
              echo "[M237 LINUX CONTROL FAIL] original signed GEOS cannot pass its documented geometry operations on ordinary Linux"
              exit 1
            fi
          '
