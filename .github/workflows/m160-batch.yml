name: NaSeed M160 HTTPS real PNG download decode and terminal display

on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  real-https-images:
    name: M160 verified HTTPS PNG wire and original image programs / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
      - name: Verify guest PNG tests, signed APK manifest and real TLS server
        run: |
          set -eu
          for script in scripts/stage-m160-prebuilt.sh scripts/probe-m160-batch.sh \
                        scripts/host-configure-m160-batch.sh tests/m160-batch-run.sh; do
            sh -n "$script"
          done
          python3 -m py_compile scripts/m160-image-wire-server.py
          python3 scripts/check-prebuilt-profile-catalog.py
          python3 scripts/check-m160-wire-inventory.py
          python3 scripts/check-three-isa-core.py
          python3 scripts/check-architecture-boundaries.py
      - name: Install native QEMU, OpenSSL and signed APK staging dependencies
        timeout-minutes: 14
        run: sh scripts/ci-install-signed-alpine-qemu-deps.sh ${{ matrix.port }} --arm64-efi-fallback mke2fs:e2fsprogs openssl:openssl
      - name: Native HTTPS TLS and image decode and Unicode rendering on real QEMU
        timeout-minutes: 58
        run: sh scripts/probe-m160-batch.sh ${{ matrix.port }}
      - name: Preserve TLS certificate network packets original ELF SHA and guest serial
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m160-original-wire-png-${{ matrix.port }}-proof
          path: |
            build/external/m160-batch/${{ matrix.port }}/apk-install.log
            build/external/m160-batch/${{ matrix.port }}/requested-packages.txt
            build/external/m160-batch/${{ matrix.port }}/*.sha256
            build/external/m160-batch/${{ matrix.port }}/host-*.log
            build/external/m160-batch/${{ matrix.port }}/host-tls.crt
            build/external/m160-batch/${{ matrix.port }}/*.pcap
            build/busybox-source-parity-x86/m160-batch.clean.log
            build/busybox-source-parity-x86/m160-batch.serial.log
            build/port-riscv64/full/matrix-source/m160-batch.clean.log
            build/port-riscv64/full/matrix-source/m160-batch.serial.log
            build/port-aarch64/full/matrix-source/m160-batch.clean.log
            build/port-aarch64/full/matrix-source/m160-batch.serial.log
          if-no-files-found: ignore
