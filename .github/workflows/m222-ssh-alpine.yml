name: NaSeed M222 original signed SSH SCP SFTP first+reopen authenticated wire

# One exactly scoped new-workflow trigger. Shared M197/M205 modifications do
# NOT replay accepted M218-M221 long native-QEMU jobs.
on:
  push:
    branches: [naseed-app-batch2]
    paths:
      - '.github/workflows/m222-ssh-alpine.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ssh-original-amd64:
    name: Signed SSH SCP SFTP authenticated OpenSSH host and 2 QEMUs / amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: true
      - name: Require fail-closed host publickey/SHA/PCAP, three ISA and prior cohorts
        run: |
          set -eu
          python3 scripts/test-m222-ssh-host.py
          python3 scripts/test-m221-dns-host.py
          python3 scripts/test-m220-nping-host.py
          python3 scripts/test-m219-utmpdump-host.py
          python3 scripts/test-m218-ifstat-host.py
          python3 scripts/check-three-isa-core.py
          python3 scripts/check-architecture-boundaries.py
          sh scripts/check-lwip-socket-abi.sh
      - name: Install x86 QEMU, ext4, original signed Alpine and OpenSSH host
        timeout-minutes: 18
        run: |
          set -eu
          PATH=/usr/sbin:/sbin:$PATH
          export PATH
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'cmake:cmake' 'g++:g++' 'clang:clang' 'ld.lld:lld' \
                      'qemu-system-x86_64:qemu-system-x86' \
                      'readelf:binutils' 'cpio:cpio' 'mke2fs:e2fsprogs' \
                      'debugfs:e2fsprogs' 'e2fsck:e2fsprogs' \
                      'xorriso:xorriso' 'mformat:mtools' 'sgdisk:gdisk' \
                      'curl:curl' 'python3:python3' 'openssl:openssl' \
                      'sshd:openssh-server' 'ssh-keygen:openssh-client'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          test -f /usr/share/OVMF/OVMF_CODE_4M.fd || \
            test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf"
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          sudo install -d -m 0755 /run/sshd
          command -v docker
          command -v sshd
          command -v ssh-keygen
      - name: Verify three official signed x86 ELF SHA and offline APK closure
        timeout-minutes: 18
        run: |
          set -eu
          sh scripts/inventory-m141-signed-apks.sh amd64 m222
          tsv=build/external/m222-candidate-inventory/amd64/candidates.tsv
          awk -F '\t' 'NR > 1 {n++; if ($3 != "NATIVE_ELF" || length($4) != 64 || $4 ~ /[^0-9a-f]/) bad++}
            END {if (n != 3 || bad) exit 1}' "$tsv"
      - name: Two physical x86 Alpine QEMUs, real SSH pubkey auth, stdout and SCP/SFTP hash
        timeout-minutes: 70
        env:
          NAS_M222_PUBLIC_QEMU_TIMEOUT: '3150'
          NAS_M222_PUBLIC_SECONDS: '3000'
          NAS_M222_REOPEN_SECONDS: '1100'
        run: sh scripts/probe-m222-alpine-pilot.sh amd64
      - name: Preserve only SSH public fingerprints, logs, signed hashes and TWO PCAPs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m222-original-ssh-amd64
          path: |
            build/external/m222-candidate-inventory/amd64/candidates.tsv
            build/external/m222-candidate-inventory/amd64/signed-cache.sha256
            build/external/m222-candidate-inventory/amd64/apk-offline-proof.log
            build/external/m191-alpine-rootfs/amd64/m222-compat-report.json
            build/external/m191-alpine-rootfs/amd64/m222-first-runner.log
            build/external/m191-alpine-rootfs/amd64/m197-live.serial.log
            build/external/m191-alpine-rootfs/amd64/m197-reopen-runner.log
            build/external/m191-alpine-rootfs/amd64/m197-public-wire.pcap
            build/external/m191-alpine-rootfs/amd64/m222-first-host-sshd.log
            build/external/m191-alpine-rootfs/amd64/m222-first-public-fingerprint.log
            build/external/m191-alpine-rootfs/amd64/m222-first-wire.json
            build/external/m191-alpine-rootfs/amd64/m222-reopen-host-sshd.log
            build/external/m191-alpine-rootfs/amd64/m222-reopen-public-fingerprint.log
            build/external/m191-alpine-rootfs/amd64/m222-reopen-wire.pcap
            build/external/m191-alpine-rootfs/amd64/m222-reopen-wire.json
            build/acceptance/**/m197-batch*.log
          if-no-files-found: warn

  ssh-original-cross:
    name: Signed SSH SCP SFTP authenticated host and 2 QEMUs / ${{ matrix.port }}
    needs: [ssh-original-amd64]
    runs-on: ubuntu-24.04
    timeout-minutes: 155
    strategy:
      fail-fast: false
      matrix:
        port: [riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: true
      - name: Require all SSH host/wire static negatives and original ISA boundaries
        run: |
          set -eu
          python3 scripts/test-m222-ssh-host.py
          python3 scripts/check-three-isa-core.py
          python3 scripts/check-architecture-boundaries.py
      - name: Install cross target GCC QEMU ELF ext4 and isolated OpenSSH
        timeout-minutes: 20
        run: |
          set -eu
          PATH=/usr/sbin:/sbin:$PATH
          export PATH
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'cmake:cmake' 'g++:g++' 'clang:clang' 'ld.lld:lld' \
                      'readelf:binutils' 'cpio:cpio' 'mke2fs:e2fsprogs' \
                      'debugfs:e2fsprogs' 'e2fsck:e2fsprogs' \
                      'xorriso:xorriso' 'mformat:mtools' 'sgdisk:gdisk' \
                      'curl:curl' 'python3:python3' 'openssl:openssl' \
                      'sshd:openssh-server' 'ssh-keygen:openssh-client'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          case '${{ matrix.port }}' in
            riscv64)
              command -v riscv64-linux-gnu-gcc >/dev/null || missing="$missing gcc-riscv64-linux-gnu"
              command -v riscv64-linux-gnu-g++ >/dev/null || missing="$missing g++-riscv64-linux-gnu"
              test -f /usr/riscv64-linux-gnu/include/bits/wordsize.h && \
              test -f /usr/riscv64-linux-gnu/lib/libc.a || missing="$missing libc6-dev-riscv64-cross"
              command -v qemu-system-riscv64 >/dev/null || missing="$missing qemu-system-misc"
              test -f /usr/share/qemu-efi-riscv64/RISCV_VIRT_CODE.fd || missing="$missing qemu-efi-riscv64" ;;
            arm64)
              command -v aarch64-linux-gnu-gcc >/dev/null || missing="$missing gcc-aarch64-linux-gnu"
              command -v aarch64-linux-gnu-g++ >/dev/null || missing="$missing g++-aarch64-linux-gnu"
              test -f /usr/aarch64-linux-gnu/include/bits/wordsize.h && \
              test -f /usr/aarch64-linux-gnu/lib/libc.a || missing="$missing libc6-dev-arm64-cross"
              command -v qemu-system-aarch64 >/dev/null || missing="$missing qemu-system-arm"
              test -f /usr/share/AAVMF/AAVMF_CODE.fd || \
                test -f /usr/share/qemu-efi-aarch64/QEMU_EFI.fd || missing="$missing qemu-efi-aarch64" ;;
          esac
          test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu"
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          sudo install -d -m 0755 /run/sshd
          command -v docker
          command -v sshd
      - name: Verify target ISA three exact signed ELF SHA and offline archive closure
        timeout-minutes: 20
        run: |
          set -eu
          sh scripts/inventory-m141-signed-apks.sh '${{ matrix.port }}' m222
          tsv='build/external/m222-candidate-inventory/${{ matrix.port }}/candidates.tsv'
          awk -F '\t' 'NR > 1 {n++; if ($3 != "NATIVE_ELF" || length($4) != 64 || $4 ~ /[^0-9a-f]/) bad++}
            END {if (n != 3 || bad) exit 1}' "$tsv"
      - name: Two cross-ISA Alpine QEMUs, temporary host sshd and exact SHA roundtrips
        timeout-minutes: 110
        env:
          NAS_M222_PUBLIC_QEMU_TIMEOUT: '4800'
          NAS_M222_PUBLIC_SECONDS: '4700'
          NAS_M222_REOPEN_SECONDS: '1500'
        run: sh scripts/probe-m222-alpine-pilot.sh '${{ matrix.port }}'
      - name: Preserve only authenticated real host SSH logs, 2 PCAPs and signed SHA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m222-original-ssh-${{ matrix.port }}
          path: |
            build/external/m222-candidate-inventory/${{ matrix.port }}/candidates.tsv
            build/external/m222-candidate-inventory/${{ matrix.port }}/signed-cache.sha256
            build/external/m222-candidate-inventory/${{ matrix.port }}/apk-offline-proof.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m222-compat-report.json
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m222-first-runner.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m197-live.serial.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m197-reopen-runner.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m197-public-wire.pcap
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m222-first-host-sshd.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m222-first-public-fingerprint.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m222-first-wire.json
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m222-reopen-host-sshd.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m222-reopen-public-fingerprint.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m222-reopen-wire.pcap
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m222-reopen-wire.json
            build/acceptance/**/m197-batch*.log
          if-no-files-found: warn
