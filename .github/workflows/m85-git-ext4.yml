name: NaSeed M85 original Git durable ext4 repository three-ISA two-boot acceptance
on:
  pull_request:
    paths:
      - '.github/workflows/m85-git-ext4.yml'
      - 'scripts/m85-*'
      - 'scripts/stage-m85-*'
      - 'scripts/probe-m85-*'
      - 'scripts/check-m85-*'
      - 'scripts/native-source-qemu.sh'
      - 'scripts/native-qemu-target.sh'
      - 'scripts/check-ext4-fsck-clean.sh'
      - 'scripts/check-lwext4-ramdisk.sh'
      - 'scripts/ci-ubuntu-mirror.sh'
      - 'rootfs/alpine/**'
      - 'tests/m85-*'
      - 'kernel/**'
      - 'ports/**'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  durable-git:
    name: M85 original signed Git real physical ext4 two QEMU boots / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install QEMU firmware, native cross build and ext4 verification tools
        timeout-minutes: 12
        run: |
          set -eu
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'clang:clang' 'ld.lld:lld' 'readelf:binutils' \
                      'cpio:cpio' 'xorriso:xorriso' 'mformat:mtools' \
                      'sgdisk:gdisk' 'qemu-riscv64:qemu-user' 'git:git' \
                      'mke2fs:e2fsprogs' 'e2fsck:e2fsprogs' 'debugfs:e2fsprogs'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          case "${{ matrix.port }}" in
            amd64)
              command -v qemu-system-x86_64 >/dev/null || missing="$missing qemu-system-x86"
              test -f /usr/share/OVMF/OVMF_CODE_4M.fd || \
                test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf" ;;
            riscv64)
              command -v qemu-system-riscv64 >/dev/null || missing="$missing qemu-system-misc"
              test -f /usr/share/qemu-efi-riscv64/RISCV_VIRT_CODE.fd || missing="$missing qemu-efi-riscv64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
            arm64)
              command -v qemu-system-aarch64 >/dev/null || missing="$missing qemu-system-arm"
              test -f /usr/share/AAVMF/AAVMF_CODE.fd || missing="$missing qemu-efi-aarch64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
          esac
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
      - name: Linux Git oracle and independently checked physical ext4 fixture
        timeout-minutes: 3
        run: sh scripts/check-m85-git-host.sh
      - name: Original signed Git commit branch gc repack fsck and ext4 reboot
        timeout-minutes: 85
        run: sh scripts/probe-m85-git.sh ${{ matrix.port }}
      - name: Preserve real raw-disk Git objects and both-boot acceptance
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: m85-original-git-pass-${{ matrix.port }}
          path: |
            build/external/m85-git/${{ matrix.port }}/m85-*.sha256
            build/external/m85-git/${{ matrix.port }}/m85-*.txt
            build/external/m85-git/${{ matrix.port }}/m85-*.pack
            build/external/m85-git/${{ matrix.port }}/m85-*.idx
            build/busybox-source-parity-x86/m85-*.clean.log
            build/port-riscv64/full/matrix-source/m85-*.clean.log
            build/port-aarch64/full/matrix-source/m85-*.clean.log
          if-no-files-found: error
      - name: Preserve physical disk and serial logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m85-original-git-fail-${{ matrix.port }}
          path: |
            build/external/m85-git/${{ matrix.port }}/m85-physical-ext4.img
            build/external/m85-git/${{ matrix.port }}/m85-*.log
            build/external/m85-git/${{ matrix.port }}/apk-install.log
            build/busybox-source-parity-x86/m85-*.clean.log
            build/port-riscv64/full/matrix-source/m85-*.clean.log
            build/port-aarch64/full/matrix-source/m85-*.clean.log
          if-no-files-found: ignore
