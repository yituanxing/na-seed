name: One-time pinned library vendoring
on:
  push:
    branches: [refactor/naseed-cleanup-01-20261124]
    paths: [.github/workflows/vendor-once.yml]
permissions:
  contents: write
jobs:
  vendor:
    if: github.event.head_commit.message == 'Vendor pinned lwIP and LVGL sources only'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Vendor original tracked source files
        shell: bash
        run: |
          set -euo pipefail
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          vendor() {
            local name=$1 revision=$2 url=$3
            shift 3
            local path="third_party/$name"
            test "$(git -C "$path" rev-parse HEAD)" = "$revision"
            git -C "$path" ls-tree -r HEAD -- "$@" | LC_ALL=C sort > "$scratch/$name.expected"
            test -s "$scratch/$name.expected"
            mkdir "$scratch/$name"
            git -C "$path" archive HEAD -- "$@" | tar -xf - -C "$scratch/$name"
            git rm --cached -f -- "$path"
            rm -rf -- "$path"
            mv "$scratch/$name" "$path"
            git add -f -- "$path"
            local index_tree
            index_tree=$(git write-tree)
            git ls-tree -r "$index_tree:$path" | LC_ALL=C sort > "$scratch/$name.actual"
            diff -u "$scratch/$name.expected" "$scratch/$name.actual"
            printf '%s\n%s\n' "$url" "$revision" > "$path/UPSTREAM_REVISION"
            git add -- "$path/UPSTREAM_REVISION"
            echo "Verified $name: $(wc -l < "$scratch/$name.expected") original upstream objects"
          }
          vendor lwip 77dcd25a72509eb83f72b033d219b1d40cd8eb95 https://github.com/lwip-tcpip/lwip.git src COPYING README BUILDING FEATURES UPGRADING CHANGELOG
          vendor lvgl c016f72d4c125098287be5e83c0f1abed4706ee5 https://github.com/lvgl/lvgl.git src lvgl.h lvgl_private.h lv_version.h lv_conf_template.h LICENCE.txt COPYRIGHTS.md README.md Kconfig lvgl.mk
          git rm -- .gitmodules
          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text()
          old = ' Checkout with `git submodule update --init --recursive`.'
          assert s.count(old) == 1
          p.write_text(s.replace(old, ' Core third-party library sources are tracked in this repository.'))
          PY
          git add -- README.md
          test -z "$(git ls-files -s | awk '$1 == 160000')"
          git diff --cached --stat | tail -n 1
      - name: Install compiler tools
        run: sudo apt-get update && sudo apt-get install -y clang lld binutils curl make xorriso ovmf qemu-system-x86
      - name: Validate vendored source build
        run: |
          make ARCH=x86_64 kernel
          make check-host
          make ARCH=x86_64 OUT=build/h0 NAS_ENABLE_H0_HARDWARE_DISCOVERY=1 kernel
          make ARCH=riscv64 NAS_ENABLE_VIRTIO_NET=1 kernel
          make ARCH=aarch64 NAS_ENABLE_VIRTIO_NET=1 kernel
          make iso
          make smoke
      - name: Commit validated source migration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "vendor: track pinned lwIP and LVGL library sources directly"
          git push origin "HEAD:$GITHUB_REF"
