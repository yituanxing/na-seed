name: Kernel baseline
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, riscv64, aarch64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install native build and emulator tools
        run: sudo apt-get update && sudo apt-get install -y clang lld binutils curl make xorriso ovmf qemu-system-x86
      - name: Validate shell entry points
        run: |
          for script in scripts/*.sh tests/*.sh; do sh -n "$script"; done
      - name: Build kernel
        run: make ARCH=${{ matrix.arch }} kernel
      - name: Build UEFI ISO
        if: matrix.arch == 'x86_64'
        run: make iso
      - name: Boot smoke
        if: matrix.arch == 'x86_64'
        run: make smoke
