name: Kernel baseline
# Push is the authoritative head check: a same-repository PR would otherwise
# run an identical push and pull_request matrix for the exact same SHA.
on:
  push:
  workflow_dispatch:
concurrency:
  group: kernel-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, riscv64, aarch64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install compiler tools
        run: sudo apt-get update && sudo apt-get install -y clang lld binutils curl make
      - name: Install x86 UEFI and QEMU tools
        if: matrix.arch == 'x86_64'
        run: sudo apt-get install -y xorriso ovmf qemu-system-x86
      - name: Validate shell entry points
        run: |
          for script in scripts/*.sh tests/*.sh; do sh -n "$script"; done
      - name: Build kernel
        run: make ARCH=${{ matrix.arch }} kernel
      - name: Display host contract
        if: matrix.arch == 'x86_64'
        run: make check-host
      - name: Build UEFI ISO
        if: matrix.arch == 'x86_64'
        run: make iso
      - name: Boot smoke
        if: matrix.arch == 'x86_64'
        run: make smoke
