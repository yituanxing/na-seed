name: NaSeed M51 focused native Alpine Git diagnostics
# Intentionally manual-only. The grouped native QEMU matrix owns PR CI.
on:
  workflow_dispatch:
jobs:
  git:
    name: Original signed Git / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Install headless QEMU and boot tools
        timeout-minutes: 12
        run: |
          set -eu
          sh scripts/ci-install-signed-alpine-qemu-deps.sh ${{ matrix.port }} --explicit-tools clang:clang ld.lld:lld readelf:binutils cpio:cpio xorriso:xorriso mformat:mtools sgdisk:gdisk qemu-riscv64:qemu-user
      - name: Original Alpine Git init add commits branch checkout in native QEMU
        timeout-minutes: 28
        run: sh scripts/probe-m51-git.sh ${{ matrix.port }}
      - name: Preserve package and guest serial evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m51-git-${{ matrix.port }}
          path: |
            build/external/m51-git/${{ matrix.port }}/apk-install.log
            build/external/m51-git/${{ matrix.port }}/requested-packages.txt
            build/busybox-source-parity-x86/m51-git.clean.log
            build/port-riscv64/full/matrix-source/m51-git.clean.log
            build/port-aarch64/full/matrix-source/m51-git.clean.log
          if-no-files-found: ignore
