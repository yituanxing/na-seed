# Single original H0-H6 PCI/NVMe cohort dispatcher; no guest proof removed.
name: NaSeed H0-H6 original read-only PCI NVMe hardware QEMU
on:
  push:
    branches: [feat/na-hw-h0-pci-20261110, 'refactor/naseed-cleanup-*']
    paths:
      - '.github/workflows/h0-h6-pci-nvme.yml'
      - 'Makefile'
      - 'kernel/arch/x86_64/mmu.*'
      - 'kernel/drivers/core/pci_resources.*'
      - 'kernel/drivers/core/pci_scan.*'
      - 'kernel/drivers/nvme/**'
      - 'kernel/drivers/port/**'
      - 'kernel/drivers/port/block.*'
      - 'kernel/drivers/port/dma.*'
      - 'kernel/drivers/port/mmio.h'
      - 'kernel/drivers/serial.*'
      - 'kernel/kernel.c'
      - 'kernel/lib/endian.h'
      - 'kernel/platform/firmware_acpi.*'
      - 'kernel/platform/pci_ecam.*'
      - 'kernel/platform/x86_h0_pci.*'
      - 'kernel/platform/x86_h11_bar.h'
      - 'kernel/platform/x86_h1_ecam.*'
      - 'kernel/platform/x86_h3_nvme.*'
      - 'kernel/platform/x86_h4_*'
      - 'kernel/platform/x86_pci_config.h'
      - 'kernel/platform/x86_qemu_hw_contract.h'
      - 'refactor/naseed-cleanup-*'
      - 'scripts/acceptance/h0-h6-pci-nvme.sh'
      - 'scripts/check-h1-pci-ecam-host.sh'
      - 'scripts/check-h2-pci-resource-host.sh'
      - 'scripts/check-h3-*.sh'
      - 'scripts/check-h4-*.sh'
      - 'scripts/check-h5-*.sh'
      - 'scripts/check-h6-*.sh'
      - 'scripts/check-host-fixture.sh'
      - 'scripts/check-pci-scan.sh'
      - 'scripts/ci-install-x86-deps.sh'
      - 'scripts/run.sh'
      - 'scripts/test-pci-scan.c'
      - 'tests/h0-acpi-host.c'
      - 'tests/h1-pci-ecam-host.c'
      - 'tests/h2-pci-resource-host.c'
      - 'tests/h3-*.c'
      - 'tests/h4-*.c'
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        description: Exact isolated original host+QEMU stage
        required: true
        default: all
        options: [all, h0, h1, h2, h3, h4, h5, h6]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      profiles: ${{ steps.choose.outputs.profiles }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Preserve original profile-specific push paths
        id: choose
        env:
          MODE: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PICK: ${{ inputs.profile }}
        run: |
          python3 - <<'PY'
          import json, fnmatch, os, subprocess
          owners = {"h0":["refactor/naseed-cleanup-*","scripts/ci-install-x86-deps.sh","kernel/kernel.c","kernel/drivers/core/pci_scan.*","kernel/drivers/serial.*","kernel/platform/firmware_acpi.*","kernel/platform/x86_h0_pci.*","kernel/platform/x86_pci_config.h","scripts/check-host-fixture.sh","scripts/check-pci-scan.sh","scripts/test-pci-scan.c","tests/h0-acpi-host.c","Makefile","kernel/lib/endian.h"],"h1":["refactor/naseed-cleanup-*","scripts/ci-install-x86-deps.sh","kernel/kernel.c","kernel/arch/x86_64/mmu.*","kernel/platform/firmware_acpi.*","kernel/platform/pci_ecam.*","kernel/platform/x86_h0_pci.*","kernel/platform/x86_pci_config.h","kernel/platform/x86_h1_ecam.*","kernel/drivers/core/pci_scan.*","tests/h0-acpi-host.c","tests/h1-pci-ecam-host.c","scripts/check-h1-pci-ecam-host.sh","Makefile","kernel/lib/endian.h"],"h2":["refactor/naseed-cleanup-*","scripts/ci-install-x86-deps.sh","kernel/platform/x86_h1_ecam.*","kernel/platform/x86_pci_config.h","kernel/drivers/core/pci_resources.*","kernel/platform/pci_ecam.*","kernel/kernel.c","tests/h2-pci-resource-host.c","scripts/check-h2-pci-resource-host.sh","scripts/run.sh","Makefile"],"h3":["refactor/naseed-cleanup-*","scripts/ci-install-x86-deps.sh","kernel/platform/x86_qemu_hw_contract.h","kernel/platform/x86_h11_bar.h","kernel/platform/x86_h1_ecam.*","kernel/platform/x86_pci_config.h","kernel/platform/x86_h3_nvme.*","kernel/platform/pci_ecam.*","kernel/drivers/core/pci_resources.*","kernel/drivers/nvme/**","kernel/kernel.c","tests/h3-*.c","scripts/check-h3-*.sh","scripts/run.sh","Makefile","kernel/lib/endian.h","kernel/drivers/port/mmio.h"],"h4":["refactor/naseed-cleanup-*","scripts/ci-install-x86-deps.sh","kernel/platform/x86_qemu_hw_contract.h","kernel/platform/x86_h11_bar.h","kernel/platform/x86_h4_*","kernel/platform/x86_h3_nvme.*","kernel/platform/x86_h1_ecam.*","kernel/drivers/nvme/**","kernel/drivers/port/block.*","kernel/kernel.c","tests/h4-*.c","scripts/check-h4-*.sh","scripts/run.sh","Makefile","kernel/lib/endian.h","kernel/drivers/port/mmio.h"],"h5":["refactor/naseed-cleanup-*","scripts/ci-install-x86-deps.sh","kernel/platform/x86_qemu_hw_contract.h","kernel/platform/x86_h11_bar.h","kernel/platform/x86_h3_nvme.*","kernel/platform/x86_h1_ecam.*","kernel/drivers/core/pci_resources.*","kernel/drivers/nvme/**","kernel/drivers/port/**","kernel/kernel.c","tests/h4-*.c","tests/h2-pci-resource-host.c","scripts/check-h5-*.sh","scripts/check-h4-*.sh","scripts/run.sh","Makefile","kernel/lib/endian.h"],"h6":["refactor/naseed-cleanup-*","scripts/ci-install-x86-deps.sh","kernel/platform/x86_qemu_hw_contract.h","kernel/platform/x86_h11_bar.h","kernel/platform/x86_h3_nvme.*","kernel/platform/x86_h1_ecam.*","kernel/drivers/core/pci_resources.*","kernel/drivers/nvme/**","kernel/drivers/port/dma.*","kernel/kernel.c","tests/h4-*.c","tests/h2-pci-resource-host.c","scripts/check-h6-*.sh","scripts/check-h4-*.sh","scripts/run.sh","Makefile","kernel/lib/endian.h","kernel/drivers/port/mmio.h"]}
          if os.environ["MODE"] == "workflow_dispatch":
              x = os.environ["PICK"]
              chosen = list(owners) if x == "all" else [x]
          else:
              before = os.environ.get("BEFORE", "")
              if not before or set(before) == {"0"}:
                  chosen = list(owners)
              else:
                  r = subprocess.run(["git", "diff", "--name-only", before,
                                      os.environ["GITHUB_SHA"]],
                                     capture_output=True, text=True)
                  changed = r.stdout.splitlines()
                  common = {".github/workflows/h0-h6-pci-nvme.yml",
                            "scripts/acceptance/h0-h6-pci-nvme.sh"}
                  chosen = list(owners) if r.returncode else [
                      name for name, globs in owners.items()
                      if any(p in common or any(fnmatch.fnmatchcase(p, g)
                             for g in globs) for p in changed)]
          if any(p not in owners for p in chosen):
              raise SystemExit("unknown hardware profile")
          with open(os.environ["GITHUB_OUTPUT"], "a") as dest:
              print("profiles=" + json.dumps(chosen, separators=(",", ":")), file=dest)
          PY
  native:
    needs: [select]
    if: ${{ needs.select.outputs.profiles != '[]' }}
    name: Original isolated ${{ matrix.profile }} PCI NVMe QEMU
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.profile == 'h6' && 22 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.select.outputs.profiles) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: true
      - name: Run each original strict host, build and real QEMU hardware step
        run: |
          bash -n scripts/acceptance/h0-h6-pci-nvme.sh
          bash scripts/acceptance/h0-h6-pci-nvme.sh "${{ matrix.profile }}"
      - name: Original H0 serial exact evidence
        if: ${{ always() && matrix.profile == 'h0' }}
        uses: actions/upload-artifact@v4
        with:
          name: h0-x86-qemu-uefi-serial
          path: build/h0-hardware/h0-qemu-uefi-serial.log
          if-no-files-found: ignore
      - name: Original H0 ISO/media exact evidence
        if: ${{ success() && matrix.profile == 'h0' }}
        uses: actions/upload-artifact@v4
        with:
          name: h0-x86-readonly-uefi-iso
          path: build/h0-hardware/naseed.iso
          if-no-files-found: error
      - name: Original H1 serial exact evidence
        if: ${{ always() && matrix.profile == 'h1' }}
        uses: actions/upload-artifact@v4
        with:
          name: h1-x86-qemu-uefi-ecam-serial
          path: build/h1-hardware/h1-qemu-uefi-serial.log
          if-no-files-found: ignore
      - name: Original H1 ISO/media exact evidence
        if: ${{ success() && matrix.profile == 'h1' }}
        uses: actions/upload-artifact@v4
        with:
          name: h1-x86-readonly-uefi-iso
          path: build/h1-hardware/naseed.iso
          if-no-files-found: error
      - name: Original H2 serial exact evidence
        if: ${{ always() && matrix.profile == 'h2' }}
        uses: actions/upload-artifact@v4
        with:
          name: h2-x86-qemu-pci-nvme-candidate-serial
          path: build/h2-hardware/h2-qemu-uefi-serial.log
          if-no-files-found: ignore
      - name: Original H2 ISO/media exact evidence
        if: ${{ success() && matrix.profile == 'h2' }}
        uses: actions/upload-artifact@v4
        with:
          name: h2-x86-readonly-uefi-iso
          path: build/h2-hardware/naseed.iso
          if-no-files-found: error
      - name: Original H3 serial exact evidence
        if: ${{ always() && matrix.profile == 'h3' }}
        uses: actions/upload-artifact@v4
        with:
          name: h3-x86-qemu-nvme-admin-identify-serial
          path: build/h3-qemu-only/h3-qemu-uefi-serial.log
          if-no-files-found: ignore
      - name: Original H3 ISO/media exact evidence
        if: ${{ success() && matrix.profile == 'h3' }}
        uses: actions/upload-artifact@v4
        with:
          name: h3-x86-qemu-nvme-identify-uefi-iso
          path: build/h3-qemu-only/naseed.iso
          if-no-files-found: error
      - name: Original H4 serial exact evidence
        if: ${{ always() && matrix.profile == 'h4' }}
        uses: actions/upload-artifact@v4
        with:
          name: h4-x86-qemu-nvme-readonly-lba-serial
          path: build/h4-qemu-only/h4-qemu-uefi-serial.log
          if-no-files-found: ignore
      - name: Original H4 ISO/media exact evidence
        if: ${{ success() && matrix.profile == 'h4' }}
        uses: actions/upload-artifact@v4
        with:
          name: h4-x86-qemu-nvme-readonly-uefi-and-seed
          path: |
            build/h4-qemu-only/naseed.iso
            build/h4-qemu-only/h4-seed.img
          if-no-files-found: error
      - name: Original H5 serial exact evidence
        if: ${{ always() && matrix.profile == 'h5' }}
        uses: actions/upload-artifact@v4
        with:
          name: h5-x86-qemu-relocated-pci-nvme-readonly-serial
          path: build/h5-qemu-only/h5-qemu-uefi-serial.log
          if-no-files-found: ignore
      - name: Original H5 ISO/media exact evidence
        if: ${{ success() && matrix.profile == 'h5' }}
        uses: actions/upload-artifact@v4
        with:
          name: h5-x86-qemu-pci-nvme-uefi-and-seed
          path: |
            build/h5-qemu-only/naseed.iso
            build/h4-qemu-only/h4-seed.img
          if-no-files-found: error
      - name: Original H6 serial exact evidence
        if: ${{ always() && matrix.profile == 'h6' }}
        uses: actions/upload-artifact@v4
        with:
          name: h6-x86-qemu-pci-resource-serial-positive-negative
          path: |
            build/h6-qemu-only/h6-qemu-uefi-serial.log
            build/h6-qemu-ambiguous/h6-ambiguous-uefi-serial.log
          if-no-files-found: ignore
      - name: Original H6 ISO/media exact evidence
        if: ${{ success() && matrix.profile == 'h6' }}
        uses: actions/upload-artifact@v4
        with:
          name: h6-x86-qemu-pci-resource-uefi-proofs
          path: |
            build/h6-qemu-only/naseed.iso
            build/h6-qemu-ambiguous/naseed.iso
            build/h4-qemu-only/h4-seed.img
          if-no-files-found: error
