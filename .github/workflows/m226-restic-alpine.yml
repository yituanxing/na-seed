name: NaSeed M226 original signed Alpine restic true REST two native boots

# Targeted; M225's active runs remain untouched. Never label a green host
# preflight or QEMU serial marker as genuine two-boot RTL/OS acceptance.
on:
  push:
    branches: [naseed-app-batch2]
    paths:
      - '.github/workflows/m226-restic-alpine.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-restic-amd64:
    name: Historical M137 signed restic NEW remote REST semantics / 2 amd64 native QEMUs
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: true
      - name: Strict candidate and prior-app architecture gates
        run: |
          set -eu
          python3 scripts/check-m141-candidates.py --profile m226
          python3 scripts/check-three-isa-core.py
          python3 scripts/check-architecture-boundaries.py
          sh -n scripts/probe-m197-alpine-software-cohort.sh
          sh -n scripts/m226-rest-server-host.sh
          sh -n tests/m226-restic-workload.sh
          sh -n tests/m226-software-workload.sh
      - name: Native x86 QEMU firmware real ext4 official APK and upstream REST prerequisites
        timeout-minutes: 24
        run: |
          set -eu
          PATH=/usr/sbin:/sbin:$PATH
          export PATH
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'cmake:cmake' 'g++:g++' 'clang:clang' 'ld.lld:lld' \
                      'qemu-system-x86_64:qemu-system-x86' 'readelf:binutils' \
                      'cpio:cpio' 'mke2fs:e2fsprogs' 'debugfs:e2fsprogs' \
                      'e2fsck:e2fsprogs' 'xorriso:xorriso' 'mformat:mtools' \
                      'sgdisk:gdisk' 'curl:curl' 'bzip2:bzip2' \
                      'python3:python3' 'openssl:openssl'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          test -f /usr/share/OVMF/OVMF_CODE_4M.fd || \
            test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf"
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
      - name: Mandatory official exact SHA host real REST complete two-lifecycle preflight
        timeout-minutes: 12
        run: |
          set -eu
          . scripts/m226-rest-server-host.sh
          m226_install_rest_server
          python3 scripts/m226-test-host.py
      - name: Official signed original restic native ELF SHA and offline apk closure
        timeout-minutes: 30
        run: |
          set -eu
          sh scripts/inventory-m141-signed-apks.sh amd64 m226
          tsv=build/external/m226-candidate-inventory/amd64/candidates.tsv
          awk -F '\t' 'NR > 1 {n++; if ($1 != "restic" || $2 != "usr/bin/restic" || $3 != "NATIVE_ELF" || length($4) != 64 || $4 ~ /[^0-9a-f]/) bad++}
            END {if (n != 1 || bad) exit 1}' "$tsv"
      - name: Native x86 real upstream REST and encrypted backup both QEMUs PCAP ext4
        timeout-minutes: 80
        env:
          NAS_M226_PUBLIC_QEMU_TIMEOUT: '3800'
          NAS_M226_PUBLIC_SECONDS: '3550'
          NAS_M226_REOPEN_SECONDS: '1500'
        run: sh scripts/probe-m226-alpine-restic-pilot.sh amd64
      - name: Retain official SHA host two-phase REST/PCAP and independent ext4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m226-real-restic-amd64
          path: |
            build/external/m226-candidate-inventory/amd64/candidates.tsv
            build/external/m226-candidate-inventory/amd64/signed-cache.sha256
            build/external/m226-candidate-inventory/amd64/apk-offline-proof.log
            build/external/m191-alpine-rootfs/amd64/m226-compat-report.json
            build/external/m191-alpine-rootfs/amd64/m226-first-runner.log
            build/external/m191-alpine-rootfs/amd64/m197-live.serial.log
            build/external/m191-alpine-rootfs/amd64/m197-reopen-runner.log
            build/external/m191-alpine-rootfs/amd64/m197-public-wire.pcap
            build/external/m191-alpine-rootfs/amd64/m226-first-source.log
            build/external/m191-alpine-rootfs/amd64/m226-first-rest-server.log
            build/external/m191-alpine-rootfs/amd64/m226-first-wire.json
            build/external/m191-alpine-rootfs/amd64/m226-first-host-restic-check.log
            build/external/m191-alpine-rootfs/amd64/m226-first-host-snapshots.json
            build/external/m191-alpine-rootfs/amd64/m226-reopen-source.log
            build/external/m191-alpine-rootfs/amd64/m226-reopen-rest-server.log
            build/external/m191-alpine-rootfs/amd64/m226-reopen-wire.pcap
            build/external/m191-alpine-rootfs/amd64/m226-reopen-wire.json
            build/external/m191-alpine-rootfs/amd64/m226-reopen-host-restic-check.log
            build/external/m191-alpine-rootfs/amd64/m226-reopen-host-snapshots.json
            build/acceptance/**/m197-batch*.log
          if-no-files-found: warn

  signed-restic-cross:
    name: Historical M137 signed restic remote REST two native QEMUs / ${{ matrix.port }}
    needs: [signed-restic-amd64]
    runs-on: ubuntu-24.04
    timeout-minutes: 225
    strategy:
      fail-fast: false
      matrix:
        port: [riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: true
      - name: Strict original restic remote two-boot candidates and architecture gates
        run: |
          set -eu
          python3 scripts/check-m141-candidates.py --profile m226
          python3 scripts/check-three-isa-core.py
          python3 scripts/check-architecture-boundaries.py
          sh -n scripts/probe-m197-alpine-software-cohort.sh
      - name: Cross GNU native QEMU firmware ext4 and upstream REST prerequisites
        timeout-minutes: 27
        run: |
          set -eu
          PATH=/usr/sbin:/sbin:$PATH
          export PATH
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'cmake:cmake' 'g++:g++' 'clang:clang' 'ld.lld:lld' \
                      'readelf:binutils' 'cpio:cpio' 'mke2fs:e2fsprogs' \
                      'debugfs:e2fsprogs' 'e2fsck:e2fsprogs' 'xorriso:xorriso' \
                      'mformat:mtools' 'sgdisk:gdisk' 'curl:curl' 'bzip2:bzip2' \
                      'python3:python3' 'openssl:openssl'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          case '${{ matrix.port }}' in
            riscv64)
              command -v riscv64-linux-gnu-gcc >/dev/null || missing="$missing gcc-riscv64-linux-gnu"
              command -v riscv64-linux-gnu-g++ >/dev/null || missing="$missing g++-riscv64-linux-gnu"
              test -f /usr/riscv64-linux-gnu/include/bits/wordsize.h && \
              test -f /usr/riscv64-linux-gnu/lib/libc.a || missing="$missing libc6-dev-riscv64-cross"
              command -v qemu-system-riscv64 >/dev/null || missing="$missing qemu-system-misc"
              test -f /usr/share/qemu-efi-riscv64/RISCV_VIRT_CODE.fd || missing="$missing qemu-efi-riscv64" ;;
            arm64)
              command -v aarch64-linux-gnu-gcc >/dev/null || missing="$missing gcc-aarch64-linux-gnu"
              command -v aarch64-linux-gnu-g++ >/dev/null || missing="$missing g++-aarch64-linux-gnu"
              test -f /usr/aarch64-linux-gnu/include/bits/wordsize.h && \
              test -f /usr/aarch64-linux-gnu/lib/libc.a || missing="$missing libc6-dev-arm64-cross"
              command -v qemu-system-aarch64 >/dev/null || missing="$missing qemu-system-arm"
              test -f /usr/share/AAVMF/AAVMF_CODE.fd || \
                test -f /usr/share/qemu-efi-aarch64/QEMU_EFI.fd || missing="$missing qemu-efi-aarch64" ;;
          esac
          test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu"
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
      - name: Mandatory official host exact SHA real restic+rest-server restart preflight
        timeout-minutes: 12
        run: |
          set -eu
          . scripts/m226-rest-server-host.sh
          m226_install_rest_server
          python3 scripts/m226-test-host.py
      - name: Exact original signed target-native Alpine restic SHA and offline APK
        timeout-minutes: 32
        run: |
          set -eu
          sh scripts/inventory-m141-signed-apks.sh '${{ matrix.port }}' m226
          tsv='build/external/m226-candidate-inventory/${{ matrix.port }}/candidates.tsv'
          awk -F '\t' 'NR > 1 {n++; if ($1 != "restic" || $2 != "usr/bin/restic" || $3 != "NATIVE_ELF" || length($4) != 64 || $4 ~ /[^0-9a-f]/) bad++}
            END {if (n != 1 || bad) exit 1}' "$tsv"
      - name: Native cross ISA true restic remote REST two-boot QEMU PCAP ext4 fsck
        timeout-minutes: 120
        env:
          NAS_M226_PUBLIC_QEMU_TIMEOUT: '5400'
          NAS_M226_PUBLIC_SECONDS: '5150'
          NAS_M226_REOPEN_SECONDS: '2000'
        run: sh scripts/probe-m226-alpine-restic-pilot.sh '${{ matrix.port }}'
      - name: Retain signed cross REST upstream host logs both PCAP and physical proofs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m226-real-restic-${{ matrix.port }}
          path: |
            build/external/m226-candidate-inventory/${{ matrix.port }}/candidates.tsv
            build/external/m226-candidate-inventory/${{ matrix.port }}/signed-cache.sha256
            build/external/m226-candidate-inventory/${{ matrix.port }}/apk-offline-proof.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m226-compat-report.json
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m226-first-runner.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m197-live.serial.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m197-reopen-runner.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m197-public-wire.pcap
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m226-first-source.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m226-first-rest-server.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m226-first-wire.json
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m226-first-host-restic-check.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m226-first-host-snapshots.json
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m226-reopen-source.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m226-reopen-rest-server.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m226-reopen-wire.pcap
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m226-reopen-wire.json
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m226-reopen-host-restic-check.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m226-reopen-host-snapshots.json
            build/acceptance/**/m197-batch*.log
          if-no-files-found: warn
