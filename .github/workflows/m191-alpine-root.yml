name: NaSeed M191 original Alpine root ext4 and PID1 BusyBox on three ISA

on:
  workflow_dispatch:
  push:
    branches: [naseed-app-batch2]
    paths:
      - 'kernel/**'
      - 'ports/lwext4/**'
      - 'ports/uboot/**'
      - 'ports/unikraft/**'
      - 'rootfs/alpine/**'
      - 'scripts/m191-*'
      - 'scripts/test-m191-export-alpine-elf.py'
      - 'scripts/probe-m191-alpine-root.sh'
      - 'scripts/build-lwext4-guest.sh'
      - 'scripts/build-riscv64-full.sh'
      - 'scripts/build-aarch64-full.sh'
      - 'scripts/probe-x86-busybox-parity.sh'
      - 'scripts/probe-riscv64-busybox-matrix.sh'
      - 'scripts/probe-aarch64-busybox-matrix.sh'
      - 'scripts/native-source-qemu.sh'
      - 'scripts/native-qemu-target.sh'
      - 'scripts/run.sh'
      - 'scripts/full-kernel-core.sources'
      - 'Makefile'

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  host-root-contract:
    name: M191 Alpine rootfs, guest symlink and partition model contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
      - name: Validate the three native ISA root source and host scripts
        run: |
          set -eu
          python3 scripts/check-three-isa-core.py
          python3 scripts/check-architecture-boundaries.py
          sh -n scripts/probe-m191-alpine-root.sh
          sh -n scripts/m191-stage-alpine-rootfs.sh
          sh -n rootfs/alpine/build.sh
          python3 -m py_compile scripts/m191-alpine-root-disk.py scripts/m191-host-smoke.py scripts/m191-export-alpine-elf.py scripts/test-m191-export-alpine-elf.py
          python3 scripts/m191-host-smoke.py
          python3 scripts/test-m191-export-alpine-elf.py
          sh scripts/check-m191-root-provider.sh

  original-alpine-physical-root:
    name: M191 official Alpine root / and real QEMU user PID1 / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    needs: host-root-contract
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
      - name: Install native QEMU, firmware, ext4, boot and release verification tools
        timeout-minutes: 18
        run: |
          set -eu
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'cmake:cmake' 'g++:g++' 'clang:clang' 'ld.lld:lld' \
                      'readelf:binutils' 'cpio:cpio' 'mke2fs:e2fsprogs' \
                      'debugfs:e2fsprogs' 'e2fsck:e2fsprogs' \
                      'xorriso:xorriso' 'mformat:mtools' 'sgdisk:gdisk' \
                      'curl:curl' 'python3:python3'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          case '${{ matrix.port }}' in
            amd64)
              command -v qemu-system-x86_64 >/dev/null || missing="$missing qemu-system-x86"
              test -f /usr/share/OVMF/OVMF_CODE_4M.fd || \
              test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf" ;;
            riscv64)
              command -v qemu-system-riscv64 >/dev/null || missing="$missing qemu-system-misc"
              test -f /usr/share/qemu-efi-riscv64/RISCV_VIRT_CODE.fd || missing="$missing qemu-efi-riscv64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
            arm64)
              command -v qemu-system-aarch64 >/dev/null || missing="$missing qemu-system-arm"
              test -f /usr/share/qemu-efi-aarch64/QEMU_EFI.fd || missing="$missing qemu-efi-aarch64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
          esac
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
          command -v sudo
      - name: Boot genuine system QEMU into signed Alpine physical ext4 root
        timeout-minutes: 74
        run: sh scripts/probe-m191-alpine-root.sh ${{ matrix.port }}
      - name: Preserve authentic rootfs, physical disk and serial boot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m191-original-alpine-root-${{ matrix.port }}
          path: |
            build/external/m191-alpine-rootfs/${{ matrix.port }}/alpine-root.img
            build/external/m191-alpine-rootfs/${{ matrix.port }}/requested-packages.txt
            build/external/m191-alpine-rootfs/${{ matrix.port }}/apk-install.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/smoke/original-alpine-elfs.sha256
            build/busybox-source-parity-x86/m191-batch.clean.log
            build/busybox-source-parity-x86/m191-batch.serial.log
            build/port-riscv64/full/matrix-source/m191-batch.clean.log
            build/port-riscv64/full/matrix-source/m191-batch.serial.log
            build/port-aarch64/full/matrix-source/m191-batch.clean.log
            build/port-aarch64/full/matrix-source/m191-batch.serial.log
          if-no-files-found: ignore
