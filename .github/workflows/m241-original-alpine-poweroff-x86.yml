name: NaSeed M241 original Alpine real PID1 poweroff x86 pilot

# Single native QEMU boot on the feature branch. Keep the already-proven
# M240 9x2/three-ISA SSH-PTY matrix out of the edit/debug feedback loop.
on:
  push:
    branches: [na-alpine-direct-use]
    paths:
      - '.github/workflows/m241-original-alpine-poweroff-x86.yml'
      - 'scripts/probe-m241-alpine-poweroff.sh'
      - 'scripts/probe-x86-busybox-parity.sh'
      - 'scripts/build-lwext4-guest.sh'
      - 'scripts/m241-alpine-poweroff-uart.py'
      - 'scripts/m241-verify-poweroff-disk.py'
      - 'kernel/init/main.c'
      - 'kernel/init/main.h'
      - 'kernel/task/signal.c'
      - 'kernel/arch/linux_syscall_abi.h'
      - 'kernel/fs/vfs.h'
      - 'kernel/fs/vfs_providers.c'
      - 'kernel/syscall/reboot_policy.h'
      - 'kernel/syscall/dispatch.c'
      - 'ports/lwext4/guest_boot.c'

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-alpine-poweroff:
    name: One genuine x86-64 QEMU / original Alpine OpenRC poweroff
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: true
      - name: Validate short preflight and native serial oracle
        run: |
          set -eu
          sh -n scripts/probe-m241-alpine-poweroff.sh
          python3 -m py_compile scripts/m241-alpine-poweroff-uart.py
          python3 -m py_compile scripts/m241-verify-poweroff-disk.py
          python3 scripts/test-m241-alpine-poweroff-uart.py
          sh scripts/check-m241-original-alpine-shutdown.sh
      - name: Install x86-64 native QEMU, ext4 and signed Alpine stage dependencies
        timeout-minutes: 18
        run: |
          set -eu
          PATH=/usr/sbin:/sbin:$PATH
          export PATH
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'cmake:cmake' 'g++:g++' 'clang:clang' 'ld.lld:lld' \
                      'readelf:binutils' 'cpio:cpio' 'mke2fs:e2fsprogs' \
                      'debugfs:e2fsprogs' 'e2fsck:e2fsprogs' \
                      'xorriso:xorriso' 'mformat:mtools' 'sgdisk:gdisk' \
                      'curl:curl' 'python3:python3' 'openssl:openssl'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          command -v qemu-system-x86_64 >/dev/null || missing="$missing qemu-system-x86"
          test -f /usr/share/OVMF/OVMF_CODE_4M.fd || \
          test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf"
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
      - name: Restore previously verified Limine firmware seed
        uses: ./.github/actions/naseed-limine-seed
        with:
          github-token: ${{ github.token }}
      - name: One original Alpine init, authenticated UART and native guest poweroff
        timeout-minutes: 38
        env:
          NAS_M241_DIAG_SECONDS: '240'
        run: sh scripts/probe-m241-alpine-poweroff.sh amd64
      - name: Preserve raw QEMU shutdown and physical ext4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m241-original-alpine-real-poweroff-amd64
          path: |
            build/external/m191-alpine-rootfs/amd64/m241-*.log
            build/busybox-source-parity-x86/m193-batch.clean.log
            build/busybox-source-parity-x86/m193-batch.serial.log
          if-no-files-found: warn
          retention-days: 7
