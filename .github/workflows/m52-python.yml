name: NaSeed M52 focused original CPython diagnostics
on:
  workflow_dispatch:
jobs:
  python:
    name: Original CPython / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Install headless QEMU and boot toolchain
        timeout-minutes: 12
        run: |
          set -eu
          sh scripts/ci-install-signed-alpine-qemu-deps.sh ${{ matrix.port }} --explicit-tools clang:clang ld.lld:lld readelf:binutils cpio:cpio xorriso:xorriso mformat:mtools sgdisk:gdisk qemu-riscv64:qemu-user
      - name: Authentic Python guest QEMU acceptance
        timeout-minutes: 28
        run: sh scripts/probe-m52-python.sh ${{ matrix.port }}
      - name: Save failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m52-python-${{ matrix.port }}
          path: |
            build/external/m52-python/${{ matrix.port }}/apk-install.log
            build/external/m52-python/${{ matrix.port }}/requested-packages.txt
            build/busybox-source-parity-x86/m52-python.clean.log
            build/port-riscv64/full/matrix-source/m52-python.clean.log
            build/port-aarch64/full/matrix-source/m52-python.clean.log
          if-no-files-found: ignore
