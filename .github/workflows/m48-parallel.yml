name: NaSeed M48 original GNU Make -j2 / GNU xargs -P2 + GCC in three native kernels
# M50: retained as an opt-in single-milestone diagnostic. PR auto-validation
# has moved to m50-alpine-matrix.yml: same twelve scripts/real QEMU checks,
# grouped by native ISA and workload class to reuse installation and builds.
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  gcc-musl:
    name: authentic GNU make -j2, GCC and xargs -P2 / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Install headless QEMU and boot toolchain
        timeout-minutes: 12
        run: |
          set -eu
          sh scripts/ci-install-signed-alpine-qemu-deps.sh ${{ matrix.port }} --explicit-tools clang:clang ld.lld:lld readelf:binutils cpio:cpio xorriso:xorriso mformat:mtools sgdisk:gdisk qemu-riscv64:qemu-user
      - name: Reject CPIO fixed-file-count regressions before expensive package fetch
        run: sh scripts/check-bootfs-scale.sh
      - name: Run genuine concurrent GNU Make GCC build and GNU xargs workers inside native QEMU
        timeout-minutes: 24
        run: sh scripts/probe-m48-parallel.sh ${{ matrix.port }}
      - name: Preserve original package/ELF/serial evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m48-native-parallel-${{ matrix.port }}
          path: |
            build/external/m48-parallel/${{ matrix.port }}/apk-install.log
            build/external/m48-parallel/${{ matrix.port }}/requested-packages.txt
            build/external/m48-parallel/${{ matrix.port }}/rootfs/tests/m48-parallel.mk
            build/busybox-source-parity-x86/m48-parallel.clean.log
            build/port-riscv64/full/matrix-source/m48-parallel.clean.log
            build/port-aarch64/full/matrix-source/m48-parallel.clean.log
          if-no-files-found: ignore
