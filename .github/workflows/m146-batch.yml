name: NaSeed M146 24 NEW signed Alpine media/development ELFs

on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  signed-original-software:
    # Smallest native QEMU cohort on PR updates. Explicit dispatch or a label
    # broadens it to two more ISAs only after a coherent batch is ready.
    name: M146 24 new original ELFs / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        port: ${{ fromJSON((github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-m146-multiarch')) && '["amd64","riscv64","arm64"]' || '["amd64"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
      - name: Verify provenance and native runner contract
        timeout-minutes: 4
        run: |
          set -eu
          for script in scripts/stage-m146-prebuilt.sh \
                        scripts/probe-m146-batch.sh \
                        scripts/stage-alpine-prebuilt-overlay.sh \
                        tests/m146-batch-run.sh; do
            sh -n "$script"
          done
          python3 scripts/check-prebuilt-profile-catalog.py
          python3 scripts/check-three-isa-core.py
          sh scripts/check-vfs-provider.sh
          sh scripts/check-m86-txn.sh
          test "$(awk '!/^#/ && NF {n++} END {print n+0}' scripts/m146-original-elfs.txt)" -eq 24
          test "$(awk '!/^#/ && NF {n++} END {print n+0}' scripts/m146-expected-markers.txt)" -eq 25
          test "$(awk '!/^#/ && NF {print $0}' scripts/m146-original-elfs.txt | sort -u | wc -l)" -eq 24
      - name: Install signed APK staging and native system QEMU
        timeout-minutes: 12
        run: sh scripts/ci-install-signed-alpine-qemu-deps.sh ${{ matrix.port }} --arm64-efi-fallback
      - name: Native QEMU 24 unmodified signed Alpine program semantics
        timeout-minutes: 48
        run: sh scripts/probe-m146-batch.sh ${{ matrix.port }}
      - name: Preserve QEMU serial and original signed APK hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m146-original-${{ matrix.port }}-proof
          path: |
            build/external/m146-batch/${{ matrix.port }}/apk-install.log
            build/external/m146-batch/${{ matrix.port }}/requested-packages.txt
            build/external/m146-batch/${{ matrix.port }}/*.sha256
            build/busybox-source-parity-x86/m146-batch.clean.log
            build/busybox-source-parity-x86/m146-batch.serial.log
            build/port-riscv64/full/matrix-source/m146-batch.clean.log
            build/port-riscv64/full/matrix-source/m146-batch.serial.log
            build/port-aarch64/full/matrix-source/m146-batch.clean.log
            build/port-aarch64/full/matrix-source/m146-batch.serial.log
          if-no-files-found: ignore
