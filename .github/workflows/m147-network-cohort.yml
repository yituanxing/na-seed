name: NaSeed M147 29 original Alpine networking ELF and protocol QEMU

on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  signed-network-portfolio:
    # PR defaults to the established x86 acceptance gate. Dispatch or the
    # explicit label runs all three native system-QEMU ISAs with no reduced
    # ELF manifest or relaxed protocol checks.
    name: M147 29 original networking ELFs + 3 protocols / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        port: ${{ fromJSON((github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-m147-multiarch')) && '["amd64","riscv64","arm64"]' || '["amd64"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
      - name: Check manifest uniqueness and static shell syntax
        run: |
          set -eu
          for f in scripts/stage-m147-prebuilt.sh scripts/probe-m147-network-cohort.sh scripts/host-configure-m147-batch.sh tests/m147-network-run.sh scripts/native-qemu-target.sh scripts/probe-riscv64-busybox-matrix.sh scripts/probe-aarch64-busybox-matrix.sh; do sh -n "$f"; done
          python3 scripts/check-prebuilt-profile-catalog.py
          test "$(awk '$1 !~ /^#/ && NF {n++} END {print n+0}' scripts/m147-original-elfs.txt)" -eq 29
          test "$(awk '$1 !~ /^#/ && NF {print $0}' scripts/m147-original-elfs.txt | sort -u | wc -l)" -eq 29
          test "$(awk -F '\t' '$1 !~ /^#/ && NF {n++} END {print n+0}' scripts/m147-network-cases.tsv)" -eq 1
          test "$(awk -F '\t' '$1 !~ /^#/ && NF {n++} END {print n+0}' scripts/m147-rootfs-copies.tsv)" -eq 2
          test "$(grep -v '^#' scripts/m147-original-elfs.txt)" = "$(grep -v '^#' tests/m147-original-elfs.txt)"
          grep -q '^m147-batch[[:space:]]' scripts/prebuilt-profile-catalog.tsv
          for elf in $(grep -v '^#' scripts/m147-original-elfs.txt); do
            for old in scripts/m[0-9]*-original-elfs.txt; do
              test "$old" = scripts/m147-original-elfs.txt && continue
              ! grep -Fxq "$elf" "$old" || { echo "duplicate $elf $old" >&2; exit 1; }
            done
          done
      - name: Install QEMU and official Alpine signed staging prerequisites
        timeout-minutes: 12
        run: |
          set -eu
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'clang:clang' 'ld.lld:lld' 'readelf:binutils' 'cpio:cpio' 'xorriso:xorriso' 'mformat:mtools' 'sgdisk:gdisk' 'qemu-riscv64:qemu-user'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          case '${{ matrix.port }}' in
            amd64)
              command -v qemu-system-x86_64 >/dev/null || missing="$missing qemu-system-x86"
              test -f /usr/share/OVMF/OVMF_CODE_4M.fd || \
                test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf" ;;
            riscv64)
              command -v qemu-system-riscv64 >/dev/null || missing="$missing qemu-system-misc"
              test -f /usr/share/qemu-efi-riscv64/RISCV_VIRT_CODE.fd || missing="$missing qemu-efi-riscv64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
            arm64)
              command -v qemu-system-aarch64 >/dev/null || missing="$missing qemu-system-arm"
              test -f /usr/share/AAVMF/AAVMF_CODE.fd || \
                test -f /usr/share/qemu-efi-aarch64/QEMU_EFI.fd || missing="$missing qemu-efi-aarch64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
          esac
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
      - name: Native upstream lwIP and SocketPort targeted host tests
        timeout-minutes: 10
        run: sh scripts/check-lwip-foundation.sh
      - name: Actual ${{ matrix.port }} system QEMU signed networking and 3 protocols
        timeout-minutes: 48
        run: sh scripts/probe-m147-network-cohort.sh ${{ matrix.port }}
      - name: Preserve signed ELF identities, serial logs and VirtIO PCAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m147-original-network-29elf-${{ matrix.port }}-qemu
          path: |
            build/external/m147-batch/${{ matrix.port }}/apk-install.log
            build/external/m147-batch/${{ matrix.port }}/requested-packages.txt
            build/external/m147-batch/${{ matrix.port }}/*.sha256
            build/external/m147-batch/${{ matrix.port }}/m147-virtio-wire.pcap
            build/busybox-source-parity-x86/m147-batch.clean.log
            build/busybox-source-parity-x86/m147-batch.serial.log
            build/port-riscv64/full/matrix-source/m147-batch.clean.log
            build/port-riscv64/full/matrix-source/m147-batch.serial.log
            build/port-aarch64/full/matrix-source/m147-batch.clean.log
            build/port-aarch64/full/matrix-source/m147-batch.serial.log
          if-no-files-found: ignore
