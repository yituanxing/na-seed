name: NaSeed M147 29 original Alpine networking ELF and protocol QEMU

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/m147-network-cohort.yml'
      - 'rootfs/alpine/packages-m147-batch.txt'
      - 'scripts/m147-**'
      - 'scripts/stage-m147-prebuilt.sh'
      - 'scripts/probe-m147-network-cohort.sh'
      - 'scripts/host-configure-m147-batch.sh'
      - 'scripts/prebuilt-profile-catalog.tsv'
      - 'tests/m147-**'
      - 'kernel/fs/**'
      - 'kernel/fd.*'
      - 'ports/lwip/**'
      - 'kernel/drivers/virtio/**'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  signed-network-portfolio:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
      - name: Check manifest uniqueness and static shell syntax
        run: |
          set -eu
          for f in scripts/stage-m147-prebuilt.sh scripts/probe-m147-network-cohort.sh scripts/host-configure-m147-batch.sh tests/m147-network-run.sh; do sh -n "$f"; done
          test "$(awk '$1 !~ /^#/ && NF {n++} END {print n+0}' scripts/m147-original-elfs.txt)" -eq 29
          test "$(awk -F '\t' '$1 !~ /^#/ && NF {n++} END {print n+0}' scripts/m147-network-cases.tsv)" -eq 1
          test "$(awk -F '\t' '$1 !~ /^#/ && NF {n++} END {print n+0}' scripts/m147-rootfs-copies.tsv)" -eq 2
          test "$(grep -v '^#' scripts/m147-original-elfs.txt)" = "$(grep -v '^#' tests/m147-original-elfs.txt)"
          grep -q '^m147-batch[[:space:]]' scripts/prebuilt-profile-catalog.tsv
          for elf in $(grep -v '^#' scripts/m147-original-elfs.txt); do
            for old in scripts/m[0-9]*-original-elfs.txt; do
              test "$old" = scripts/m147-original-elfs.txt && continue
              ! grep -Fxq "$elf" "$old" || { echo "duplicate $elf $old" >&2; exit 1; }
            done
          done
      - name: Install QEMU and official Alpine signed staging prerequisites
        timeout-minutes: 12
        run: |
          set -eu
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'clang:clang' 'ld.lld:lld' 'readelf:binutils' 'cpio:cpio' 'xorriso:xorriso' 'mformat:mtools' 'sgdisk:gdisk'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          command -v qemu-system-x86_64 >/dev/null || missing="$missing qemu-system-x86"
          test -f /usr/share/OVMF/OVMF_CODE_4M.fd || test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf"
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
      - name: Native upstream lwIP and SocketPort targeted host tests
        timeout-minutes: 10
        run: sh scripts/check-lwip-foundation.sh
      - name: Actual x86-64 QEMU signed network software and three protocols
        timeout-minutes: 48
        run: sh scripts/probe-m147-network-cohort.sh
      - name: Preserve signed ELF identities, serial logs and VirtIO PCAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m147-original-network-29elf-x86-qemu
          path: |
            build/external/m147-batch/amd64/apk-install.log
            build/external/m147-batch/amd64/requested-packages.txt
            build/external/m147-batch/amd64/*.sha256
            build/external/m147-batch/amd64/m147-virtio-wire.pcap
            build/busybox-source-parity-x86/m147-batch.clean.log
            build/busybox-source-parity-x86/m147-batch.serial.log
          if-no-files-found: ignore
