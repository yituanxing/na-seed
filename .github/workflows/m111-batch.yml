name: NaSeed M111 15 more signed original Alpine Linux applications — one QEMU boot per ISA
on:
  # The heavy original-program suite remains opt-in. A PR must both change
  # relevant execution code and carry the explicit run-m111-batch label;
  # manual workflow_dispatch continues to work on any selected branch.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  signed-original-software:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-m111-batch')
    name: M111 15 signed original Linux ELF functional tests / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate signed APK profile and original-program functional oracles
        timeout-minutes: 3
        run: |
          set -eu
          sh -n scripts/stage-alpine-prebuilt-overlay.sh \
                scripts/stage-m111-prebuilt.sh \
                scripts/probe-m111-batch.sh \
                tests/m111-batch-run.sh
          python3 scripts/check-prebuilt-profile-catalog.py
          python3 scripts/check-native-qemu-target.py
          python3 scripts/check-three-isa-core.py
          # Direct host-link regression for actual getrusage/wait4 CPU
          # ownership: no software is compiled inside NaSeed.
          sh scripts/check-m111-getrusage.sh
          sh scripts/check-a005-cross-mm.sh
      - name: Install host tools and native target QEMU
        timeout-minutes: 12
        run: sh scripts/ci-install-signed-alpine-qemu-deps.sh ${{ matrix.port }}
      - name: Run 15 original Alpine programs inside ONE NaSeed QEMU guest
        timeout-minutes: 45
        run: sh scripts/probe-m111-batch.sh ${{ matrix.port }}
      - name: Retain original signed APK provenance and full guest serial on success
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: m111-signed-original-elf-batch-pass-${{ matrix.port }}
          path: |
            build/external/m111-batch/${{ matrix.port }}/apk-install.log
            build/external/m111-batch/${{ matrix.port }}/requested-packages.txt
            build/external/m111-batch/${{ matrix.port }}/*.sha256
            build/busybox-source-parity-x86/m111-batch.clean.log
            build/port-riscv64/full/matrix-source/m111-batch.clean.log
            build/port-aarch64/full/matrix-source/m111-batch.clean.log
          if-no-files-found: error
      - name: Preserve actual failure serial and unchanged original target ELF rootfs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m111-signed-original-elf-batch-fail-${{ matrix.port }}
          path: |
            build/external/m111-batch/${{ matrix.port }}/apk-install.log
            build/external/m111-batch/${{ matrix.port }}/requested-packages.txt
            build/external/m111-batch/${{ matrix.port }}/rootfs.cpio
            build/external/m111-batch/${{ matrix.port }}/*.sha256
            build/busybox-source-parity-x86/m111-batch.clean.log
            build/port-riscv64/full/matrix-source/m111-batch.clean.log
            build/port-aarch64/full/matrix-source/m111-batch.clean.log
          if-no-files-found: ignore
