name: NaSeed original TinyCC
on:
  # Original TinyCC compiles C objects inside NaSeed; run this diagnostic
  # explicitly rather than on host-prebuilt application-batch PRs.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tinycc:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install only missing x86 native toolchain and QEMU dependencies
        timeout-minutes: 8
        run: |
          set -eu
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for pair in 'gcc:gcc' 'make:make' 'readelf:binutils' 'curl:curl' \
                      'bzip2:bzip2' 'tar:tar' 'clang:clang' 'ld.lld:lld' \
                      'xorriso:xorriso' 'cpio:cpio' 'qemu-system-x86_64:qemu-system-x86'; do
            bin=${pair%%:*}; pkg=${pair#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          { test -e /usr/share/OVMF/OVMF_CODE_4M.fd || \
            test -e /usr/share/OVMF/OVMF_CODE.fd; } || missing="$missing ovmf"
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
      - name: Cache official TinyCC release
        uses: actions/cache@v4
        with:
          path: build/deps/external/tcc-0.9.27.tar.bz2
          key: naseed-tcc-0.9.27-de23af78fca90ce3
      - name: Linux compiler oracle then original TinyCC boot on NaSeed x86-64
        run: sh scripts/probe-external-tcc.sh
      - name: Upload genuine serial and Linux compiler output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: naseed-native-tcc
          path: |
            build/external/tcc/amd64/artifacts.sha256
            build/external/tcc/amd64/first.o
            build/busybox-source-parity-x86/tcc-*.serial.log
          if-no-files-found: ignore
