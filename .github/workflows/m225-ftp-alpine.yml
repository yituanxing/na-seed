name: NaSeed M225 original Alpine lftp rclone FTP two native boots

# Deliberately targeted: adding/editing M225 helpers does not trigger the
# expensive M224 native QEMU jobs. Manual dispatch remains available.
# Rerun M225 with Alpine rclone direct final-path STOR via --inplace;
# all original signed, wire, physical ext4 and independent reboot gates remain.
on:
  push:
    branches: [naseed-app-batch2]
    paths:
      - '.github/workflows/m225-ftp-alpine.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-ftp-amd64:
    name: Original signed lftp rclone FTP both directions 2 native QEMUs / amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: true
      - name: Require strict host transactions phase-replay negatives and ABI boundaries
        run: |
          set -eu
          python3 scripts/m225-test-host.py
          python3 scripts/check-m141-candidates.py --profile m225
          python3 scripts/check-three-isa-core.py
          python3 scripts/check-architecture-boundaries.py
          sh -n scripts/probe-m197-alpine-software-cohort.sh
          sh -n tests/m225-ftp-workload.sh
          sh -n tests/m225-software-workload.sh
      - name: Install native QEMU ext4 rclone and official Alpine signature prerequisites
        timeout-minutes: 22
        run: |
          set -eu
          PATH=/usr/sbin:/sbin:$PATH
          export PATH
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'cmake:cmake' 'g++:g++' 'clang:clang' 'ld.lld:lld' \
                      'lftp:lftp' 'rclone:rclone' 'qemu-system-x86_64:qemu-system-x86' \
                      'readelf:binutils' 'cpio:cpio' 'mke2fs:e2fsprogs' \
                      'debugfs:e2fsprogs' 'e2fsck:e2fsprogs' \
                      'xorriso:xorriso' 'mformat:mtools' 'sgdisk:gdisk' \
                      'curl:curl' 'python3:python3' 'openssl:openssl'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          test -f /usr/share/OVMF/OVMF_CODE_4M.fd || \
            test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf"
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
          command -v lftp
          command -v rclone
          NAS_M225_REQUIRE_HOST_LFTP=1 python3 scripts/m225-test-host.py
      - name: Obtain exact signed official x86 Alpine ELF SHA and verified offline APK closure
        timeout-minutes: 28
        run: |
          set -eu
          sh scripts/inventory-m141-signed-apks.sh amd64 m225
          tsv=build/external/m225-candidate-inventory/amd64/candidates.tsv
          awk -F '\t' 'NR > 1 {n++; if ($3 != "NATIVE_ELF" || length($4) != 64 || $4 ~ /[^0-9a-f]/) bad++}
            END {if (n != 2 || bad) exit 1}' "$tsv"
      - name: Native x86 two independent signed FTP upload/download QEMUs PCAP ext4
        timeout-minutes: 78
        env:
          NAS_M225_PUBLIC_QEMU_TIMEOUT: '3500'
          NAS_M225_PUBLIC_SECONDS: '3300'
          NAS_M225_REOPEN_SECONDS: '1250'
        run: sh scripts/probe-m225-alpine-ftp-pilot.sh amd64
      - name: Retain original Alpine signed provenance host FTP and two raw PCAPs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m225-original-ftp-amd64
          path: |
            build/external/m225-candidate-inventory/amd64/candidates.tsv
            build/external/m225-candidate-inventory/amd64/signed-cache.sha256
            build/external/m225-candidate-inventory/amd64/apk-offline-proof.log
            build/external/m191-alpine-rootfs/amd64/m225-compat-report.json
            build/external/m191-alpine-rootfs/amd64/m225-first-runner.log
            build/external/m191-alpine-rootfs/amd64/m197-live.serial.log
            build/external/m191-alpine-rootfs/amd64/m197-reopen-runner.log
            build/external/m191-alpine-rootfs/amd64/m197-public-wire.pcap
            build/external/m191-alpine-rootfs/amd64/m225-first-host-ftp.log
            build/external/m191-alpine-rootfs/amd64/m225-first-wire.json
            build/external/m191-alpine-rootfs/amd64/m225-reopen-host-ftp.log
            build/external/m191-alpine-rootfs/amd64/m225-reopen-wire.pcap
            build/external/m191-alpine-rootfs/amd64/m225-reopen-wire.json
            build/acceptance/**/m197-batch*.log
          if-no-files-found: warn

  signed-ftp-cross:
    name: Original signed lftp rclone two native QEMUs / ${{ matrix.port }}
    needs: [signed-ftp-amd64]
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        port: [riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: true
      - name: Require signed FTP candidate boundaries and actual host negative checks
        run: |
          set -eu
          python3 scripts/check-m141-candidates.py --profile m225
          python3 scripts/m225-test-host.py
          python3 scripts/check-three-isa-core.py
          python3 scripts/check-architecture-boundaries.py
      - name: Install cross GNU QEMU firmware and physical ext4 prereqs
        timeout-minutes: 25
        run: |
          set -eu
          PATH=/usr/sbin:/sbin:$PATH
          export PATH
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'cmake:cmake' 'g++:g++' 'clang:clang' 'ld.lld:lld' \
                      'rclone:rclone' 'readelf:binutils' 'cpio:cpio' \
                      'mke2fs:e2fsprogs' 'debugfs:e2fsprogs' 'e2fsck:e2fsprogs' \
                      'xorriso:xorriso' 'mformat:mtools' 'sgdisk:gdisk' \
                      'curl:curl' 'python3:python3' 'openssl:openssl'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          case '${{ matrix.port }}' in
            riscv64)
              command -v riscv64-linux-gnu-gcc >/dev/null || missing="$missing gcc-riscv64-linux-gnu"
              command -v riscv64-linux-gnu-g++ >/dev/null || missing="$missing g++-riscv64-linux-gnu"
              test -f /usr/riscv64-linux-gnu/include/bits/wordsize.h && \
              test -f /usr/riscv64-linux-gnu/lib/libc.a || missing="$missing libc6-dev-riscv64-cross"
              command -v qemu-system-riscv64 >/dev/null || missing="$missing qemu-system-misc"
              test -f /usr/share/qemu-efi-riscv64/RISCV_VIRT_CODE.fd || missing="$missing qemu-efi-riscv64" ;;
            arm64)
              command -v aarch64-linux-gnu-gcc >/dev/null || missing="$missing gcc-aarch64-linux-gnu"
              command -v aarch64-linux-gnu-g++ >/dev/null || missing="$missing g++-aarch64-linux-gnu"
              test -f /usr/aarch64-linux-gnu/include/bits/wordsize.h && \
              test -f /usr/aarch64-linux-gnu/lib/libc.a || missing="$missing libc6-dev-arm64-cross"
              command -v qemu-system-aarch64 >/dev/null || missing="$missing qemu-system-arm"
              test -f /usr/share/AAVMF/AAVMF_CODE.fd || \
                test -f /usr/share/qemu-efi-aarch64/QEMU_EFI.fd || missing="$missing qemu-efi-aarch64" ;;
          esac
          test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu"
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
      - name: Verify two target-native original ELF signed SHA and offline Alpine APKs
        timeout-minutes: 30
        run: |
          set -eu
          sh scripts/inventory-m141-signed-apks.sh '${{ matrix.port }}' m225
          tsv='build/external/m225-candidate-inventory/${{ matrix.port }}/candidates.tsv'
          awk -F '\t' 'NR > 1 {n++; if ($3 != "NATIVE_ELF" || length($4) != 64 || $4 ~ /[^0-9a-f]/) bad++}
            END {if (n != 2 || bad) exit 1}' "$tsv"
      - name: Original cross ISA two independent FTP QEMU PCAP ext4 and fsck
        timeout-minutes: 120
        env:
          NAS_M225_PUBLIC_QEMU_TIMEOUT: '5600'
          NAS_M225_PUBLIC_SECONDS: '5300'
          NAS_M225_REOPEN_SECONDS: '2100'
        run: sh scripts/probe-m225-alpine-ftp-pilot.sh '${{ matrix.port }}'
      - name: Retain signed cross FTP source and actual independent QEMU evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m225-original-ftp-${{ matrix.port }}
          path: |
            build/external/m225-candidate-inventory/${{ matrix.port }}/candidates.tsv
            build/external/m225-candidate-inventory/${{ matrix.port }}/signed-cache.sha256
            build/external/m225-candidate-inventory/${{ matrix.port }}/apk-offline-proof.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m225-compat-report.json
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m225-first-runner.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m197-live.serial.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m197-reopen-runner.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m197-public-wire.pcap
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m225-first-host-ftp.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m225-first-wire.json
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m225-reopen-host-ftp.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m225-reopen-wire.pcap
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m225-reopen-wire.json
            build/acceptance/**/m197-batch*.log
          if-no-files-found: warn
