name: NaSeed M131 15 new signed Netpbm conversion ELF, native QEMU three ISAs
on:
  # Historical M131 45/45 remains reproducible by manual dispatch; M132 is
  # the sole active three-ISA QEMU acceptance census on this Draft PR.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  signed-original-software:
    name: M131 15 signed native image converters and filters / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify signed catalog, real tmpfs, VFS and kernel ISA contracts
        timeout-minutes: 4
        run: |
          set -eu
          sh -n scripts/stage-alpine-prebuilt-overlay.sh \
                scripts/stage-m131-prebuilt.sh \
                scripts/probe-m131-batch.sh \
                tests/m131-batch-run.sh
          python3 scripts/check-prebuilt-profile-catalog.py
          python3 scripts/check-native-qemu-target.py
          python3 scripts/check-three-isa-core.py
          sh scripts/check-vfs-provider.sh
          sh scripts/check-m108-tmp-index.sh
      - name: Install signed APK staging tools and native target QEMU
        timeout-minutes: 12
        run: sh scripts/ci-install-signed-alpine-qemu-deps.sh ${{ matrix.port }}
      - name: Run all 15 original signed Netpbm ELFs in one NaSeed guest
        timeout-minutes: 45
        run: sh scripts/probe-m131-batch.sh ${{ matrix.port }}
      - name: Preserve native ELF provenance and actual serial on success
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: m131-signed-image-batch-pass-${{ matrix.port }}
          path: |
            build/external/m131-batch/${{ matrix.port }}/apk-install.log
            build/external/m131-batch/${{ matrix.port }}/requested-packages.txt
            build/external/m131-batch/${{ matrix.port }}/*.sha256
            build/busybox-source-parity-x86/m131-batch.clean.log
            build/port-riscv64/full/matrix-source/m131-batch.clean.log
            build/port-aarch64/full/matrix-source/m131-batch.clean.log
          if-no-files-found: error
      - name: Preserve failure serial and signed original guest rootfs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m131-signed-image-batch-fail-${{ matrix.port }}
          path: |
            build/external/m131-batch/${{ matrix.port }}/apk-install.log
            build/external/m131-batch/${{ matrix.port }}/requested-packages.txt
            build/external/m131-batch/${{ matrix.port }}/rootfs.cpio
            build/external/m131-batch/${{ matrix.port }}/*.sha256
            build/busybox-source-parity-x86/m131-batch.clean.log
            build/port-riscv64/full/matrix-source/m131-batch.clean.log
            build/port-aarch64/full/matrix-source/m131-batch.clean.log
          if-no-files-found: ignore
