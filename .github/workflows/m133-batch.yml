name: NaSeed M133 15 signed graph xz text FAT original ELFs, QEMU three ISAs
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  signed-original-software:
    name: M133 15 signed native graph xz diff ed FAT software / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify signed profile, shared tmpfs, VFS, 3-ISA kernel invariants
        timeout-minutes: 4
        run: |
          set -eu
          sh -n scripts/stage-alpine-prebuilt-overlay.sh \
                scripts/stage-m133-prebuilt.sh \
                scripts/probe-m133-batch.sh \
                tests/m133-batch-run.sh
          python3 scripts/check-prebuilt-profile-catalog.py
          python3 scripts/check-native-qemu-target.py
          python3 scripts/check-three-isa-core.py
          sh scripts/check-vfs-provider.sh
          sh scripts/check-m108-tmp-index.sh
      - name: Install signed APK staging tools and native system QEMU
        timeout-minutes: 12
        run: sh scripts/ci-install-signed-alpine-qemu-deps.sh ${{ matrix.port }}
      - name: Execute all 15 new original signed ELFs in native NaSeed QEMU
        timeout-minutes: 45
        run: sh scripts/probe-m133-batch.sh ${{ matrix.port }}
      - name: Preserve signed ELF SHA256 and full native QEMU PASS serial
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: m133-signed-multifamily-pass-${{ matrix.port }}
          path: |
            build/external/m133-batch/${{ matrix.port }}/apk-install.log
            build/external/m133-batch/${{ matrix.port }}/requested-packages.txt
            build/external/m133-batch/${{ matrix.port }}/*.sha256
            build/busybox-source-parity-x86/m133-batch.clean.log
            build/port-riscv64/full/matrix-source/m133-batch.clean.log
            build/port-aarch64/full/matrix-source/m133-batch.clean.log
          if-no-files-found: error
      - name: Preserve entire failure serial and signed guest rootfs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m133-signed-multifamily-fail-${{ matrix.port }}
          path: |
            build/external/m133-batch/${{ matrix.port }}/apk-install.log
            build/external/m133-batch/${{ matrix.port }}/requested-packages.txt
            build/external/m133-batch/${{ matrix.port }}/rootfs.cpio
            build/external/m133-batch/${{ matrix.port }}/*.sha256
            build/busybox-source-parity-x86/m133-batch.clean.log
            build/port-riscv64/full/matrix-source/m133-batch.clean.log
            build/port-aarch64/full/matrix-source/m133-batch.clean.log
          if-no-files-found: ignore
