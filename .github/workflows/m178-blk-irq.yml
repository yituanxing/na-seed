name: NaSeed M178 real concurrent VirtIO block IRQ plus original Alpine GPU desktop three ISA

on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  host-contract:
    name: M178 BlockRequest ownership, tags, DMA, IRQ completion and fail-closed contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
      - name: Common ISA boundaries, request/IRQ/transport and previous 2D GPU
        run: |
          set -eu
          python3 scripts/check-three-isa-core.py
          python3 scripts/check-architecture-boundaries.py
          sh scripts/check-m178-blk-irq.sh

  three-isa-real-async-block:
    name: M178 concurrent real block DMA IRQ, host-durable writes, M177 GPU + Alpine / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    needs: host-contract
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
      - name: Install native cross compilers, EFI and system QEMU
        timeout-minutes: 18
        run: |
          set -eu
          sh scripts/ci-install-signed-alpine-qemu-deps.sh ${{ matrix.port }} --arm64-efi-fallback --cross-cxx --explicit-tools cmake:cmake g++:g++ clang:clang ld.lld:lld readelf:binutils cpio:cpio mke2fs:e2fsprogs xorriso:xorriso mformat:mtools sgdisk:gdisk gcc:gcc qemu-riscv64:qemu-user curl:curl
      - name: One native guest, actual physical async disk and original signed Alpine/QMP oracles
        timeout-minutes: 78
        run: sh scripts/probe-m178-blk-irq.sh ${{ matrix.port }}
      - name: Preserve actual guest logs, real disk, PCAP and physical GPU frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m178-real-async-block-${{ matrix.port }}
          path: |
            build/m178/async-blk/${{ matrix.port }}/independent-virtio-blk.img
            build/external/m174-software-batch/${{ matrix.port }}/m174-qmp-check.log
            build/external/m174-software-batch/${{ matrix.port }}/m173-*.ppm
            build/external/m174-software-batch/${{ matrix.port }}/m176-wire.pcap
            build/external/m174-software-batch/${{ matrix.port }}/m176-host-http.log
            build/external/m174-software-batch/${{ matrix.port }}/m174-software-original-signed-elfs.sha256
            build/busybox-source-parity-x86/m174-batch.clean.log
            build/busybox-source-parity-x86/m174-batch.serial.log
            build/port-riscv64/full/matrix-source/m174-batch.clean.log
            build/port-riscv64/full/matrix-source/m174-batch.serial.log
            build/port-aarch64/full/matrix-source/m174-batch.clean.log
            build/port-aarch64/full/matrix-source/m174-batch.serial.log
          if-no-files-found: ignore
