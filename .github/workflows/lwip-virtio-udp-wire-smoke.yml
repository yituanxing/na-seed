name: NaSeed VirtIO-Net + lwIP signed Alpine Ncat UDP (x86 QEMU)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/lwip-virtio-udp-wire-smoke.yml'
      - 'kernel/fs/socket_syscall.c'
      - 'kernel/syscall/dispatch.c'
      - 'ports/lwip/**'
      - 'kernel/drivers/virtio/**'
      - 'scripts/lwip-udp-wire-cases.tsv'
      - 'scripts/lwip-udp-echo-server.py'
      - 'scripts/probe-lwip-udp-wire-smoke.sh'
      - 'scripts/run.sh'
      - 'tests/m141-system-run.sh'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  x86-real-virtio-udp:
    name: Real PCI NIC + DHCP + Alpine Ncat UDP guest-host echo
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
      - name: Verify pinned upstream protocol and exact guest case
        run: |
          set -eu
          test "$(git -C third_party/lwip rev-parse HEAD)" = \
            77dcd25a72509eb83f72b033d219b1d40cd8eb95
          sh -n scripts/probe-lwip-udp-wire-smoke.sh
          sh -n scripts/run.sh
          sh -n tests/m141-system-run.sh
          python3 -m py_compile scripts/lwip-udp-echo-server.py
          test "$(awk -F '\t' '$1 !~ /^#/ && NF { n++ } END {print n+0}' scripts/lwip-udp-wire-cases.tsv)" -eq 1
          grep -Fq M141_SYSTEM_NCAT_UDP_WIRE_PASS scripts/lwip-udp-wire-cases.tsv
      - name: Install native QEMU and signed Alpine staging tools
        timeout-minutes: 12
        run: |
          set -eu
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'clang:clang' 'ld.lld:lld' 'readelf:binutils' \
                      'cpio:cpio' 'xorriso:xorriso' 'mformat:mtools' \
                      'sgdisk:gdisk' 'qemu-riscv64:qemu-user'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          command -v qemu-system-x86_64 >/dev/null || missing="$missing qemu-system-x86"
          test -f /usr/share/OVMF/OVMF_CODE_4M.fd || \
          test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf"
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
      - name: Probe actual guest UDP datagram and host-only response
        timeout-minutes: 35
        run: sh scripts/probe-lwip-udp-wire-smoke.sh
      - name: Preserve signed binary inventory, serial and wire evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lwip-virtio-udp-wire-amd64-qemu
          path: |
            build/external/m141-batch/amd64/apk-install.log
            build/external/m141-batch/amd64/requested-packages.txt
            build/external/m141-batch/amd64/*.sha256
            build/external/m141-batch/amd64/host-udp.log
            build/external/m141-batch/amd64/virtio-udp-wire.pcap
            build/busybox-source-parity-x86/m141-batch.clean.log
            build/busybox-source-parity-x86/m141-batch.serial.log
          if-no-files-found: ignore
