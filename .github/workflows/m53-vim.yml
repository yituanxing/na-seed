name: NaSeed M53 original signed Vim real editor diagnostics
# Manual-only, do not duplicate the grouped native QEMU matrix on PRs.
on:
  workflow_dispatch:
jobs:
  vim:
    name: Original Vim editor / ${{ matrix.port }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Install three-ISA native QEMU and clang/lld boot tooling
        timeout-minutes: 12
        run: |
          set -eu
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'clang:clang' 'ld.lld:lld' 'readelf:binutils' 'cpio:cpio' \
                      'xorriso:xorriso' 'mformat:mtools' 'sgdisk:gdisk' \
                      'qemu-riscv64:qemu-user'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          case "${{ matrix.port }}" in
            amd64)
              command -v qemu-system-x86_64 >/dev/null || missing="$missing qemu-system-x86"
              test -f /usr/share/OVMF/OVMF_CODE_4M.fd || \
                test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf" ;;
            riscv64)
              command -v qemu-system-riscv64 >/dev/null || missing="$missing qemu-system-misc"
              test -f /usr/share/qemu-efi-riscv64/RISCV_VIRT_CODE.fd || missing="$missing qemu-efi-riscv64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
            arm64)
              command -v qemu-system-aarch64 >/dev/null || missing="$missing qemu-system-arm"
              test -f /usr/share/AAVMF/AAVMF_CODE.fd || missing="$missing qemu-efi-aarch64"
              test -f /usr/lib/ipxe/qemu/efi-virtio.rom || missing="$missing ipxe-qemu" ;;
          esac
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
      - name: Execute original Vim two real QEMU boots (Ex and physical TTY)
        timeout-minutes: 36
        run: sh scripts/probe-m53-vim.sh ${{ matrix.port }}
      - name: Preserve original ELF, package and serial evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m53-vim-${{ matrix.port }}
          path: |
            build/external/m53-vim/${{ matrix.port }}/apk-install.log
            build/external/m53-vim/${{ matrix.port }}/requested-packages.txt
            build/external/m53-vim/${{ matrix.port }}/live-serial.log
            build/busybox-source-parity-x86/m53-vim.clean.log
            build/port-riscv64/full/matrix-source/m53-vim.clean.log
            build/port-aarch64/full/matrix-source/m53-vim.clean.log
          if-no-files-found: ignore
