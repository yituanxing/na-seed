name: NaSeed native x86 signed network and system cohorts
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Original signed cohort
        type: choice
        required: true
        options: [ncat, system, dns-cohort, dns, iperf3, ssh-chain, ssh-keyscan, udp, wire, bind-offline, dns-update, llvm]
  push:
    branches: ['refactor/naseed-cleanup-*']
    paths:
      - 'kernel/fs/**'
      - 'kernel/platform/virtio_qemu_classes.h'
      - 'kernel/platform/x86_pci_config.h'
      - 'kernel/platform/virtio_mmio_qemu.c'
      - 'kernel/platform/x86_virtio_pci.c'
      - 'ports/lwip/socket_port.c'
      - '.github/workflows/alpine-x86-cohorts.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ inputs.profile || 'system' }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    name: ${{ inputs.profile || 'system' }} original signed ELF / x86 QEMU
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.profile == 'llvm' && 55 || 50 }}
    env:
      PROFILE: ${{ inputs.profile || 'system' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
      - name: Select original probe and preserve exact evidence paths
        id: profile
        run: |
          set -eu
          case "$PROFILE" in
            ncat)
              probe=scripts/probe-lwip-ncat-smoke.sh
              artifact=lwip-ncat-amd64-native-qemu
              evidence="build/external/m141-batch/amd64/apk-install.log
              build/external/m141-batch/amd64/requested-packages.txt
              build/external/m141-batch/amd64/*.sha256
              build/busybox-source-parity-x86/m141-batch.clean.log
              build/busybox-source-parity-x86/m141-batch.serial.log" ;;
            system)
              probe=scripts/probe-lwip-system-cohort-smoke.sh
              artifact=lwip-eight-system-utilities-amd64-qemu
              evidence="build/external/m141-batch/amd64/apk-install.log
              build/external/m141-batch/amd64/requested-packages.txt
              build/external/m141-batch/amd64/*.sha256
              build/busybox-source-parity-x86/m141-batch.clean.log
              build/busybox-source-parity-x86/m141-batch.serial.log" ;;
            dns-cohort)
              probe=scripts/probe-lwip-dns-cohort-wire-smoke.sh
              artifact=lwip-virtio-dns-cohort-amd64-qemu
              evidence="build/external/m141-batch/amd64/apk-install.log
              build/external/m141-batch/amd64/requested-packages.txt
              build/external/m141-batch/amd64/*.sha256
              build/external/m141-batch/amd64/host-dns-cohort.log
              build/external/m141-batch/amd64/virtio-dns-cohort-wire.pcap
              build/busybox-source-parity-x86/m141-batch.clean.log
              build/busybox-source-parity-x86/m141-batch.serial.log" ;;
            dns)
              probe=scripts/probe-lwip-dns-wire-smoke.sh
              artifact=lwip-virtio-dns-wire-amd64-qemu
              evidence="build/external/m141-batch/amd64/apk-install.log
              build/external/m141-batch/amd64/requested-packages.txt
              build/external/m141-batch/amd64/*.sha256
              build/external/m141-batch/amd64/host-dns.log
              build/external/m141-batch/amd64/virtio-dns-wire.pcap
              build/busybox-source-parity-x86/m141-batch.clean.log
              build/busybox-source-parity-x86/m141-batch.serial.log" ;;
            iperf3)
              probe=scripts/probe-lwip-iperf3-wire-smoke.sh
              artifact=lwip-virtio-nmap-iperf3-wire-amd64-qemu
              evidence="build/external/m141-batch/amd64/apk-install.log
              build/external/m141-batch/amd64/requested-packages.txt
              build/external/m141-batch/amd64/*.sha256
              build/external/m141-batch/amd64/host-iperf3.log
              build/external/m141-batch/amd64/virtio-iperf3-wire.pcap
              build/busybox-source-parity-x86/m141-batch.clean.log
              build/busybox-source-parity-x86/m141-batch.serial.log" ;;
            ssh-chain)
              probe=scripts/m142-ssh-chain-probe.sh
              artifact=lwip-virtio-ssh-chain-amd64-qemu
              evidence="build/external/m141-batch/amd64/apk-install.log
              build/external/m141-batch/amd64/requested-packages.txt
              build/external/m141-batch/amd64/*.sha256
              build/external/m141-batch/amd64/host-ssh-chain-fingerprint.log
              build/external/m141-batch/amd64/host-ssh-chain.log
              build/external/m141-batch/amd64/host-ssh-chain/ssh_host_ed25519_key.pub
              build/external/m141-batch/amd64/virtio-ssh-chain-wire.pcap
              build/busybox-source-parity-x86/m141-batch.clean.log
              build/busybox-source-parity-x86/m141-batch.serial.log" ;;
            ssh-keyscan)
              probe=scripts/probe-lwip-ssh-keyscan-wire-smoke.sh
              artifact=lwip-virtio-ssh-keyscan-wire-amd64-qemu
              evidence="build/external/m141-batch/amd64/apk-install.log
              build/external/m141-batch/amd64/requested-packages.txt
              build/external/m141-batch/amd64/*.sha256
              build/external/m141-batch/amd64/host-ssh-fingerprint.log
              build/external/m141-batch/amd64/host-sshd.log
              build/external/m141-batch/amd64/host-ssh-keyscan/ssh_host_ed25519_key.pub
              build/external/m141-batch/amd64/virtio-ssh-keyscan-wire.pcap
              build/busybox-source-parity-x86/m141-batch.clean.log
              build/busybox-source-parity-x86/m141-batch.serial.log" ;;
            udp)
              probe=scripts/probe-lwip-udp-wire-smoke.sh
              artifact=lwip-virtio-udp-wire-amd64-qemu
              evidence="build/external/m141-batch/amd64/apk-install.log
              build/external/m141-batch/amd64/requested-packages.txt
              build/external/m141-batch/amd64/*.sha256
              build/external/m141-batch/amd64/host-udp.log
              build/external/m141-batch/amd64/virtio-udp-wire.pcap
              build/busybox-source-parity-x86/m141-batch.clean.log
              build/busybox-source-parity-x86/m141-batch.serial.log" ;;
            wire)
              probe=scripts/probe-lwip-virtio-wire-smoke.sh
              artifact=lwip-virtio-wire-amd64-qemu
              evidence="build/external/m141-batch/amd64/apk-install.log
              build/external/m141-batch/amd64/requested-packages.txt
              build/external/m141-batch/amd64/*.sha256
              build/external/m141-batch/amd64/host-http.log
              build/external/m141-batch/amd64/virtio-wire.pcap
              build/busybox-source-parity-x86/m141-batch.clean.log
              build/busybox-source-parity-x86/m141-batch.serial.log" ;;
            bind-offline)
              probe=scripts/probe-m141-bind-offline-cohort.sh
              artifact=m141-bind-offline-five-amd64-qemu
              evidence="build/external/m141-batch/amd64/apk-install.log
              build/external/m141-batch/amd64/requested-packages.txt
              build/external/m141-batch/amd64/*.sha256
              build/busybox-source-parity-x86/m141-batch.clean.log
              build/busybox-source-parity-x86/m141-batch.serial.log" ;;
            dns-update)
              probe=scripts/probe-m142-dns-update-wire-smoke.sh
              artifact=m142-rfc2136-nping-amd64-qemu
              evidence="build/external/m141-batch/amd64/apk-install.log
              build/external/m141-batch/amd64/requested-packages.txt
              build/external/m141-batch/amd64/*.sha256
              build/external/m141-batch/amd64/host-m142-dns-update.log
              build/external/m141-batch/amd64/virtio-m142-dns-update.pcap
              build/busybox-source-parity-x86/m142-batch.clean.log
              build/busybox-source-parity-x86/m142-batch.serial.log" ;;
            llvm)
              probe=scripts/probe-m142-llvm-cohort.sh
              artifact=m142-nine-original-llvm-clang-amd64-qemu
              evidence="build/external/m141-batch/amd64/apk-install.log
              build/external/m141-batch/amd64/requested-packages.txt
              build/external/m141-batch/amd64/*.sha256
              build/busybox-source-parity-x86/m141-batch.clean.log
              build/busybox-source-parity-x86/m141-batch.serial.log" ;;
            *) exit 2 ;;
          esac
          test -f "$probe"
          printf 'probe=%s\nartifact=%s\n' "$probe" "$artifact" >> "$GITHUB_OUTPUT"
          {
            echo 'paths<<NASEED_PATHS'
            printf '%s\n' "$evidence" | sed 's/^[[:space:]]*//'
            echo NASEED_PATHS
          } >> "$GITHUB_OUTPUT"
      - name: Verify exact pinned upstream lwIP and original profile host contracts
        run: |
          set -eu
          case "$PROFILE" in
            bind-offline|llvm) ;;
            *) test "$(git -C third_party/lwip rev-parse HEAD)" = 77dcd25a72509eb83f72b033d219b1d40cd8eb95 ;;
          esac
          case "$PROFILE" in
            ncat)
              test -s third_party/lwip/src/include/lwip/opt.h
              sh -n scripts/probe-lwip-ncat-smoke.sh
              sh -n scripts/probe-x86-busybox-parity.sh
              sh -n scripts/stage-alpine-signed-batch.sh
              test "$(awk -F '\t' '$1 !~ /^#/ && NF { count++ } END {print count+0}' scripts/lwip-ncat-cases.tsv)" -eq 1
              grep -Fq 'M141_SYSTEM_NCAT_LOOPBACK_PASS' scripts/lwip-ncat-cases.tsv
              ;;
            system)
              sh -n scripts/probe-lwip-system-cohort-smoke.sh
              sh -n tests/m141-system-cohort-run.sh
              sh -n tests/m141-system-run.sh
              test "$(awk -F '\t' '$1 !~ /^#/ && NF {n++} END {print n+0}' scripts/lwip-system-cohort-cases.tsv)" -eq 1
              for elf in usr/bin/tcpdump usr/bin/ssh-agent usr/bin/ssh-add bin/ionice bin/pidwait usr/bin/exch sbin/mkfs.bfs sbin/fdisk; do
                grep -Fxq "$elf" scripts/m141-original-elfs.txt
              done
              grep -Fq M141_SIGNED_SYSTEM_COHORT_PASS scripts/lwip-system-cohort-cases.tsv
              ;;
            dns-cohort)
              sh -n scripts/probe-lwip-dns-cohort-wire-smoke.sh
              sh -n scripts/run.sh
              sh -n tests/m141-system-run.sh
              python3 scripts/test-lwip-dns-wire-server.py
              test "$(awk -F '\t' '$1 !~ /^#/ && NF {n++} END {print n+0}' scripts/lwip-dns-cohort-wire-cases.tsv)" -eq 1
              for program in host nslookup mdig; do
                grep -Fxq "usr/bin/$program" scripts/m141-original-elfs.txt
              done
              grep -Fq M141_SYSTEM_DNS_COHORT_WIRE_PASS scripts/lwip-dns-cohort-wire-cases.tsv
              ;;
            dns)
              sh -n scripts/probe-lwip-dns-wire-smoke.sh
              sh -n scripts/run.sh
              sh -n tests/m141-system-run.sh
              python3 -m py_compile scripts/lwip-dns-wire-server.py
              python3 scripts/test-lwip-dns-wire-server.py
              test "$(awk -F '\t' '$1 !~ /^#/ && NF { n++ } END {print n+0}' scripts/lwip-dns-wire-cases.tsv)" -eq 1
              grep -Fq M141_SYSTEM_DIG_DNS_WIRE_PASS scripts/lwip-dns-wire-cases.tsv
              ;;
            iperf3)
              sh -n scripts/probe-lwip-iperf3-wire-smoke.sh
              sh -n tests/m141-iperf3-wire-run.sh
              sh -n scripts/run.sh
              test "$(awk -F '\t' '$1 !~ /^#/ && NF { n++ } END {print n+0}' scripts/lwip-iperf3-wire-cases.tsv)" -eq 1
              grep -Fxq 'tests/m141-iperf3-wire-run.sh	tests/m141-iperf3-wire-run.sh' scripts/m141-rootfs-copies.tsv
              grep -Fq M141_SIGNED_NMAP_IPERF3_WIRE_PASS scripts/lwip-iperf3-wire-cases.tsv
              ;;
            ssh-chain)
              sh -n scripts/m142-ssh-chain-probe.sh
              sh -n tests/m142-ssh-chain-run.sh
              sh -n scripts/run.sh
              test "$(awk -F '\t' '$1 !~ /^#/ && NF { n++ } END {print n+0}' scripts/m142-ssh-chain-cases.tsv)" -eq 1
              awk -F '\t' '$1=="tests/m142-ssh-chain-run.sh" && $2==$1 {found++} END {exit found==1?0:1}' scripts/m141-rootfs-copies.tsv
              for exe in usr/bin/ssh usr/bin/scp usr/bin/sftp; do
                grep -Fxq "$exe" scripts/m141-original-elfs.txt
              done
              grep -Fq M142_SIGNED_SSH_CHAIN_CASE_PASS scripts/m142-ssh-chain-cases.tsv
              ;;
            ssh-keyscan)
              sh -n scripts/probe-lwip-ssh-keyscan-wire-smoke.sh
              sh -n tests/m141-ssh-keyscan-wire-run.sh
              sh -n scripts/run.sh
              test "$(awk -F '\t' '$1 !~ /^#/ && NF { n++ } END {print n+0}' scripts/lwip-ssh-keyscan-wire-cases.tsv)" -eq 1
              awk -F '\t' '$1=="tests/m141-ssh-keyscan-wire-run.sh" && $2==$1 {found++} END {exit found==1?0:1}' scripts/m141-rootfs-copies.tsv
              grep -Fq M141_SIGNED_SSH_KEYSCAN_CASE_PASS scripts/lwip-ssh-keyscan-wire-cases.tsv
              ;;
            udp)
              sh -n scripts/probe-lwip-udp-wire-smoke.sh
              sh -n scripts/run.sh
              sh -n tests/m141-system-run.sh
              python3 -m py_compile scripts/lwip-udp-echo-server.py
              test "$(awk -F '\t' '$1 !~ /^#/ && NF { n++ } END {print n+0}' scripts/lwip-udp-wire-cases.tsv)" -eq 1
              grep -Fq M141_SYSTEM_NCAT_UDP_WIRE_PASS scripts/lwip-udp-wire-cases.tsv
              ;;
            wire)
              sh -n scripts/probe-lwip-virtio-wire-smoke.sh
              sh -n scripts/run.sh
              sh -n tests/m141-system-run.sh
              test "$(awk -F '\t' '$1 !~ /^#/ && NF { count++ } END {print count+0}' scripts/lwip-wire-cases.tsv)" -eq 1
              grep -Fq 'M141_SYSTEM_NCAT_WIRE_PASS' scripts/lwip-wire-cases.tsv
              ;;
            bind-offline)
              sh -n scripts/probe-m141-bind-offline-cohort.sh
              sh -n tests/m141-dns-run.sh
              sh -n tests/m141-system-run.sh
              test "$(awk -F '\t' '$1 !~ /^#/ && NF {n++} END {print n+0}' scripts/m141-bind-offline-cohort-cases.tsv)" -eq 1
              for elf in usr/bin/arpaname usr/bin/named-rrchecker \
                         usr/bin/named-checkzone usr/sbin/rndc-confgen \
                         usr/sbin/ddns-confgen; do
                grep -Fxq "$elf" scripts/m141-original-elfs.txt
              done
              grep -Fq M141_SYSTEM_BIND_OFFLINE_COHORT_PASS scripts/m141-bind-offline-cohort-cases.tsv
              ;;
            dns-update)
              sh -n tests/m142-dns-update-run.sh
              sh -n scripts/probe-m142-dns-update-wire-smoke.sh
              sh -n scripts/run.sh
              python3 scripts/test-m142-dns-update-server.py
              test "$(awk -F '\t' '$1 !~ /^#/ && NF {n++} END {print n+0}' scripts/m142-dns-update-cases.tsv)" -eq 1
              grep -Fq 'tests/m142-dns-update-run.sh' scripts/m141-rootfs-copies.tsv
              for program in nsupdate host nping; do
                grep -Fxq "usr/bin/$program" scripts/m141-original-elfs.txt
              done
              ;;
            llvm)
              sh -n scripts/probe-m142-llvm-cohort.sh
              sh -n tests/m142-llvm-cohort-run.sh
              sh -n tests/m141-toolchain-run.sh
              test "$(awk -F '\t' '$1 !~ /^#/ && NF {n++} END {print n+0}' scripts/m142-llvm-cohort-cases.tsv)" -eq 1
              awk -F '\t' '$1=="tests/m142-llvm-cohort-run.sh" && $2==$1 {found++} END {exit found==1?0:1}' scripts/m141-rootfs-copies.tsv
              for elf in usr/bin/llvm21-tblgen usr/bin/llvm21-remarkutil usr/bin/llvm21-rc usr/bin/llvm21-reduce usr/bin/llvm21-lto usr/bin/llvm21-ar usr/bin/llvm21-strip usr/bin/llvm21-addr2line usr/bin/clang; do
                grep -Fxq "$elf" scripts/m141-original-elfs.txt
              done
              grep -Fq M142_SIGNED_LLVM_COHORT_PASS scripts/m142-llvm-cohort-cases.tsv
              ;;
            *) exit 2 ;;
          esac
      - name: Install standard native QEMU and signed Alpine staging tools
        if: ${{ !contains(fromJSON('["iperf3","ssh-chain","ssh-keyscan","llvm"]'), env.PROFILE) }}
        timeout-minutes: 12
        run: |
          set -eu
          sh scripts/ci-install-signed-alpine-qemu-deps.sh amd64 --explicit-tools clang:clang ld.lld:lld readelf:binutils cpio:cpio xorriso:xorriso mformat:mtools sgdisk:gdisk qemu-riscv64:qemu-user
      - name: Install iperf3 native QEMU and independent host tools
        if: env.PROFILE == 'iperf3'
        timeout-minutes: 12
        run: |
          set -eu
          sh scripts/ci-install-signed-alpine-qemu-deps.sh amd64 --explicit-tools clang:clang ld.lld:lld readelf:binutils cpio:cpio xorriso:xorriso mformat:mtools sgdisk:gdisk iperf3:iperf3
          command -v iperf3
      - name: Install OpenSSH isolated host and native QEMU
        if: env.PROFILE == 'ssh-chain' || env.PROFILE == 'ssh-keyscan'
        timeout-minutes: 12
        run: |
          set -eu
          PATH=/usr/sbin:/sbin:$PATH
          export PATH
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'clang:clang' 'ld.lld:lld' 'readelf:binutils' \
                      'cpio:cpio' 'xorriso:xorriso' 'mformat:mtools' \
                      'sgdisk:gdisk' 'sshd:openssh-server' \
                      'ssh-keygen:openssh-client'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          command -v qemu-system-x86_64 >/dev/null || missing="$missing qemu-system-x86"
          test -f /usr/share/OVMF/OVMF_CODE_4M.fd || \
          test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf"
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          sudo install -d -m 0755 /run/sshd
          command -v docker
          command -v sshd
          command -v ssh-keygen
      - name: Install LLVM cohort native QEMU and staging tools
        if: env.PROFILE == 'llvm'
        timeout-minutes: 12
        run: |
          set -eu
          sh scripts/ci-install-signed-alpine-qemu-deps.sh amd64 --explicit-tools clang:clang ld.lld:lld readelf:binutils cpio:cpio xorriso:xorriso mformat:mtools sgdisk:gdisk
      - name: Run original signed Alpine cohort in real native QEMU
        timeout-minutes: ${{ inputs.profile == 'llvm' && 40 || 35 }}
        run: sh "${{ steps.profile.outputs.probe }}"
      - name: Preserve actual signed ELF hashes and guest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.profile.outputs.artifact }}
          path: ${{ steps.profile.outputs.paths }}
          if-no-files-found: ignore
