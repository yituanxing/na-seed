name: NaSeed dual VirtIO-Net + lwIP Alpine Ncat wire (x86 QEMU)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/lwip-virtio-wire-smoke.yml'
      - 'kernel/drivers/port/net.c'
      - 'kernel/drivers/virtio/**'
      - 'kernel/platform/x86_virtio_pci.c'
      - 'kernel/fs/socket_syscall.c'
      - 'ports/lwip/**'
      - 'ports/uboot/net_port.c'
      - 'ports/uboot/virtio_net_bus.c'
      - 'scripts/probe-lwip-virtio-wire-smoke.sh'
      - 'scripts/lwip-wire-cases.tsv'
      - 'scripts/run.sh'
      - 'tests/m141-system-run.sh'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  x86-real-virtio-net:
    name: Two real VirtIO PCI NICs + independent DHCP + Alpine Ncat TCP
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
      - name: Verify pinned upstream lwIP and targeted test
        run: |
          set -eu
          test "$(git -C third_party/lwip rev-parse HEAD)" = \
            77dcd25a72509eb83f72b033d219b1d40cd8eb95
          sh -n scripts/probe-lwip-virtio-wire-smoke.sh
          sh -n scripts/run.sh
          sh -n tests/m141-system-run.sh
          test "$(awk -F '\t' '$1 !~ /^#/ && NF { count++ } END {print count+0}' scripts/lwip-wire-cases.tsv)" -eq 1
          grep -Fq 'M141_SYSTEM_NCAT_WIRE_PASS' scripts/lwip-wire-cases.tsv
      - name: Install native QEMU and signed APK staging dependencies
        timeout-minutes: 12
        run: |
          set -eu
          sh scripts/ci-ubuntu-mirror.sh
          missing=''
          for spec in 'clang:clang' 'ld.lld:lld' 'readelf:binutils' \
                      'cpio:cpio' 'xorriso:xorriso' 'mformat:mtools' \
                      'sgdisk:gdisk' 'qemu-riscv64:qemu-user'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          command -v qemu-system-x86_64 >/dev/null || missing="$missing qemu-system-x86"
          test -f /usr/share/OVMF/OVMF_CODE_4M.fd || \
          test -f /usr/share/OVMF/OVMF_CODE.fd || missing="$missing ovmf"
          if [ -n "$missing" ]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=30 install -y --no-install-recommends $missing
          fi
          command -v docker
      - name: Real dual-PCI/two-DHCP/wire TCP targeted QEMU gate
        timeout-minutes: 35
        run: sh scripts/probe-lwip-virtio-wire-smoke.sh
      - name: Preserve guest serial and host HTTP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lwip-virtio-wire-amd64-qemu
          path: |
            build/external/m141-batch/amd64/apk-install.log
            build/external/m141-batch/amd64/requested-packages.txt
            build/external/m141-batch/amd64/*.sha256
            build/external/m141-batch/amd64/host-http.log
            build/external/m141-batch/amd64/virtio-wire.pcap
            build/busybox-source-parity-x86/m141-batch.clean.log
            build/busybox-source-parity-x86/m141-batch.serial.log
          if-no-files-found: ignore
