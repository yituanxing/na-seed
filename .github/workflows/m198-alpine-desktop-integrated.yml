name: NaSeed M198 original Alpine PID1 with real GPU input desktop and ext4

on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  original-alpine-desktop:
    name: M198 original Alpine PID1 GPU input GUI Vim and two QEMU boots / ${{ matrix.port }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        port: [amd64, riscv64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
      - name: Check M197 compatibility and M198 cross-ISA desktop contract
        run: |
          set -eu
          sh -n scripts/probe-m191-alpine-root.sh \
                scripts/probe-m197-alpine-software-cohort.sh \
                scripts/stage-m198-alpine-desktop.sh
          python3 -m py_compile scripts/m198-alpine-uart.py \
            scripts/m198-qmp-alpine-desktop.py \
            scripts/m198-alpine-disk-check.py scripts/test-m198-alpine-host.py
          python3 scripts/test-m198-alpine-host.py
          python3 scripts/test-m197-alpine-host.py
          python3 scripts/test-m194-uart-prompt.py
          python3 scripts/test-m196-public-wire.py
          python3 scripts/check-three-isa-core.py
          python3 scripts/check-architecture-boundaries.py
          test -s third_party/lvgl/CMakeLists.txt
          test -s third_party/lwip/src/include/lwip/init.h
      - name: Install native QEMU, cross compilers and official Alpine tools
        timeout-minutes: 20
        run: |
          set -eu
          sh scripts/ci-install-signed-alpine-qemu-deps.sh ${{ matrix.port }} --arm64-efi-fallback --cross-cxx --explicit-tools cmake:cmake g++:g++ clang:clang ld.lld:lld readelf:binutils cpio:cpio mke2fs:e2fsprogs debugfs:e2fsprogs e2fsck:e2fsprogs xorriso:xorriso mformat:mtools sgdisk:gdisk curl:curl python3:python3 openssl:openssl
          command -v sudo
      - name: One real Alpine root with signed public apps and physical GUI followed by reboot
        timeout-minutes: 98
        env:
          NAS_M198_INTEGRATED_DESKTOP: '1'
        run: sh scripts/probe-m197-alpine-software-cohort.sh ${{ matrix.port }}
      - name: Preserve raw public wire, real GPU frames and two QEMU boot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m198-original-alpine-desktop-${{ matrix.port }}
          path: |
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m197-public-wire.pcap
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m197-public-wire.json
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m198-first-runner.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m197-reopen-runner.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m197-live.serial.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m198-qmp-check.log
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m187-m198-*.ppm
            build/external/m191-alpine-rootfs/${{ matrix.port }}/m188-*-vim-visible.ppm
            build/busybox-source-parity-x86/m197-batch.clean.log
            build/busybox-source-parity-x86/m197-batch.serial.log
            build/port-riscv64/full/matrix-source/m197-batch.clean.log
            build/port-riscv64/full/matrix-source/m197-batch.serial.log
            build/port-aarch64/full/matrix-source/m197-batch.clean.log
            build/port-aarch64/full/matrix-source/m197-batch.serial.log
          if-no-files-found: ignore
