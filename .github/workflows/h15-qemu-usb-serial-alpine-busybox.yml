name: NaSeed H15 real QEMU FT232BM xHCI USB serial original signed Alpine BusyBox random host nonce

on:
  push:
    branches:
      - feat/na-hw-h0-pci-20261110
    paths:
      - '.github/workflows/h15-qemu-usb-serial-alpine-busybox.yml'
      - 'kernel/platform/x86_h15_ftdi.*'
      - 'kernel/platform/x86_h11_usb.*'
      - 'kernel/platform/x86_h1_ecam.*'
      - 'kernel/drivers/usb/**'
      - 'kernel/drivers/core/chrdev.*'
      - 'kernel/drivers/tty.*'
      - 'kernel/fs/devfs.c'
      - 'kernel/fs/syscall.c'
      - 'kernel/init/main.c'
      - 'kernel/boot_image.c'
      - 'kernel/kernel.c'
      - 'ports/lwext4/**'
      - 'scripts/h15-*'
      - 'scripts/check-h15-*.sh'
      - 'scripts/stage-h15-ftdi-alpine.sh'
      - 'scripts/build-h15-ftdi-iso.sh'
      - 'scripts/stage-m166-prebuilt.sh'
      - 'scripts/stage-h8-alpine-nvme.sh'
      - 'scripts/build-lwext4-guest.sh'
      - 'limine-h15-ftdi.conf'
      - 'scripts/run.sh'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h15-qa-ft232bm-original-alpine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  h15-original-signed-alpine-ftdi:
    name: Genuine QEMU FT232BM USB ttyUSB0 -> original Alpine BusyBox stty/head/printf -> random Unix socket nonce
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install toolchain, signed Alpine staging, ext4, QEMU, OVMF and Python
        timeout-minutes: 15
        run: |
          set -eu
          missing=''
          for spec in 'clang:clang' 'ld.lld:lld' 'cc:gcc' 'cmake:cmake' \
                      'readelf:binutils' 'cpio:cpio' 'mke2fs:e2fsprogs' \
                      'debugfs:e2fsprogs' 'sha256sum:coreutils' \
                      'curl:curl' 'tar:tar' 'gzip:gzip' 'openssl:openssl' \
                      'python3:python3' 'xorriso:xorriso' \
                      'qemu-system-x86_64:qemu-system-x86'; do
            bin=${spec%%:*}; pkg=${spec#*:}
            command -v "$bin" >/dev/null || missing="$missing $pkg"
          done
          if [ ! -s /usr/share/OVMF/OVMF_CODE_4M.fd ] &&
             [ ! -s /usr/share/OVMF/OVMF_CODE.fd ]; then
            missing="$missing ovmf"
          fi
          if [ -n "$missing" ]; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends $missing
          fi
      - name: H15 FTDI shell and Python socket oracle syntax; inherited H14 xHCI host regressions
        timeout-minutes: 8
        run: |
          set -eu
          sh -n scripts/stage-h15-ftdi-alpine.sh
          sh -n scripts/h15-guest-workload.sh
          sh -n scripts/build-h15-ftdi-iso.sh
          sh -n scripts/check-h15-usb-serial-qemu.sh
          sh -n scripts/check-h15-no-usb-serial-qemu.sh
          sh -n scripts/check-h15-no-xhci-qemu.sh
          sh -n scripts/run.sh
          python3 -m py_compile scripts/h15-ftdi-socket-oracle.py
          sh -n scripts/check-h15-ftdi-host.sh
          make hw-h14-host-check
          sh scripts/check-h15-ftdi-host.sh
      - name: Build H15 kernel, UEFI ISO and immutable original signed Alpine NVMe ext4 root
        timeout-minutes: 50
        run: |
          set -eu
          make hw-h15-iso
          readelf -h build/h15-qemu-only/kernel.elf | grep -q 'Machine:.*Advanced Micro Devices X86-64'
          (cd build/h15-qemu-only && sha256sum -c h15-media-before.sha256)
          sha256sum -c build/h15-qemu-only/h15-original-alpine-elfs.sha256
      - name: Positive REAL QEMU FT232BM USB Bulk IN/OUT original BusyBox stty/head/printf random host nonce
        timeout-minutes: 9
        run: sh scripts/check-h15-usb-serial-qemu.sh
      - name: Negative REAL QEMU xHCI with no USB serial fail-closed and no Alpine guest execution
        timeout-minutes: 3
        run: sh scripts/check-h15-no-usb-serial-qemu.sh
      - name: Negative REAL QEMU without xHCI fail-closed and no Alpine guest execution
        timeout-minutes: 3
        run: sh scripts/check-h15-no-xhci-qemu.sh
      - name: Verify exact signed Alpine ELF and immutable ext4 media after actual positive and negatives
        if: success()
        run: |
          set -eu
          (cd build/h15-qemu-only && sha256sum -c h15-media-before.sha256)
          sha256sum -c build/h15-qemu-only/h15-original-alpine-elfs.sha256
      - name: Preserve physical FTDI QEMU serial, random socket nonce and both fail-closed negative logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h15-real-ft232bm-original-signed-alpine-busybox-serial-nonce-logs
          path: |
            build/h15-qemu-only/h15-qemu-uefi-serial.log
            build/h15-qemu-only/h15-qemu-uefi-clean.log
            build/h15-qemu-only/h15-ftdi-oracle.log
            build/h15-qemu-only/h15-no-usb-serial-uefi-serial.log
            build/h15-qemu-only/h15-no-usb-serial-uefi-clean.log
            build/h15-qemu-only/h15-no-xhci-uefi-serial.log
            build/h15-qemu-only/h15-no-xhci-uefi-clean.log
          if-no-files-found: ignore
      - name: Preserve H15 kernel, UEFI ISO and original signed Alpine immutable SHA manifest
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: h15-real-ft232bm-original-signed-alpine-verified-artifacts
          path: |
            build/h15-qemu-only/kernel.elf
            build/h15-qemu-only/naseed.iso
            build/h15-qemu-only/h15-media-before.sha256
            build/h15-qemu-only/h15-original-alpine-elfs.sha256
          if-no-files-found: error
