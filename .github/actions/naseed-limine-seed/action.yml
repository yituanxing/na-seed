name: Restore three-ISA proven Limine seed
description: >-
  Reuse the archived Limine UEFI binaries and protocol header from the real
  three-ISA M239 two-boot PASS; never accept moving/latest upstream bytes.
inputs:
  github-token:
    description: Read-only Actions token for the same-repository cold-cache artifact
    required: true
runs:
  using: composite
  steps:
    - name: Restore checked Limine seed from repository cache
      id: limine-cache
      uses: actions/cache/restore@v4
      with:
        path: |
          build/deps/limine-binary.tar.gz
          build/deps/limine-binary.tar.gz.sha256
          build/deps/limine.h
          build/deps/limine.h.sha256
        key: naseed-limine-m239-proven-0641680706a97041a688557004daba3723ad678811c375b2cf79baeb6d1971ad
    - name: Fetch real three-ISA M239 PASS seed when cache is cold
      if: steps.limine-cache.outputs.cache-hit != 'true'
      uses: actions/download-artifact@v4
      with:
        name: m239-limine-verified-6cceaccb3852121a395fe8b4050e3185a2630ed1
        run-id: 42480429066
        repository: yituanxing/na-seed
        github-token: ${{ inputs.github-token }}
        path: build/deps
    - name: Reject missing or modified pinned Limine bytes before native QEMU
      shell: sh
      run: |
        set -eu
        archive=build/deps/limine-binary.tar.gz
        header=build/deps/limine.h
        test -s "$archive"
        test -s "$header"
        test -s "$archive.sha256"
        test -s "$header.sha256"
        sha256sum -c "$archive.sha256"
        sha256sum -c "$header.sha256"
        echo 'b38aabb042b0c0f9f562b7741be3c1204838d7bbacfa78bb411c674bd5b984ee  build/deps/limine-binary.tar.gz' | sha256sum -c -
        echo '0aadf2633c85d8cb145344c968add158aeb1deb68af567d55ba8431c492b6d4c  build/deps/limine.h' | sha256sum -c -
        for efi in BOOTX64.EFI BOOTRISCV64.EFI BOOTAA64.EFI; do
          tar -tzf "$archive" | grep -Eq "(^|/)$efi$"
        done
        echo '[NAS PROVEN LIMINE PASS] three native EFI targets and immutable archive/header SHA-256'
    - name: Cache SHA-verified Limine seed for subsequent native runs
      if: steps.limine-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          build/deps/limine-binary.tar.gz
          build/deps/limine-binary.tar.gz.sha256
          build/deps/limine.h
          build/deps/limine.h.sha256
        key: naseed-limine-m239-proven-0641680706a97041a688557004daba3723ad678811c375b2cf79baeb6d1971ad
