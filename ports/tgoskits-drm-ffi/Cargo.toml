[package]
name = "naseed-tgoskits-drm-ffi"
version = "0.0.1"
edition = "2024"
publish = false
license = "MIT"

[lib]
crate-type = ["staticlib"]

# This is a system-boundary adapter, not a rewrite of the upstream DRM.
# Both upstream crates are fetched at an exact commit by
# scripts/build-tgoskits-drm-ffi.sh and remain UNMODIFIED.
[features]
default = []
gpu-owner = ["dep:virtio-gpu", "dep:virtio-drivers", "dep:zerocopy"]

[dependencies]
kdrm-core = { path = "../../build/tgos-upstream/components/kdrm-core" }
drm-kapi = { path = "../../build/tgos-upstream/components/drm-kapi" }
# ORIGINAL unmodified pinned TGOSKits driver, not another protocol rewrite.
virtio-gpu = { path = "../../build/tgos-upstream/drivers/gpu/virtio-gpu", optional = true }
virtio-drivers = { version = "=0.13.0", default-features = false, features = ["alloc"], optional = true }
zerocopy = { version = "0.8", default-features = false, optional = true }

[profile.release]
panic = "abort"
opt-level = "s"
lto = "thin"
codegen-units = 1
